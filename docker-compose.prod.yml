services:
  app:
    image: ghcr.io/fpi-tw/findb:latest
    container_name: findb-app
    env_file: .env
    environment:
      PORT: ${PORT:-8080}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    restart: unless-stopped
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080} --workers 2"

  raw-cleanup:
    image: ghcr.io/fpi-tw/findb:latest
    container_name: findb-raw-cleanup
    env_file: .env
    restart: unless-stopped
    command: sh -c "while true; do python /app/scripts/cleanup_raw.py; sleep 86400; done"
