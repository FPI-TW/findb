x-normalization-consumer-timeout: &normalization-consumer-timeout "3600000"

x-app-environment: &app-environment
  APP_NAME: "${APP_NAME:?APP_NAME must be set in GitHub Actions variables}"
  APP_VERSION: "${APP_VERSION:?APP_VERSION must be set in GitHub Actions variables}"
  APP_ROLE: "${APP_ROLE:-all}"
  DEBUG: "${DEBUG:?DEBUG must be set in GitHub Actions variables}"
  PORT: "${PORT:?PORT must be set in GitHub Actions variables}"
  DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in GitHub Actions secrets}"
  DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:?DATABASE_POOL_SIZE must be set in GitHub Actions variables}"
  DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:?DATABASE_MAX_OVERFLOW must be set in GitHub Actions variables}"
  API_V1_PREFIX: "${API_V1_PREFIX:?API_V1_PREFIX must be set in GitHub Actions variables}"
  API_KEY_HEADER: "${API_KEY_HEADER:?API_KEY_HEADER must be set in GitHub Actions variables}"
  SOURCE_API_KEY: "${SOURCE_API_KEY:?SOURCE_API_KEY must be set in GitHub Actions secrets}"
  SOURCE_TRUST_PROXY_HEADERS: "${SOURCE_TRUST_PROXY_HEADERS:?SOURCE_TRUST_PROXY_HEADERS must be set in GitHub Actions variables}"
  SERVE_API_KEYS: "${SERVE_API_KEYS:-}"
  SERVE_REQUIRE_AUTH: "${SERVE_REQUIRE_AUTH:?SERVE_REQUIRE_AUTH must be set in GitHub Actions variables}"
  ADMIN_API_KEY: "${ADMIN_API_KEY:?ADMIN_API_KEY must be set in GitHub Actions secrets}"
  RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:?RATE_LIMIT_REQUESTS must be set in GitHub Actions variables}"
  RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:?RATE_LIMIT_WINDOW must be set in GitHub Actions variables}"
  RAW_RETENTION_ENABLED: "${RAW_RETENTION_ENABLED:?RAW_RETENTION_ENABLED must be set in GitHub Actions variables}"
  RAW_RETENTION_DAYS: "${RAW_RETENTION_DAYS:?RAW_RETENTION_DAYS must be set in GitHub Actions variables}"
  CELERY_BROKER_URL: "${CELERY_BROKER_URL:?CELERY_BROKER_URL must be set in GitHub Actions secrets}"
  NORMALIZATION_EXCHANGE: "findb.ingestion.v1"
  NORMALIZATION_QUEUE: "findb.normalize.v1"
  NORMALIZATION_DLQ: "findb.normalize.dlq.v1"
  NORMALIZATION_CONSUMER_TIMEOUT_MS: *normalization-consumer-timeout

x-app-healthcheck: &app-healthcheck
  test:
    [
      "CMD-SHELL",
      "python -c 'import os, urllib.request; port=os.getenv(\"PORT\", \"8080\"); urllib.request.urlopen(\"http://127.0.0.1:\"+port+\"/health\", timeout=5)'",
    ]
  interval: 15s
  timeout: 5s
  retries: 8
  start_period: 30s

services:
  serve:
    image: "ghcr.io/fpi-tw/findb:${IMAGE_TAG:-latest}"
    container_name: findb-serve
    environment:
      <<: *app-environment
      APP_ROLE: "serve"
      DATABASE_POOL_SIZE: "${SERVE_DATABASE_POOL_SIZE:-5}"
      DATABASE_MAX_OVERFLOW: "${SERVE_DATABASE_MAX_OVERFLOW:-10}"
      FINDB_STATIC_CACHE_BASE_URL: "${FINDB_STATIC_CACHE_BASE_URL:-http://127.0.0.1:${PORT:?PORT must be set in GitHub Actions variables}}"
      FINDB_STATIC_CACHE_SERVE_API_KEY: "${FINDB_STATIC_CACHE_SERVE_API_KEY:-}"
      FINDB_LATEST_PRICE_WORKERS: "${FINDB_LATEST_PRICE_WORKERS:?FINDB_LATEST_PRICE_WORKERS must be set in GitHub Actions variables}"
    restart: unless-stopped
    healthcheck: *app-healthcheck
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:?PORT must be set in GitHub Actions variables} --workers 2"
    volumes:
      - findb-static-data:/app/app/static/data

  ingest:
    image: "ghcr.io/fpi-tw/findb:${IMAGE_TAG:-latest}"
    container_name: findb-ingest
    environment:
      <<: *app-environment
      APP_ROLE: "ingest"
      DATABASE_POOL_SIZE: "${INGEST_DATABASE_POOL_SIZE:-3}"
      DATABASE_MAX_OVERFLOW: "${INGEST_DATABASE_MAX_OVERFLOW:-5}"
      FINDB_STATIC_CACHE_BASE_URL: "${FINDB_STATIC_CACHE_BASE_URL:-http://serve:${PORT:?PORT must be set in GitHub Actions variables}}"
      FINDB_STATIC_CACHE_SERVE_API_KEY: "${FINDB_STATIC_CACHE_SERVE_API_KEY:-}"
      FINDB_LATEST_PRICE_WORKERS: "${FINDB_LATEST_PRICE_WORKERS:?FINDB_LATEST_PRICE_WORKERS must be set in GitHub Actions variables}"
    restart: unless-stopped
    healthcheck: *app-healthcheck
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:?PORT must be set in GitHub Actions variables} --workers 1"
    volumes:
      - findb-static-data:/app/app/static/data

  rabbitmq:
    image: "rabbitmq:4.2-management@sha256:a29528adc5fa512cdadf60204e3336602ee400f8e026f5637b281959d2d51426"
    container_name: findb-rabbitmq
    hostname: findb-rabbitmq
    environment:
      RABBITMQ_NODENAME: "rabbit@findb-rabbitmq"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?RabbitMQ user must be set in GitHub Actions secrets}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?RabbitMQ password must be set in GitHub Actions secrets}"
      RABBITMQ_DEFAULT_VHOST: "/findb"
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:?Erlang cookie must be set in GitHub Actions secrets}"
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.60 disk_free_limit 2147483648"
    volumes:
      - /var/lib/findb/rabbitmq:/var/lib/rabbitmq
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  rabbitmq-policy:
    image: "rabbitmq:4.2-management@sha256:a29528adc5fa512cdadf60204e3336602ee400f8e026f5637b281959d2d51426"
    container_name: findb-rabbitmq-policy
    environment:
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:?Erlang cookie must be set in GitHub Actions secrets}"
      NORMALIZATION_CONSUMER_TIMEOUT_MS: *normalization-consumer-timeout
    depends_on:
      rabbitmq:
        condition: service_healthy
    command:
      - sh
      - -euc
      - >-
        rabbitmqctl --node rabbit@findb-rabbitmq set_policy
        --vhost /findb
        findb-normalization-consumer-timeout
        '^findb[.]normalize[.]v1$$'
        "{\"consumer-timeout\":$${NORMALIZATION_CONSUMER_TIMEOUT_MS}}"
        --apply-to classic_queues
    restart: "no"

  dispatcher:
    image: "ghcr.io/fpi-tw/findb:${IMAGE_TAG:-latest}"
    container_name: findb-dispatcher
    environment:
      <<: *app-environment
    command: python /app/scripts/dispatch_outbox.py
    depends_on:
      rabbitmq-policy:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: "ghcr.io/fpi-tw/findb:${IMAGE_TAG:-latest}"
    container_name: findb-worker
    environment:
      <<: *app-environment
    command: celery -A app.task_queue:celery_app worker --loglevel=INFO --queues=findb.normalize.v1 --pool=prefork --concurrency=2
    depends_on:
      rabbitmq-policy:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.task_queue inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  nginx:
      image: nginx:alpine
      container_name: findb-nginx
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - /home/ubuntu/etc/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        - /home/ubuntu/etc/nginx/cloudflare-real-ip.conf:/etc/nginx/cloudflare-real-ip.conf:ro
        - /home/ubuntu/etc/nginx/source-allowlist.conf:/etc/nginx/source-allowlist.conf:ro
        - /home/ubuntu/etc/nginx/serve-key.conf:/etc/nginx/serve-key.conf:ro
        - /home/ubuntu/etc/nginx/ssl/server.crt:/etc/nginx/ssl/server.crt:ro
        - /home/ubuntu/etc/nginx/ssl/server.key:/etc/nginx/ssl/server.key:ro
      healthcheck:
        test: ["CMD-SHELL", "wget -q --no-check-certificate --spider https://127.0.0.1/health"]
        interval: 15s
        timeout: 5s
        retries: 4
        start_period: 60s
      depends_on:
        - serve
        - ingest
      restart: unless-stopped

  raw-cleanup:
    image: "ghcr.io/fpi-tw/findb:${IMAGE_TAG:-latest}"
    container_name: findb-raw-cleanup
    environment:
      <<: *app-environment
    restart: unless-stopped
    command: sh -c "while true; do python /app/scripts/cleanup_raw.py; sleep 86400; done"

volumes:
  findb-static-data:
