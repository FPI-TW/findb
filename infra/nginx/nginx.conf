include /etc/nginx/serve-key.conf;

proxy_cache_path /var/cache/nginx/findb_serve
    levels=1:2
    keys_zone=findb_serve_cache:20m
    max_size=1g
    inactive=10m
    use_temp_path=off;

map $request_method $findb_serve_cacheable_method {
    default 0;
    GET 1;
    HEAD 1;
}

map $http_x_findb_key_tier $findb_serve_cache_partition {
    default $http_x_findb_key_tier;
    "" $findb_serve_proxy_key;
}

server {
    listen 80;
    server_name findb.tingfong.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name findb.tingfong.com;

    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/cloudflare-real-ip.conf;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location @source_forbidden {
        default_type application/json;
        return 403 '{"detail":"Source API client IP not allowlisted"}';
    }

    location ^~ /api/v1/source/ {
        error_page 403 = @source_forbidden;
        include /etc/nginx/source-allowlist.conf;
        client_max_body_size 1m;

        set $findb_upstream ingest:8080;
        proxy_pass http://$findb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/admin/ {
        set $findb_upstream ingest:8080;
        proxy_pass http://$findb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/serve/ {
        set $findb_upstream serve:8080;
        proxy_pass http://$findb_upstream;
        proxy_cache findb_serve_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_key "$scheme|$request_method|$host|$request_uri|$findb_serve_cache_partition";
        proxy_cache_bypass $http_authorization $arg_nocache;
        proxy_no_cache $http_authorization $arg_nocache;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $findb_serve_proxy_key;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        set $findb_upstream serve:8080;
        proxy_pass http://$findb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
