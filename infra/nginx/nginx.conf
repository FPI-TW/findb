server {
    listen 80;
    server_name findb.tingfong.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name findb.tingfong.com;

    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/cloudflare-real-ip.conf;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location @source_forbidden {
        default_type application/json;
        return 403 '{"detail":"Source API client IP not allowlisted"}';
    }

    location ^~ /api/v1/source/ {
        error_page 403 = @source_forbidden;
        include /etc/nginx/source-allowlist.conf;

        set $findb_upstream app:8080;
        proxy_pass http://$findb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $findb_upstream app:8080;
        proxy_pass http://$findb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
