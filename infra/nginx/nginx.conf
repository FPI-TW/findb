include /etc/nginx/serve-key.conf;

server {
    listen 80;
    server_name __FINDB_PUBLIC_HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name __FINDB_PUBLIC_HOST__;

    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/cloudflare-real-ip.conf;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location @source_forbidden {
        default_type application/json;
        return 403 '{"detail":"Source API client IP not allowlisted"}';
    }

    location ^~ /api/v1/source/ {
        error_page 403 = @source_forbidden;
        include /etc/nginx/source-allowlist.conf;
        client_max_body_size 1m;

        set $findb_upstream ingest:8080;
        proxy_pass http://$findb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/admin/ {
        set $findb_upstream ingest:8080;
        proxy_pass http://$findb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/serve/ {
        set $findb_upstream serve:8080;
        proxy_pass http://$findb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $findb_serve_proxy_key;
    }

    location = /dashboard {
        return 301 /dashboard/;
    }

    location ^~ /dashboard/ {
        set $findb_upstream dashboard:3333;
        proxy_pass http://$findb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        set $findb_upstream serve:8080;
        proxy_pass http://$findb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
