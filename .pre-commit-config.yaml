repos:
  - repo: local
    hooks:
      - id: check-pre-commit
        name: check before commit
        entry: pnpm hook:pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-test-pre-push
        name: check and test before push
        entry: pnpm hook:pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
