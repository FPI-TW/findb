repos:
  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff fix
        entry: uv --project backend run ruff check --fix
        language: system
        types_or: [python]
        stages: [pre-commit]

      - id: black-format
        name: black format
        entry: uv --project backend run black
        language: system
        types_or: [python]
        stages: [pre-commit]

      - id: dashboard-format-check
        name: dashboard format check
        entry: pnpm --filter dashboard format:check
        language: system
        files: ^dashboard/
        pass_filenames: false
        stages: [pre-commit]

      - id: dashboard-lint-check
        name: dashboard lint check
        entry: pnpm --filter dashboard lint:check
        language: system
        files: ^dashboard/
        pass_filenames: false
        stages: [pre-commit]

      - id: quality-pre-push
        name: quality pre-push
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
