repos:
  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff fix
        entry: .venv/bin/ruff check --fix
        language: system
        types_or: [python]
        stages: [pre-commit]

      - id: black-format
        name: black format
        entry: .venv/bin/black
        language: system
        types_or: [python]
        stages: [pre-commit]

      - id: pytest-pre-push
        name: pytest pre-push
        entry: uv run python scripts/dev.py test-db
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
