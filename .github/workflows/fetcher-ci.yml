name: Fetcher CI

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "fetcher/**"
      - "contracts/**"
      - "backend/app/schemas/ingress.py"
      - "backend/app/services/ingress_contracts.py"
      - "backend/scripts/export_ingress_contracts.py"
      - "backend/tests/test_contract_artifacts.py"
      - ".github/workflows/fetcher-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - "fetcher/**"
      - "contracts/**"
      - "backend/app/schemas/ingress.py"
      - "backend/app/services/ingress_contracts.py"
      - "backend/scripts/export_ingress_contracts.py"
      - "backend/tests/test_contract_artifacts.py"
      - ".github/workflows/fetcher-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetcher-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: fetcher

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.9.9"
          enable-cache: true
          cache-dependency-glob: "fetcher/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check contract artifacts
        working-directory: backend
        run: uv run --frozen python scripts/export_ingress_contracts.py --check

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Test
        run: uv run pytest --tb=short -q

      - name: Build container
        working-directory: .
        run: docker build -f fetcher/Dockerfile -t findb-fetcher:${{ github.sha }} .
