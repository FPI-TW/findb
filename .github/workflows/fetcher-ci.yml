name: Fetcher CI

on:
  push:
    branches: [main]
    paths:
      - "fetcher/**"
      - "contracts/**"
      # Contract generation imports application code transitively. Keep this
      # conservative CI-only gate broad so backend changes cannot silently
      # invalidate checked-in contracts consumed by Fetcher.
      - "backend/app/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "backend/scripts/export_ingress_contracts.py"
      - "backend/tests/test_contract_artifacts.py"
      - ".github/workflows/fetcher-ci.yml"
      - ".github/workflows/fetcher-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "fetcher/**"
      - "contracts/**"
      - "backend/app/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "backend/scripts/export_ingress_contracts.py"
      - "backend/tests/test_contract_artifacts.py"
      - ".github/workflows/fetcher-ci.yml"
      - ".github/workflows/fetcher-cd.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetcher-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: fetcher

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.9"
          enable-cache: true
          cache-dependency-glob: "fetcher/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check contract artifacts
        working-directory: backend
        run: uv run --frozen python scripts/export_ingress_contracts.py --check

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --tb=short -q

      - name: Build container
        working-directory: .
        run: |
          image="findb-fetcher:${{ github.sha }}"
          for attempt in 1 2 3; do
            if docker build -f fetcher/Dockerfile -t "$image" .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=Fetcher container build failed::Docker build failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 10))
            echo "::warning title=Fetcher container build retry::Attempt ${attempt} failed; retrying in ${delay}s"
            sleep "$delay"
          done
