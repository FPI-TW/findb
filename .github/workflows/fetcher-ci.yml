name: Fetcher CI

# Pull requests are routed through required-ci.yml. After merge, Fetcher CD calls
# this workflow once through workflow_call before it can build or deploy.
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetcher-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: fetcher

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ inputs.revision || github.sha }}', persist-credentials: false}
      - name: Verify exact requested revision
        env: {EXPECTED_SHA: '${{ inputs.revision || github.sha }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.9"
          enable-cache: true
          cache-dependency-glob: "fetcher/uv.lock"

      - name: Install dependencies
        # The Shioaji extra lets test_shioaji_sdk_contract.py check the real SDK API.
        run: uv sync --frozen --extra shioaji

      - name: Check contract artifacts
        working-directory: backend
        run: |
          uv run --frozen python scripts/export_ingress_contracts.py --check
          uv run --frozen python scripts/export_archive_contracts.py --check
          uv run --frozen python scripts/export_execution_feeds.py --check

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --tb=short -q

      - name: Build container
        working-directory: .
        run: |
          image="findb-fetcher:${{ github.sha }}"
          for attempt in 1 2 3; do
            if docker build -f fetcher/Dockerfile -t "$image" .; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=Fetcher container build failed::Docker build failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 10))
            echo "::warning title=Fetcher container build retry::Attempt ${attempt} failed; retrying in ${delay}s"
            sleep "$delay"
          done
          docker run --rm "$image" findb-fetch-runtime --help

      - name: Build and inspect isolated FinLab scheduler container
        working-directory: .
        run: |
          generic_image="findb-fetcher:${{ github.sha }}"
          finlab_image="findb-fetcher-finlab:${{ github.sha }}"
          shioaji_image="findb-fetcher-shioaji:${{ github.sha }}"
          # The generic runtime must not gain either optional provider SDK.
          docker run --rm "$generic_image" python -c 'import importlib.util, sys; sys.exit(0 if all(importlib.util.find_spec(name) is None for name in ("finlab", "shioaji")) else 1)'
          docker build -f fetcher/Dockerfile.finlab -t "$finlab_image" .
          docker run --rm "$finlab_image" python -c 'import importlib.util, sys; sys.exit(0 if importlib.util.find_spec("finlab") is not None and importlib.util.find_spec("shioaji") is None else 1)'
          docker run --rm "$finlab_image"
          docker run --rm "$finlab_image" findb-fetch-historical-backfill --help

      - name: Build and inspect isolated Shioaji scheduler container
        working-directory: .
        run: |
          generic_image="findb-fetcher:${{ github.sha }}"
          finlab_image="findb-fetcher-finlab:${{ github.sha }}"
          shioaji_image="findb-fetcher-shioaji:${{ github.sha }}"
          docker build -f fetcher/Dockerfile.shioaji -t "$shioaji_image" .
          # The Shioaji runtime carries only its explicitly requested optional
          # SDK.  Keep the generic and FinLab images hermetic as well.
          docker run --rm "$shioaji_image" python -c 'import importlib.util, sys; sys.exit(0 if importlib.util.find_spec("shioaji") is not None and importlib.util.find_spec("finlab") is None else 1)'
          docker run --rm "$shioaji_image"

      - name: Build and inspect isolated FactSet runtime
        working-directory: .
        run: |
          image="findb-fetcher-factset:${{ github.sha }}"
          docker build -f fetcher/Dockerfile.factset -t "$image" .
          docker run --rm "$image" python -c 'import importlib.util,ssl; assert importlib.util.find_spec("pymysql"); assert all(importlib.util.find_spec(n) is None for n in ("finlab","shioaji")); c=ssl.create_default_context(cafile="/app/certs/ap-southeast-1-bundle.pem"); assert c.check_hostname and c.verify_mode==ssl.CERT_REQUIRED'
          docker run --rm "$image"
          docker run --rm "$image" findb-fetch-runtime --provider factset --config /app/configs/full_market.local.v1.json --check
          docker run --rm "$image" findb-fetch-historical-backfill --help

      - name: Verify runtime images ship valid import bytecode
        working-directory: .
        run: |
          # Runtimes run --read-only and cannot cache bytecode, so a missing or
          # stale .pyc would be recompiled from source on every container start.
          for image in findb-fetcher findb-fetcher-finlab findb-fetcher-shioaji findb-fetcher-factset; do
            docker run --rm -i --read-only --user 10001:10001 "$image:${{ github.sha }}" python - <<'PY'
          import importlib.util, os, struct
          import boto3, httpx, jsonschema
          import findb_fetcher.full_market_cli as cli
          for module in (boto3, httpx, jsonschema, cli):
              with open(importlib.util.cache_from_source(module.__file__), "rb") as cached:
                  _, flags, mtime, size = struct.unpack("<4I", cached.read(16))
              stat = os.stat(module.__file__)
              current = (int(stat.st_mtime) & 0xFFFFFFFF, stat.st_size & 0xFFFFFFFF)
              assert flags & 1 or (mtime, size) == current, f"stale bytecode: {module.__name__}"
          PY
          done
