name: Production promotion
# Shared by findb-production-cd.yml and fetcher-production-cd.yml. Copies the
# exact staging-accepted digests into production ECR and uploads a production
# candidate bundle; it never rebuilds images.
'on':
  workflow_call:
    inputs:
      unit:
        required: true
        type: string
      revision:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      accepted_bundle_key:
        required: true
        type: string
    outputs:
      candidate_bundle_key:
        value: ${{ jobs.promote.outputs.candidate_bundle_key }}
permissions:
  contents: read
  id-token: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate_bundle_key: ${{ steps.bundle.outputs.candidate_bundle_key }}
    env:
      UNIT: ${{ inputs.unit }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
        clean: false
    - name: Load deployment driver from protected main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: .deployment-driver
        persist-credentials: false
    - name: Load AWS deployment configuration
      uses: ./.deployment-driver/.github/actions/aws-configuration
      with:
        target: production
        unit: ${{ inputs.unit }}
    - name: Verify exact release revision and unit image set
      id: unit
      env:
        EXPECTED_SHA: ${{ inputs.revision }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        # Image names in the release manifest and their ECR path under
        # findb/<target>/; Fetcher repositories use dashed names.
        case "$UNIT" in
          findb) echo 'images=backend:backend dashboard:dashboard' >> "$GITHUB_OUTPUT" ;;
          fetcher) echo 'images=twelve_data:fetcher/twelve-data finlab:fetcher/finlab shioaji:fetcher/shioaji factset:fetcher/factset' >> "$GITHUB_OUTPUT" ;;
          *) exit 1 ;;
        esac
    - name: Configure staging promotion-reader credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
      with:
        role-to-assume: ${{ env.STAGING_PROMOTION_READ_ROLE_ARN }}
        aws-region: ap-southeast-1
        allowed-account-ids: ${{ env.STAGING_AWS_ACCOUNT_ID }}
        role-session-name: ${{ inputs.unit }}-production-source-${{ github.run_id }}
    - name: Download and validate exact accepted staging bundle
      env:
        REVISION: ${{ inputs.revision }}
        BUNDLE_KEY: ${{ inputs.accepted_bundle_key }}
        IMAGES: ${{ steps.unit.outputs.images }}
        SOURCE_BUCKET: ${{ env.STAGING_DEPLOY_BUNDLE_BUCKET }}
        SOURCE_REGISTRY: ${{ env.STAGING_ECR_REGISTRY }}
        SOURCE_ACCOUNT: ${{ env.STAGING_AWS_ACCOUNT_ID }}
        DESTINATION_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
      run: |
        set -euo pipefail
        [ "$(aws sts get-caller-identity --query Account --output text)" = "$SOURCE_ACCOUNT" ]
        [ "$SOURCE_ACCOUNT" != "$DESTINATION_ACCOUNT" ]
        [ "$SOURCE_REGISTRY" = "$SOURCE_ACCOUNT.dkr.ecr.ap-southeast-1.amazonaws.com" ]
        [[ "$BUNDLE_KEY" =~ ^${UNIT}/accepted/${REVISION}/([0-9a-f]{64})[.]tar$ ]]
        bundle_sha256="${BASH_REMATCH[1]}"
        aws s3api get-object --bucket "$SOURCE_BUCKET" --key "$BUNDLE_KEY" "$RUNNER_TEMP/staging-bundle.tar" >/dev/null
        [ "$(sha256sum "$RUNNER_TEMP/staging-bundle.tar" | cut -d ' ' -f1)" = "$bundle_sha256" ]
        python3 infra/deploy/release_manifest.py validate-bundle --bundle "$RUNNER_TEMP/staging-bundle.tar" --expected-bundle-sha256 "$bundle_sha256" --unit "$UNIT"
        tar -xOf "$RUNNER_TEMP/staging-bundle.tar" release-manifest.json > "$RUNNER_TEMP/staging-manifest.json"
        [ "$(jq -r .schema_version "$RUNNER_TEMP/staging-manifest.json")" = 3 ]
        [ "$(jq -r .deployment_target "$RUNNER_TEMP/staging-manifest.json")" = staging ]
        [ "$(jq -r .release_tag "$RUNNER_TEMP/staging-manifest.json")" = "" ]
        [ "$(jq -r .registry "$RUNNER_TEMP/staging-manifest.json")" = "$SOURCE_REGISTRY" ]
        [ "$(jq -r .account_id "$RUNNER_TEMP/staging-manifest.json")" = "$SOURCE_ACCOUNT" ]
        migration="$(jq -r .migration_revision "$RUNNER_TEMP/staging-manifest.json")"
        [ "$UNIT" != fetcher ] || [ "$migration" = none ]
        image_args=()
        for entry in $IMAGES; do
          name="${entry%%:*}"
          image_ref="$(jq -r --arg name "$name" '.images[$name]' "$RUNNER_TEMP/staging-manifest.json")"
          [ "${image_ref%@*}" = "$SOURCE_REGISTRY/findb/staging/${entry#*:}" ]
          [[ "${image_ref##*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_args+=(--image "$name=$image_ref")
        done
        python3 infra/deploy/release_manifest.py validate-bundle --bundle "$RUNNER_TEMP/staging-bundle.tar" --expected-bundle-sha256 "$bundle_sha256" --unit "$UNIT" --commit-sha "$REVISION" --migration-revision "$migration" "${image_args[@]}"
        aws s3api get-object --bucket "$SOURCE_BUCKET" --key "${BUNDLE_KEY%.tar}.acceptance.json" "$RUNNER_TEMP/staging-acceptance.json" >/dev/null
        jq -e --arg unit "$UNIT" --arg key "$BUNDLE_KEY" --arg sha "$bundle_sha256" --arg revision "$REVISION" --slurpfile manifest "$RUNNER_TEMP/staging-manifest.json" '
          type == "object" and .state == "accepted" and .unit == $unit and .commit_sha == $revision
          and .bundle_key == $key and .bundle_sha256 == $sha and .images == $manifest[0].images
        ' "$RUNNER_TEMP/staging-acceptance.json" >/dev/null
    - name: Log in to staging ECR
      uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c
      with:
        registry: ${{ env.STAGING_ECR_REGISTRY }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - name: Configure production promotion credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
      with:
        role-to-assume: ${{ env.AWS_PROMOTION_ROLE_ARN }}
        aws-region: ap-southeast-1
        allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
        role-session-name: ${{ inputs.unit }}-production-promote-${{ github.run_id }}
    - name: Log in to production ECR
      uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c
      with:
        registry: ${{ env.ECR_REGISTRY }}
    - name: Copy exact digests and create production candidate bundle
      id: bundle
      env:
        REVISION: ${{ inputs.revision }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        SOURCE_BUNDLE_KEY: ${{ inputs.accepted_bundle_key }}
        IMAGES: ${{ steps.unit.outputs.images }}
        SOURCE_REGISTRY: ${{ env.STAGING_ECR_REGISTRY }}
        REGISTRY: ${{ env.ECR_REGISTRY }}
        ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
        BUNDLE_BUCKET: ${{ env.DEPLOY_BUNDLE_BUCKET }}
        BUNDLE_KMS_KEY: ${{ env.DEPLOY_BUNDLE_KMS_KEY_ARN }}
      run: |
        set -euo pipefail
        [ "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID" ]
        [ "$REGISTRY" = "$ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com" ]
        short_tag="${RELEASE_TAG#"$UNIT"-}"
        manifest="$RUNNER_TEMP/staging-manifest.json"
        args=()
        for entry in $IMAGES; do
          name="${entry%%:*}"
          source_ref="$(jq -r --arg name "$name" '.images[$name]' "$manifest")"
          destination_repository="$REGISTRY/findb/production/${entry#*:}"
          SOURCE_IMAGE_REF="$source_ref" DESTINATION_REPOSITORY="$destination_repository" RELEASE_TAG="$short_tag" infra/deploy/promote_image.sh
          args+=(--image "$name=$destination_repository@${source_ref##*@}")
        done
        migration="$(jq -r .migration_revision "$manifest")"
        profile_args=()
        if [ "$UNIT" = fetcher ]; then
          [ "$migration" = none ]
          profile_args=(--runtime-profile unified)
        fi
        python3 infra/deploy/release_manifest.py generate --repo-root . --unit "$UNIT" --commit-sha "$REVISION" --migration-revision "$migration" --contract-manifest contracts/manifest.json --created-by-run-id "$GITHUB_RUN_ID" --deployment-target production ${profile_args[@]+"${profile_args[@]}"} --registry "$REGISTRY" --account-id "$ACCOUNT_ID" --release-tag "$RELEASE_TAG" --promotion-source-bundle-key "$SOURCE_BUNDLE_KEY" --promotion-source-registry "$SOURCE_REGISTRY" "${args[@]}" --output "$RUNNER_TEMP/production-manifest.json"
        python3 infra/deploy/release_manifest.py bundle --repo-root . --unit "$UNIT" --manifest "$RUNNER_TEMP/production-manifest.json" --output "$RUNNER_TEMP/production-bundle.tar"
        bundle_sha256="$(sha256sum "$RUNNER_TEMP/production-bundle.tar" | cut -d ' ' -f1)"
        candidate_key="${UNIT}/production/candidates/${REVISION}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${bundle_sha256}.tar"
        aws s3api put-object --bucket "$BUNDLE_BUCKET" --key "$candidate_key" --body "$RUNNER_TEMP/production-bundle.tar" --if-none-match '*' --server-side-encryption aws:kms --ssekms-key-id "$BUNDLE_KMS_KEY" >/dev/null
        echo "candidate_bundle_key=$candidate_key" >> "$GITHUB_OUTPUT"
    permissions:
      id-token: write
      contents: read
