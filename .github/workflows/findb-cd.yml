name: FinDB CD
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Staging target only
        required: true
        default: staging
        type: choice
        options:
        - staging
      revision:
        description: Exact protected-main commit SHA
        required: true
        type: string
      deployment_mode:
        description: Create a new candidate or replay an accepted bundle
        required: true
        default: replay
        type: choice
        options:
        - replay
        - candidate
      candidate_confirmation:
        description: Type deploy-new-candidate for candidate mode
        required: false
        default: ''
        type: string
      image_tag:
        description: Existing staging SHA for an accepted replay
        required: false
        default: ''
        type: string
      accepted_bundle_key:
        description: Exact staging accepted bundle key for replay
        required: false
        default: ''
        type: string
concurrency:
  group: staging-findb
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      mode: ${{ steps.selection.outputs.mode }}
      bundle_key: ${{ steps.selection.outputs.bundle_key }}
      findb_ci: ${{ steps.policy.outputs.findb_ci }}
      findb_staging: ${{ steps.policy.outputs.findb_staging }}
      findb_ci_evidence: ${{ steps.policy.outputs.findb_ci_evidence }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision || github.sha }}
        fetch-depth: 0
        persist-credentials: false
        clean: false
    - id: revision
      env:
        EXPECTED_SHA: ${{ inputs.revision || github.sha }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        set -euo pipefail
        actual="$(git rev-parse HEAD)"; [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; [ "$actual" = "$EXPECTED_SHA" ]
        if [ "${{ github.event_name }}" = workflow_dispatch ]; then
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$actual" refs/remotes/origin/main
          [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "$actual" ]
        fi
        echo "sha=$actual" >> "$GITHUB_OUTPUT"
    - id: policy
      env:
        EVENT: ${{ github.event_name }}
        HEAD: ${{ inputs.revision || github.sha }}
        DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = workflow_dispatch ]; then
          # An accepted replay already passed CI when it was accepted.
          ci=true; [ "$DEPLOYMENT_MODE" = replay ] && ci=false
          printf 'findb_ci=%s\nfindb_staging=true\n' "$ci" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Diff from the last successful push rollout, not github.event.before:
        # a superseded pending run or a failed rollout must not hide changes.
        base="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/findb-cd.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
        if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$base" "$HEAD"; then
          python3 infra/deploy/change_policy.py --base "$base" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
        else
          echo "change_policy_base=unavailable selection=full"
          python3 infra/deploy/change_policy.py --full --github-output "$GITHUB_OUTPUT"
        fi
        # A squash merge whose tree equals the PR head already passed this unit's
        # CI in Required CI; any doubt falls back to running CI here.
        if grep -qx 'findb_ci=true' "$GITHUB_OUTPUT"; then
          python3 infra/deploy/ci_evidence.py --repository "$GITHUB_REPOSITORY" --revision "$HEAD" --unit findb --ci-workflow .github/workflows/findb-ci.yml --github-output "$GITHUB_OUTPUT"
        fi
    - name: Verify exact requested revision, staging-only route, and deployment selection
      id: selection
      env:
        REVISION: ${{ steps.revision.outputs.sha }}
        DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
        CANDIDATE_CONFIRMATION: ${{ inputs.candidate_confirmation }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        ACCEPTED: ${{ inputs.accepted_bundle_key }}
      run: |
        set -euo pipefail
        [ "${{ inputs.deployment_target || 'staging' }}" = staging ]
        [ "$(git rev-parse HEAD)" = "$REVISION" ]
        echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
        if [ "${{ github.event_name }}" = workflow_dispatch ]; then
          case "$DEPLOYMENT_MODE" in
            candidate)
              [ "$CANDIDATE_CONFIRMATION" = deploy-new-candidate ]
              [ -z "$ACCEPTED" ] && [ -z "$IMAGE_TAG" ]
              echo 'mode=candidate' >> "$GITHUB_OUTPUT"
              ;;
            replay)
              [ -z "$CANDIDATE_CONFIRMATION" ]
              [ -n "$ACCEPTED" ] && [ -n "$IMAGE_TAG" ]
              [ "$IMAGE_TAG" = "$REVISION" ]
              [[ "$ACCEPTED" =~ ^findb/accepted/${REVISION}/[0-9a-f]{64}[.]tar$ ]]
              printf 'mode=replay\nbundle_key=%s\n' "$ACCEPTED" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
        else
          [ "${{ github.event_name }}" = push ] && [ -z "$DEPLOYMENT_MODE" ] && [ -z "$CANDIDATE_CONFIRMATION" ] && [ -z "$IMAGE_TAG" ] && [ -z "$ACCEPTED" ] || exit 1
          echo 'mode=candidate' >> "$GITHUB_OUTPUT"
        fi
  verify:
    needs: policy
    if: ${{ needs.policy.outputs.findb_ci == 'true' && needs.policy.outputs.findb_ci_evidence == '' }}
    uses: ./.github/workflows/findb-ci.yml
    with:
      revision: ${{ needs.policy.outputs.revision }}
  publish:
    needs: [policy, verify]
    if: |-
      (!cancelled() && github.ref == 'refs/heads/main' && needs.policy.result == 'success' && needs.policy.outputs.findb_staging == 'true' &&
      (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'replay') ||
      (needs.verify.result == 'skipped' && github.event_name == 'push' && needs.policy.outputs.findb_ci_evidence != ''))) && needs.policy.outputs.mode == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image_ref }}
      dashboard_image: ${{ steps.images.outputs.dashboard_image_ref }}
      migration_revision: ${{ steps.release.outputs.migration_revision }}
    env:
      AWS_REGION: ap-southeast-1
      ACCOUNT: '439622209937'
      REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com
      BACKEND: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/backend
      DASHBOARD: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/dashboard
      ECR_BUILD_CACHE: gha
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.policy.outputs.revision }}
        persist-credentials: false
        clean: false
    - name: Verify exact requested revision for publication
      env:
        EXPECTED_SHA: ${{ needs.policy.outputs.revision }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - name: Configure staging publisher credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
      with:
        role-to-assume: arn:aws:iam::439622209937:role/findb-staging-ecr-publisher
        aws-region: ap-southeast-1
        allowed-account-ids: '439622209937'
        role-session-name: findb-staging-publish-${{ github.run_id }}
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - name: Expose BuildKit cache runtime without logging it
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: |
          core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN || '');
          for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL']) {
            if (process.env[name]) core.exportVariable(name, process.env[name]);
          }
    - name: Build or reuse immutable FinDB images
      id: images
      env:
        ECR_IMAGE_TAG: ${{ needs.policy.outputs.revision }}
      run: |
        set -euo pipefail
        [ "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT" ]
        aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
        work="$RUNNER_TEMP/findb-images"; mkdir -p "$work"
        build() {
          local name="$1"; shift
          GITHUB_OUTPUT="$work/$name.output" infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$@" >"$work/$name.log" 2>&1
        }
        pids=()
        build backend "$BACKEND" ./backend ./backend/Dockerfile & pids+=("backend:$!")
        build dashboard "$DASHBOARD" . ./dashboard/Dockerfile & pids+=("dashboard:$!")
        failed=0
        for entry in "${pids[@]}"; do
          name="${entry%%:*}"; status=0
          wait "${entry#*:}" || status=$?
          echo "::group::${name} image (exit ${status})"; cat "$work/$name.log"; echo "::endgroup::"
          [ "$status" -eq 0 ] || failed=1
        done
        [ "$failed" -eq 0 ]
        for name in backend dashboard; do
          [ "$(grep -c '^image_ref=' "$work/$name.output")" = 1 ]
          printf '%s_image_ref=%s\n' "$name" "$(sed -n 's/^image_ref=//p' "$work/$name.output")" >> "$GITHUB_OUTPUT"
        done
    - name: Resolve immutable release inputs
      id: release
      env:
        BACKEND_IMAGE: ${{ steps.images.outputs.backend_image_ref }}
        DASHBOARD_IMAGE: ${{ steps.images.outputs.dashboard_image_ref }}
      run: |
        set -euo pipefail
        [[ "$BACKEND_IMAGE" =~ ^${REGISTRY}/findb/staging/backend@sha256:[0-9a-f]{64}$ ]]
        [[ "$DASHBOARD_IMAGE" =~ ^${REGISTRY}/findb/staging/dashboard@sha256:[0-9a-f]{64}$ ]]
        migration="$(docker run --rm --network none "$BACKEND_IMAGE" alembic heads | sed -n 's/^\([0-9a-f]\{12\}\) (head)$/\1/p')"
        [[ "$migration" =~ ^[0-9a-f]{12}$ ]]
        echo "migration_revision=$migration" >> "$GITHUB_OUTPUT"
  deploy:
    needs:
    - policy
    - verify
    - publish
    if: |-
      (!cancelled() && github.ref == 'refs/heads/main' && needs.policy.result == 'success' && needs.policy.outputs.findb_staging == 'true' &&
      (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'replay') ||
      (needs.verify.result == 'skipped' && github.event_name == 'push' && needs.policy.outputs.findb_ci_evidence != ''))) && ((needs.policy.outputs.mode == 'candidate' && needs.publish.result == 'success') ||
       (needs.policy.outputs.mode == 'replay' && needs.publish.result == 'skipped'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/findb-deploy.yml
    with:
      deployment_target: staging
      revision: ${{ needs.policy.outputs.revision }}
      mode: ${{ needs.policy.outputs.mode }}
      bundle_key: ${{ needs.policy.outputs.bundle_key }}
      prepare_candidate: ${{ needs.policy.outputs.mode == 'candidate' }}
      backend_image: ${{ needs.publish.outputs.backend_image }}
      dashboard_image: ${{ needs.publish.outputs.dashboard_image }}
      migration_revision: ${{ needs.publish.outputs.migration_revision }}
      release_tag: ''
  report-staging-deployment-failure:
    needs:
    - policy
    - verify
    - publish
    - deploy
    if: |-
      always() && github.ref == 'refs/heads/main' && (inputs.deployment_target || 'staging') == 'staging' && (needs.verify.result == 'failure' ||
        needs.verify.result == 'cancelled' ||
        needs.policy.result == 'failure' ||
        needs.policy.result == 'cancelled' ||
        needs.publish.result == 'failure' ||
        needs.publish.result == 'cancelled' ||
        needs.deploy.result == 'failure' ||
        needs.deploy.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Load deployment driver from protected main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: .deployment-driver
        persist-credentials: false
    - name: Load AWS deployment configuration
      uses: ./.deployment-driver/.github/actions/aws-configuration
      with:
        target: staging
        unit: findb
    - name: Verify deployment account
      shell: bash
      run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
    - name: Publish staging deployment failure metric
      run: |
        aws cloudwatch put-metric-data \
          --region ap-southeast-1 \
          --namespace FinDB/Staging \
          --metric-name DeploymentFailure \
          --dimensions DeploymentUnit=findb,Resource=github-actions \
          --value 1 \
          --unit Count
  deployment-summary:
    needs: [policy, verify, publish, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Report deployment wall time
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 infra/deploy/deployment_timing.py --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/deployment-timing.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: deployment-timing-findb
        path: ${{ runner.temp }}/deployment-timing.json
