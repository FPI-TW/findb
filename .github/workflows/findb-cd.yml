name: FinDB CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "dashboard/**"
      - "infra/nginx/**"
      - "infra/deploy/runtime-secrets/load_runtime_secrets.py"
      - "infra/deploy/runtime-secrets/runtime_secret_command.sh"
      - "infra/deploy/runtime-secrets/render_nginx_runtime.sh"
      - "infra/deploy/runtime-secrets/render_serve_key.py"
      - "infra/deploy/runtime-secrets/install_findb_bootstrap.sh"
      - "infra/deploy/runtime-secrets/deploy_findb_aws.sh"
      - "infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh"
      - "infra/deploy/release_manifest.py"
      - "infra/deploy/runtime-secrets/findb.json"
      - "docker-compose.prod.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/findb-cd.yml"
  workflow_dispatch:
    inputs:
      deployment_target:
        description: GitHub Environment target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Optional existing staging ECR 40-character lowercase SHA to roll back to (staging only)
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ inputs.deployment_target || 'staging' }}-findb
  cancel-in-progress: false

permissions:
  contents: read

env:
  STAGING_ECR_REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com

jobs:
  verify:
    uses: ./.github/workflows/findb-ci.yml

  build-push-production:
    needs: verify
    if: github.ref == 'refs/heads/main' && (inputs.deployment_target || 'staging') == 'production' && inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/fpi-tw/findb
      DASHBOARD_IMAGE: ghcr.io/fpi-tw/findb-dashboard

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dashboard image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: dashboard/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:latest
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  build-push-staging-ecr:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.deployment_target || 'staging') == 'staging' &&
      vars.STAGING_ECR_CUTOVER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_image_ref: ${{ steps.backend_image.outputs.image_ref }}
      dashboard_image_ref: ${{ steps.dashboard_image.outputs.image_ref }}
    env:
      AWS_REGION: ap-southeast-1
      AWS_ACCOUNT_ID: '439622209937'
      ECR_REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com
      FINDB_IMAGE: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/backend
      DASHBOARD_IMAGE: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/dashboard
      ECR_IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ECR_REUSE_ONLY: ${{ inputs.image_tag != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate staging ECR release selection
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ]
          if [ -n "$ECR_IMAGE_TAG" ]; then
            [[ "$ECR_IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error title=Invalid staging rollback tag::image_tag must be a lowercase 40-character commit SHA"
              exit 1
            }
            git rev-parse --verify "$ECR_IMAGE_TAG^{commit}" >/dev/null
            git merge-base --is-ancestor "$ECR_IMAGE_TAG" HEAD || {
              echo "::error title=Invalid staging rollback tag::image_tag must be reachable from protected main"
              exit 1
            }
            if [ "$ECR_REUSE_ONLY" = true ]; then
              if ! git diff --quiet "$ECR_IMAGE_TAG" HEAD -- \
                docker-compose.prod.yml \
                infra/nginx/nginx.conf \
                infra/nginx/source-allowlist.conf \
                infra/nginx/cloudflare-real-ip.conf \
                backend/scripts/render_nginx_public_host.py \
                backend/scripts/render_nginx_source_allowlist.py \
                backend/scripts/render_nginx_cloudflare_real_ip.py \
                infra/deploy/runtime-secrets/load_runtime_secrets.py \
                infra/deploy/runtime-secrets/runtime_secret_command.sh \
                infra/deploy/runtime-secrets/render_nginx_runtime.sh \
                infra/deploy/runtime-secrets/render_serve_key.py \
                infra/deploy/runtime-secrets/install_findb_bootstrap.sh \
                infra/deploy/runtime-secrets/deploy_findb_aws.sh \
                infra/deploy/runtime-secrets/findb.json; then
                echo "::error title=Incompatible staging rollback::Deployment contract files differ from the selected image SHA; deploy a forward compatibility fix before retrying rollback"
                exit 1
              fi
            fi
          fi
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::439622209937:role/findb-staging-ecr-publisher
          aws-region: ap-southeast-1
          allowed-account-ids: '439622209937'
          role-session-name: findb-staging-ecr-${{ github.run_id }}
      - name: Fail closed on exact ECR cutover activation
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ vars.STAGING_ECR_CUTOVER_ENABLED }}" = true ]
          [ "$(aws sts get-caller-identity --query Account --output text)" = 439622209937 ]
      - name: Log in to private ECR
        shell: bash
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build or reuse immutable backend image
        id: backend_image
        shell: bash
        run: infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$FINDB_IMAGE" ./backend ./backend/Dockerfile
      - name: Build or reuse immutable dashboard image
        id: dashboard_image
        shell: bash
        run: infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$DASHBOARD_IMAGE" . ./dashboard/Dockerfile
      - name: Classify selected release manifest support
        id: manifest_support
        shell: bash
        run: |
          set -euo pipefail
          manifest_tool_path=infra/deploy/release_manifest.py
          if ! git cat-file -e "$ECR_IMAGE_TAG^{commit}"; then
            echo "::error title=Selected commit unavailable::Cannot read the selected release commit"
            exit 1
          fi
          manifest_entries_file="$(mktemp "${RUNNER_TEMP:?}/selected-manifest-entry.XXXXXX")"
          trap 'rm -f -- "$manifest_entries_file"' EXIT
          if ! git ls-tree -z "$ECR_IMAGE_TAG" -- "$manifest_tool_path" > "$manifest_entries_file"; then
            echo "::error title=Selected manifest tool inspection failed::Cannot inspect the selected release tree"
            exit 1
          fi
          if [ ! -s "$manifest_entries_file" ]; then
            manifest_missing=true
          else
          if ! manifest_object_id="$(python3 - "$manifest_entries_file" "$manifest_tool_path" <<'PY'
          import re
          import sys

          raw = open(sys.argv[1], "rb").read()
          path = sys.argv[2].encode("ascii")
          if not raw.endswith(b"\0") or raw.count(b"\0") != 1:
              raise SystemExit(1)
          record = raw[:-1]
          match = re.fullmatch(
              rb"100(?:644|755) blob ((?:[0-9a-f]{40}|[0-9a-f]{64}))\t" + re.escape(path),
              record,
          )
          if match is None:
              raise SystemExit(1)
          print(match.group(1).decode("ascii"))
          PY
          )"; then
              echo "::error title=Selected manifest tool inspection failed::Selected manifest tool must be exactly one regular blob entry"
              exit 1
            fi
            if ! git cat-file -e "$manifest_object_id^{blob}"; then
              echo "::error title=Selected manifest tool inspection failed::Selected manifest tool blob is unreadable"
              exit 1
            fi
            manifest_missing=false
          fi
          if [ "$manifest_missing" = false ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          elif [ "$ECR_REUSE_ONLY" = true ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Legacy staging rollback::Selected SHA predates the Phase 3 release manifest; continuing the explicit protected-main SHA-tag rollback without a manifest artifact"
          else
            echo "::error title=Missing selected release manifest tool::Current releases must select a SHA that contains infra/deploy/release_manifest.py"
            exit 1
          fi
      - name: Materialize selected deployment source inputs
        id: selected_source_bundle
        if: ${{ steps.manifest_support.outputs.supported == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/findb-selected-deployment-source"
          mkdir -p "$source_root"
          git archive --format=tar "$ECR_IMAGE_TAG" | tar -x -C "$source_root"
          printf 'path=%s\n' "$source_root" >> "$GITHUB_OUTPUT"
      - name: Verify selected release manifest protocol
        if: ${{ steps.manifest_support.outputs.supported == 'true' }}
        shell: bash
        env:
          SOURCE_BUNDLE_ROOT: ${{ steps.selected_source_bundle.outputs.path }}
        run: |
          set -euo pipefail
          protocol_output="$(mktemp "${RUNNER_TEMP:?}/selected-manifest-protocol.XXXXXX")"
          protocol_error="$(mktemp "${RUNNER_TEMP:?}/selected-manifest-protocol-error.XXXXXX")"
          trap 'rm -f -- "$protocol_output" "$protocol_error"' EXIT
          if ! python3 "$SOURCE_BUNDLE_ROOT/infra/deploy/release_manifest.py" protocol > "$protocol_output" 2> "$protocol_error"; then
            echo "::error title=Selected manifest protocol failed::Selected manifest tool did not complete its v1 protocol"
            exit 1
          fi
          if [ -s "$protocol_error" ] || ! printf 'findb-release-manifest-v1\n' | cmp -s - "$protocol_output"; then
            echo "::error title=Selected manifest protocol invalid::Selected manifest tool must emit only the v1 protocol marker"
            exit 1
          fi
      - name: Read exact backend Alembic head
        id: backend_alembic_head
        shell: bash
        env:
          BACKEND_IMAGE_REF: ${{ steps.backend_image.outputs.image_ref }}
        run: |
          set -euo pipefail
          migration_heads="$(docker run --rm --pull always --network none "$BACKEND_IMAGE_REF" alembic heads)"
          if ! [[ "$migration_heads" =~ ^([0-9a-f]{12})\ \(head\)$ ]]; then
            echo "::error title=Invalid Alembic head::Expected exactly one '<revision> (head)' result from the selected backend digest"
            exit 1
          fi
          printf 'migration_revision=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Generate and validate staging release manifest
        if: ${{ steps.manifest_support.outputs.supported == 'true' }}
        shell: bash
        env:
          BACKEND_IMAGE_REF: ${{ steps.backend_image.outputs.image_ref }}
          DASHBOARD_IMAGE_REF: ${{ steps.dashboard_image.outputs.image_ref }}
          MIGRATION_REVISION: ${{ steps.backend_alembic_head.outputs.migration_revision }}
          SOURCE_BUNDLE_ROOT: ${{ steps.selected_source_bundle.outputs.path }}
        run: |
          set -euo pipefail
          python3 "$SOURCE_BUNDLE_ROOT/infra/deploy/release_manifest.py" generate \
            --repo-root "$SOURCE_BUNDLE_ROOT" \
            --unit findb \
            --commit-sha "$ECR_IMAGE_TAG" \
            --migration-revision "$MIGRATION_REVISION" \
            --contract-manifest "$SOURCE_BUNDLE_ROOT/contracts/manifest.json" \
            --image "backend=$BACKEND_IMAGE_REF" \
            --image "dashboard=$DASHBOARD_IMAGE_REF" \
            --created-by-run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/findb-staging-release-manifest.json"
          python3 "$SOURCE_BUNDLE_ROOT/infra/deploy/release_manifest.py" validate \
            --repo-root "$SOURCE_BUNDLE_ROOT" \
            --unit findb \
            --commit-sha "$ECR_IMAGE_TAG" \
            --migration-revision "$MIGRATION_REVISION" \
            --contract-manifest "$SOURCE_BUNDLE_ROOT/contracts/manifest.json" \
            --image "backend=$BACKEND_IMAGE_REF" \
            --image "dashboard=$DASHBOARD_IMAGE_REF" \
            --created-by-run-id "$GITHUB_RUN_ID" \
            --manifest "$RUNNER_TEMP/findb-staging-release-manifest.json"
      - name: Upload staging release manifest
        if: ${{ steps.manifest_support.outputs.supported == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-findb-release-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/findb-staging-release-manifest.json
          if-no-files-found: error
          retention-days: 30

  staging-ecr-cutover-disabled:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.deployment_target || 'staging') == 'staging' &&
      vars.STAGING_ECR_CUTOVER_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - name: Fail closed until separately authorized foundation acceptance
        run: exit 1

  build-push:
    needs: [verify, build-push-production, build-push-staging-ecr, staging-ecr-cutover-disabled]
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      backend_image_ref: ${{ steps.release_selection.outputs.backend_image_ref }}
      dashboard_image_ref: ${{ steps.release_selection.outputs.dashboard_image_ref }}
    steps:
      - name: Confirm the exact target-specific image build succeeded
        id: release_selection
        shell: bash
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target || 'staging' }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          PRODUCTION_BUILD: ${{ needs.build-push-production.result }}
          STAGING_ECR_BUILD: ${{ needs.build-push-staging-ecr.result }}
          CUTOVER_DISABLED: ${{ needs.staging-ecr-cutover-disabled.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BACKEND_IMAGE_REF: ${{ needs.build-push-staging-ecr.outputs.backend_image_ref }}
          DASHBOARD_IMAGE_REF: ${{ needs.build-push-staging-ecr.outputs.dashboard_image_ref }}
        run: |
          set -euo pipefail
          [ "$VERIFY_RESULT" = success ]
          case "$DEPLOYMENT_TARGET" in
            production)
              [ -z "$IMAGE_TAG_INPUT" ] || {
                echo "::error title=Invalid production image tag::image_tag is available only for staging ECR rollback"
                exit 1
              }
              [ "$PRODUCTION_BUILD" = success ]
              [ "$STAGING_ECR_BUILD" = skipped ]
              [ "$CUTOVER_DISABLED" = skipped ]
              ;;
            staging)
              if [ "$EVENT_NAME" = workflow_dispatch ]; then
                [ "$STAGING_ECR_BUILD" = success ]
                [ "$PRODUCTION_BUILD" = skipped ]
                [ "$CUTOVER_DISABLED" = skipped ]
                if ! [[ "$BACKEND_IMAGE_REF" =~ ^439622209937[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/findb/staging/backend@sha256:[0-9a-f]{64}$ ]] \
                  || ! [[ "$DASHBOARD_IMAGE_REF" =~ ^439622209937[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/findb/staging/dashboard@sha256:[0-9a-f]{64}$ ]]; then
                  echo "::error title=Invalid FinDB release bridge::Build outputs must contain both exact unit-scoped ECR digests"
                  exit 1
                fi
                printf 'backend_image_ref=%s\n' "$BACKEND_IMAGE_REF" >> "$GITHUB_OUTPUT"
                printf 'dashboard_image_ref=%s\n' "$DASHBOARD_IMAGE_REF" >> "$GITHUB_OUTPUT"
              else
                [ "$STAGING_ECR_BUILD" = skipped ]
                [ "$PRODUCTION_BUILD" = skipped ]
                [ "$CUTOVER_DISABLED" = skipped ]
              fi
              ;;
            *)
              echo "::error title=Invalid deployment target::Expected staging or production"
              exit 1
              ;;
          esac

  deploy:
    needs: build-push
    if: always() && github.event_name == 'workflow_dispatch' && needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.deployment_target || 'staging' }}-findb

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      APP_NAME: ${{ vars.APP_NAME }}
      APP_VERSION: ${{ vars.APP_VERSION }}
      DEBUG: ${{ vars.DEBUG }}
      PORT: ${{ vars.PORT }}
      DATABASE_POOL_SIZE: ${{ vars.DATABASE_POOL_SIZE }}
      DATABASE_MAX_OVERFLOW: ${{ vars.DATABASE_MAX_OVERFLOW }}
      API_V1_PREFIX: ${{ vars.API_V1_PREFIX }}
      API_KEY_HEADER: ${{ vars.API_KEY_HEADER }}
      SOURCE_ALLOWLIST_CIDRS: ${{ vars.SOURCE_ALLOWLIST_CIDRS }}
      SOURCE_TRUST_PROXY_HEADERS: ${{ vars.SOURCE_TRUST_PROXY_HEADERS }}
      SERVE_REQUIRE_AUTH: ${{ vars.SERVE_REQUIRE_AUTH }}
      RATE_LIMIT_REQUESTS: ${{ vars.RATE_LIMIT_REQUESTS }}
      RATE_LIMIT_WINDOW: ${{ vars.RATE_LIMIT_WINDOW }}
      RAW_RETENTION_ENABLED: ${{ vars.RAW_RETENTION_ENABLED }}
      RAW_RETENTION_DAYS: ${{ vars.RAW_RETENTION_DAYS }}
      FINDB_STATIC_CACHE_BASE_URL: ${{ vars.FINDB_STATIC_CACHE_BASE_URL }}
      FINDB_LATEST_PRICE_WORKERS: ${{ vars.FINDB_LATEST_PRICE_WORKERS }}
      FINDB_PUBLIC_HOST: ${{ vars.FINDB_PUBLIC_HOST }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_CANONICAL_BUCKET: ${{ vars.CLOUDFLARE_R2_CANONICAL_BUCKET }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate target-derived deployment route
        shell: bash
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target || 'staging' }}
          STAGING_ECR_CUTOVER_ENABLED: ${{ vars.STAGING_ECR_CUTOVER_ENABLED }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_TARGET" in
            production) ;;
            staging)
              [ "$STAGING_ECR_CUTOVER_ENABLED" = true ] || {
                echo "::error title=Staging ECR cutover disabled::Activation must be exactly true"
                exit 1
              }
              ;;
            *)
              echo "::error title=Invalid deployment target::Expected staging or production"
              exit 1
              ;;
          esac

      - name: Validate deployment configuration
        if: ${{ (inputs.deployment_target || 'staging') == 'production' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_BREAK_GLASS_API_KEY: ${{ secrets.ADMIN_BREAK_GLASS_API_KEY }}
          FINDB_QUEUE_HEALTH_ADMIN_API_KEY: ${{ secrets.FINDB_QUEUE_HEALTH_ADMIN_API_KEY }}
          FINDB_LOOKUP_SERVE_API_KEY: ${{ secrets.FINDB_LOOKUP_SERVE_API_KEY }}
          FINDB_STATIC_CACHE_SERVE_API_KEY: ${{ secrets.FINDB_STATIC_CACHE_SERVE_API_KEY }}
          CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
          RABBITMQ_DEFAULT_USER: ${{ secrets.RABBITMQ_DEFAULT_USER }}
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          CLOUDFLARE_R2_CANONICAL_PUBLISHER_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_CANONICAL_PUBLISHER_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_CANONICAL_PUBLISHER_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_CANONICAL_PUBLISHER_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_CANONICAL_READER_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_CANONICAL_READER_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_CANONICAL_READER_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_CANONICAL_READER_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_NAME APP_VERSION DEBUG PORT DATABASE_URL DATABASE_POOL_SIZE DATABASE_MAX_OVERFLOW API_V1_PREFIX API_KEY_HEADER SOURCE_ALLOWLIST_CIDRS SOURCE_TRUST_PROXY_HEADERS SERVE_REQUIRE_AUTH ADMIN_BREAK_GLASS_API_KEY FINDB_QUEUE_HEALTH_ADMIN_API_KEY RATE_LIMIT_REQUESTS RATE_LIMIT_WINDOW RAW_RETENTION_ENABLED RAW_RETENTION_DAYS FINDB_LATEST_PRICE_WORKERS FINDB_PUBLIC_HOST CELERY_BROKER_URL RABBITMQ_DEFAULT_USER RABBITMQ_DEFAULT_PASS RABBITMQ_ERLANG_COOKIE CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_CANONICAL_BUCKET CLOUDFLARE_R2_CANONICAL_PUBLISHER_ACCESS_KEY_ID CLOUDFLARE_R2_CANONICAL_PUBLISHER_SECRET_ACCESS_KEY CLOUDFLARE_R2_CANONICAL_READER_ACCESS_KEY_ID CLOUDFLARE_R2_CANONICAL_READER_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment setting::$name must be configured for the selected legacy deployment path"
              missing=1
            fi
          done
          if [ "${CLOUDFLARE_R2_CANONICAL_PUBLISHER_ACCESS_KEY_ID:-}" = "${CLOUDFLARE_R2_CANONICAL_READER_ACCESS_KEY_ID:-}" ] || [ "${CLOUDFLARE_R2_CANONICAL_PUBLISHER_SECRET_ACCESS_KEY:-}" = "${CLOUDFLARE_R2_CANONICAL_READER_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error title=Canonical R2 credential reuse::Publisher and reader credentials must be distinct"
            missing=1
          fi
          if [ "${SERVE_REQUIRE_AUTH:-}" = "true" ] && [ -z "${FINDB_LOOKUP_SERVE_API_KEY:-}" ]; then
            echo "::error title=Missing deployment secret::FINDB_LOOKUP_SERVE_API_KEY must be configured when SERVE_REQUIRE_AUTH=true"
            missing=1
          fi
          if [ "${SERVE_REQUIRE_AUTH:-}" = "true" ] && [ -z "${FINDB_STATIC_CACHE_SERVE_API_KEY:-}" ]; then
            echo "::error title=Missing deployment secret::FINDB_STATIC_CACHE_SERVE_API_KEY must be configured when SERVE_REQUIRE_AUTH=true"
            missing=1
          fi
          if [ "${SERVE_REQUIRE_AUTH:-}" = "true" ] && [ -n "${FINDB_LOOKUP_SERVE_API_KEY:-}" ] && [ "${FINDB_LOOKUP_SERVE_API_KEY}" = "${FINDB_STATIC_CACHE_SERVE_API_KEY:-}" ]; then
            echo "::error title=Credential reuse::FINDB_LOOKUP_SERVE_API_KEY and FINDB_STATIC_CACHE_SERVE_API_KEY must be distinct credentials"
            missing=1
          fi
          if [ "${PORT:-}" != "8080" ]; then
            echo "::error title=PORT mismatch::infra/nginx/nginx.conf routes upstreams to serve:8080/ingest:8080; PORT=$PORT would break nginx routing. Update nginx.conf together with PORT."
            missing=1
          fi
          exit "$missing"

      - name: Validate AWS runtime deployment configuration
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APP_NAME APP_VERSION DEBUG PORT DATABASE_POOL_SIZE DATABASE_MAX_OVERFLOW API_V1_PREFIX API_KEY_HEADER SOURCE_ALLOWLIST_CIDRS SOURCE_TRUST_PROXY_HEADERS SERVE_REQUIRE_AUTH RATE_LIMIT_REQUESTS RATE_LIMIT_WINDOW RAW_RETENTION_ENABLED RAW_RETENTION_DAYS FINDB_LATEST_PRICE_WORKERS FINDB_PUBLIC_HOST CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_CANONICAL_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment setting::$name must be configured for the AWS runtime-secret path"
              missing=1
            fi
          done
          if [ "${PORT:-}" != "8080" ]; then
            echo "::error title=PORT mismatch::infra/nginx/nginx.conf requires PORT=8080"
            missing=1
          fi
          exit "$missing"

      - name: Render nginx configs
        if: ${{ (inputs.deployment_target || 'staging') == 'production' }}
        env:
          FINDB_LOOKUP_SERVE_API_KEY: ${{ secrets.FINDB_LOOKUP_SERVE_API_KEY }}
        run: |
          set -euo pipefail
          python backend/scripts/render_nginx_public_host.py \
            --host "$FINDB_PUBLIC_HOST" \
            --template infra/nginx/nginx.conf \
            --output infra/nginx/nginx.conf
          python backend/scripts/render_nginx_source_allowlist.py \
            --cidrs "$SOURCE_ALLOWLIST_CIDRS" \
            --output infra/nginx/source-allowlist.conf
          python backend/scripts/render_nginx_cloudflare_real_ip.py \
            --output infra/nginx/cloudflare-real-ip.conf
          python backend/scripts/render_nginx_serve_key.py \
            --key "${FINDB_LOOKUP_SERVE_API_KEY:-}" \
            --public-host "$FINDB_PUBLIC_HOST" \
            --output infra/nginx/serve-key.conf

      - name: Render nonsecret nginx configs for AWS runtime secrets
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python backend/scripts/render_nginx_public_host.py \
            --host "$FINDB_PUBLIC_HOST" \
            --template infra/nginx/nginx.conf \
            --output infra/nginx/nginx.conf
          python backend/scripts/render_nginx_source_allowlist.py \
            --cidrs "$SOURCE_ALLOWLIST_CIDRS" \
            --output infra/nginx/source-allowlist.conf
          python backend/scripts/render_nginx_cloudflare_real_ip.py \
            --output infra/nginx/cloudflare-real-ip.conf

      - name: Configure staging AWS credentials
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: findb-staging-preflight-${{ github.run_id }}

      - name: Run staging AWS and SSM preflight
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' }}
        shell: bash
        env:
          DEPLOYMENT_UNIT: findb
          AWS_REGION: ap-southeast-1
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_INSTANCE_PROFILE_NAME: ${{ vars.AWS_INSTANCE_PROFILE_NAME }}
          AWS_SSM_LOG_GROUP: ${{ vars.AWS_SSM_LOG_GROUP }}
          AWS_DNS_CHECK_NAME: ${{ vars.AWS_DNS_CHECK_NAME }}
          PREFLIGHT_MARKER_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-findb
          BACKEND_IMAGE_REF: ${{ needs.build-push.outputs.backend_image_ref }}
          DASHBOARD_IMAGE_REF: ${{ needs.build-push.outputs.dashboard_image_ref }}
        run: |
          set -euo pipefail

          for name in AWS_REGION AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN AWS_INSTANCE_PROFILE_NAME AWS_SSM_LOG_GROUP AWS_DNS_CHECK_NAME BACKEND_IMAGE_REF DASHBOARD_IMAGE_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing staging AWS preflight variable::$name must be configured in the staging-findb Environment"
              exit 1
            fi
          done
          if ! [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error title=Invalid staging AWS account::AWS_ACCOUNT_ID must be a 12-digit account identifier"
            exit 1
          fi
          if ! [[ "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]] || [[ "$AWS_DEPLOY_ROLE_ARN" != "arn:aws:iam::${AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "::error title=Invalid staging deploy role::AWS_DEPLOY_ROLE_ARN must be an IAM role ARN in the expected account"
            exit 1
          fi
          if ! [[ "$AWS_INSTANCE_PROFILE_NAME" =~ ^[A-Za-z0-9+=,.@_-]+$ ]]; then
            echo "::error title=Invalid staging instance profile::AWS_INSTANCE_PROFILE_NAME must use IAM name characters without a path"
            exit 1
          fi
          if ! [[ "$AWS_SSM_LOG_GROUP" =~ ^[A-Za-z0-9_.\/#-]+$ ]] || [ "${#AWS_SSM_LOG_GROUP}" -gt 512 ]; then
            echo "::error title=Invalid staging SSM log group::AWS_SSM_LOG_GROUP contains unsupported CloudWatch Logs name characters"
            exit 1
          fi
          if ! [[ "$AWS_DNS_CHECK_NAME" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error title=Invalid staging DNS check::AWS_DNS_CHECK_NAME contains unsafe characters"
            exit 1
          fi
          if [ "${#AWS_DNS_CHECK_NAME}" -gt 253 ]; then
            echo "::error title=Invalid staging DNS check::AWS_DNS_CHECK_NAME exceeds the DNS name length limit"
            exit 1
          fi
          if ! [[ "$PREFLIGHT_MARKER_TOKEN" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Invalid preflight marker::The bounded marker token contains unsupported characters"
            exit 1
          fi
          expected_ecr_registry="439622209937.dkr.ecr.ap-southeast-1.amazonaws.com"
          if ! [[ "$BACKEND_IMAGE_REF" =~ ^439622209937[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/findb/staging/backend@sha256:[0-9a-f]{64}$ ]] \
            || ! [[ "$DASHBOARD_IMAGE_REF" =~ ^439622209937[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/findb/staging/dashboard@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Invalid FinDB digest selection::SSM preflight requires both exact unit-scoped ECR digests"
            exit 1
          fi

          caller_account="$(aws sts get-caller-identity --region "$AWS_REGION" --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --region "$AWS_REGION" --query Arn --output text)"
          if [ "$caller_account" != "$AWS_ACCOUNT_ID" ]; then
            echo "::error title=AWS account guard failed::STS account does not match AWS_ACCOUNT_ID"
            exit 1
          fi
          expected_role_name="${AWS_DEPLOY_ROLE_ARN#*:role/}"
          actual_role_name="${caller_arn#*:assumed-role/}"
          actual_role_name="${actual_role_name%/*}"
          if [ -z "$expected_role_name" ] || [ "$actual_role_name" != "$expected_role_name" ]; then
            echo "::error title=AWS role guard failed::STS identity is not the expected unit deploy role"
            exit 1
          fi
          echo "sts_identity=ok account_guard=ok role_guard=ok"

          target_ids_json="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                Name=instance-state-name,Values=running \
                Name=tag:Project,Values=findb \
                Name=tag:Environment,Values=staging \
                Name=tag:DeploymentUnit,Values=findb \
              --query 'Reservations[].Instances[].InstanceId' \
              --output json
          )"
          target_count="$(jq -r 'length' <<<"$target_ids_json")"
          if [ "$target_count" -ne 1 ]; then
            echo "::error title=Staging target cardinality failed::Expected exactly one running findb target"
            exit 1
          fi
          target_id="$(jq -r '.[0]' <<<"$target_ids_json")"
          echo "target_selector=exact-tags target_count=1"

          profile_arn="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --instance-ids "$target_id" \
              --query 'Reservations[0].Instances[0].IamInstanceProfile.Arn' \
              --output text
          )"
          profile_name="${profile_arn##*/}"
          if [ -z "$profile_arn" ] || [ "$profile_arn" = "None" ] || [ "$profile_name" != "$AWS_INSTANCE_PROFILE_NAME" ]; then
            echo "::error title=Instance profile guard failed::Target does not use the expected instance profile"
            exit 1
          fi
          ping_status="$(
            aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=${target_id}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text
          )"
          if [ "$ping_status" != "Online" ]; then
            echo "::error title=SSM target offline::Target instance is not Online in Systems Manager"
            exit 1
          fi
          echo "instance_profile=ok ssm_ping=Online"

          probe_secret_arn="arn:aws:secretsmanager:${AWS_REGION}:${AWS_ACCOUNT_ID}:secret:findb/staging/${DEPLOYMENT_UNIT}/phase1-preflight-denial-probe"
          probe_stderr="$(mktemp)"
          cleanup_probe() { rm -f -- "$probe_stderr" >/dev/null 2>&1 || true; }
          trap cleanup_probe EXIT
          if aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$probe_secret_arn" >/dev/null 2>"$probe_stderr"; then
            echo "::error title=Deploy role secret boundary failed::Secret denial probe unexpectedly succeeded"
            exit 1
          fi
          if ! grep -Fq "AccessDenied" "$probe_stderr" 2>/dev/null; then
            echo "::error title=Deploy role secret boundary failed::Secret denial probe did not return AccessDenied"
            exit 1
          fi
          echo "secret_read_denial=AccessDenied"

          printf -v expected_instance_id_q '%q' "$target_id"
          printf -v expected_instance_profile_name_q '%q' "$AWS_INSTANCE_PROFILE_NAME"
          printf -v expected_dns_name_q '%q' "$AWS_DNS_CHECK_NAME"
          printf -v expected_unit_q '%q' "$DEPLOYMENT_UNIT"
          printf -v expected_marker_token_q '%q' "$PREFLIGHT_MARKER_TOKEN"
          printf -v expected_aws_region_q '%q' "$AWS_REGION"
          printf -v expected_ecr_registry_q '%q' "$expected_ecr_registry"
          printf -v expected_backend_image_ref_q '%q' "$BACKEND_IMAGE_REF"
          printf -v expected_dashboard_image_ref_q '%q' "$DASHBOARD_IMAGE_REF"
          host_script="$(cat <<'HOST_SCRIPT'
          set -eu

          preflight_succeeded=0
          docker_config=""
          emit_preflight_failure() {
            trap - EXIT
            case "$docker_config" in
              /run/findb-ecr-preflight.*) rm -rf -- "$docker_config" ;;
            esac
            if [ "$preflight_succeeded" -ne 1 ]; then
              printf 'phase1_preflight_marker=%s status=failed\n' "$expected_marker_token"
            fi
          }
          trap emit_preflight_failure EXIT

          imds_token="$(curl --silent --fail --noproxy '*' --max-time 5 -X PUT \
            -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
            http://169.254.169.254/latest/api/token 2>/dev/null)"
          imds_instance_id="$(curl --silent --fail --noproxy '*' --max-time 5 \
            -H "X-aws-ec2-metadata-token: $imds_token" \
            http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null)"
          imds_profile_arn="$(curl --silent --fail --noproxy '*' --max-time 5 \
            -H "X-aws-ec2-metadata-token: $imds_token" \
            http://169.254.169.254/latest/meta-data/iam/info 2>/dev/null | \
            sed -n 's/.*"InstanceProfileArn"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | \
            sed -n '1p')"
          imds_profile_name="${imds_profile_arn##*/}"
          if [ "$imds_instance_id" != "$expected_instance_id" ]; then
            echo "instance_id_match=failed"
            exit 1
          fi
          if [ "$imds_profile_name" != "$expected_instance_profile_name" ]; then
            echo "instance_profile_match=failed"
            exit 1
          fi
          printf 'instance_id_match=ok instance_profile_match=ok unit=%s\n' "$expected_unit"

          ssm_agent_service=""
          for candidate in \
            amazon-ssm-agent.service \
            snap.amazon-ssm-agent.amazon-ssm-agent.service
          do
            if systemctl is-active --quiet "$candidate" >/dev/null 2>&1; then
              ssm_agent_service="$candidate"
              break
            fi
          done
          if [ -z "$ssm_agent_service" ]; then
            echo "ssm_agent=inactive"
            exit 1
          fi
          printf 'ssm_agent=active service=%s\n' "$ssm_agent_service"

          docker_version="$(docker --version 2>/dev/null | cut -c1-128)"
          compose_version="$(docker compose version --short 2>/dev/null | cut -c1-128)"
          if [ -z "$docker_version" ] || [ -z "$compose_version" ]; then
            echo "docker_runtime=missing"
            exit 1
          fi
          printf 'docker=%s compose=%s\n' "$docker_version" "$compose_version"

          docker_config="$(mktemp -d /run/findb-ecr-preflight.XXXXXX)"
          chmod 0700 "$docker_config"
          aws ecr get-login-password --region "$expected_aws_region" | \
            docker --config "$docker_config" login \
              --username AWS --password-stdin "$expected_ecr_registry" >/dev/null
          for image_ref in "$expected_backend_image_ref" "$expected_dashboard_image_ref"; do
            docker --config "$docker_config" pull "$image_ref" >/dev/null
            if ! docker image inspect "$image_ref" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -Fxq "$image_ref"; then
              echo "ecr_digest_inspection=failed"
              exit 1
            fi
          done
          rm -rf -- "$docker_config"
          docker_config=""
          echo "ecr_digest_pull_inspect=ok images=2"

          disk_free_percent="$(df -P / 2>/dev/null | awk 'NR == 2 { sub(/%/, "", $5); print 100 - $5 }')"
          inode_free_percent="$(df -Pi / 2>/dev/null | awk 'NR == 2 { sub(/%/, "", $5); print 100 - $5 }')"
          case "$disk_free_percent" in
            ''|*[!0-9]*)
              echo "disk_free_percent=invalid"
              exit 1
              ;;
          esac
          if [ "$disk_free_percent" -lt 15 ]; then
            echo "disk_free_percent=below-threshold"
            exit 1
          fi
          case "$inode_free_percent" in
            ''|*[!0-9]*)
              echo "inode_free_percent=invalid"
              exit 1
              ;;
          esac
          if [ "$inode_free_percent" -lt 10 ]; then
            echo "inode_free_percent=below-threshold"
            exit 1
          fi
          printf 'disk_free_percent=%s inode_free_percent=%s\n' "$disk_free_percent" "$inode_free_percent"

          time_sync="$(timedatectl show -p NTPSynchronized --value 2>/dev/null || true)"
          case "$time_sync" in
            yes|true|1) ;;
            *)
              echo "time_sync=unsynchronized"
              exit 1
              ;;
          esac
          printf 'utc_now=%s time_sync=ok\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if ! getent ahosts "$expected_dns_name" >/dev/null 2>&1; then
            echo "dns_resolution=failed"
            exit 1
          fi
          printf 'dns_resolution=ok name=%s\n' "$expected_dns_name"
          printf 'phase1_preflight_marker=%s status=success\n' "$expected_marker_token"
          preflight_succeeded=1
          HOST_SCRIPT
          )"
          host_script="expected_instance_id=${expected_instance_id_q}
          expected_instance_profile_name=${expected_instance_profile_name_q}
          expected_dns_name=${expected_dns_name_q}
          expected_unit=${expected_unit_q}
          expected_marker_token=${expected_marker_token_q}
          expected_aws_region=${expected_aws_region_q}
          expected_ecr_registry=${expected_ecr_registry_q}
          expected_backend_image_ref=${expected_backend_image_ref_q}
          expected_dashboard_image_ref=${expected_dashboard_image_ref_q}
          ${host_script}"
          parameters_json="$(jq -nc --arg command "$host_script" '{commands: [$command]}')"
          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --document-name AWS-RunShellScript \
              --instance-ids "$target_id" \
              --parameters "$parameters_json" \
              --comment "Phase 1 bounded preflight (${DEPLOYMENT_UNIT})" \
              --timeout-seconds 300 \
              --max-concurrency 1 \
              --max-errors 0 \
              --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=${AWS_SSM_LOG_GROUP}" \
              --query 'Command.CommandId' \
              --output text
          )"
          if [ -z "$command_id" ] || [ "$command_id" = "None" ]; then
            echo "::error title=SSM preflight dispatch failed::No command ID was returned"
            exit 1
          fi
          success_marker="phase1_preflight_marker=${PREFLIGHT_MARKER_TOKEN} status=success"
          failure_marker="phase1_preflight_marker=${PREFLIGHT_MARKER_TOKEN} status=failed"
          marker_state="pending"
          for attempt in $(seq 1 36); do
            # Read only the marker event count from this command's stdout stream; never retrieve log text.
            failure_event_count="$(
              aws logs filter-log-events \
                --region "$AWS_REGION" \
                --log-group-name "$AWS_SSM_LOG_GROUP" \
                --log-stream-name-prefix "${command_id}/${target_id}/aws-runShellScript/stdout" \
                --filter-pattern "\"$failure_marker\"" \
                --query 'length(events)' \
                --output json 2>/dev/null
            )"
            if ! [[ "$failure_event_count" =~ ^[0-9]+$ ]]; then
              echo "::error title=Invalid SSM marker count::CloudWatch returned a non-numeric failure marker event count"
              exit 1
            fi
            if [ "$failure_event_count" -gt 0 ]; then
              echo "::error title=SSM host preflight failed::Bounded host failure marker observed; command_id=${command_id}"
              exit 1
            fi
            success_event_count="$(
              aws logs filter-log-events \
                --region "$AWS_REGION" \
                --log-group-name "$AWS_SSM_LOG_GROUP" \
                --log-stream-name-prefix "${command_id}/${target_id}/aws-runShellScript/stdout" \
                --filter-pattern "\"$success_marker\"" \
                --query 'length(events)' \
                --output json 2>/dev/null
            )"
            if ! [[ "$success_event_count" =~ ^[0-9]+$ ]]; then
              echo "::error title=Invalid SSM marker count::CloudWatch returned a non-numeric success marker event count"
              exit 1
            fi
            if [ "$success_event_count" -gt 0 ]; then
              marker_state="success"
              echo "ssm_preflight_status=Success command_id=${command_id} marker_event_count=${success_event_count}"
              break
            fi
            sleep 5
          done
          if [ "$marker_state" != "success" ]; then
            echo "::error title=SSM host preflight timed out::No bounded marker observed; command_id=${command_id}"
            exit 1
          fi

      - name: Calculate AWS runtime-secret bundle checksums
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        id: runtime_secret_checksums
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            infra/deploy/runtime-secrets/load_runtime_secrets.py \
            infra/deploy/runtime-secrets/runtime_secret_command.sh \
            infra/deploy/runtime-secrets/render_nginx_runtime.sh \
            infra/deploy/runtime-secrets/render_serve_key.py \
            infra/deploy/runtime-secrets/install_findb_bootstrap.sh \
            infra/deploy/runtime-secrets/deploy_findb_aws.sh \
            infra/deploy/runtime-secrets/findb.json \
            docker-compose.prod.yml \
            infra/nginx/nginx.conf \
            infra/nginx/source-allowlist.conf \
            infra/nginx/cloudflare-real-ip.conf; do
            name="$(basename "$file" | tr '.-' '__')"
            checksum="$(sha256sum "$file" | cut -d ' ' -f1)"
            printf '%s=%s\n' "$name" "$checksum" >> "$GITHUB_OUTPUT"
          done

      - name: Prepare AWS runtime-secret directories on EC2
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.FINDB_EC2_HOST }}
          username: ${{ secrets.FINDB_EC2_USER }}
          key: ${{ secrets.FINDB_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo install -d -o root -g root -m 0755 /opt/findb/runtime-secrets
            sudo install -d -o root -g root -m 0700 /run/findb-runtime-secrets
            sudo install -d -o root -g root -m 0700 /run/findb-runtime-secrets/nginx
            sudo mkdir -p /var/lib/findb/rabbitmq /home/ubuntu/etc/nginx/ssl
            sudo chown -R 999:999 /var/lib/findb/rabbitmq
            sudo chown ubuntu:ubuntu /opt/findb /home/ubuntu/etc/nginx
            sudo chown root:root /home/ubuntu/etc/nginx/ssl
            sudo rm -rf -- /tmp/findb-runtime-secrets
            sudo install -d -o ubuntu -g ubuntu -m 0700 /tmp/findb-runtime-secrets

      - name: Sync AWS runtime-secret loader and exact FinDB catalog
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.FINDB_EC2_HOST }}
          username: ${{ secrets.FINDB_EC2_USER }}
          key: ${{ secrets.FINDB_EC2_SSH_KEY }}
          source: "infra/deploy/runtime-secrets/load_runtime_secrets.py,infra/deploy/runtime-secrets/runtime_secret_command.sh,infra/deploy/runtime-secrets/render_nginx_runtime.sh,infra/deploy/runtime-secrets/render_serve_key.py,infra/deploy/runtime-secrets/install_findb_bootstrap.sh,infra/deploy/runtime-secrets/deploy_findb_aws.sh,infra/deploy/runtime-secrets/findb.json,docker-compose.prod.yml,infra/nginx/nginx.conf,infra/nginx/source-allowlist.conf,infra/nginx/cloudflare-real-ip.conf"
          target: /tmp/findb-runtime-secrets
          overwrite: true

      - name: Verify AWS runtime-secret bundle ownership, mode, and checksum
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          LOADER_SHA256: ${{ steps.runtime_secret_checksums.outputs.load_runtime_secrets_py }}
          COMMAND_SHA256: ${{ steps.runtime_secret_checksums.outputs.runtime_secret_command_sh }}
          NGINX_SHA256: ${{ steps.runtime_secret_checksums.outputs.render_nginx_runtime_sh }}
          RENDER_SHA256: ${{ steps.runtime_secret_checksums.outputs.render_serve_key_py }}
          BOOTSTRAP_SHA256: ${{ steps.runtime_secret_checksums.outputs.install_findb_bootstrap_sh }}
          DEPLOY_SHA256: ${{ steps.runtime_secret_checksums.outputs.deploy_findb_aws_sh }}
          CATALOG_SHA256: ${{ steps.runtime_secret_checksums.outputs.findb_json }}
          COMPOSE_SHA256: ${{ steps.runtime_secret_checksums.outputs.docker_compose_prod_yml }}
          NGINX_CONFIG_SHA256: ${{ steps.runtime_secret_checksums.outputs.nginx_conf }}
          SOURCE_ALLOWLIST_SHA256: ${{ steps.runtime_secret_checksums.outputs.source_allowlist_conf }}
          CLOUDFLARE_REAL_IP_SHA256: ${{ steps.runtime_secret_checksums.outputs.cloudflare_real_ip_conf }}
        with:
          host: ${{ secrets.FINDB_EC2_HOST }}
          username: ${{ secrets.FINDB_EC2_USER }}
          key: ${{ secrets.FINDB_EC2_SSH_KEY }}
          envs: LOADER_SHA256,COMMAND_SHA256,NGINX_SHA256,RENDER_SHA256,BOOTSTRAP_SHA256,DEPLOY_SHA256,CATALOG_SHA256,COMPOSE_SHA256,NGINX_CONFIG_SHA256,SOURCE_ALLOWLIST_SHA256,CLOUDFLARE_REAL_IP_SHA256
          script: |
            set -euo pipefail
            runtime_dir=/opt/findb/runtime-secrets
            staging_root=/tmp/findb-runtime-secrets
            for relative_path in \
              infra/deploy/runtime-secrets/load_runtime_secrets.py \
              infra/deploy/runtime-secrets/runtime_secret_command.sh \
              infra/deploy/runtime-secrets/render_nginx_runtime.sh \
              infra/deploy/runtime-secrets/render_serve_key.py \
              infra/deploy/runtime-secrets/install_findb_bootstrap.sh \
              infra/deploy/runtime-secrets/deploy_findb_aws.sh \
              infra/deploy/runtime-secrets/findb.json \
              docker-compose.prod.yml \
              infra/nginx/nginx.conf \
              infra/nginx/source-allowlist.conf \
              infra/nginx/cloudflare-real-ip.conf; do
              if [ ! -f "$staging_root/$relative_path" ] || [ -L "$staging_root/$relative_path" ]; then
                echo "::error title=Runtime-secret bundle missing::${relative_path} is not a regular staged file"
                exit 1
              fi
            done
            declare -A expected_staged=(
              [infra/deploy/runtime-secrets/load_runtime_secrets.py]="$LOADER_SHA256"
              [infra/deploy/runtime-secrets/runtime_secret_command.sh]="$COMMAND_SHA256"
              [infra/deploy/runtime-secrets/render_nginx_runtime.sh]="$NGINX_SHA256"
              [infra/deploy/runtime-secrets/render_serve_key.py]="$RENDER_SHA256"
              [infra/deploy/runtime-secrets/install_findb_bootstrap.sh]="$BOOTSTRAP_SHA256"
              [infra/deploy/runtime-secrets/deploy_findb_aws.sh]="$DEPLOY_SHA256"
              [infra/deploy/runtime-secrets/findb.json]="$CATALOG_SHA256"
              [docker-compose.prod.yml]="$COMPOSE_SHA256"
              [infra/nginx/nginx.conf]="$NGINX_CONFIG_SHA256"
              [infra/nginx/source-allowlist.conf]="$SOURCE_ALLOWLIST_SHA256"
              [infra/nginx/cloudflare-real-ip.conf]="$CLOUDFLARE_REAL_IP_SHA256"
            )
            for relative_path in "${!expected_staged[@]}"; do
              actual="$(sha256sum "$staging_root/$relative_path" | cut -d ' ' -f1)"
              if [ -z "${expected_staged[$relative_path]}" ] || [ "$actual" != "${expected_staged[$relative_path]}" ]; then
                echo "::error title=Runtime-secret bundle checksum failed::${relative_path} does not match the checked-out artifact"
                exit 1
              fi
            done
            for file in \
              load_runtime_secrets.py \
              runtime_secret_command.sh \
              render_nginx_runtime.sh \
              render_serve_key.py \
              install_findb_bootstrap.sh \
              deploy_findb_aws.sh \
              findb.json; do
              case "$file" in
                findb.json) install_mode=0644; expected_mode=644 ;;
                *) install_mode=0755; expected_mode=755 ;;
              esac
              sudo install -o root -g root -m "$install_mode" \
                "$staging_root/infra/deploy/runtime-secrets/$file" "$runtime_dir/$file"
              if [ "$(sudo stat -c '%u:%g:%a' "$runtime_dir/$file")" != "0:0:$expected_mode" ]; then
                echo "::error title=Runtime-secret bundle metadata failed::${file} ownership or mode is unsafe"
                exit 1
              fi
            done
            declare -A expected=(
              [load_runtime_secrets.py]="$LOADER_SHA256"
              [runtime_secret_command.sh]="$COMMAND_SHA256"
              [render_nginx_runtime.sh]="$NGINX_SHA256"
              [render_serve_key.py]="$RENDER_SHA256"
              [deploy_findb_aws.sh]="$DEPLOY_SHA256"
              [findb.json]="$CATALOG_SHA256"
            )
            for file in "${!expected[@]}"; do
              actual="$(sudo sha256sum "$runtime_dir/$file" | cut -d ' ' -f1)"
              if [ -z "${expected[$file]}" ] || [ "$actual" != "${expected[$file]}" ]; then
                echo "::error title=Runtime-secret bundle checksum failed::${file} does not match the checked-out artifact"
                exit 1
              fi
            done
            sudo install -o ubuntu -g ubuntu -m 0644 \
              "$staging_root/docker-compose.prod.yml" /opt/findb/docker-compose.prod.yml
            if [ "$(sudo stat -c '%U:%G:%a' /opt/findb/docker-compose.prod.yml)" != "ubuntu:ubuntu:644" ] \
              || [ "$(sudo sha256sum /opt/findb/docker-compose.prod.yml | cut -d ' ' -f1)" != "$COMPOSE_SHA256" ]; then
              echo "::error title=Deploy artifact install failed::docker-compose.prod.yml metadata or checksum is invalid"
              exit 1
            fi
            for file in nginx.conf source-allowlist.conf cloudflare-real-ip.conf; do
              sudo install -o ubuntu -g ubuntu -m 0644 \
                "$staging_root/infra/nginx/$file" "/home/ubuntu/etc/nginx/$file"
            done
            declare -A installed_nginx=(
              [nginx.conf]="$NGINX_CONFIG_SHA256"
              [source-allowlist.conf]="$SOURCE_ALLOWLIST_SHA256"
              [cloudflare-real-ip.conf]="$CLOUDFLARE_REAL_IP_SHA256"
            )
            for file in "${!installed_nginx[@]}"; do
              if [ "$(sudo stat -c '%U:%G:%a' "/home/ubuntu/etc/nginx/$file")" != "ubuntu:ubuntu:644" ] \
                || [ "$(sudo sha256sum "/home/ubuntu/etc/nginx/$file" | cut -d ' ' -f1)" != "${installed_nginx[$file]}" ]; then
                echo "::error title=Nginx artifact install failed::${file} metadata or checksum is invalid"
                exit 1
              fi
            done
            sudo rm -rf -- /tmp/findb-runtime-secrets
            echo "runtime_secret_bundle=verified files=11"

      - name: Install FinDB boot-time runtime-secret dependency
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          AWS_REGION: ap-southeast-1
          FINDB_PUBLIC_HOST: ${{ vars.FINDB_PUBLIC_HOST }}
        with:
          host: ${{ secrets.FINDB_EC2_HOST }}
          username: ${{ secrets.FINDB_EC2_USER }}
          key: ${{ secrets.FINDB_EC2_SSH_KEY }}
          envs: AWS_REGION,FINDB_PUBLIC_HOST
          script: |
            set -euo pipefail
            sudo /opt/findb/runtime-secrets/install_findb_bootstrap.sh \
              "$AWS_REGION" "$FINDB_PUBLIC_HOST"

      - name: Run FinDB AWS runtime-secret canary
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          AWS_REGION: ap-southeast-1
        with:
          host: ${{ secrets.FINDB_EC2_HOST }}
          username: ${{ secrets.FINDB_EC2_USER }}
          key: ${{ secrets.FINDB_EC2_SSH_KEY }}
          envs: AWS_REGION
          script: |
            set -euo pipefail
            sudo python3 /opt/findb/runtime-secrets/load_runtime_secrets.py \
              --catalog /opt/findb/runtime-secrets/findb.json \
              --consumer canary \
              --region "$AWS_REGION" \
              --output /run/findb-runtime-secrets/canary/runtime.env \
              --owner 0:0 \
              --check-only

      - name: Deploy to EC2 with AWS runtime secrets
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          AWS_REGION: ap-southeast-1
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          ECR_REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com
          FINDB_IMAGE: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/backend
          DASHBOARD_IMAGE: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/dashboard
          APP_NAME: ${{ vars.APP_NAME }}
          APP_VERSION: ${{ vars.APP_VERSION }}
          DEBUG: ${{ vars.DEBUG }}
          PORT: ${{ vars.PORT }}
          DATABASE_POOL_SIZE: ${{ vars.DATABASE_POOL_SIZE }}
          DATABASE_MAX_OVERFLOW: ${{ vars.DATABASE_MAX_OVERFLOW }}
          API_V1_PREFIX: ${{ vars.API_V1_PREFIX }}
          API_KEY_HEADER: ${{ vars.API_KEY_HEADER }}
          SOURCE_ALLOWLIST_CIDRS: ${{ vars.SOURCE_ALLOWLIST_CIDRS }}
