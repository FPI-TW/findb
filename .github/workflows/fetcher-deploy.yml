name: Reusable Fetcher deployment

# The same host transaction for staging and production: validate the immutable
# bundle, run a read-only SSM preflight with the trusted host guard, run the
# candidate or accepted replay behind the trusted checkpoint gate, persist the
# acceptance record, then activate. Control-plane values come from the
# committed infra/env/<target>/fetcher.json at the workflow's own SHA; every
# application value is loaded on the host from Secrets Manager.
on:
  workflow_call:
    inputs:
      deployment_target: {required: true, type: string}
      revision: {required: true, type: string}
      mode: {required: true, type: string}
      bundle_key: {required: true, type: string}
      release_tag: {required: false, type: string, default: ''}
    outputs:
      accepted_bundle_key: {value: '${{ jobs.deploy.outputs.accepted_bundle_key }}'}
      target_id: {value: '${{ jobs.deploy.outputs.target_id }}'}
      release_root: {value: '${{ jobs.deploy.outputs.release_root }}'}
      finlab_image_ref: {value: '${{ jobs.deploy.outputs.finlab_image_ref }}'}

permissions: {contents: read, id-token: write}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.deployment_target }}-fetcher
    concurrency: {group: '${{ inputs.deployment_target }}-fetcher-deploy', cancel-in-progress: false}
    outputs:
      accepted_bundle_key: ${{ steps.outputs.outputs.accepted_bundle_key }}
      target_id: ${{ steps.outputs.outputs.target_id }}
      release_root: ${{ steps.outputs.outputs.release_root }}
      finlab_image_ref: ${{ steps.release.outputs.finlab }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ inputs.revision }}', persist-credentials: false}
      - name: Checkout trusted checkpoint safety gate and control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .trusted-checkpoint-safety
          persist-credentials: false
          sparse-checkout: |
            infra/deploy/check_full_market_checkpoint.sh
            infra/deploy/check_fetcher_host.py
            infra/deploy/release_manifest.py
            infra/env/control_plane.py
            infra/env/staging/findb.json
            infra/env/staging/fetcher.json
            infra/env/production/findb.json
            infra/env/production/fetcher.json
          sparse-checkout-cone-mode: false
      - name: Verify trusted checkpoint safety provenance
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [ "$(git -C .trusted-checkpoint-safety rev-parse HEAD)" = "$WORKFLOW_SHA" ]
          guard=.trusted-checkpoint-safety/infra/deploy/check_full_market_checkpoint.sh
          [ -f "$guard" ] && [ ! -L "$guard" ]
          bash -n "$guard"
          for helper in check_fetcher_host.py release_manifest.py; do
            trusted=.trusted-checkpoint-safety/infra/deploy/$helper
            [ -f "$trusted" ] && [ ! -L "$trusted" ]
            [ "$(sha256sum "$trusted" | cut -d ' ' -f1)" = "$(git -C .trusted-checkpoint-safety show "$WORKFLOW_SHA:infra/deploy/$helper" | sha256sum | cut -d ' ' -f1)" ]
          done
      - name: Load control-plane configuration
        env: {TARGET: '${{ inputs.deployment_target }}', UNIT: fetcher}
        run: |
          set -euo pipefail
          python3 .trusted-checkpoint-safety/infra/env/control_plane.py export --target "$TARGET" --unit "$UNIT" >> "$GITHUB_ENV"
      - name: Verify immutable target contract
        env:
          EXPECTED_SHA: ${{ inputs.revision }}
          TARGET: ${{ inputs.deployment_target }}
          MODE: ${{ inputs.mode }}
          BUNDLE_KEY: ${{ inputs.bundle_key }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]
          [[ "$TARGET" =~ ^(staging|production)$ ]] || exit 1
          [[ "$MODE" =~ ^(candidate|replay)$ ]] || exit 1
          [[ "$FULL_MARKET_ENABLED" =~ ^(true|false)$ ]] || exit 1
          [[ "$FETCHER_FULL_MARKET_STATE_DIR" =~ ^/var/lib/findb-full-market(/[a-z0-9-]+)?$ ]] || exit 1
          if [ "$TARGET" = production ]; then
            [[ "$RELEASE_TAG" =~ ^fetcher-v[0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 1
            if [ "$MODE" = candidate ]; then
              [[ "$BUNDLE_KEY" =~ ^fetcher/production/candidates/${EXPECTED_SHA}/[0-9]+-[0-9]+-[0-9a-f]{64}[.]tar$ ]] || exit 1
            else
              [[ "$BUNDLE_KEY" =~ ^fetcher/production/accepted/${EXPECTED_SHA}/[0-9a-f]{64}[.]tar$ ]] || exit 1
            fi
          else
            [ -z "$RELEASE_TAG" ]
            if [ "$MODE" = candidate ]; then
              [[ "$BUNDLE_KEY" =~ ^fetcher/candidates/${EXPECTED_SHA}/[0-9]+-[0-9]+-[0-9a-f]{64}[.]tar$ ]] || exit 1
            else
              [[ "$BUNDLE_KEY" =~ ^fetcher/accepted/${EXPECTED_SHA}/[0-9a-f]{64}[.]tar$ ]] || exit 1
            fi
          fi
      - name: Configure target AWS deploy credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: ${{ inputs.deployment_target }}-fetcher-${{ github.run_id }}
      - name: Validate account and materialize release selection
        id: release
        env:
          TARGET: ${{ inputs.deployment_target }}
          REVISION: ${{ inputs.revision }}
          MODE: ${{ inputs.mode }}
          BUNDLE_KEY: ${{ inputs.bundle_key }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUNDLE_BUCKET: ${{ env.DEPLOY_BUNDLE_BUCKET }}
          INSTANCE_PROFILE: ${{ env.AWS_INSTANCE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          [ "$AWS_REGION" = ap-southeast-1 ]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || exit 1
          [ "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID" ]
          [ "$ECR_REGISTRY" = "$AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com" ]
          target_ids="$(aws ec2 describe-instances --filters Name=instance-state-name,Values=running Name=tag:Project,Values=findb Name=tag:Environment,Values="$TARGET" Name=tag:DeploymentUnit,Values=fetcher --query 'Reservations[].Instances[].InstanceId' --output json)"
          [ "$(jq -r length <<<"$target_ids")" -eq 1 ]
          target_id="$(jq -r '.[0]' <<<"$target_ids")"
          profile_arn="$(aws ec2 describe-instances --instance-ids "$target_id" --query 'Reservations[0].Instances[0].IamInstanceProfile.Arn' --output text)"
          [ "${profile_arn##*/}" = "$INSTANCE_PROFILE" ]
          [ "$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$target_id" --query 'InstanceInformationList[0].PingStatus' --output text)" = Online ]
          bundle_filename="${BUNDLE_KEY##*/}"
          bundle_filename="${bundle_filename%.tar}"
          if [ "$MODE" = candidate ]; then
            bundle_sha256="${bundle_filename##*-}"
          else
            bundle_sha256="$bundle_filename"
          fi
          [[ "$bundle_sha256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          aws s3api get-object --bucket "$BUNDLE_BUCKET" --key "$BUNDLE_KEY" "$RUNNER_TEMP/release-bundle.tar" >/dev/null
          [ "$(sha256sum "$RUNNER_TEMP/release-bundle.tar" | cut -d ' ' -f1)" = "$bundle_sha256" ]
          validator="infra/deploy/release_manifest.py"
          python3 "$validator" validate-bundle --bundle "$RUNNER_TEMP/release-bundle.tar" --expected-bundle-sha256 "$bundle_sha256" --unit fetcher
          tar -xOf "$RUNNER_TEMP/release-bundle.tar" release-manifest.json > "$RUNNER_TEMP/release-manifest.json"
          [ "$(jq -r .deployment_target "$RUNNER_TEMP/release-manifest.json")" = "$TARGET" ]
          [ "$(jq -r .release_tag "$RUNNER_TEMP/release-manifest.json")" = "$RELEASE_TAG" ]
          if [ "$TARGET" = production ]; then
            [ "$(jq -r .promotion_source.staging_registry "$RUNNER_TEMP/release-manifest.json")" = "$STAGING_ECR_REGISTRY" ]
          fi
          twelve_data="$(jq -r .images.twelve_data "$RUNNER_TEMP/release-manifest.json")"
          finlab="$(jq -r .images.finlab "$RUNNER_TEMP/release-manifest.json")"
          shioaji="$(jq -r .images.shioaji "$RUNNER_TEMP/release-manifest.json")"
          python3 "$validator" validate-bundle --bundle "$RUNNER_TEMP/release-bundle.tar" --expected-bundle-sha256 "$bundle_sha256" --unit fetcher --commit-sha "$REVISION" --migration-revision none --image "twelve_data=$twelve_data" --image "finlab=$finlab" --image "shioaji=$shioaji"
          [ "$(jq -r .migration_revision "$RUNNER_TEMP/release-manifest.json")" = none ]
          [[ "$twelve_data" =~ ^${ECR_REGISTRY}/findb/${TARGET}/fetcher/twelve-data@sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$finlab" =~ ^${ECR_REGISTRY}/findb/${TARGET}/fetcher/finlab@sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$shioaji" =~ ^${ECR_REGISTRY}/findb/${TARGET}/fetcher/shioaji@sha256:[0-9a-f]{64}$ ]] || exit 1
          if [ "$MODE" = replay ]; then
            record_key="${BUNDLE_KEY%.tar}.acceptance.json"
            aws s3api get-object --bucket "$BUNDLE_BUCKET" --key "$record_key" "$RUNNER_TEMP/acceptance.json" >/dev/null
            jq -e --arg target "$TARGET" --arg key "$BUNDLE_KEY" --arg sha "$bundle_sha256" --arg revision "$REVISION" --arg release_tag "$RELEASE_TAG" '.schema_version == 2 and .deployment_target == $target and .state == "accepted" and .bundle_key == $key and .bundle_sha256 == $sha and .unit == "fetcher" and .commit_sha == $revision and .release_tag == $release_tag and (.ssm_command_id | test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))' "$RUNNER_TEMP/acceptance.json" >/dev/null
          fi
          # Accepted bundles produced before the unified pipeline recorded a
          # bounded/full-market profile that their own coordinator re-checks.
          # Replay supplies exactly the bundled manifest's value; new releases
          # carry no profile and never receive one.
          legacy_profile="$(jq -r '.runtime_profile // empty' "$RUNNER_TEMP/release-manifest.json")"
          if [ -n "$legacy_profile" ]; then
            [ "$MODE" = replay ]
            [[ "$legacy_profile" =~ ^(bounded|full-market)$ ]] || exit 1
          fi
          validator_sha256="$(sha256sum infra/deploy/release_manifest.py | cut -d ' ' -f1)"
          printf 'bundle_sha256=%s\ntwelve_data=%s\nfinlab=%s\nshioaji=%s\ntarget_id=%s\nvalidator_sha256=%s\nlegacy_profile=%s\n' "$bundle_sha256" "$twelve_data" "$finlab" "$shioaji" "$target_id" "$validator_sha256" "$legacy_profile" >> "$GITHUB_OUTPUT"
      - name: Run read-only SSM preflight
        id: preflight
        env:
          TARGET: ${{ inputs.deployment_target }}
          REVISION: ${{ inputs.revision }}
          BUNDLE_KEY: ${{ inputs.bundle_key }}
          BUNDLE_SHA256: ${{ steps.release.outputs.bundle_sha256 }}
          VALIDATOR_SHA256: ${{ steps.release.outputs.validator_sha256 }}
          TWELVE_IMAGE: ${{ steps.release.outputs.twelve_data }}
          FINLAB_IMAGE: ${{ steps.release.outputs.finlab }}
          SHIOAJI_IMAGE: ${{ steps.release.outputs.shioaji }}
          TARGET_ID: ${{ steps.release.outputs.target_id }}
          BUNDLE_BUCKET: ${{ env.DEPLOY_BUNDLE_BUCKET }}
          DNS_CHECK_NAME: ${{ env.FINDB_PUBLIC_HOST }}
          SSM_LOG_GROUP: ${{ env.AWS_SSM_LOG_GROUP }}
          FULL_MARKET_STATE_DIR: ${{ env.FETCHER_FULL_MARKET_STATE_DIR }}
        run: |
          set -euo pipefail
          marker="fetcher-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for name in TARGET REVISION BUNDLE_KEY BUNDLE_SHA256 VALIDATOR_SHA256 TWELVE_IMAGE FINLAB_IMAGE SHIOAJI_IMAGE TARGET_ID AWS_REGION AWS_ACCOUNT_ID ECR_REGISTRY BUNDLE_BUCKET DNS_CHECK_NAME SSM_LOG_GROUP FULL_MARKET_STATE_DIR; do [ -n "${!name:-}" ] || exit 1; done
          printf -v q_target '%q' "$TARGET"; printf -v q_revision '%q' "$REVISION"; printf -v q_key '%q' "$BUNDLE_KEY"; printf -v q_sha '%q' "$BUNDLE_SHA256"; printf -v q_validator '%q' "$VALIDATOR_SHA256"; printf -v q_twelve '%q' "$TWELVE_IMAGE"; printf -v q_finlab '%q' "$FINLAB_IMAGE"; printf -v q_shioaji '%q' "$SHIOAJI_IMAGE"; printf -v q_account '%q' "$AWS_ACCOUNT_ID"; printf -v q_region '%q' "$AWS_REGION"; printf -v q_registry '%q' "$ECR_REGISTRY"; printf -v q_bucket '%q' "$BUNDLE_BUCKET"; printf -v q_dns '%q' "$DNS_CHECK_NAME"; printf -v q_marker '%q' "$marker"; printf -v q_state_dir '%q' "$FULL_MARKET_STATE_DIR"
          host_guard=.trusted-checkpoint-safety/infra/deploy/check_fetcher_host.py
          installed_validator=.trusted-checkpoint-safety/infra/deploy/release_manifest.py
          [ -f "$installed_validator" ] && [ ! -L "$installed_validator" ]
          installed_validator_b64="$(gzip -c "$installed_validator" | base64 -w0)"
          installed_validator_sha="$(sha256sum "$installed_validator" | cut -d ' ' -f1)"
          printf -v q_installed_validator_b64 '%q' "$installed_validator_b64"
          printf -v q_installed_validator_sha '%q' "$installed_validator_sha"
          [ -f "$host_guard" ] && [ ! -L "$host_guard" ]
          host_guard_b64="$(gzip -c "$host_guard" | base64 -w0)"
          host_guard_sha="$(sha256sum "$host_guard" | cut -d ' ' -f1)"
          printf -v q_host_guard_b64 '%q' "$host_guard_b64"
          printf -v q_host_guard_sha '%q' "$host_guard_sha"
          host_command="set -euo pipefail; trap 'printf \"fetcher_preflight_marker=%s status=failed\\n\" $q_marker' ERR; [ \"\$(aws sts get-caller-identity --query Account --output text)\" = $q_account ]; getent ahostsv4 $q_dns >/dev/null; work=\$(mktemp -d /tmp/fetcher-preflight.XXXXXX); trap 'rm -rf \"\$work\"' EXIT; bundle=\"\$work/bundle.tar\"; aws s3api get-object --bucket $q_bucket --key $q_key \"\$bundle\" >/dev/null; [ \"\$(sha256sum \"\$bundle\" | cut -d ' ' -f1)\" = $q_sha ]; tar -xOf \"\$bundle\" infra/deploy/release_manifest.py > \"\$work/validator.py\"; [ \"\$(sha256sum \"\$work/validator.py\" | cut -d ' ' -f1)\" = $q_validator ]; python3 \"\$work/validator.py\" materialize-bundle --bundle \"\$bundle\" --expected-bundle-sha256 $q_sha --unit fetcher --output \"\$work/release\" --commit-sha $q_revision --migration-revision none --image twelve_data=$q_twelve --image finlab=$q_finlab --image shioaji=$q_shioaji; aws ecr get-login-password --region $q_region | docker --config \"\$work/docker\" login --username AWS --password-stdin $q_registry >/dev/null; for image in $q_twelve $q_finlab $q_shioaji; do docker --config \"\$work/docker\" pull \"\$image\" >/dev/null; docker image inspect \"\$image\" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -Fxq \"\$image\"; done; if aws secretsmanager get-secret-value --region $q_region --secret-id findb/$q_target/findb/runtime/configuration >/dev/null 2>&1; then exit 1; fi; python3 \"\$work/release/infra/deploy/runtime-secrets/load_runtime_secrets.py\" --catalog \"\$work/release/infra/deploy/runtime-secrets/fetcher.json\" --consumer twelve-data --region $q_region --deployment-target $q_target --output /run/findb-runtime-secrets/preflight-fetcher/runtime.env --check-only; bash -n \"\$work/release/infra/deploy/runtime-secrets/runtime_secret_command.sh\" \"\$work/release/infra/deploy/runtime-secrets/deploy_fetcher_aws.sh\" \"\$work/release/infra/deploy/runtime-secrets/release_fetcher_provider.sh\"; printf '%s' $q_host_guard_b64 | base64 --decode | gzip --decompress > \"\$work/host-guard.py\"; [ \"\$(sha256sum \"\$work/host-guard.py\" | cut -d ' ' -f1)\" = $q_host_guard_sha ]; printf '%s' $q_installed_validator_b64 | base64 --decode | gzip --decompress > \"\$work/installed-validator.py\"; [ \"\$(sha256sum \"\$work/installed-validator.py\" | cut -d ' ' -f1)\" = $q_installed_validator_sha ]; python3 \"\$work/host-guard.py\" --target $q_target --registry $q_registry --installed-validator \"\$work/installed-validator.py\" --full-market-state-dir $q_state_dir; printf \"fetcher_preflight_marker=%s status=success\\n\" $q_marker"
          host_command="$(printf '%s' "$host_command" | python3 infra/deploy/ssm_bash_command.py)"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --document-name AWS-RunShellScript --instance-ids "$TARGET_ID" --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=${SSM_LOG_GROUP}" --parameters "$(jq -nc --arg command "$host_command" '{commands: [$command]}')" --query Command.CommandId --output text)"
          source infra/deploy/ssm_command_marker_gate.sh
          for _ in $(seq 1 60); do state="$(ssm_command_marker_state "$AWS_REGION" "$command_id" "$TARGET_ID" "fetcher_preflight_marker=$marker status=success" "fetcher_preflight_marker=$marker status=failed")"; [ "$state" = success ] && { echo "command_id=$command_id" >> "$GITHUB_OUTPUT"; exit 0; }; sleep 5; done
          exit 1
      - name: Run candidate acceptance or accepted replay through bounded SSM
        id: ssm
        env:
          TARGET: ${{ inputs.deployment_target }}
          MODE: ${{ inputs.mode }}
          REVISION: ${{ inputs.revision }}
          BUNDLE_KEY: ${{ inputs.bundle_key }}
          BUNDLE_SHA256: ${{ steps.release.outputs.bundle_sha256 }}
          TWELVE_IMAGE: ${{ steps.release.outputs.twelve_data }}
          FINLAB_IMAGE: ${{ steps.release.outputs.finlab }}
          SHIOAJI_IMAGE: ${{ steps.release.outputs.shioaji }}
          LEGACY_PROFILE: ${{ steps.release.outputs.legacy_profile }}
          BUNDLE_BUCKET: ${{ env.DEPLOY_BUNDLE_BUCKET }}
          TARGET_ID: ${{ steps.release.outputs.target_id }}
          VALIDATOR_SHA256: ${{ steps.release.outputs.validator_sha256 }}
          DNS_CHECK_NAME: ${{ env.FINDB_PUBLIC_HOST }}
          SSM_LOG_GROUP: ${{ env.AWS_SSM_LOG_GROUP }}
        run: |
          set -euo pipefail
          [[ "$TARGET_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || exit 1
          # Only non-secret control-plane values cross to the host; application
          # configuration is loaded there from Secrets Manager in every target.
          runtime_variable_names="FULL_MARKET_ENABLED FETCHER_FULL_MARKET_STATE_DIR"
          runtime_exports=""
          for name in $runtime_variable_names; do
            [ -n "${!name:-}" ] || exit 1
            printf -v q_runtime_value '%q' "${!name}"
            runtime_exports+=" $name=$q_runtime_value"
          done
          marker="fetcher-${MODE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v q_bucket '%q' "$BUNDLE_BUCKET"; printf -v q_key '%q' "$BUNDLE_KEY"; printf -v q_sha '%q' "$BUNDLE_SHA256"
          printf -v q_target '%q' "$TARGET"; printf -v q_account '%q' "$AWS_ACCOUNT_ID"; printf -v q_registry '%q' "$ECR_REGISTRY"
          printf -v q_twelve '%q' "$TWELVE_IMAGE"; printf -v q_finlab '%q' "$FINLAB_IMAGE"; printf -v q_shioaji '%q' "$SHIOAJI_IMAGE"
          printf -v q_marker '%q' "$marker"
          printf -v q_dns '%q' "$DNS_CHECK_NAME"
          printf -v q_validator_sha '%q' "$VALIDATOR_SHA256"
          host_mode=candidate; [ "$MODE" = replay ] && host_mode=activate
          if [ "$MODE" = replay ]; then
            runtime_exports="$runtime_exports FETCHER_ACCEPTED_REPLAY=true"
            if [ -n "$LEGACY_PROFILE" ]; then
              # Bounded compatibility shim: an older coordinator compares this
              # value with its bundled manifest. It is derived from that
              # manifest above, never from an input.
              printf -v q_profile '%q' "$LEGACY_PROFILE"
              runtime_exports="$runtime_exports FETCHER_RUNTIME_PROFILE=$q_profile"
            fi
          fi
          printf -v q_host_mode '%q' "$host_mode"
          # Safety policy comes from the current workflow commit, never from
          # inputs.revision or the immutable bundle being replayed.
          guard=.trusted-checkpoint-safety/infra/deploy/check_full_market_checkpoint.sh
          [ -f "$guard" ] && [ ! -L "$guard" ]
          guard_b64="$(base64 -w0 "$guard")"
          guard_sha="$(sha256sum "$guard" | cut -d ' ' -f1)"
          printf -v q_guard_b64 '%q' "$guard_b64"
          printf -v q_guard_sha '%q' "$guard_sha"
          checkpoint_entry_gate="(guard=\$(mktemp /tmp/fetcher-checkpoint-guard.XXXXXX); trap 'rm -f \"\$guard\"' EXIT; printf '%s' $q_guard_b64 | base64 --decode > \"\$guard\"; [ \"\$(sha256sum \"\$guard\" | cut -d ' ' -f1)\" = $q_guard_sha ]; bash \"\$guard\");"
          # Every executed helper, candidate or accepted replay, must carry the
          # canonical environment contract marker; older helpers fail closed.
          environment_contract_gate='grep -qx '\''# findb_environment_contract=app-environment-v1'\'' "$root/infra/deploy/runtime-secrets/deploy_fetcher_aws.sh";'
          host_command="set -euo pipefail; trap 'printf \"fetcher_deploy_marker=%s status=failed\\n\" $q_marker' ERR; [ \"\$(aws sts get-caller-identity --query Account --output text)\" = $q_account ]; getent ahostsv4 $q_dns >/dev/null; bundle=/tmp/fetcher-$BUNDLE_SHA256.tar; validator=/tmp/fetcher-release-manifest-$BUNDLE_SHA256.py; root=/opt/fetcher/releases/$BUNDLE_SHA256-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT; aws s3api get-object --bucket $q_bucket --key $q_key \"\$bundle\" >/dev/null; [ \"\$(sha256sum \"\$bundle\" | cut -d ' ' -f1)\" = $q_sha ]; tar -xOf \"\$bundle\" infra/deploy/release_manifest.py > \"\$validator\"; [ \"\$(sha256sum \"\$validator\" | cut -d ' ' -f1)\" = $q_validator_sha ]; chmod 0700 \"\$validator\"; python3 \"\$validator\" materialize-bundle --bundle \"\$bundle\" --expected-bundle-sha256 $q_sha --unit fetcher --output \"\$root\" --commit-sha $REVISION --migration-revision none --image twelve_data=$q_twelve --image finlab=$q_finlab --image shioaji=$q_shioaji; [ \"\${APP_ENVIRONMENT+x}\" != x ] || [ \"\$APP_ENVIRONMENT\" = $q_target ]; export AWS_REGION=ap-southeast-1 AWS_ACCOUNT_ID=$q_account APP_ENVIRONMENT=$q_target ECR_REGISTRY=$q_registry TWELVE_IMAGE_REF=$q_twelve FINLAB_IMAGE_REF=$q_finlab SHIOAJI_IMAGE_REF=$q_shioaji$runtime_exports FETCHER_RELEASE_ROOT=\"\$root\" FETCHER_DEPLOY_MODE=$q_host_mode; $checkpoint_entry_gate $environment_contract_gate \"\$root/infra/deploy/runtime-secrets/deploy_fetcher_aws.sh\"; printf \"fetcher_deploy_marker=%s status=success\\n\" $q_marker"
          host_command="$(printf '%s' "$host_command" | python3 infra/deploy/ssm_bash_command.py)"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --document-name AWS-RunShellScript --instance-ids "$TARGET_ID" --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=${SSM_LOG_GROUP}" --parameters "$(jq -nc --arg command "$host_command" '{commands: [$command]}')" --query Command.CommandId --output text)"
          source infra/deploy/ssm_command_marker_gate.sh
          for _ in $(seq 1 360); do
            state="$(ssm_command_marker_state "$AWS_REGION" "$command_id" "$TARGET_ID" "fetcher_deploy_marker=$marker status=success" "fetcher_deploy_marker=$marker status=failed")"
            if [ "$state" = success ]; then echo "command_id=$command_id" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Persist immutable target-aware acceptance record
        id: acceptance
        if: ${{ success() && inputs.mode == 'candidate' }}
        env:
          TARGET: ${{ inputs.deployment_target }}
          REVISION: ${{ inputs.revision }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_KEY: ${{ inputs.bundle_key }}
          BUNDLE_SHA256: ${{ steps.release.outputs.bundle_sha256 }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          VALIDATOR_SHA256: ${{ steps.release.outputs.validator_sha256 }}
          TWELVE_IMAGE: ${{ steps.release.outputs.twelve_data }}
          FINLAB_IMAGE: ${{ steps.release.outputs.finlab }}
          SHIOAJI_IMAGE: ${{ steps.release.outputs.shioaji }}
          BUNDLE_BUCKET: ${{ env.DEPLOY_BUNDLE_BUCKET }}
          KMS_KEY: ${{ env.DEPLOY_BUNDLE_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = production ]; then
            accepted_key="fetcher/production/accepted/${REVISION}/${BUNDLE_SHA256}.tar"
          else
            accepted_key="fetcher/accepted/${REVISION}/${BUNDLE_SHA256}.tar"
          fi
          if aws s3api head-object --bucket "$BUNDLE_BUCKET" --key "$accepted_key" >/dev/null 2>&1; then
            aws s3api get-object --bucket "$BUNDLE_BUCKET" --key "$accepted_key" "$RUNNER_TEMP/existing.tar" >/dev/null
            [ "$(sha256sum "$RUNNER_TEMP/existing.tar" | cut -d ' ' -f1)" = "$BUNDLE_SHA256" ]
          else
            aws s3api put-object --bucket "$BUNDLE_BUCKET" --key "$accepted_key" --body "$RUNNER_TEMP/release-bundle.tar" --if-none-match '*' --server-side-encryption aws:kms --ssekms-key-id "$KMS_KEY" >/dev/null
          fi
          record_key="${accepted_key%.tar}.acceptance.json"
          jq -cn --arg target "$TARGET" --arg unit fetcher --arg commit_sha "$REVISION" --arg bundle_sha256 "$BUNDLE_SHA256" --arg bundle_key "$accepted_key" --arg release_tag "$RELEASE_TAG" --arg candidate_key "$CANDIDATE_KEY" --arg ssm_command_id "$COMMAND_ID" --arg validator_sha256 "$VALIDATOR_SHA256" --arg twelve "$TWELVE_IMAGE" --arg finlab "$FINLAB_IMAGE" --arg shioaji "$SHIOAJI_IMAGE" --arg workflow_run_id "$GITHUB_RUN_ID" --arg workflow_run_attempt "$GITHUB_RUN_ATTEMPT" '{schema_version:2,deployment_target:$target,unit:$unit,commit_sha:$commit_sha,bundle_sha256:$bundle_sha256,bundle_key:$bundle_key,release_tag:$release_tag,candidate_key:$candidate_key,ssm_command_id:$ssm_command_id,validator_sha256:$validator_sha256,migration_revision:"none",images:{twelve_data:$twelve,finlab:$finlab,shioaji:$shioaji},workflow_run_id:$workflow_run_id,workflow_run_attempt:$workflow_run_attempt,state:"accepted"}' > "$RUNNER_TEMP/acceptance.json"
          if aws s3api head-object --bucket "$BUNDLE_BUCKET" --key "$record_key" >/dev/null 2>&1; then
            aws s3api get-object --bucket "$BUNDLE_BUCKET" --key "$record_key" "$RUNNER_TEMP/existing-acceptance.json" >/dev/null
            jq -e --arg target "$TARGET" --arg key "$accepted_key" --arg sha "$BUNDLE_SHA256" --arg revision "$REVISION" --arg release_tag "$RELEASE_TAG" '.schema_version == 2 and .deployment_target == $target and .state == "accepted" and .unit == "fetcher" and .bundle_key == $key and .bundle_sha256 == $sha and .commit_sha == $revision and .release_tag == $release_tag' "$RUNNER_TEMP/existing-acceptance.json" >/dev/null
          else
            aws s3api put-object --bucket "$BUNDLE_BUCKET" --key "$record_key" --body "$RUNNER_TEMP/acceptance.json" --if-none-match '*' --server-side-encryption aws:kms --ssekms-key-id "$KMS_KEY" >/dev/null
          fi
          echo "accepted_bundle_key=$accepted_key" >> "$GITHUB_OUTPUT"
      - name: Activate only after immutable acceptance is durable
        if: ${{ success() && inputs.mode == 'candidate' }}
        env:
          TARGET: ${{ inputs.deployment_target }}
          BUNDLE_SHA256: ${{ steps.release.outputs.bundle_sha256 }}
          TARGET_ID: ${{ steps.release.outputs.target_id }}
          TWELVE_IMAGE: ${{ steps.release.outputs.twelve_data }}
          FINLAB_IMAGE: ${{ steps.release.outputs.finlab }}
          SHIOAJI_IMAGE: ${{ steps.release.outputs.shioaji }}
          SSM_LOG_GROUP: ${{ env.AWS_SSM_LOG_GROUP }}
        run: |
          set -euo pipefail
          runtime_variable_names="FULL_MARKET_ENABLED FETCHER_FULL_MARKET_STATE_DIR"
          runtime_exports=""
          for name in $runtime_variable_names; do
            [ -n "${!name:-}" ] || exit 1
            printf -v q_runtime_value '%q' "${!name}"
            runtime_exports+=" $name=$q_runtime_value"
          done
          marker="fetcher-activate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          root="/opt/fetcher/releases/${BUNDLE_SHA256}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v q_root '%q' "$root"; printf -v q_account '%q' "$AWS_ACCOUNT_ID"; printf -v q_registry '%q' "$ECR_REGISTRY"; printf -v q_twelve '%q' "$TWELVE_IMAGE"; printf -v q_finlab '%q' "$FINLAB_IMAGE"; printf -v q_shioaji '%q' "$SHIOAJI_IMAGE"; printf -v q_target '%q' "$TARGET"; printf -v q_marker '%q' "$marker"
          host_command="set -euo pipefail; trap 'printf \"fetcher_activate_marker=%s status=failed\\n\" $q_marker' ERR; root=$q_root; [ -d \"\$root\" ] && [ ! -L \"\$root\" ]; [ \"\$(aws sts get-caller-identity --query Account --output text)\" = $q_account ]; [ \"\${APP_ENVIRONMENT+x}\" != x ] || [ \"\$APP_ENVIRONMENT\" = $q_target ]; export AWS_REGION=ap-southeast-1 AWS_ACCOUNT_ID=$q_account APP_ENVIRONMENT=$q_target ECR_REGISTRY=$q_registry TWELVE_IMAGE_REF=$q_twelve FINLAB_IMAGE_REF=$q_finlab SHIOAJI_IMAGE_REF=$q_shioaji$runtime_exports FETCHER_RELEASE_ROOT=\"\$root\" FETCHER_DEPLOY_MODE=activate; grep -qx \"# findb_environment_contract=app-environment-v1\" \"\$root/infra/deploy/runtime-secrets/deploy_fetcher_aws.sh\"; \"\$root/infra/deploy/runtime-secrets/deploy_fetcher_aws.sh\"; printf \"fetcher_activate_marker=%s status=success\\n\" $q_marker"
          host_command="$(printf '%s' "$host_command" | python3 infra/deploy/ssm_bash_command.py)"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --document-name AWS-RunShellScript --instance-ids "$TARGET_ID" --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=${SSM_LOG_GROUP}" --parameters "$(jq -nc --arg command "$host_command" '{commands: [$command]}')" --query Command.CommandId --output text)"
          source infra/deploy/ssm_command_marker_gate.sh
          for _ in $(seq 1 360); do
            state="$(ssm_command_marker_state "$AWS_REGION" "$command_id" "$TARGET_ID" "fetcher_activate_marker=$marker status=success" "fetcher_activate_marker=$marker status=failed")"
            [ "$state" = success ] && exit 0
            sleep 5
          done
          exit 1
      - name: Publish reusable deployment outputs
        id: outputs
        if: ${{ success() }}
        env:
          TARGET_ID: ${{ steps.release.outputs.target_id }}
          BUNDLE_SHA256: ${{ steps.release.outputs.bundle_sha256 }}
          ACCEPTED_BUNDLE_KEY: ${{ steps.acceptance.outputs.accepted_bundle_key || inputs.bundle_key }}
        run: |
          set -euo pipefail
          printf 'accepted_bundle_key=%s\n' "$ACCEPTED_BUNDLE_KEY" >> "$GITHUB_OUTPUT"
          printf 'target_id=%s\n' "$TARGET_ID" >> "$GITHUB_OUTPUT"
          printf 'release_root=/opt/fetcher/releases/%s-%s-%s\n' "$BUNDLE_SHA256" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
