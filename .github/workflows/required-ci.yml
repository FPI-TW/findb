name: Required CI

on:
  pull_request:
    branches: [main]

permissions: {contents: read}
concurrency:
  group: required-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      findb_ci: ${{ steps.policy.outputs.findb_ci }}
      fetcher_ci: ${{ steps.policy.outputs.fetcher_ci }}
      findb_staging: ${{ steps.policy.outputs.findb_staging }}
      fetcher_staging: ${{ steps.policy.outputs.fetcher_staging }}
      infra_plan: ${{ steps.policy.outputs.infra_plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: revision
        env: {EXPECTED_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"; [ "$actual" = "$EXPECTED_SHA" ]
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - id: policy
        env: {BASE: '${{ github.event.pull_request.base.sha }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: python3 infra/deploy/change_policy.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
  findb:
    needs: policy
    if: ${{ needs.policy.outputs.findb_ci == 'true' }}
    uses: ./.github/workflows/findb-ci.yml
    with: {revision: '${{ needs.policy.outputs.revision }}'}
  fetcher:
    needs: policy
    if: ${{ needs.policy.outputs.fetcher_ci == 'true' }}
    uses: ./.github/workflows/fetcher-ci.yml
    with: {revision: '${{ needs.policy.outputs.revision }}'}
  staging-infra-plan:
    needs: policy
    if: ${{ needs.policy.outputs.infra_plan == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/staging-infra-plan.yml
  required:
    name: Required CI
    if: ${{ always() }}
    needs: [policy, findb, fetcher, staging-infra-plan]
    runs-on: ubuntu-latest
    steps:
      - env:
          POLICY: ${{ needs.policy.result }}
          FINDB: ${{ needs.findb.result }}
          FETCHER: ${{ needs.fetcher.result }}
          WANT_FINDB: ${{ needs.policy.outputs.findb_ci }}
          WANT_FETCHER: ${{ needs.policy.outputs.fetcher_ci }}
          INFRA: ${{ needs.staging-infra-plan.result }}
          WANT_INFRA: ${{ needs.policy.outputs.infra_plan }}
        run: |
          set -euo pipefail
          [ "$POLICY" = success ]
          if [ "$WANT_FINDB" = true ]; then
            [ "$FINDB" = success ]
          else
            [ "$WANT_FINDB" = false ] && [ "$FINDB" = skipped ]
          fi
          if [ "$WANT_FETCHER" = true ]; then
            [ "$FETCHER" = success ]
          else
            [ "$WANT_FETCHER" = false ] && [ "$FETCHER" = skipped ]
          fi
          if [ "$WANT_INFRA" = true ]; then
            [ "$INFRA" = success ]
          else
            [ "$WANT_INFRA" = false ] && [ "$INFRA" = skipped ]
          fi
