name: FinDB Production CD
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Promote staging or replay production
        required: true
        type: choice
        options:
        - promote
        - rollback
      release_tag:
        description: Exact immutable findb-vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      accepted_bundle_key:
        description: Exact staging or production accepted bundle key
        required: true
        type: string
      confirmation:
        description: Type PROMOTE_FINDB_PRODUCTION
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-findb
  cancel-in-progress: false
jobs:
  # Release binding and promotion are shared with the other unit; this caller
  # keeps the unit's dispatch inputs, concurrency, CI, deployer and alerting.
  release:
    uses: ./.github/workflows/production-release.yml
    with:
      unit: findb
      mode: ${{ inputs.mode }}
      release_tag: ${{ inputs.release_tag }}
      accepted_bundle_key: ${{ inputs.accepted_bundle_key }}
      confirmation: ${{ inputs.confirmation }}
  verify:
    # A rollback replays a production acceptance record, which already proves
    # this SHA passed CI at promotion. Re-running today's CI definition against
    # an older SHA can fail on drift and only delays recovery.
    needs: release
    if: ${{ inputs.mode == 'promote' }}
    uses: ./.github/workflows/findb-ci.yml
    with:
      revision: ${{ needs.release.outputs.revision }}
  promote:
    needs:
    - release
    - verify
    if: ${{ inputs.mode == 'promote' && needs.verify.result == 'success' }}
    uses: ./.github/workflows/production-promote.yml
    with:
      unit: findb
      revision: ${{ needs.release.outputs.revision }}
      release_tag: ${{ inputs.release_tag }}
      accepted_bundle_key: ${{ inputs.accepted_bundle_key }}
  deploy-promotion:
    needs:
    - release
    - verify
    - promote
    if: ${{ inputs.mode == 'promote' && needs.promote.result == 'success' }}
    uses: ./.github/workflows/findb-deploy.yml
    with:
      deployment_target: production
      revision: ${{ needs.release.outputs.revision }}
      mode: candidate
      bundle_key: ${{ needs.promote.outputs.candidate_bundle_key }}
      release_tag: ${{ inputs.release_tag }}
  deploy-rollback:
    needs:
    - release
    if: ${{ inputs.mode == 'rollback' && needs.release.result == 'success' }}
    uses: ./.github/workflows/findb-deploy.yml
    with:
      deployment_target: production
      revision: ${{ needs.release.outputs.revision }}
      mode: replay
      bundle_key: ${{ inputs.accepted_bundle_key }}
      release_tag: ${{ inputs.release_tag }}
  report-production-deployment-failure:
    # The release job also fails on input validation; only jobs after a
    # successful release binding report a deployment failure.
    needs:
    - verify
    - promote
    - deploy-promotion
    - deploy-rollback
    if: |-
      always() && github.ref == 'refs/heads/main' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Load deployment driver from protected main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: .deployment-driver
        persist-credentials: false
    - name: Load AWS deployment configuration
      uses: ./.deployment-driver/.github/actions/aws-configuration
      with:
        target: production
        unit: findb
    - name: Verify deployment account
      shell: bash
      run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
    - name: Publish production deployment failure metric
      run: |
        aws cloudwatch put-metric-data \
          --region ap-southeast-1 \
          --namespace FinDB/Production \
          --metric-name DeploymentFailure \
          --dimensions DeploymentUnit=findb,Resource=github-actions \
          --value 1 \
          --unit Count
  deployment-summary:
    needs: [release, verify, promote, deploy-promotion, deploy-rollback]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Report deployment wall time
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 infra/deploy/deployment_timing.py --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/deployment-timing.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: deployment-timing-findb
        path: ${{ runner.temp }}/deployment-timing.json
