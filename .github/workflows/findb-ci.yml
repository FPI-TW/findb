name: FinDB CI

# Pull requests are routed through required-ci.yml. After merge, FinDB CD calls
# this workflow once through workflow_call before it can build or deploy.
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findb
          POSTGRES_PASSWORD: findb
          POSTGRES_DB: findb_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U findb -d findb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://findb:findb@localhost:5435/findb_test
      TEST_DATABASE_URL: postgresql+asyncpg://findb:findb@localhost:5435/findb_test

    steps:
      - name: Record job start
        working-directory: ${{ runner.temp }}
        run: echo "FINDB_CI_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ inputs.revision || github.sha }}', persist-credentials: false}
      - name: Verify exact requested revision
        env: {EXPECTED_SHA: '${{ inputs.revision || github.sha }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.9"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            fetcher/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Fetcher runtime dependencies
        working-directory: fetcher
        run: uv sync --frozen --no-dev

      - name: Lint and format check
        run: |
          uv run ruff check app tests scripts migrations
          uv run ruff format --check app tests scripts migrations

      - name: Type check
        run: uv run mypy app

      - name: Check published contracts
        run: |
          uv run python scripts/export_ingress_contracts.py --check
          uv run python scripts/export_archive_contracts.py --check

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/findb-ci-backend"
          /usr/bin/time -p -o "$RUNNER_TEMP/findb-ci-backend/pytest-time.txt" \
            uv run pytest -n 2 --dist worksteal --tb=short -q \
            --durations=20 --durations-min=0.5 \
            --junitxml="$RUNNER_TEMP/findb-ci-backend/junit.xml" \
            --ignore-glob='tests/test_*migration*.py' \
            2>&1 | tee "$RUNNER_TEMP/findb-ci-backend/pytest.log"

      - name: Record total job timing
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/findb-ci-backend"
          elapsed=$(( $(date +%s) - FINDB_CI_JOB_STARTED_AT ))
          echo "job_elapsed_seconds=$elapsed" | tee "$RUNNER_TEMP/findb-ci-backend/job-time.txt"
          echo "backend elapsed: ${elapsed}s (first step through report creation)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findb-ci-backend-${{ github.run_attempt }}
          path: ${{ runner.temp }}/findb-ci-backend/
          retention-days: 14

  backend-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findb
          POSTGRES_PASSWORD: findb
          POSTGRES_DB: findb_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U findb -d findb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://findb:findb@localhost:5435/findb_test
      TEST_DATABASE_URL: postgresql+asyncpg://findb:findb@localhost:5435/findb_test

    steps:
      - name: Record job start
        working-directory: ${{ runner.temp }}
        run: echo "FINDB_CI_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ inputs.revision || github.sha }}', persist-credentials: false}
      - name: Verify exact requested revision
        env: {EXPECTED_SHA: '${{ inputs.revision || github.sha }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.9"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migration smoke test
        run: |
          uv run alembic upgrade head
          uv run alembic current

      - name: Run migration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/findb-ci-backend-migrations"
          /usr/bin/time -p -o "$RUNNER_TEMP/findb-ci-backend-migrations/pytest-time.txt" \
            uv run pytest --tb=short -q tests/test_*migration*.py \
            --durations=20 --durations-min=0.5 \
            --junitxml="$RUNNER_TEMP/findb-ci-backend-migrations/junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/findb-ci-backend-migrations/pytest.log"

      - name: Record total job timing
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/findb-ci-backend-migrations"
          elapsed=$(( $(date +%s) - FINDB_CI_JOB_STARTED_AT ))
          echo "job_elapsed_seconds=$elapsed" | tee "$RUNNER_TEMP/findb-ci-backend-migrations/job-time.txt"
          echo "backend-migrations elapsed: ${elapsed}s (first step through report creation)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findb-ci-backend-migrations-${{ github.run_attempt }}
          path: ${{ runner.temp }}/findb-ci-backend-migrations/
          retention-days: 14

  infra-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Record job start
        working-directory: ${{ runner.temp }}
        run: echo "FINDB_CI_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ inputs.revision || github.sha }}', persist-credentials: false}
      - name: Verify exact requested revision
        env: {EXPECTED_SHA: '${{ inputs.revision || github.sha }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.9"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and format check
        run: |
          uv run ruff check ../infra/tests
          uv run ruff format --check ../infra/tests

      - name: Run infra tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/findb-ci-infra-tests"
          /usr/bin/time -p -o "$RUNNER_TEMP/findb-ci-infra-tests/pytest-time.txt" \
            uv run pytest ../infra/tests -n 2 --dist worksteal --tb=short -q \
            --durations=20 --durations-min=0.5 \
            --junitxml="$RUNNER_TEMP/findb-ci-infra-tests/junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/findb-ci-infra-tests/pytest.log"

      - name: Record total job timing
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/findb-ci-infra-tests"
          elapsed=$(( $(date +%s) - FINDB_CI_JOB_STARTED_AT ))
          echo "job_elapsed_seconds=$elapsed" | tee "$RUNNER_TEMP/findb-ci-infra-tests/job-time.txt"
          echo "infra-tests elapsed: ${elapsed}s (first step through report creation)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findb-ci-infra-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/findb-ci-infra-tests/
          retention-days: 14

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ inputs.revision || github.sha }}', persist-credentials: false}
      - name: Verify exact requested revision
        env: {EXPECTED_SHA: '${{ inputs.revision || github.sha }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

      - name: Type check
        run: pnpm type:check

      - name: Test
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ inputs.revision || github.sha }}', persist-credentials: false}
      - name: Verify exact requested revision
        env: {EXPECTED_SHA: '${{ inputs.revision || github.sha }}'}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Browser component tests
        run: pnpm test:browser

      - name: Public route hydration smoke test
        run: pnpm test:e2e
