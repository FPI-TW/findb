name: FinDB CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "dashboard/**"
      - "contracts/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "infra/nginx/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/findb-ci.yml"
      - ".github/workflows/findb-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "dashboard/**"
      - "contracts/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "infra/nginx/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/findb-ci.yml"
      - ".github/workflows/findb-cd.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findb
          POSTGRES_PASSWORD: findb
          POSTGRES_DB: findb_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U findb -d findb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://findb:findb@localhost:5435/findb_test
      TEST_DATABASE_URL: postgresql+asyncpg://findb:findb@localhost:5435/findb_test
      SOURCE_API_KEY: test-source-key
      ADMIN_API_KEY: test-admin-key

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.9"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and format check
        run: |
          uv run ruff check app tests scripts migrations
          uv run ruff format --check app tests scripts migrations

      - name: Type check
        run: uv run mypy app

      - name: Check published ingress contracts
        run: uv run python scripts/export_ingress_contracts.py --check

      - name: Run migration smoke test
        run: |
          uv run alembic upgrade head
          uv run alembic current

      - name: Run tests
        run: uv run pytest --tb=short -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

      - name: Type check
        run: pnpm type:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
