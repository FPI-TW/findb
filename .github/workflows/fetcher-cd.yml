name: Fetcher CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_target: {description: Staging target only, required: true, default: staging, type: choice, options: [staging]}
      revision: {description: Exact protected-main commit SHA, required: true, type: string}
      image_tag: {description: Existing staging SHA for an accepted replay, required: false, default: '', type: string}
      accepted_bundle_key: {description: Exact staging accepted bundle key for replay, required: false, default: '', type: string}
      run_finlab_smoke: {description: Run isolated FinLab smoke after deploy, required: true, default: false, type: boolean}
      finlab_target_date: {description: ISO trade date for smoke, required: false, default: '', type: string}
      finlab_symbols: {description: Reviewed comma-delimited symbols, required: false, default: '2330,2317', type: choice, options: ['2330,2317']}

concurrency: {group: staging-fetcher, cancel-in-progress: false}
permissions: {contents: read}

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      fetcher_ci: ${{ steps.policy.outputs.fetcher_ci }}
      fetcher_staging: ${{ steps.policy.outputs.fetcher_staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ inputs.revision || github.sha }}', fetch-depth: 0, persist-credentials: false}
      - id: revision
        env: {EXPECTED_SHA: '${{ inputs.revision || github.sha }}', IMAGE_TAG: '${{ inputs.image_tag }}'}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"; [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; [ "$actual" = "$EXPECTED_SHA" ]
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then git fetch --no-tags origin main:refs/remotes/origin/main; git merge-base --is-ancestor "$actual" refs/remotes/origin/main; [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "$actual" ]; fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - id: policy
        env: {EVENT: '${{ github.event_name }}', BASE: '${{ github.event.before }}', HEAD: '${{ inputs.revision || github.sha }}'}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then printf 'fetcher_ci=true\nfetcher_staging=true\n' >> "$GITHUB_OUTPUT"; else python3 infra/deploy/change_policy.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"; fi

  verify:
    needs: policy
    if: ${{ needs.policy.outputs.fetcher_ci == 'true' }}
    uses: ./.github/workflows/fetcher-ci.yml
    with: {revision: '${{ needs.policy.outputs.revision }}'}

  select:
    needs: [policy, verify]
    if: >-
      github.ref == 'refs/heads/main' && needs.verify.result == 'success' &&
      needs.policy.outputs.fetcher_staging == 'true' &&
      (github.event_name == 'workflow_dispatch' || vars.STAGING_ECR_CUTOVER_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: staging-fetcher
    permissions: {actions: read, contents: read}
    outputs:
      revision: ${{ steps.selection.outputs.revision }}
      mode: ${{ steps.selection.outputs.mode }}
      bundle_key: ${{ steps.selection.outputs.bundle_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ needs.policy.outputs.revision }}', fetch-depth: 0, persist-credentials: false}
      - name: Verify exact requested revision, staging-only route, and replay selection
        id: selection
        env: {REVISION: '${{ needs.policy.outputs.revision }}', IMAGE_TAG: '${{ inputs.image_tag }}', ACCEPTED: '${{ inputs.accepted_bundle_key }}', CUTOVER: '${{ vars.STAGING_ECR_CUTOVER_ENABLED }}'}
        run: |
          set -euo pipefail
          [ "${{ inputs.deployment_target || 'staging' }}" = staging ]; [ "$CUTOVER" = true ]; [ "$(git rev-parse HEAD)" = "$REVISION" ]
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            [ -n "$ACCEPTED" ] && [ -n "$IMAGE_TAG" ] || exit 1
            [ "$IMAGE_TAG" = "$REVISION" ]; [[ "$ACCEPTED" =~ ^fetcher/accepted/${REVISION}/[0-9a-f]{64}[.]tar$ ]]
            printf 'mode=replay\nbundle_key=%s\n' "$ACCEPTED" >> "$GITHUB_OUTPUT"
          else
            [ "${{ github.event_name }}" = push ] && [ -z "$IMAGE_TAG" ] && [ -z "$ACCEPTED" ] || exit 1
            echo 'mode=candidate' >> "$GITHUB_OUTPUT"
          fi
      - name: Confirm staging credential and provider isolation policy
        run: |
          set -euo pipefail
          [ "${{ vars.STAGING_ECR_CUTOVER_ENABLED }}" = true ]
          echo 'staging runtime secret isolation remains host-catalog enforced'
      - name: Wait for same-revision FinDB staging rollout
        if: ${{ github.event_name == 'push' && steps.selection.outputs.mode == 'candidate' }}
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ needs.policy.outputs.revision }}'}
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 8); do
            runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/findb-cd.yml/runs?head_sha=${HEAD_SHA}&event=push&per_page=10")"
            run_id="$(jq -r --arg sha "$HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            [ -n "$run_id" ] && break; sleep 15
          done
          [ -n "$run_id" ] || { echo 'same-revision FinDB rollout was not found'; exit 1; }
          for _ in $(seq 1 240); do
            run="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status // empty' <<<"$run")"; conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            case "$status" in
              completed) [ "$conclusion" = success ] && exit 0; echo "FinDB rollout concluded ${conclusion:-unknown}"; exit 1 ;;
              queued|in_progress|pending|waiting|requested) sleep 15 ;;
              *) echo "unexpected FinDB rollout state ${status:-empty}"; exit 1 ;;
            esac
          done
          echo 'timed out waiting for same-revision FinDB rollout'; exit 1

  publish:
    needs: select
    if: ${{ needs.select.result == 'success' && needs.select.outputs.mode == 'candidate' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    outputs:
      twelve_image: ${{ steps.twelve_image.outputs.image_ref }}
      finlab_image: ${{ steps.finlab_image.outputs.image_ref }}
      shioaji_image: ${{ steps.shioaji_image.outputs.image_ref }}
    env:
      AWS_REGION: ap-southeast-1
      ACCOUNT: '439622209937'
      REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com
      TWELVE: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/fetcher/twelve-data
      FINLAB: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/fetcher/finlab
      SHIOAJI: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/fetcher/shioaji
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ needs.select.outputs.revision }}', persist-credentials: false}
      - name: Verify exact requested revision for publication
        env: {EXPECTED_SHA: '${{ needs.select.outputs.revision }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Configure staging publisher credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::439622209937:role/fetcher-staging-ecr-publisher
          aws-region: ap-southeast-1
          allowed-account-ids: '439622209937'
          role-session-name: fetcher-staging-publish-${{ github.run_id }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build or reuse immutable Twelve Data image
        id: twelve_image
        env: {ECR_IMAGE_TAG: '${{ needs.select.outputs.revision }}'}
        run: |
          set -euo pipefail
          [ "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT" ]
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$TWELVE" ./fetcher ./fetcher/Dockerfile
      - name: Build or reuse immutable FinLab image
        id: finlab_image
        env: {ECR_IMAGE_TAG: '${{ needs.select.outputs.revision }}'}
        run: infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$FINLAB" ./fetcher ./fetcher/Dockerfile.finlab
      - name: Build or reuse immutable Shioaji image
        id: shioaji_image
        env: {ECR_IMAGE_TAG: '${{ needs.select.outputs.revision }}'}
        run: infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$SHIOAJI" ./fetcher ./fetcher/Dockerfile.shioaji

  prepare:
    needs: [select, publish]
    if: >-
      always() && needs.select.result == 'success' &&
      ((needs.select.outputs.mode == 'candidate' && needs.publish.result == 'success') ||
       (needs.select.outputs.mode == 'replay' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: staging-fetcher
    permissions: {contents: read, id-token: write}
    outputs:
      revision: ${{ needs.select.outputs.revision }}
      mode: ${{ needs.select.outputs.mode }}
      bundle_key: ${{ steps.contract.outputs.bundle_key }}
    env:
      AWS_REGION: ap-southeast-1
      ACCOUNT: '439622209937'
      REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ needs.select.outputs.revision }}', persist-credentials: false}
      - name: Verify exact requested revision for bundle preparation
        env: {EXPECTED_SHA: '${{ needs.select.outputs.revision }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Configure staging deploy credentials
        if: ${{ needs.select.outputs.mode == 'candidate' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: fetcher-staging-bundle-${{ github.run_id }}
      - name: Build and upload exact v2 staging candidate
        if: ${{ needs.select.outputs.mode == 'candidate' }}
        id: candidate
        env:
          REVISION: ${{ needs.select.outputs.revision }}
          BUNDLE_BUCKET: ${{ vars.DEPLOY_BUNDLE_BUCKET }}
          KMS_KEY: ${{ vars.DEPLOY_BUNDLE_KMS_KEY_ARN }}
          TWELVE_IMAGE: ${{ needs.publish.outputs.twelve_image }}
          FINLAB_IMAGE: ${{ needs.publish.outputs.finlab_image }}
          SHIOAJI_IMAGE: ${{ needs.publish.outputs.shioaji_image }}
        run: |
          set -euo pipefail
          [ "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT" ]
          [[ "$TWELVE_IMAGE" =~ ^${REGISTRY}/findb/staging/fetcher/twelve-data@sha256:[0-9a-f]{64}$ ]]; [[ "$FINLAB_IMAGE" =~ ^${REGISTRY}/findb/staging/fetcher/finlab@sha256:[0-9a-f]{64}$ ]]; [[ "$SHIOAJI_IMAGE" =~ ^${REGISTRY}/findb/staging/fetcher/shioaji@sha256:[0-9a-f]{64}$ ]]
          python3 infra/deploy/release_manifest.py generate --repo-root . --unit fetcher --commit-sha "$REVISION" --migration-revision none --contract-manifest contracts/manifest.json --created-by-run-id "$GITHUB_RUN_ID" --deployment-target staging --registry "$REGISTRY" --account-id "$ACCOUNT" --release-tag '' --image "twelve_data=$TWELVE_IMAGE" --image "finlab=$FINLAB_IMAGE" --image "shioaji=$SHIOAJI_IMAGE" --output "$RUNNER_TEMP/manifest.json"
          python3 infra/deploy/release_manifest.py bundle --repo-root . --unit fetcher --manifest "$RUNNER_TEMP/manifest.json" --output "$RUNNER_TEMP/bundle.tar"
          sha="$(sha256sum "$RUNNER_TEMP/bundle.tar" | cut -d ' ' -f1)"; key="fetcher/candidates/${REVISION}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${sha}.tar"
          aws s3api put-object --bucket "$BUNDLE_BUCKET" --key "$key" --body "$RUNNER_TEMP/bundle.tar" --if-none-match '*' --server-side-encryption aws:kms --ssekms-key-id "$KMS_KEY" >/dev/null
          echo "bundle_key=$key" >> "$GITHUB_OUTPUT"
      - name: Publish exact reusable deployment contract
        id: contract
        env: {MODE: '${{ needs.select.outputs.mode }}', REPLAY_KEY: '${{ needs.select.outputs.bundle_key }}', CANDIDATE_KEY: '${{ steps.candidate.outputs.bundle_key }}'}
        run: |
          set -euo pipefail
          key="$REPLAY_KEY"; [ "$MODE" = candidate ] && key="$CANDIDATE_KEY"; [ -n "$key" ]; echo "bundle_key=$key" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/fetcher-deploy.yml
    with:
      deployment_target: staging
      revision: ${{ needs.prepare.outputs.revision }}
      mode: ${{ needs.prepare.outputs.mode }}
      bundle_key: ${{ needs.prepare.outputs.bundle_key }}
      release_tag: ''

  finlab-acquisition-smoke:
    needs: [deploy, prepare]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_finlab_smoke && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging-fetcher
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: '${{ needs.prepare.outputs.revision }}', persist-credentials: false}
      - name: Configure staging credentials for FinLab smoke
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: fetcher-staging-smoke-${{ github.run_id }}
      - name: Run bounded FinLab acquisition smoke over SSM
        env:
          AWS_REGION: ap-southeast-1
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_SSM_LOG_GROUP: ${{ vars.AWS_SSM_LOG_GROUP }}
          TARGET_ID: ${{ needs.deploy.outputs.target_id }}
          RELEASE_ROOT: ${{ needs.deploy.outputs.release_root }}
          FINLAB_IMAGE: ${{ needs.deploy.outputs.finlab_image_ref }}
          TARGET_DATE: ${{ inputs.finlab_target_date }}
          SYMBOLS: ${{ inputs.finlab_symbols }}
        run: |
          set -euo pipefail
          [[ "$TARGET_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; [[ "$RELEASE_ROOT" =~ ^/opt/fetcher/releases/[0-9a-f]{64}-[0-9]+-[0-9]+$ ]]; [[ "$FINLAB_IMAGE" =~ /findb/staging/fetcher/finlab@sha256:[0-9a-f]{64}$ ]]; [ -n "$TARGET_DATE" ]
          marker="finlab-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          success_marker="finlab_smoke_marker=${marker} status=success"
          failure_marker="finlab_smoke_marker=${marker} status=failed"
          printf -v q_root '%q' "$RELEASE_ROOT"; printf -v q_image '%q' "$FINLAB_IMAGE"; printf -v q_date '%q' "$TARGET_DATE"; printf -v q_symbols '%q' "$SYMBOLS"; printf -v q_marker '%q' "$marker"
          command="set -euo pipefail; trap 'printf \"finlab_smoke_marker=%s status=failed\\n\" $q_marker' ERR; export AWS_REGION=ap-southeast-1; cache_dir=/var/lib/findb-finlab-smoke-cache; install -d -m 0700 \"\$cache_dir\"; chown 10001:10001 \"\$cache_dir\"; \"$q_root/infra/deploy/runtime-secrets/runtime_secret_command.sh\" --catalog \"$q_root/infra/deploy/runtime-secrets/fetcher.json\" --region ap-southeast-1 --deployment-target staging --aws-account-id $AWS_ACCOUNT_ID --consumer finlab-smoke -- docker run --rm --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --mount \"type=bind,src=\$cache_dir,dst=/home/fetcher\" \"$q_image\" findb-fetch-finlab-smoke --target-date \"$q_date\" --symbols \"$q_symbols\"; printf \"finlab_smoke_marker=%s status=success\\n\" $q_marker"
          command="$(printf '%s' "$command" | python3 infra/deploy/ssm_bash_command.py)"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --document-name AWS-RunShellScript --instance-ids "$TARGET_ID" --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=${AWS_SSM_LOG_GROUP}" --parameters "$(jq -nc --arg command "$command" '{commands: [$command]}')" --query Command.CommandId --output text)"
          source infra/deploy/ssm_command_marker_gate.sh
          for _ in $(seq 1 120); do state="$(ssm_command_marker_state "$AWS_REGION" "$command_id" "$TARGET_ID" "$success_marker" "$failure_marker")"; [ "$state" = success ] && exit 0; sleep 5; done
          exit 1

  report-staging-deployment-failure:
    needs: [verify, select, publish, prepare, deploy]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (inputs.deployment_target || 'staging') == 'staging' &&
      vars.STAGING_ECR_CUTOVER_ENABLED == 'true' &&
      (needs.verify.result == 'failure' ||
        needs.verify.result == 'cancelled' ||
        needs.select.result == 'failure' ||
        needs.select.result == 'cancelled' ||
        needs.publish.result == 'failure' ||
        needs.publish.result == 'cancelled' ||
        needs.prepare.result == 'failure' ||
        needs.prepare.result == 'cancelled' ||
        needs.deploy.result == 'failure' ||
        needs.deploy.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging-fetcher
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure staging AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: fetcher-staging-failure-${{ github.run_id }}
      - name: Publish staging deployment failure metric
        run: |
          aws cloudwatch put-metric-data \
            --region ap-southeast-1 \
            --namespace FinDB/Staging \
            --metric-name DeploymentFailure \
            --dimensions DeploymentUnit=fetcher,Resource=github-actions \
            --value 1 \
            --unit Count
