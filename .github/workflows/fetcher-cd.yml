name: Fetcher CD

on:
  push:
    branches: [main]
    paths:
      - "fetcher/**"
      - ".github/workflows/fetcher-cd.yml"
  workflow_dispatch:
    inputs:
      deployment_target:
        description: GitHub Environment target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ inputs.deployment_target || 'staging' }}-fetcher
  cancel-in-progress: false

permissions:
  contents: read

env:
  FETCHER_IMAGE: ghcr.io/fpi-tw/findb-fetcher
  FETCHER_IMAGE_TAG: ${{ github.sha }}

jobs:
  verify:
    uses: ./.github/workflows/fetcher-ci.yml

  build-push:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Fetcher image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: fetcher/Dockerfile
          push: true
          tags: ${{ env.FETCHER_IMAGE }}:${{ env.FETCHER_IMAGE_TAG }}
          cache-from: type=gha,scope=fetcher
          cache-to: type=gha,mode=max,scope=fetcher

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.deployment_target || 'staging' }}-fetcher

    permissions:
      contents: read
      packages: read

    steps:
      - name: Release and validate Fetcher image on Fetcher EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FETCHER_IMAGE: ${{ env.FETCHER_IMAGE }}
          FETCHER_IMAGE_TAG: ${{ env.FETCHER_IMAGE_TAG }}
          FETCHER_SCHEDULER_DESIRED_STATE: ${{ vars.FETCHER_SCHEDULER_DESIRED_STATE }}
          FETCHER_SOURCE_API_URL: ${{ vars.FETCHER_SOURCE_API_URL }}
          FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY: ${{ secrets.FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_BASE_URL: ${{ vars.TWELVE_DATA_BASE_URL || 'https://api.twelvedata.com' }}
          TWELVE_DATA_TIMEOUT_SECONDS: ${{ vars.TWELVE_DATA_TIMEOUT_SECONDS || '30' }}
          TWELVE_DATA_MAX_RESPONSE_BYTES: ${{ vars.TWELVE_DATA_MAX_RESPONSE_BYTES || '8388608' }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_SESSION_TOKEN: ${{ secrets.CLOUDFLARE_R2_SESSION_TOKEN }}
          CLOUDFLARE_R2_PREFIX: ${{ vars.CLOUDFLARE_R2_PREFIX || 'raw/twelve-data' }}
          CLOUDFLARE_R2_MAX_OBJECT_BYTES: ${{ vars.CLOUDFLARE_R2_MAX_OBJECT_BYTES || '8388608' }}
          FETCHER_REQUEST_TIMEOUT_SECONDS: ${{ vars.FETCHER_REQUEST_TIMEOUT_SECONDS || '30' }}
          FETCHER_MAX_ATTEMPTS: ${{ vars.FETCHER_MAX_ATTEMPTS || '3' }}
          FETCHER_MAX_RETRY_AFTER_SECONDS: ${{ vars.FETCHER_MAX_RETRY_AFTER_SECONDS || '30' }}
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,FETCHER_IMAGE,FETCHER_IMAGE_TAG,FETCHER_SCHEDULER_DESIRED_STATE,FETCHER_SOURCE_API_URL,FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY,TWELVE_DATA_API_KEY,TWELVE_DATA_BASE_URL,TWELVE_DATA_TIMEOUT_SECONDS,TWELVE_DATA_MAX_RESPONSE_BYTES,CLOUDFLARE_R2_ACCOUNT_ID,CLOUDFLARE_R2_BUCKET,CLOUDFLARE_R2_ACCESS_KEY_ID,CLOUDFLARE_R2_SECRET_ACCESS_KEY,CLOUDFLARE_R2_SESSION_TOKEN,CLOUDFLARE_R2_PREFIX,CLOUDFLARE_R2_MAX_OBJECT_BYTES,FETCHER_REQUEST_TIMEOUT_SECONDS,FETCHER_MAX_ATTEMPTS,FETCHER_MAX_RETRY_AFTER_SECONDS
          script: |
            set -euo pipefail

            require_runtime_value() {
              if [ -z "$2" ]; then
                echo "::error title=Missing Fetcher configuration::Required runtime setting is not configured"
                exit 1
              fi
            }

            require_runtime_value source_api_url "${FETCHER_SOURCE_API_URL:-}"
            require_runtime_value twelve_data_source_client_key "${FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY:-}"
            require_runtime_value twelve_data_api_key "${TWELVE_DATA_API_KEY:-}"
            require_runtime_value r2_account_id "${CLOUDFLARE_R2_ACCOUNT_ID:-}"
            require_runtime_value r2_bucket "${CLOUDFLARE_R2_BUCKET:-}"
            require_runtime_value r2_access_key_id "${CLOUDFLARE_R2_ACCESS_KEY_ID:-}"
            require_runtime_value r2_secret_access_key "${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}"
            case "${FETCHER_SCHEDULER_DESIRED_STATE:-}" in
              running|stopped) ;;
              *)
                echo "::error title=Invalid Fetcher scheduler state::FETCHER_SCHEDULER_DESIRED_STATE must be running or stopped"
                exit 1
                ;;
            esac

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            image="${FETCHER_IMAGE}:${FETCHER_IMAGE_TAG}"

            export SOURCE_API_URL="$FETCHER_SOURCE_API_URL"
            export SOURCE_CLIENT_KEY="$FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY"
            export FETCHER_STATE_PATH=/var/lib/findb-fetcher/state.sqlite3

            state_dir=/var/lib/findb-fetcher
            stable=findb-fetcher-scheduler
            candidate=findb-fetcher-scheduler-candidate
            previous=findb-fetcher-scheduler-previous

            sudo mkdir -p "$state_dir"
            sudo chown 10001:10001 "$state_dir"
            sudo chmod 0700 "$state_dir"
            if [ "$(stat -c '%u:%g' "$state_dir")" != "10001:10001" ] \
              || [ "$(stat -c '%a' "$state_dir")" != "700" ]; then
              echo "::error title=Fetcher state rejected::Durable state ownership or mode is unsafe"
              exit 1
            fi

            # BEGIN FETCHER SCHEDULER RECONCILIATION
            reconciliation_failed() {
              echo "::error title=Fetcher reconciliation failed::Scheduler state could not be reconciled" >&2
              exit 1
            }

            # Resolve interrupted rollouts to the Environment's declared state.
            # A stopped target must never be started merely by reconciliation.
            if docker container inspect "$candidate" >/dev/null 2>&1; then
              if docker container inspect "$stable" >/dev/null 2>&1 \
                || docker container inspect "$previous" >/dev/null 2>&1; then
                docker rm -f "$candidate" >/dev/null 2>&1 \
                  || reconciliation_failed
              else
                docker rename "$candidate" "$stable" >/dev/null 2>&1 \
                  || reconciliation_failed
              fi
            fi
            if docker container inspect "$previous" >/dev/null 2>&1; then
              if docker container inspect "$stable" >/dev/null 2>&1; then
                docker rm -f "$previous" >/dev/null 2>&1 \
                  || reconciliation_failed
              else
                docker rename "$previous" "$stable" >/dev/null 2>&1 \
                  || reconciliation_failed
              fi
            fi
            if docker container inspect "$stable" >/dev/null 2>&1; then
              if [ "$FETCHER_SCHEDULER_DESIRED_STATE" = "running" ]; then
                docker start "$stable" >/dev/null 2>&1 || reconciliation_failed
              else
                docker stop --time 30 "$stable" >/dev/null 2>&1 || reconciliation_failed
              fi
              stable_running="$(docker inspect --format '{{.State.Running}}' "$stable")" \
                || reconciliation_failed
              if [ "$FETCHER_SCHEDULER_DESIRED_STATE" = "running" ] && [ "$stable_running" != "true" ]; then
                reconciliation_failed
              fi
              if [ "$FETCHER_SCHEDULER_DESIRED_STATE" = "stopped" ] && [ "$stable_running" != "false" ]; then
                reconciliation_failed
              fi
            fi
            # END FETCHER SCHEDULER RECONCILIATION

            docker pull "$image"

            runtime_env_args="\
              --env SOURCE_API_URL \
              --env SOURCE_CLIENT_KEY \
              --env TWELVE_DATA_API_KEY \
              --env TWELVE_DATA_BASE_URL \
              --env TWELVE_DATA_TIMEOUT_SECONDS \
              --env TWELVE_DATA_MAX_RESPONSE_BYTES \
              --env CLOUDFLARE_R2_ACCOUNT_ID \
              --env CLOUDFLARE_R2_BUCKET \
              --env CLOUDFLARE_R2_ACCESS_KEY_ID \
              --env CLOUDFLARE_R2_SECRET_ACCESS_KEY \
              --env CLOUDFLARE_R2_SESSION_TOKEN \
              --env CLOUDFLARE_R2_PREFIX \
              --env CLOUDFLARE_R2_MAX_OBJECT_BYTES \
              --env FETCHER_REQUEST_TIMEOUT_SECONDS \
              --env FETCHER_MAX_ATTEMPTS \
              --env FETCHER_MAX_RETRY_AFTER_SECONDS \
              --env FETCHER_STATE_PATH"

            # Validate the exact image and the real durable state before stopping
            # the current scheduler. Check mode performs no external calls.
            docker run --rm \
              --name findb-fetcher-scheduler-preflight \
              --user 10001:10001 \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --mount "type=bind,src=$state_dir,dst=/var/lib/findb-fetcher" \
              $runtime_env_args \
              "$image" \
              findb-fetch-scheduler --check

            recover_scheduler() {
              original_status="$1"
              if [ "$original_status" -eq 0 ]; then
                original_status=1
              fi
              trap - ERR INT TERM HUP
              set +e

              recovery_failed=0
              if docker container inspect "$candidate" >/dev/null 2>&1; then
                docker rm -f "$candidate" >/dev/null 2>&1 || recovery_failed=1
              fi
              if [ "$recovery_failed" -eq 0 ] && ! docker container inspect "$stable" >/dev/null 2>&1 \
                && docker container inspect "$previous" >/dev/null 2>&1; then
                  docker rename "$previous" "$stable" >/dev/null 2>&1 \
                    || recovery_failed=1
              fi
              if [ "$recovery_failed" -eq 0 ] && docker container inspect "$stable" >/dev/null 2>&1; then
                if [ "$FETCHER_SCHEDULER_DESIRED_STATE" = "running" ]; then
                  docker start "$stable" >/dev/null 2>&1 || recovery_failed=1
                else
                  docker stop --time 30 "$stable" >/dev/null 2>&1 || recovery_failed=1
                fi
              fi
              if [ "$recovery_failed" -ne 0 ]; then
                echo "::error title=Fetcher recovery failed::Scheduler recovery did not complete" >&2
              fi
              exit "$original_status"
            }
            trap 'recover_scheduler "$?"' ERR
            trap 'recover_scheduler 130' INT
            trap 'recover_scheduler 143' TERM
            trap 'recover_scheduler 129' HUP

            had_previous=0
            if docker container inspect "$stable" >/dev/null 2>&1; then
              had_previous=1
              docker stop --time 30 "$stable" >/dev/null
              docker rename "$stable" "$previous"
            fi

            if [ "$FETCHER_SCHEDULER_DESIRED_STATE" = "stopped" ]; then
              docker create \
                --name "$candidate" \
                --user 10001:10001 \
                --restart unless-stopped \
                --read-only \
                --cap-drop ALL \
                --security-opt no-new-privileges \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                --mount "type=bind,src=$state_dir,dst=/var/lib/findb-fetcher" \
                $runtime_env_args \
                "$image" \
                findb-fetch-scheduler --run-forever >/dev/null
              candidate_image="$(docker inspect --format '{{.Config.Image}}' "$candidate")"
              candidate_running="$(docker inspect --format '{{.State.Running}}' "$candidate")"
              if [ "$candidate_image" != "$image" ] || [ "$candidate_running" != "false" ]; then
                echo "::error title=Fetcher stopped release rejected::Candidate is not the exact stopped image" >&2
                false
              fi
              docker rename "$candidate" "$stable"
              if [ "$had_previous" -eq 1 ]; then
                docker rm "$previous" >/dev/null 2>&1 || false
              fi
              stable_running="$(docker inspect --format '{{.State.Running}}' "$stable")"
              if [ "$stable_running" != "false" ]; then
                echo "::error title=Fetcher stopped release rejected::Stopped target has a running scheduler" >&2
                false
              fi
              trap - ERR INT TERM HUP
              trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
              echo "Fetcher scheduler release reconciled to stopped"
              exit 0
            fi

            docker run -d \
              --name "$candidate" \
              --user 10001:10001 \
              --restart unless-stopped \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --mount "type=bind,src=$state_dir,dst=/var/lib/findb-fetcher" \
              $runtime_env_args \
              "$image" \
              findb-fetch-scheduler --run-forever >/dev/null

            healthy=0
            for attempt in $(seq 1 6); do
              status="$(docker inspect --format '{{.State.Status}}' "$candidate")"
              restarts="$(docker inspect --format '{{.RestartCount}}' "$candidate")"
              if [ "$status" != "running" ] || [ "$restarts" -ne 0 ]; then
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                healthy=1
                break
              fi
              sleep 5
            done
            if [ "$healthy" -ne 1 ]; then
              docker inspect --format \
                'Fetcher candidate failed: status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}' \
                "$candidate" || true
              false
            fi

            docker rename "$candidate" "$stable"
            trap - ERR INT TERM HUP
            if [ "$had_previous" -eq 1 ]; then
              docker rm "$previous" >/dev/null 2>&1 || false
            fi
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "Fetcher scheduler release completed"
