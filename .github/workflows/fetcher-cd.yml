              write_raw_bucket_marker() {
                marker_tmp="$(sudo mktemp "$state_dir/.raw-bucket.sha256.XXXXXX")"
                printf '%s\n' "$raw_bucket_fingerprint" | sudo tee "$marker_tmp" >/dev/null
                sudo chown 10001:10001 "$marker_tmp"; sudo chmod 0600 "$marker_tmp"; sudo mv "$marker_tmp" "$raw_bucket_marker"
              }
              validate_raw_bucket_marker_mode() {
                if ! sudo test -f "$raw_bucket_marker" || [ "$(sudo stat -c '%u:%g:%a' "$raw_bucket_marker")" != "10001:10001:600" ]; then
                  echo "::error title=FinLab state rejected::Raw bucket binding marker ownership or mode is unsafe" >&2; exit 1
                fi
              }
              if sudo test -e "$state_path"; then
                sudo test -f "$raw_bucket_marker" || { echo "::error title=FinLab raw bucket cutover required::State has no binding marker" >&2; exit 1; }
                validate_raw_bucket_marker_mode
                [ "$(sudo cat "$raw_bucket_marker")" = "$raw_bucket_fingerprint" ] || { echo "::error title=FinLab raw bucket mismatch::State belongs to a different Raw bucket" >&2; exit 1; }
              elif sudo test -e "$raw_bucket_marker"; then
                validate_raw_bucket_marker_mode
                [ "$(sudo cat "$raw_bucket_marker")" = "$raw_bucket_fingerprint" ] || write_raw_bucket_marker
              else
                write_raw_bucket_marker
              fi
              if docker container inspect "$candidate" >/dev/null 2>&1; then
                if docker container inspect "$stable" >/dev/null 2>&1 || docker container inspect "$previous" >/dev/null 2>&1; then docker rm -f "$candidate"; else docker rename "$candidate" "$stable"; fi
              fi
              if docker container inspect "$previous" >/dev/null 2>&1; then
                if docker container inspect "$stable" >/dev/null 2>&1; then docker rm -f "$previous"; else docker rename "$previous" "$stable"; fi
              fi
              echo "Pruning unused Docker images before pulling ${provider_id}"
              docker image prune -af
              docker pull "$image"
              runtime_mounts="--mount type=bind,src=$state_dir,dst=$state_dir --mount type=bind,src=$cache_dir,dst=/home/fetcher"
              # FinLab preflight happens before replacing its stable container.
              docker run --rm --name "$preflight_name" --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m $runtime_mounts $runtime_env_args "$image" "${scheduler_command[@]}" --check
              recover_scheduler() {
                original_status="$1"; [ "$original_status" -eq 0 ] && original_status=1; trap - ERR INT TERM HUP; set +e; recovery_failed=0
                if docker container inspect "$candidate" >/dev/null 2>&1; then docker rm -f "$candidate" >/dev/null 2>&1 || recovery_failed=1; fi
                if ! docker container inspect "$stable" >/dev/null 2>&1 && docker container inspect "$previous" >/dev/null 2>&1; then docker rename "$previous" "$stable" >/dev/null 2>&1 || recovery_failed=1; fi
                if [ "$recovery_failed" -eq 0 ] && docker container inspect "$stable" >/dev/null 2>&1; then
                  docker start "$stable" >/dev/null 2>&1 || recovery_failed=1
                fi
                [ "$recovery_failed" -eq 0 ] || echo "::error title=FinLab recovery failed::Rollback did not complete" >&2
                exit "$original_status"
              }
              trap 'recover_scheduler "$?"' ERR; trap 'recover_scheduler 130' INT; trap 'recover_scheduler 143' TERM; trap 'recover_scheduler 129' HUP
              had_previous=0
              if docker container inspect "$stable" >/dev/null 2>&1; then
                had_previous=1
                docker stop --time 30 "$stable" >/dev/null
                stable_exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$stable")"
                if [ "$stable_exit_code" -ne 0 ]; then
                  echo "::error title=FinLab graceful stop failed::Stable container exited ${stable_exit_code}" >&2
                  false
                fi
                docker rename "$stable" "$previous"
              fi
              common_runtime_args=(--user 10001:10001 --restart unless-stopped --read-only --cap-drop ALL --security-opt no-new-privileges --log-opt max-size=10m --log-opt max-file=3 --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$state_dir,dst=$state_dir" --mount "type=bind,src=$cache_dir,dst=/home/fetcher")
              docker run -d --name "$candidate" "${common_runtime_args[@]}" $runtime_env_args "$image" "${scheduler_command[@]}" --run-forever >/dev/null
              candidate_image="$(docker inspect --format '{{.Config.Image}}' "$candidate")"
              candidate_user="$(docker inspect --format '{{.Config.User}}' "$candidate")"
              healthy=0
              for attempt in $(seq 1 6); do status="$(docker inspect --format '{{.State.Status}}' "$candidate")"; restarts="$(docker inspect --format '{{.RestartCount}}' "$candidate")"; if [ "$status" != "running" ] || [ "$restarts" -ne 0 ]; then break; fi; [ "$attempt" -eq 6 ] && healthy=1 && break; sleep 5; done
              if [ "$candidate_image" != "$image" ] || [ "$candidate_user" != "10001:10001" ] || [ "$healthy" -ne 1 ]; then
                docker inspect --format "FinLab candidate failed: image={{.Config.Image}} user={{.Config.User}} status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}" "$candidate" || true
                false
              fi
              docker rename "$candidate" "$stable"; [ "$had_previous" -eq 1 ] && docker rm "$previous" >/dev/null 2>&1 || true
              stable_running="$(docker inspect --format '{{.State.Running}}' "$stable")"
              if [ "$stable_running" != "true" ]; then
                echo "::error title=FinLab release rejected::Scheduler did not converge to running" >&2
                false
              fi
              trap - ERR INT TERM HUP
              echo "FinLab scheduler release reconciled to running"
            }
            runtime_env_args="\
              --env SOURCE_API_URL --env SOURCE_CLIENT_KEY --env FINDB_SERVE_BASE_URL \
              --env FETCHER_CALENDAR_SERVE_API_KEY --env FETCHER_CALENDAR_TIMEOUT_SECONDS --env FETCHER_CALENDAR_CACHE_TTL_SECONDS \
              --env FINLAB_API_TOKEN --env CLOUDFLARE_R2_ACCOUNT_ID --env CLOUDFLARE_R2_RAW_BUCKET \
              --env CLOUDFLARE_R2_RAW_ACCESS_KEY_ID --env CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY --env CLOUDFLARE_R2_RAW_SESSION_TOKEN \
