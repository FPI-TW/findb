name: Fetcher CD

on:
  push:
    branches: [main]
    paths:
      - "fetcher/**"
      - ".github/workflows/fetcher-cd.yml"
  workflow_dispatch:
    inputs:
      deployment_target:
        description: GitHub Environment target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      run_finlab_smoke:
        description: Run the isolated FinLab acquisition smoke on staging (never deploys data)
        required: true
        default: false
        type: boolean
      finlab_target_date:
        description: Required ISO trade date for the FinLab smoke, for example 2026-07-29
        required: false
        default: ""
        type: string
      finlab_symbols:
        description: Reviewed FinLab smoke symbols
        required: false
        # Keep comma-delimited symbols quoted. GitHub otherwise normalizes this
        # choice to 23302317 before dispatching the workflow.
        default: "2330,2317"
        type: choice
        options:
          - "2330,2317"

concurrency:
  group: ${{ inputs.deployment_target || 'staging' }}-fetcher
  cancel-in-progress: false

permissions:
  contents: read

env:
  FETCHER_IMAGE: ghcr.io/fpi-tw/findb-fetcher
  FETCHER_FINLAB_IMAGE: ghcr.io/fpi-tw/findb-fetcher-finlab
  FETCHER_SHIOAJI_IMAGE: ghcr.io/fpi-tw/findb-fetcher-shioaji
  FETCHER_IMAGE_TAG: ${{ github.sha }}

jobs:
  verify:
    uses: ./.github/workflows/fetcher-ci.yml

  build-push:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Fetcher image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: fetcher/Dockerfile
          push: true
          tags: ${{ env.FETCHER_IMAGE }}:${{ env.FETCHER_IMAGE_TAG }}
          cache-from: type=gha,scope=fetcher
          cache-to: type=gha,mode=max,scope=fetcher

      - name: Build and push FinLab Fetcher image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: fetcher/Dockerfile.finlab
          push: true
          tags: ${{ env.FETCHER_FINLAB_IMAGE }}:${{ env.FETCHER_IMAGE_TAG }}
          cache-from: type=gha,scope=fetcher-finlab
          cache-to: type=gha,mode=max,scope=fetcher-finlab

      - name: Build and push Shioaji Fetcher image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: fetcher/Dockerfile.shioaji
          push: true
          tags: ${{ env.FETCHER_SHIOAJI_IMAGE }}:${{ env.FETCHER_IMAGE_TAG }}
          cache-from: type=gha,scope=fetcher-shioaji
          cache-to: type=gha,mode=max,scope=fetcher-shioaji

  validate-r2-bucket-configuration:
    needs: build-push
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.run_finlab_smoke != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.deployment_target || 'staging' }}-fetcher
    env:
      DEPLOYMENT_TARGET: ${{ inputs.deployment_target || 'staging' }}
      R2_RAW_BUCKET: ${{ vars.CLOUDFLARE_R2_RAW_BUCKET }}
    steps:
      - name: Fail closed on target-specific R2 bucket configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_TARGET" in
            staging|production) ;;
            *)
              echo "::error title=Invalid Fetcher deployment target::Expected staging or production"
              exit 1
              ;;
          esac
          if [ -z "$R2_RAW_BUCKET" ]; then
            echo "::error title=R2 bucket configuration missing::Fetcher raw bucket name is required"
            exit 1
          fi

  validate-fetcher-credential-isolation:
    needs: build-push
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.run_finlab_smoke != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.deployment_target || 'staging' }}-fetcher
    env:
      FETCHER_CALENDAR_SERVE_API_KEY: ${{ secrets.FETCHER_CALENDAR_SERVE_API_KEY }}
      FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY: ${{ secrets.FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY }}
      FETCHER_FINLAB_SOURCE_CLIENT_KEY: ${{ secrets.FETCHER_FINLAB_SOURCE_CLIENT_KEY }}
      FETCHER_SHIOAJI_SOURCE_CLIENT_KEY: ${{ secrets.FETCHER_SHIOAJI_SOURCE_CLIENT_KEY }}
    steps:
      - name: Fail closed on Fetcher credential reuse
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            FETCHER_CALENDAR_SERVE_API_KEY \
            FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY \
            FETCHER_FINLAB_SOURCE_CLIENT_KEY \
            FETCHER_SHIOAJI_SOURCE_CLIENT_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Fetcher credential configuration missing::Required credential is not configured"
              exit 1
            fi
          done
          keys=(
            "$FETCHER_CALENDAR_SERVE_API_KEY"
            "$FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY"
            "$FETCHER_FINLAB_SOURCE_CLIENT_KEY"
            "$FETCHER_SHIOAJI_SOURCE_CLIENT_KEY"
          )
          for left in "${!keys[@]}"; do
            for right in "${!keys[@]}"; do
              if [ "$left" -lt "$right" ] && [ "${keys[$left]}" = "${keys[$right]}" ]; then
                echo "::error title=Fetcher credential isolation failed::Calendar and provider Source credentials must be distinct"
                exit 1
              fi
            done
          done
          echo "Fetcher credential isolation check passed without printing credential values"

  deploy:
    needs: [build-push, validate-r2-bucket-configuration, validate-fetcher-credential-isolation]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.run_finlab_smoke != true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.deployment_target || 'staging' }}-fetcher

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Configure staging AWS credentials
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: fetcher-staging-preflight-${{ github.run_id }}

      - name: Run staging AWS and SSM preflight
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' }}
        shell: bash
        env:
          DEPLOYMENT_UNIT: fetcher
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_INSTANCE_PROFILE_NAME: ${{ vars.AWS_INSTANCE_PROFILE_NAME }}
          AWS_SSM_LOG_GROUP: ${{ vars.AWS_SSM_LOG_GROUP }}
          AWS_DNS_CHECK_NAME: ${{ vars.AWS_DNS_CHECK_NAME }}
          PREFLIGHT_MARKER_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-fetcher
        run: |
          set -euo pipefail

          for name in AWS_REGION AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN AWS_INSTANCE_PROFILE_NAME AWS_SSM_LOG_GROUP AWS_DNS_CHECK_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing staging AWS preflight variable::$name must be configured in the staging-fetcher Environment"
              exit 1
            fi
          done
          if ! [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error title=Invalid staging AWS account::AWS_ACCOUNT_ID must be a 12-digit account identifier"
            exit 1
          fi
          if ! [[ "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]] || [[ "$AWS_DEPLOY_ROLE_ARN" != "arn:aws:iam::${AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "::error title=Invalid staging deploy role::AWS_DEPLOY_ROLE_ARN must be an IAM role ARN in the expected account"
            exit 1
          fi
          if ! [[ "$AWS_INSTANCE_PROFILE_NAME" =~ ^[A-Za-z0-9+=,.@_-]+$ ]]; then
            echo "::error title=Invalid staging instance profile::AWS_INSTANCE_PROFILE_NAME must use IAM name characters without a path"
            exit 1
          fi
          if ! [[ "$AWS_SSM_LOG_GROUP" =~ ^[A-Za-z0-9_.\/#-]+$ ]] || [ "${#AWS_SSM_LOG_GROUP}" -gt 512 ]; then
            echo "::error title=Invalid staging SSM log group::AWS_SSM_LOG_GROUP contains unsupported CloudWatch Logs name characters"
            exit 1
          fi
          if ! [[ "$AWS_DNS_CHECK_NAME" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error title=Invalid staging DNS check::AWS_DNS_CHECK_NAME contains unsafe characters"
            exit 1
          fi
          if [ "${#AWS_DNS_CHECK_NAME}" -gt 253 ]; then
            echo "::error title=Invalid staging DNS check::AWS_DNS_CHECK_NAME exceeds the DNS name length limit"
            exit 1
          fi
          if ! [[ "$PREFLIGHT_MARKER_TOKEN" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Invalid preflight marker::The bounded marker token contains unsupported characters"
            exit 1
          fi

          caller_account="$(aws sts get-caller-identity --region "$AWS_REGION" --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --region "$AWS_REGION" --query Arn --output text)"
          if [ "$caller_account" != "$AWS_ACCOUNT_ID" ]; then
            echo "::error title=AWS account guard failed::STS account does not match AWS_ACCOUNT_ID"
            exit 1
          fi
          expected_role_name="${AWS_DEPLOY_ROLE_ARN#*:role/}"
          actual_role_name="${caller_arn#*:assumed-role/}"
          actual_role_name="${actual_role_name%/*}"
          if [ -z "$expected_role_name" ] || [ "$actual_role_name" != "$expected_role_name" ]; then
            echo "::error title=AWS role guard failed::STS identity is not the expected unit deploy role"
            exit 1
          fi
          echo "sts_identity=ok account_guard=ok role_guard=ok"

          target_ids_json="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                Name=instance-state-name,Values=running \
                Name=tag:Project,Values=findb \
                Name=tag:Environment,Values=staging \
                Name=tag:DeploymentUnit,Values=fetcher \
              --query 'Reservations[].Instances[].InstanceId' \
              --output json
          )"
          target_count="$(jq -r 'length' <<<"$target_ids_json")"
          if [ "$target_count" -ne 1 ]; then
            echo "::error title=Staging target cardinality failed::Expected exactly one running fetcher target"
            exit 1
          fi
          target_id="$(jq -r '.[0]' <<<"$target_ids_json")"
          echo "target_selector=exact-tags target_count=1"

          profile_arn="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --instance-ids "$target_id" \
              --query 'Reservations[0].Instances[0].IamInstanceProfile.Arn' \
              --output text
          )"
          profile_name="${profile_arn##*/}"
          if [ -z "$profile_arn" ] || [ "$profile_arn" = "None" ] || [ "$profile_name" != "$AWS_INSTANCE_PROFILE_NAME" ]; then
            echo "::error title=Instance profile guard failed::Target does not use the expected instance profile"
            exit 1
          fi
          ping_status="$(
            aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=${target_id}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text
          )"
          if [ "$ping_status" != "Online" ]; then
            echo "::error title=SSM target offline::Target instance is not Online in Systems Manager"
            exit 1
          fi
          echo "instance_profile=ok ssm_ping=Online"

          probe_secret_arn="arn:aws:secretsmanager:${AWS_REGION}:${AWS_ACCOUNT_ID}:secret:findb/staging/${DEPLOYMENT_UNIT}/phase1-preflight-denial-probe"
          probe_stderr="$(mktemp)"
          cleanup_probe() { rm -f -- "$probe_stderr" >/dev/null 2>&1 || true; }
          trap cleanup_probe EXIT
          if aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$probe_secret_arn" >/dev/null 2>"$probe_stderr"; then
            echo "::error title=Deploy role secret boundary failed::Secret denial probe unexpectedly succeeded"
            exit 1
          fi
          if ! grep -Fq "AccessDenied" "$probe_stderr" 2>/dev/null; then
            echo "::error title=Deploy role secret boundary failed::Secret denial probe did not return AccessDenied"
            exit 1
          fi
          echo "secret_read_denial=AccessDenied"

          printf -v expected_instance_id_q '%q' "$target_id"
          printf -v expected_instance_profile_name_q '%q' "$AWS_INSTANCE_PROFILE_NAME"
          printf -v expected_dns_name_q '%q' "$AWS_DNS_CHECK_NAME"
          printf -v expected_unit_q '%q' "$DEPLOYMENT_UNIT"
          printf -v expected_marker_token_q '%q' "$PREFLIGHT_MARKER_TOKEN"
          host_script="$(cat <<'HOST_SCRIPT'
          set -eu

          preflight_succeeded=0
          emit_preflight_failure() {
            trap - EXIT
            if [ "$preflight_succeeded" -ne 1 ]; then
              printf 'phase1_preflight_marker=%s status=failed\n' "$expected_marker_token"
            fi
          }
          trap emit_preflight_failure EXIT

          imds_token="$(curl --silent --fail --noproxy '*' --max-time 5 -X PUT \
            -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
            http://169.254.169.254/latest/api/token 2>/dev/null)"
          imds_instance_id="$(curl --silent --fail --noproxy '*' --max-time 5 \
            -H "X-aws-ec2-metadata-token: $imds_token" \
            http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null)"
          imds_profile_arn="$(curl --silent --fail --noproxy '*' --max-time 5 \
            -H "X-aws-ec2-metadata-token: $imds_token" \
            http://169.254.169.254/latest/meta-data/iam/info 2>/dev/null | \
            sed -n 's/.*"InstanceProfileArn"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | \
            sed -n '1p')"
          imds_profile_name="${imds_profile_arn##*/}"
          if [ "$imds_instance_id" != "$expected_instance_id" ]; then
            echo "instance_id_match=failed"
            exit 1
          fi
          if [ "$imds_profile_name" != "$expected_instance_profile_name" ]; then
            echo "instance_profile_match=failed"
            exit 1
          fi
          printf 'instance_id_match=ok instance_profile_match=ok unit=%s\n' "$expected_unit"

          ssm_agent_service=""
          for candidate in \
            amazon-ssm-agent.service \
            snap.amazon-ssm-agent.amazon-ssm-agent.service
          do
            if systemctl is-active --quiet "$candidate" >/dev/null 2>&1; then
              ssm_agent_service="$candidate"
              break
            fi
          done
          if [ -z "$ssm_agent_service" ]; then
            echo "ssm_agent=inactive"
            exit 1
          fi
          printf 'ssm_agent=active service=%s\n' "$ssm_agent_service"

          docker_version="$(docker --version 2>/dev/null | cut -c1-128)"
          compose_version="$(docker compose version --short 2>/dev/null | cut -c1-128)"
          if [ -z "$docker_version" ] || [ -z "$compose_version" ]; then
            echo "docker_runtime=missing"
            exit 1
          fi
          printf 'docker=%s compose=%s\n' "$docker_version" "$compose_version"

          disk_free_percent="$(df -P / 2>/dev/null | awk 'NR == 2 { sub(/%/, "", $5); print 100 - $5 }')"
          inode_free_percent="$(df -Pi / 2>/dev/null | awk 'NR == 2 { sub(/%/, "", $5); print 100 - $5 }')"
          case "$disk_free_percent" in
            ''|*[!0-9]*)
              echo "disk_free_percent=invalid"
              exit 1
              ;;
          esac
          if [ "$disk_free_percent" -lt 15 ]; then
            echo "disk_free_percent=below-threshold"
            exit 1
          fi
          case "$inode_free_percent" in
            ''|*[!0-9]*)
              echo "inode_free_percent=invalid"
              exit 1
              ;;
          esac
          if [ "$inode_free_percent" -lt 10 ]; then
            echo "inode_free_percent=below-threshold"
            exit 1
          fi
          printf 'disk_free_percent=%s inode_free_percent=%s\n' "$disk_free_percent" "$inode_free_percent"

          time_sync="$(timedatectl show -p NTPSynchronized --value 2>/dev/null || true)"
          case "$time_sync" in
            yes|true|1) ;;
            *)
              echo "time_sync=unsynchronized"
              exit 1
              ;;
          esac
          printf 'utc_now=%s time_sync=ok\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if ! getent ahosts "$expected_dns_name" >/dev/null 2>&1; then
            echo "dns_resolution=failed"
            exit 1
          fi
          printf 'dns_resolution=ok name=%s\n' "$expected_dns_name"
          printf 'phase1_preflight_marker=%s status=success\n' "$expected_marker_token"
          preflight_succeeded=1
          HOST_SCRIPT
          )"
          host_script="expected_instance_id=${expected_instance_id_q}
          expected_instance_profile_name=${expected_instance_profile_name_q}
          expected_dns_name=${expected_dns_name_q}
          expected_unit=${expected_unit_q}
          expected_marker_token=${expected_marker_token_q}
          ${host_script}"
          parameters_json="$(jq -nc --arg command "$host_script" '{commands: [$command]}')"
          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --document-name AWS-RunShellScript \
              --instance-ids "$target_id" \
              --parameters "$parameters_json" \
              --comment "Phase 1 bounded preflight (${DEPLOYMENT_UNIT})" \
              --timeout-seconds 300 \
              --max-concurrency 1 \
              --max-errors 0 \
              --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=${AWS_SSM_LOG_GROUP}" \
              --query 'Command.CommandId' \
              --output text
          )"
          if [ -z "$command_id" ] || [ "$command_id" = "None" ]; then
            echo "::error title=SSM preflight dispatch failed::No command ID was returned"
            exit 1
          fi
          success_marker="phase1_preflight_marker=${PREFLIGHT_MARKER_TOKEN} status=success"
          failure_marker="phase1_preflight_marker=${PREFLIGHT_MARKER_TOKEN} status=failed"
          marker_state="pending"
          for attempt in $(seq 1 36); do
            # Read only the marker event count from this command's stdout stream; never retrieve log text.
            failure_event_count="$(
              aws logs filter-log-events \
                --region "$AWS_REGION" \
                --log-group-name "$AWS_SSM_LOG_GROUP" \
                --log-stream-names "${command_id}/${target_id}/aws-runShellScript/stdout" \
                --filter-pattern "\"$failure_marker\"" \
                --query 'length(events)' \
                --output json 2>/dev/null
            )"
            if ! [[ "$failure_event_count" =~ ^[0-9]+$ ]]; then
              echo "::error title=Invalid SSM marker count::CloudWatch returned a non-numeric failure marker event count"
              exit 1
            fi
            if [ "$failure_event_count" -gt 0 ]; then
              echo "::error title=SSM host preflight failed::Bounded host failure marker observed; command_id=${command_id}"
              exit 1
            fi
            success_event_count="$(
              aws logs filter-log-events \
                --region "$AWS_REGION" \
                --log-group-name "$AWS_SSM_LOG_GROUP" \
                --log-stream-names "${command_id}/${target_id}/aws-runShellScript/stdout" \
                --filter-pattern "\"$success_marker\"" \
                --query 'length(events)' \
                --output json 2>/dev/null
            )"
            if ! [[ "$success_event_count" =~ ^[0-9]+$ ]]; then
              echo "::error title=Invalid SSM marker count::CloudWatch returned a non-numeric success marker event count"
              exit 1
            fi
            if [ "$success_event_count" -gt 0 ]; then
              marker_state="success"
              echo "ssm_preflight_status=Success command_id=${command_id} marker_event_count=${success_event_count}"
              break
            fi
            sleep 5
          done
          if [ "$marker_state" != "success" ]; then
            echo "::error title=SSM host preflight timed out::No bounded marker observed; command_id=${command_id}"
            exit 1
          fi

      - name: Release and validate Twelve Data scheduler on Fetcher EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FETCHER_IMAGE: ${{ env.FETCHER_IMAGE }}
          FETCHER_IMAGE_TAG: ${{ env.FETCHER_IMAGE_TAG }}
          FETCHER_SOURCE_API_URL: ${{ vars.FETCHER_SOURCE_API_URL }}
          FINDB_SERVE_BASE_URL: ${{ vars.FINDB_SERVE_BASE_URL }}
          FETCHER_CALENDAR_SERVE_API_KEY: ${{ secrets.FETCHER_CALENDAR_SERVE_API_KEY }}
          FETCHER_CALENDAR_TIMEOUT_SECONDS: ${{ vars.FETCHER_CALENDAR_TIMEOUT_SECONDS || '10' }}
          FETCHER_CALENDAR_CACHE_TTL_SECONDS: ${{ vars.FETCHER_CALENDAR_CACHE_TTL_SECONDS || '300' }}
          FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY: ${{ secrets.FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_BASE_URL: ${{ vars.TWELVE_DATA_BASE_URL || 'https://api.twelvedata.com' }}
          TWELVE_DATA_TIMEOUT_SECONDS: ${{ vars.TWELVE_DATA_TIMEOUT_SECONDS || '30' }}
          TWELVE_DATA_MAX_RESPONSE_BYTES: ${{ vars.TWELVE_DATA_MAX_RESPONSE_BYTES || '8388608' }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_RAW_BUCKET: ${{ vars.CLOUDFLARE_R2_RAW_BUCKET }}
          CLOUDFLARE_R2_RAW_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RAW_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_RAW_SESSION_TOKEN: ${{ secrets.CLOUDFLARE_R2_RAW_SESSION_TOKEN }}
          CLOUDFLARE_R2_MAX_OBJECT_BYTES: ${{ vars.CLOUDFLARE_R2_MAX_OBJECT_BYTES || '8388608' }}
          FETCHER_REQUEST_TIMEOUT_SECONDS: ${{ vars.FETCHER_REQUEST_TIMEOUT_SECONDS || '30' }}
          FETCHER_SCHEDULER_CONTROL_POLL_SECONDS: ${{ vars.FETCHER_SCHEDULER_CONTROL_POLL_SECONDS || '30' }}
          FETCHER_MAX_ATTEMPTS: ${{ vars.FETCHER_MAX_ATTEMPTS || '3' }}
          FETCHER_MAX_RETRY_AFTER_SECONDS: ${{ vars.FETCHER_MAX_RETRY_AFTER_SECONDS || '30' }}
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,FETCHER_IMAGE,FETCHER_IMAGE_TAG,FETCHER_SOURCE_API_URL,FINDB_SERVE_BASE_URL,FETCHER_CALENDAR_SERVE_API_KEY,FETCHER_CALENDAR_TIMEOUT_SECONDS,FETCHER_CALENDAR_CACHE_TTL_SECONDS,FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY,TWELVE_DATA_API_KEY,TWELVE_DATA_BASE_URL,TWELVE_DATA_TIMEOUT_SECONDS,TWELVE_DATA_MAX_RESPONSE_BYTES,CLOUDFLARE_R2_ACCOUNT_ID,CLOUDFLARE_R2_RAW_BUCKET,CLOUDFLARE_R2_RAW_ACCESS_KEY_ID,CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY,CLOUDFLARE_R2_RAW_SESSION_TOKEN,CLOUDFLARE_R2_MAX_OBJECT_BYTES,FETCHER_REQUEST_TIMEOUT_SECONDS,FETCHER_SCHEDULER_CONTROL_POLL_SECONDS,FETCHER_MAX_ATTEMPTS,FETCHER_MAX_RETRY_AFTER_SECONDS
          script: |
            set -euo pipefail

            require_runtime_value() {
              if [ -z "$2" ]; then
                echo "::error title=Missing Fetcher configuration::Required runtime setting is not configured"
                exit 1
              fi
            }
            require_runtime_value source_api_url "${FETCHER_SOURCE_API_URL:-}"
            require_runtime_value twelve_data_source_client_key "${FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY:-}"
            require_runtime_value twelve_data_api_key "${TWELVE_DATA_API_KEY:-}"
            require_runtime_value r2_account_id "${CLOUDFLARE_R2_ACCOUNT_ID:-}"
            require_runtime_value r2_raw_bucket "${CLOUDFLARE_R2_RAW_BUCKET:-}"
            require_runtime_value r2_raw_access_key_id "${CLOUDFLARE_R2_RAW_ACCESS_KEY_ID:-}"
            require_runtime_value r2_raw_secret_access_key "${CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY:-}"
            require_runtime_value serve_base_url "${FINDB_SERVE_BASE_URL:-}"
            require_runtime_value calendar_serve_api_key "${FETCHER_CALENDAR_SERVE_API_KEY:-}"
            if [ "$FETCHER_CALENDAR_SERVE_API_KEY" = "$FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY" ]; then
              echo "::error title=Fetcher credential isolation failed::Calendar Serve and Source credentials must be different"
              exit 1
            fi
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            export SOURCE_API_URL="$FETCHER_SOURCE_API_URL"
            export SOURCE_CLIENT_KEY="$FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY"
            export FETCHER_STATE_PATH=/var/lib/findb-fetcher/state.sqlite3
            export TWELVE_DATA_API_KEY TWELVE_DATA_BASE_URL TWELVE_DATA_TIMEOUT_SECONDS TWELVE_DATA_MAX_RESPONSE_BYTES

            reconcile_scheduler() {
              provider_id="$1"
              image="$2"
              state_dir="$3"
              state_path="$4"
              stable="$5"
              candidate="$6"
              previous="$7"
              preflight_name="$8"
              cache_dir="${9}"
              runtime_env_args="${10}"
              shift 10
              scheduler_command=("$@")

              sudo mkdir -p "$state_dir"
              sudo chown 10001:10001 "$state_dir"
              sudo chmod 0700 "$state_dir"
              if [ "$(sudo stat -c '%u:%g:%a' "$state_dir")" != "10001:10001:700" ]; then
                echo "::error title=Fetcher state rejected::${provider_id} state directory ownership or mode is unsafe"
                exit 1
              fi
              if [ -e "$state_path" ] && { [ ! -f "$state_path" ] || [ "$(sudo stat -c '%u:%g:%a' "$state_path")" != "10001:10001:600" ]; }; then
                echo "::error title=Fetcher state rejected::${provider_id} SQLite ownership or mode is unsafe"
                exit 1
              fi
              if [ "$cache_dir" != "-" ]; then
                sudo mkdir -p "$cache_dir"
                sudo chown 10001:10001 "$cache_dir"
                sudo chmod 0700 "$cache_dir"
                if [ "$(sudo stat -c '%u:%g:%a' "$cache_dir")" != "10001:10001:700" ]; then
                  echo "::error title=Fetcher cache rejected::${provider_id} cache ownership or mode is unsafe"
                  exit 1
                fi
              fi

              raw_bucket_marker="$state_dir/raw-bucket.sha256"
              if ! printf '%s' "$CLOUDFLARE_R2_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
                echo "::error title=Invalid Fetcher R2 configuration::R2 account ID is unsafe" >&2
                exit 1
              fi
              if ! printf '%s' "$CLOUDFLARE_R2_RAW_BUCKET" | grep -Eq '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$' \
                || printf '%s' "$CLOUDFLARE_R2_RAW_BUCKET" | grep -Eq '^([0-9]{1,3}[.]){3}[0-9]{1,3}$'; then
                echo "::error title=Invalid Fetcher R2 configuration::Raw bucket name is unsafe" >&2
                exit 1
              fi
              raw_bucket_fingerprint="$(printf '%s\n%s\n%s' "$CLOUDFLARE_R2_ACCOUNT_ID" "$CLOUDFLARE_R2_RAW_BUCKET" "$provider_id" | sha256sum | cut -d ' ' -f1)"
              write_raw_bucket_marker() {
                marker_tmp="$(sudo mktemp "$state_dir/.raw-bucket.sha256.XXXXXX")"
                printf '%s\n' "$raw_bucket_fingerprint" | sudo tee "$marker_tmp" >/dev/null
                sudo chown 10001:10001 "$marker_tmp"
                sudo chmod 0600 "$marker_tmp"
                sudo mv "$marker_tmp" "$raw_bucket_marker"
              }
              validate_raw_bucket_marker_mode() {
                if ! sudo test -f "$raw_bucket_marker" \
                  || [ "$(sudo stat -c '%u:%g:%a' "$raw_bucket_marker")" != "10001:10001:600" ]; then
                  echo "::error title=Fetcher state rejected::${provider_id} raw bucket binding marker ownership or mode is unsafe" >&2
                  exit 1
                fi
              }
              if sudo test -e "$state_path"; then
                if ! sudo test -f "$raw_bucket_marker"; then
                  echo "::error title=Fetcher raw bucket cutover required::${provider_id} state has no binding marker" >&2
                  exit 1
                fi
                validate_raw_bucket_marker_mode
                marker_fingerprint="$(sudo cat "$raw_bucket_marker")"
                if [ "$marker_fingerprint" != "$raw_bucket_fingerprint" ]; then
                  echo "::error title=Fetcher raw bucket mismatch::${provider_id} state belongs to a different Raw bucket" >&2
                  exit 1
                fi
              elif sudo test -e "$raw_bucket_marker"; then
                validate_raw_bucket_marker_mode
                marker_fingerprint="$(sudo cat "$raw_bucket_marker")"
                if [ "$marker_fingerprint" != "$raw_bucket_fingerprint" ]; then
                  write_raw_bucket_marker
                fi
              else
                write_raw_bucket_marker
              fi

              # Resolve interrupted candidate/previous names without changing
              # another provider's container.
              if docker container inspect "$candidate" >/dev/null 2>&1; then
                if docker container inspect "$stable" >/dev/null 2>&1 || docker container inspect "$previous" >/dev/null 2>&1; then
                  docker rm -f "$candidate"
                else
                  docker rename "$candidate" "$stable"
                fi
              fi
              if docker container inspect "$previous" >/dev/null 2>&1; then
                if docker container inspect "$stable" >/dev/null 2>&1; then
                  docker rm -f "$previous"
                else
                  docker rename "$previous" "$stable"
                fi
              fi

              echo "Pruning unused Docker images before pulling ${provider_id}"
              docker image prune -af
              docker pull "$image"
              if [ "$cache_dir" = "-" ]; then
                cache_mount=""
              else
                cache_mount="--mount type=bind,src=$cache_dir,dst=/home/fetcher"
              fi

              # Provider-specific preflight is deliberately before replacing
              # the stable container. --check performs no provider or Source calls.
              docker run --rm \
                --name "$preflight_name" \
                --user 10001:10001 \
                --read-only \
                --cap-drop ALL \
                --security-opt no-new-privileges \
                --tmpfs /tmp:rw,noexec,nosuid,size=16m \
                --mount "type=bind,src=$state_dir,dst=$state_dir" \
                $cache_mount \
                $runtime_env_args \
                "$image" \
                "${scheduler_command[@]}" --check

              recover_scheduler() {
                original_status="$1"
                [ "$original_status" -eq 0 ] && original_status=1
                trap - ERR INT TERM HUP
                set +e
                recovery_failed=0
                if docker container inspect "$candidate" >/dev/null 2>&1; then
                  docker rm -f "$candidate" >/dev/null 2>&1 || recovery_failed=1
                fi
                if [ "$recovery_failed" -eq 0 ] && ! docker container inspect "$stable" >/dev/null 2>&1 \
                  && docker container inspect "$previous" >/dev/null 2>&1; then
                  docker rename "$previous" "$stable" >/dev/null 2>&1 || recovery_failed=1
                fi
                if [ "$recovery_failed" -eq 0 ] && docker container inspect "$stable" >/dev/null 2>&1; then
                  docker start "$stable" >/dev/null 2>&1 || recovery_failed=1
                fi
                if [ "$recovery_failed" -ne 0 ]; then
                  echo "::error title=Fetcher recovery failed::${provider_id} rollback did not complete" >&2
                fi
                exit "$original_status"
              }
              trap 'recover_scheduler "$?"' ERR
              trap 'recover_scheduler 130' INT
              trap 'recover_scheduler 143' TERM
              trap 'recover_scheduler 129' HUP

              had_previous=0
              if docker container inspect "$stable" >/dev/null 2>&1; then
                had_previous=1
                docker stop --time 30 "$stable" >/dev/null
                stable_exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$stable")"
                if [ "$stable_exit_code" -ne 0 ]; then
                  echo "::error title=Fetcher graceful stop failed::${provider_id} stable container exited ${stable_exit_code}" >&2
                  false
                fi
                docker rename "$stable" "$previous"
              fi

              common_runtime_args=(
                --user 10001:10001
                --restart unless-stopped
                --read-only
                --cap-drop ALL
                --security-opt no-new-privileges
                --log-opt max-size=10m
                --log-opt max-file=3
                --tmpfs /tmp:rw,noexec,nosuid,size=16m
                --mount "type=bind,src=$state_dir,dst=$state_dir"
              )
              if [ -n "$cache_mount" ]; then
                common_runtime_args+=(--mount "type=bind,src=$cache_dir,dst=/home/fetcher")
              fi
              docker run -d \
                --name "$candidate" \
                "${common_runtime_args[@]}" \
                $runtime_env_args \
                "$image" \
                "${scheduler_command[@]}" --run-forever >/dev/null
              candidate_image="$(docker inspect --format '{{.Config.Image}}' "$candidate")"
              candidate_user="$(docker inspect --format '{{.Config.User}}' "$candidate")"
              healthy=0
              for attempt in $(seq 1 6); do
                status="$(docker inspect --format '{{.State.Status}}' "$candidate")"
                restarts="$(docker inspect --format '{{.RestartCount}}' "$candidate")"
