name: Fetcher CD

on:
  push:
    branches: [main]
    paths:
      - "fetcher/**"
      - ".github/workflows/fetcher-cd.yml"
  workflow_dispatch:

concurrency:
  group: production-fetcher
  cancel-in-progress: false

permissions:
  contents: read

env:
  FETCHER_IMAGE: ghcr.io/fpi-tw/findb-fetcher
  FETCHER_IMAGE_TAG: ${{ github.sha }}

jobs:
  verify:
    uses: ./.github/workflows/fetcher-ci.yml

  build-push:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Fetcher image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: fetcher/Dockerfile
          push: true
          tags: ${{ env.FETCHER_IMAGE }}:${{ env.FETCHER_IMAGE_TAG }}
          cache-from: type=gha,scope=fetcher
          cache-to: type=gha,mode=max,scope=fetcher

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-fetcher

    permissions:
      contents: read
      packages: read

    steps:
      - name: Release and validate Fetcher image on Fetcher EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FETCHER_IMAGE: ${{ env.FETCHER_IMAGE }}
          FETCHER_IMAGE_TAG: ${{ env.FETCHER_IMAGE_TAG }}
          FETCHER_SOURCE_API_URL: ${{ vars.FETCHER_SOURCE_API_URL }}
          FETCHER_SOURCE_CLIENT_KEY: ${{ secrets.FETCHER_SOURCE_CLIENT_KEY }}
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,FETCHER_IMAGE,FETCHER_IMAGE_TAG,FETCHER_SOURCE_API_URL,FETCHER_SOURCE_CLIENT_KEY
          script: |
            set -euo pipefail

            if [ -z "${FETCHER_SOURCE_API_URL:-}" ]; then
              echo "::error title=Missing Fetcher variable::FETCHER_SOURCE_API_URL must be configured"
              exit 1
            fi
            if [ -z "${FETCHER_SOURCE_CLIENT_KEY:-}" ]; then
              echo "::error title=Missing Fetcher secret::FETCHER_SOURCE_CLIENT_KEY must be configured"
              exit 1
            fi

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            image="${FETCHER_IMAGE}:${FETCHER_IMAGE_TAG}"
            docker pull "$image"

            # The current Fetcher entry point is a one-shot readiness validator,
            # not a scheduler. This intentionally verifies the immutable release
            # and runtime contract without installing a fake long-running service.
            export SOURCE_API_URL="$FETCHER_SOURCE_API_URL"
            export SOURCE_CLIENT_KEY="$FETCHER_SOURCE_CLIENT_KEY"
            docker run --rm \
              --env SOURCE_API_URL \
              --env SOURCE_CLIENT_KEY \
              "$image"

            docker image inspect "$image" --format \
              'Fetcher release verified: image={{.RepoTags}} digest={{index .RepoDigests 0}}'
