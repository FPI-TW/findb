              # manifest, credentials, and the explicit simulation=true mode.
              docker run --rm --name "$preflight_name" --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$state_dir,dst=$state_dir" --mount "type=bind,src=$cache_dir,dst=/home/fetcher" $runtime_env_args "$image" "${scheduler_command[@]}" --check
              recover_scheduler() { original_status="$1"; [ "$original_status" -eq 0 ] && original_status=1; trap - ERR INT TERM HUP; set +e; recovery_failed=0; if docker container inspect "$candidate" >/dev/null 2>&1; then docker rm -f "$candidate" >/dev/null 2>&1 || recovery_failed=1; fi; if [ "$recovery_failed" -eq 0 ] && ! docker container inspect "$stable" >/dev/null 2>&1 && docker container inspect "$previous" >/dev/null 2>&1; then docker rename "$previous" "$stable" >/dev/null 2>&1 || recovery_failed=1; fi; if [ "$recovery_failed" -eq 0 ] && docker container inspect "$stable" >/dev/null 2>&1; then docker start "$stable" >/dev/null 2>&1 || recovery_failed=1; fi; [ "$recovery_failed" -eq 0 ] || echo "::error title=Shioaji recovery failed::Rollback did not complete" >&2; exit "$original_status"; }
              trap 'recover_scheduler "$?"' ERR; trap 'recover_scheduler 130' INT; trap 'recover_scheduler 143' TERM; trap 'recover_scheduler 129' HUP
              had_previous=0
              if docker container inspect "$stable" >/dev/null 2>&1; then
                had_previous=1
                docker stop --time 30 "$stable" >/dev/null
                stable_exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$stable")"
                if [ "$stable_exit_code" -ne 0 ]; then
                  echo "::error title=Shioaji graceful stop failed::Stable container exited ${stable_exit_code}" >&2
                  false
                fi
                docker rename "$stable" "$previous"
              fi
              common_runtime_args=(--user 10001:10001 --restart unless-stopped --read-only --cap-drop ALL --security-opt no-new-privileges --log-opt max-size=10m --log-opt max-file=3 --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$state_dir,dst=$state_dir" --mount "type=bind,src=$cache_dir,dst=/home/fetcher")
              docker run -d --name "$candidate" "${common_runtime_args[@]}" $runtime_env_args "$image" "${scheduler_command[@]}" --run-forever >/dev/null; candidate_image="$(docker inspect --format '{{.Config.Image}}' "$candidate")"; candidate_user="$(docker inspect --format '{{.Config.User}}' "$candidate")"; healthy=0; for attempt in $(seq 1 6); do status="$(docker inspect --format '{{.State.Status}}' "$candidate")"; restarts="$(docker inspect --format '{{.RestartCount}}' "$candidate")"; if [ "$status" != "running" ] || [ "$restarts" -ne 0 ]; then break; fi; [ "$attempt" -eq 6 ] && healthy=1 && break; sleep 5; done; if [ "$candidate_image" != "$image" ] || [ "$candidate_user" != "10001:10001" ] || [ "$healthy" -ne 1 ]; then docker inspect --format "Shioaji candidate failed: image={{.Config.Image}} user={{.Config.User}} status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}" "$candidate" || true; false; fi
              docker rename "$candidate" "$stable"; [ "$had_previous" -eq 1 ] && docker rm "$previous" >/dev/null 2>&1 || true; stable_running="$(docker inspect --format '{{.State.Running}}' "$stable")"
              if [ "$stable_running" != "true" ]; then
                echo "::error title=Shioaji release rejected::Scheduler did not converge to running" >&2
                false
              fi
              trap - ERR INT TERM HUP; echo "Shioaji scheduler release reconciled to running"
            }
            runtime_env_args="\
              --env SOURCE_API_URL --env SOURCE_CLIENT_KEY --env FINDB_SERVE_BASE_URL \
              --env FETCHER_CALENDAR_SERVE_API_KEY --env FETCHER_CALENDAR_TIMEOUT_SECONDS --env FETCHER_CALENDAR_CACHE_TTL_SECONDS \
              --env SHIOAJI_API_KEY --env SHIOAJI_SECRET_KEY --env SHIOAJI_SIMULATION \
              --env CLOUDFLARE_R2_ACCOUNT_ID --env CLOUDFLARE_R2_RAW_BUCKET --env CLOUDFLARE_R2_RAW_ACCESS_KEY_ID \
              --env CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY --env CLOUDFLARE_R2_RAW_SESSION_TOKEN --env CLOUDFLARE_R2_MAX_OBJECT_BYTES \
              --env FETCHER_REQUEST_TIMEOUT_SECONDS --env FETCHER_SCHEDULER_CONTROL_POLL_SECONDS --env FETCHER_MAX_ATTEMPTS --env FETCHER_MAX_RETRY_AFTER_SECONDS --env FETCHER_SHIOAJI_STATE_PATH"
            # BEGIN FETCHER SHIOAJI SCHEDULER RECONCILIATION
            # Provider command contracts: findb-fetch-shioaji-scheduler --check and findb-fetch-shioaji-scheduler --run-forever.
            reconcile_scheduler shioaji "${FETCHER_SHIOAJI_IMAGE}:${FETCHER_IMAGE_TAG}" \
              /var/lib/findb-shioaji-fetcher /var/lib/findb-shioaji-fetcher/state.sqlite3 \
              findb-fetcher-shioaji-scheduler findb-fetcher-shioaji-scheduler-candidate findb-fetcher-shioaji-scheduler-previous \
              findb-fetcher-shioaji-scheduler-preflight "$runtime_env_args" findb-fetch-shioaji-scheduler --manifest /app/configs/shioaji_tw_pilot.v1.json
            # END FETCHER SHIOAJI SCHEDULER RECONCILIATION

  finlab-acquisition-smoke:
    needs: [deploy, build-push, validate-target-routing]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_finlab_smoke == true &&
      (inputs.deployment_target || 'staging') == 'staging' &&
      vars.STAGING_ECR_CUTOVER_ENABLED == 'true' &&
      needs.deploy.result == 'success' &&
      needs.build-push.result == 'success' &&
      needs.validate-target-routing.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job is intentionally staging-only, regardless of the regular deploy input.
    environment: staging-fetcher
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure staging AWS credentials for FinLab smoke
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: fetcher-staging-smoke-${{ github.run_id }}

      - name: Run bounded FinLab acquisition smoke over SSM
        shell: bash
        env:
          AWS_REGION: ap-southeast-1
          AWS_SSM_LOG_GROUP: ${{ vars.AWS_SSM_LOG_GROUP }}
          DEPLOY_BUNDLE_BUCKET: ${{ vars.DEPLOY_BUNDLE_BUCKET }}
          ACCEPTED_BUNDLE_KEY: ${{ needs.deploy.outputs.accepted_bundle_key }}
          TARGET_ID: ${{ needs.deploy.outputs.target_id }}
          RELEASE_ROOT: ${{ needs.deploy.outputs.release_root }}
          ECR_REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com
          FETCHER_FINLAB_IMAGE_REF: ${{ needs.build-push.outputs.finlab_image_ref }}
          FINLAB_SMOKE_TARGET_DATE: ${{ inputs.finlab_target_date }}
          FINLAB_SMOKE_SYMBOLS: ${{ inputs.finlab_symbols }}
          MARKER_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-finlab-smoke
        run: |
          set -euo pipefail
          [ -n "$FINLAB_SMOKE_TARGET_DATE" ] || exit 1
          [[ "$TARGET_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || exit 1
          [[ "$RELEASE_ROOT" =~ ^/opt/fetcher/releases/[0-9a-f]{64}-[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$ACCEPTED_BUNDLE_KEY" =~ ^fetcher/accepted/[0-9a-f]{40}/[0-9a-f]{64}[.]tar$ ]] || exit 1
          [[ "$FETCHER_FINLAB_IMAGE_REF" =~ ^439622209937\.dkr\.ecr\.ap-southeast-1\.amazonaws\.com/findb/staging/fetcher/finlab@sha256:[0-9a-f]{64}$ ]] || exit 1
          record_file="$(mktemp "$RUNNER_TEMP/fetcher-smoke-record.XXXXXX")"
          trap 'rm -f -- "$record_file"' EXIT
          aws s3api get-object --bucket "$DEPLOY_BUNDLE_BUCKET" --key "${ACCEPTED_BUNDLE_KEY%.tar}.acceptance.json" "$record_file" >/dev/null
          python3 - "$record_file" "$ACCEPTED_BUNDLE_KEY" "$FETCHER_FINLAB_IMAGE_REF" <<'PY'
          import json, re, sys
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result: raise ValueError("duplicate key")
                  result[key] = value
              return result
          record = json.load(open(sys.argv[1], encoding="utf-8"), object_pairs_hook=unique)
          key = sys.argv[2]
          required = {"unit","commit_sha","bundle_sha256","bundle_key","validator_sha256","migration_revision","workflow_run_id","workflow_run_attempt","ssm_command_id","images","state"}
          valid = isinstance(record, dict) and set(record) == required and record["unit"] == "fetcher" and record["commit_sha"] == key.split("/")[2] and record["bundle_sha256"] == key.rsplit("/", 1)[1].removesuffix(".tar") and record["bundle_key"] == key and re.fullmatch(r"[0-9a-f]{64}", record["validator_sha256"]) and record["migration_revision"] == "none" and isinstance(record["images"], dict) and set(record["images"]) == {"twelve_data","finlab","shioaji"} and record["images"]["finlab"] == sys.argv[3] and record["state"] == "accepted" and re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", record["ssm_command_id"])
          raise SystemExit(0 if valid else 1)
          PY
          host_script='set -eu
          smoke_succeeded=0
          emit_failure() { trap - EXIT; [ "$smoke_succeeded" -eq 1 ] || printf "phase5_finlab_smoke_marker=%s status=failed\\n" "$MARKER_TOKEN"; }
          trap emit_failure EXIT
          cache_dir=/var/lib/findb-finlab-smoke-cache
          install -d -o 10001 -g 10001 -m 0700 "$cache_dir"
          sudo --preserve-env=AWS_REGION,ECR_REGISTRY,FETCHER_FINLAB_IMAGE_REF,FINLAB_SMOKE_TARGET_DATE,FINLAB_SMOKE_SYMBOLS "$RELEASE_ROOT/infra/deploy/runtime-secrets/runtime_secret_command.sh" --catalog "$RELEASE_ROOT/infra/deploy/runtime-secrets/fetcher.json" --region "$AWS_REGION" --consumer finlab-smoke --ecr-registry "$ECR_REGISTRY" --docker-login -- docker run --rm --name findb-finlab-acquisition-smoke --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --mount "type=bind,src=$cache_dir,dst=/home/fetcher" --env FINLAB_API_TOKEN "$FETCHER_FINLAB_IMAGE_REF" findb-fetch-finlab-smoke --target-date "$FINLAB_SMOKE_TARGET_DATE" --symbols "$FINLAB_SMOKE_SYMBOLS"
          printf "phase5_finlab_smoke_marker=%s status=success\\n" "$MARKER_TOKEN"
          smoke_succeeded=1'
          for name in AWS_REGION ECR_REGISTRY FETCHER_FINLAB_IMAGE_REF FINLAB_SMOKE_TARGET_DATE FINLAB_SMOKE_SYMBOLS RELEASE_ROOT MARKER_TOKEN; do printf -v prefix 'export %s=%q\n' "$name" "${!name}"; host_script="${prefix}${host_script}"; done
          command_id="$(aws ssm send-command --region "$AWS_REGION" --document-name AWS-RunShellScript --instance-ids "$TARGET_ID" --parameters "$(jq -nc --arg command "$host_script" '{commands: [$command]}')" --comment 'Phase 5 bounded FinLab smoke' --timeout-seconds 600 --max-concurrency 1 --max-errors 0 --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=${AWS_SSM_LOG_GROUP}" --query 'Command.CommandId' --output text)"
          [[ "$command_id" =~ ^[0-9a-f-]{36}$ ]] || exit 1
          source infra/deploy/cloudwatch_marker_count.sh
          success_marker="phase5_finlab_smoke_marker=${MARKER_TOKEN} status=success"
          for attempt in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$TARGET_ID" --cli-connect-timeout 5 --cli-read-timeout 10 --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                success_count="$(cloudwatch_marker_count "$AWS_REGION" "$AWS_SSM_LOG_GROUP" "${command_id}/${TARGET_ID}/aws-runShellScript/stdout" "$success_marker" || true)"
                if [[ "$success_count" =~ ^[0-9]+$ ]] && [ "$success_count" -gt 0 ]; then exit 0; fi ;;
              Pending|InProgress|Delayed|Cancelling|""|None) ;;
              Cancelled|TimedOut|Failed) exit 1 ;;
              *) exit 1 ;;
            esac
            sleep 5
          done
          exit 1
