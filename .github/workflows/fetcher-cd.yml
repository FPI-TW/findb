name: Fetcher CD
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Staging target only
        required: true
        default: staging
        type: choice
        options:
        - staging
      revision:
        description: Exact protected-main commit SHA
        required: true
        type: string
      deployment_mode:
        description: Create a new candidate or replay an accepted bundle
        required: true
        default: replay
        type: choice
        options:
        - replay
        - candidate
      candidate_confirmation:
        description: Type deploy-new-candidate for candidate mode
        required: false
        default: ''
        type: string
      image_tag:
        description: Existing staging SHA for an accepted replay
        required: false
        default: ''
        type: string
      accepted_bundle_key:
        description: Exact staging accepted bundle key for replay
        required: false
        default: ''
        type: string
concurrency:
  group: staging-fetcher
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      fetcher_ci: ${{ steps.policy.outputs.fetcher_ci }}
      fetcher_staging: ${{ steps.policy.outputs.fetcher_staging }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision || github.sha }}
        fetch-depth: 0
        persist-credentials: false
        clean: false
    - id: revision
      env:
        EXPECTED_SHA: ${{ inputs.revision || github.sha }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        set -euo pipefail
        actual="$(git rev-parse HEAD)"; [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; [ "$actual" = "$EXPECTED_SHA" ]
        if [ "${{ github.event_name }}" = workflow_dispatch ]; then git fetch --no-tags origin main:refs/remotes/origin/main; git merge-base --is-ancestor "$actual" refs/remotes/origin/main; [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "$actual" ]; fi
        echo "sha=$actual" >> "$GITHUB_OUTPUT"
    - id: policy
      env:
        EVENT: ${{ github.event_name }}
        HEAD: ${{ inputs.revision || github.sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = workflow_dispatch ]; then
          printf 'fetcher_ci=true\nfetcher_staging=true\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Diff from the last successful push rollout, not github.event.before:
        # a superseded pending run or a failed rollout must not hide changes.
        base="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/fetcher-cd.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
        if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$base" "$HEAD"; then
          python3 infra/deploy/change_policy.py --base "$base" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
        else
          echo "change_policy_base=unavailable selection=full"
          python3 infra/deploy/change_policy.py --full --github-output "$GITHUB_OUTPUT"
        fi
  verify:
    needs: policy
    if: ${{ needs.policy.outputs.fetcher_ci == 'true' }}
    uses: ./.github/workflows/fetcher-ci.yml
    with:
      revision: ${{ needs.policy.outputs.revision }}
  select:
    needs:
    - policy
    - verify
    if: github.ref == 'refs/heads/main' && needs.verify.result == 'success' && needs.policy.outputs.fetcher_staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.selection.outputs.revision }}
      mode: ${{ steps.selection.outputs.mode }}
      bundle_key: ${{ steps.selection.outputs.bundle_key }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.policy.outputs.revision }}
        fetch-depth: 0
        persist-credentials: false
        clean: false
    - name: Verify exact requested revision, staging-only route, and deployment selection
      id: selection
      env:
        REVISION: ${{ needs.policy.outputs.revision }}
        DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
        CANDIDATE_CONFIRMATION: ${{ inputs.candidate_confirmation }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        ACCEPTED: ${{ inputs.accepted_bundle_key }}
      run: |
        set -euo pipefail
        [ "${{ inputs.deployment_target || 'staging' }}" = staging ]; [ "$(git rev-parse HEAD)" = "$REVISION" ]
        echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
        if [ "${{ github.event_name }}" = workflow_dispatch ]; then
          case "$DEPLOYMENT_MODE" in
            candidate)
              [ "$CANDIDATE_CONFIRMATION" = deploy-new-candidate ]
              [ -z "$ACCEPTED" ] && [ -z "$IMAGE_TAG" ]
              echo 'mode=candidate' >> "$GITHUB_OUTPUT"
              ;;
            replay)
              [ -z "$CANDIDATE_CONFIRMATION" ]
              [ -n "$ACCEPTED" ] && [ -n "$IMAGE_TAG" ]
              [ "$IMAGE_TAG" = "$REVISION" ]; [[ "$ACCEPTED" =~ ^fetcher/accepted/${REVISION}/[0-9a-f]{64}[.]tar$ ]]
              printf 'mode=replay\nbundle_key=%s\n' "$ACCEPTED" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
        else
          [ "${{ github.event_name }}" = push ] && [ -z "$DEPLOYMENT_MODE" ] && [ -z "$CANDIDATE_CONFIRMATION" ] && [ -z "$IMAGE_TAG" ] && [ -z "$ACCEPTED" ] || exit 1
          echo 'mode=candidate' >> "$GITHUB_OUTPUT"
        fi
    - name: Confirm staging credential and provider isolation policy
      run: |
        set -euo pipefail
        echo 'staging runtime secret isolation remains host-catalog enforced'
  publish:
    needs: select
    if: ${{ needs.select.result == 'success' && needs.select.outputs.mode == 'candidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      twelve_image: ${{ steps.twelve_image.outputs.image_ref }}
      finlab_image: ${{ steps.finlab_image.outputs.image_ref }}
      shioaji_image: ${{ steps.shioaji_image.outputs.image_ref }}
      factset_image: ${{ steps.factset_image.outputs.image_ref }}
    env:
      AWS_REGION: ap-southeast-1
      ACCOUNT: '439622209937'
      REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com
      TWELVE: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/fetcher/twelve-data
      FINLAB: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/fetcher/finlab
      SHIOAJI: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/fetcher/shioaji
      FACTSET: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/fetcher/factset
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.select.outputs.revision }}
        persist-credentials: false
        clean: false
    - name: Verify exact requested revision for publication
      env:
        EXPECTED_SHA: ${{ needs.select.outputs.revision }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - name: Configure staging publisher credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
      with:
        role-to-assume: arn:aws:iam::439622209937:role/fetcher-staging-ecr-publisher
        aws-region: ap-southeast-1
        allowed-account-ids: '439622209937'
        role-session-name: fetcher-staging-publish-${{ github.run_id }}
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - name: Build or reuse immutable Twelve Data image
      id: twelve_image
      env:
        ECR_IMAGE_TAG: ${{ needs.select.outputs.revision }}
      run: |
        set -euo pipefail
        [ "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT" ]
        aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
        infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$TWELVE" . ./fetcher/Dockerfile
    - name: Build or reuse immutable FinLab image
      id: finlab_image
      env:
        ECR_IMAGE_TAG: ${{ needs.select.outputs.revision }}
      run: infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$FINLAB" . ./fetcher/Dockerfile.finlab
    - name: Build or reuse immutable Shioaji image
      id: shioaji_image
      env:
        ECR_IMAGE_TAG: ${{ needs.select.outputs.revision }}
      run: infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$SHIOAJI" . ./fetcher/Dockerfile.shioaji
    - name: Build or reuse immutable FactSet image
      id: factset_image
      env:
        ECR_IMAGE_TAG: ${{ needs.select.outputs.revision }}
      run: infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$FACTSET" . ./fetcher/Dockerfile.factset
  prepare:
    needs:
    - select
    - publish
    if: |-
      always() && needs.select.result == 'success' && ((needs.select.outputs.mode == 'candidate' && needs.publish.result == 'success') ||
       (needs.select.outputs.mode == 'replay' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      revision: ${{ needs.select.outputs.revision }}
      mode: ${{ needs.select.outputs.mode }}
      bundle_key: ${{ steps.contract.outputs.bundle_key }}
    env:
      AWS_REGION: ap-southeast-1
      ACCOUNT: '439622209937'
      REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.select.outputs.revision }}
        persist-credentials: false
        clean: false
    - name: Load deployment driver from protected main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: .deployment-driver
        persist-credentials: false
    - name: Load AWS deployment configuration
      uses: ./.deployment-driver/.github/actions/aws-configuration
      with:
        target: staging
        unit: fetcher
    - name: Verify exact requested revision for bundle preparation
      env:
        EXPECTED_SHA: ${{ needs.select.outputs.revision }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - name: Verify deployment account
      shell: bash
      run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
    - name: Build and upload exact v2 staging candidate
      if: ${{ needs.select.outputs.mode == 'candidate' }}
      id: candidate
      env:
        REVISION: ${{ needs.select.outputs.revision }}
        BUNDLE_BUCKET: ${{ env.DEPLOY_BUNDLE_BUCKET }}
        KMS_KEY: ${{ env.DEPLOY_BUNDLE_KMS_KEY_ARN }}
        TWELVE_IMAGE: ${{ needs.publish.outputs.twelve_image }}
        FINLAB_IMAGE: ${{ needs.publish.outputs.finlab_image }}
        SHIOAJI_IMAGE: ${{ needs.publish.outputs.shioaji_image }}
        FACTSET_IMAGE: ${{ needs.publish.outputs.factset_image }}
      run: |
        set -euo pipefail
        [ "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT" ]
        [[ "$TWELVE_IMAGE" =~ ^${REGISTRY}/findb/staging/fetcher/twelve-data@sha256:[0-9a-f]{64}$ ]]; [[ "$FINLAB_IMAGE" =~ ^${REGISTRY}/findb/staging/fetcher/finlab@sha256:[0-9a-f]{64}$ ]]; [[ "$SHIOAJI_IMAGE" =~ ^${REGISTRY}/findb/staging/fetcher/shioaji@sha256:[0-9a-f]{64}$ ]]; [[ "$FACTSET_IMAGE" =~ ^${REGISTRY}/findb/staging/fetcher/factset@sha256:[0-9a-f]{64}$ ]]
        profile=unified
        python3 infra/deploy/release_manifest.py generate --runtime-profile "$profile" --repo-root . --unit fetcher --commit-sha "$REVISION" --migration-revision none --contract-manifest contracts/manifest.json --created-by-run-id "$GITHUB_RUN_ID" --deployment-target staging --registry "$REGISTRY" --account-id "$ACCOUNT" --release-tag '' --image "twelve_data=$TWELVE_IMAGE" --image "finlab=$FINLAB_IMAGE" --image "shioaji=$SHIOAJI_IMAGE" --image "factset=$FACTSET_IMAGE" --output "$RUNNER_TEMP/manifest.json"
        python3 infra/deploy/release_manifest.py bundle --repo-root . --unit fetcher --manifest "$RUNNER_TEMP/manifest.json" --output "$RUNNER_TEMP/bundle.tar"
        sha="$(sha256sum "$RUNNER_TEMP/bundle.tar" | cut -d ' ' -f1)"; key="fetcher/candidates/${REVISION}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${sha}.tar"
        aws s3api put-object --bucket "$BUNDLE_BUCKET" --key "$key" --body "$RUNNER_TEMP/bundle.tar" --if-none-match '*' --server-side-encryption aws:kms --ssekms-key-id "$KMS_KEY" >/dev/null
        echo "bundle_key=$key" >> "$GITHUB_OUTPUT"
    - name: Wait for same-revision FinDB staging rollout
      if: ${{ github.event_name == 'push' && needs.select.outputs.mode == 'candidate' }}
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ needs.select.outputs.revision }}
      run: |
        set -euo pipefail
        run_id=""
        for _ in $(seq 1 8); do
          runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/findb-cd.yml/runs?head_sha=${HEAD_SHA}&event=push&per_page=10")"
          run_id="$(jq -r --arg sha "$HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
          [ -n "$run_id" ] && break; sleep 15
        done
        [ -n "$run_id" ] || { echo 'same-revision FinDB rollout was not found'; exit 1; }
        for _ in $(seq 1 240); do
          run="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          status="$(jq -r '.status // empty' <<<"$run")"; conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
          case "$status" in
            completed) [ "$conclusion" = success ] && exit 0; echo "FinDB rollout concluded ${conclusion:-unknown}"; exit 1 ;;
            queued|in_progress|pending|waiting|requested) sleep 15 ;;
            *) echo "unexpected FinDB rollout state ${status:-empty}"; exit 1 ;;
          esac
        done
        echo 'timed out waiting for same-revision FinDB rollout'; exit 1
    - name: Publish exact reusable deployment contract
      id: contract
      env:
        MODE: ${{ needs.select.outputs.mode }}
        REPLAY_KEY: ${{ needs.select.outputs.bundle_key }}
        CANDIDATE_KEY: ${{ steps.candidate.outputs.bundle_key }}
      run: |
        set -euo pipefail
        key="$REPLAY_KEY"; [ "$MODE" = candidate ] && key="$CANDIDATE_KEY"; [ -n "$key" ]; echo "bundle_key=$key" >> "$GITHUB_OUTPUT"
  deploy:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/fetcher-deploy.yml
    with:
      deployment_target: staging
      revision: ${{ needs.prepare.outputs.revision }}
      mode: ${{ needs.prepare.outputs.mode }}
      bundle_key: ${{ needs.prepare.outputs.bundle_key }}
      release_tag: ''
  report-staging-deployment-failure:
    needs:
    - verify
    - select
    - publish
    - prepare
    - deploy
    if: |-
      always() && github.ref == 'refs/heads/main' && (inputs.deployment_target || 'staging') == 'staging' && (needs.verify.result == 'failure' ||
        needs.verify.result == 'cancelled' ||
        needs.select.result == 'failure' ||
        needs.select.result == 'cancelled' ||
        needs.publish.result == 'failure' ||
        needs.publish.result == 'cancelled' ||
        needs.prepare.result == 'failure' ||
        needs.prepare.result == 'cancelled' ||
        needs.deploy.result == 'failure' ||
        needs.deploy.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Load deployment driver from protected main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: .deployment-driver
        persist-credentials: false
    - name: Load AWS deployment configuration
      uses: ./.deployment-driver/.github/actions/aws-configuration
      with:
        target: staging
        unit: fetcher
    - name: Verify deployment account
      shell: bash
      run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
    - name: Publish staging deployment failure metric
      run: |
        aws cloudwatch put-metric-data \
          --region ap-southeast-1 \
          --namespace FinDB/Staging \
          --metric-name DeploymentFailure \
          --dimensions DeploymentUnit=fetcher,Resource=github-actions \
          --value 1 \
          --unit Count
