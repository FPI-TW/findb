name: Fetcher CD

on:
  push:
    branches: [main]
    paths:
      - "fetcher/**"
      - "infra/deploy/runtime-secrets/load_runtime_secrets.py"
      - "infra/deploy/runtime-secrets/runtime_secret_command.sh"
      - "infra/deploy/runtime-secrets/release_fetcher_provider.sh"
      - "infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh"
      - "infra/deploy/release_manifest.py"
      - "infra/deploy/runtime-secrets/fetcher.json"
      - ".github/workflows/fetcher-cd.yml"
  workflow_dispatch:
    inputs:
      deployment_target:
        description: GitHub Environment target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Optional existing staging ECR 40-character lowercase SHA to roll back to (staging only)
        required: false
        default: ""
        type: string
      run_finlab_smoke:
        description: Run the isolated FinLab acquisition smoke on staging (never deploys data)
        required: true
        default: false
        type: boolean
      finlab_target_date:
        description: Required ISO trade date for the FinLab smoke, for example 2026-07-29
        required: false
        default: ""
        type: string
      finlab_symbols:
        description: Reviewed FinLab smoke symbols
        required: false
        # Keep comma-delimited symbols quoted. GitHub otherwise normalizes this
        # choice to 23302317 before dispatching the workflow.
        default: "2330,2317"
        type: choice
        options:
          - "2330,2317"

concurrency:
  group: ${{ inputs.deployment_target || 'staging' }}-fetcher
  cancel-in-progress: false

permissions:
  contents: read

env:
  FETCHER_IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  STAGING_ECR_REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com

jobs:
  verify:
    uses: ./.github/workflows/fetcher-ci.yml

  validate-target-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate target-derived runtime route before build
        shell: bash
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target || 'staging' }}
          STAGING_ECR_CUTOVER_ENABLED: ${{ vars.STAGING_ECR_CUTOVER_ENABLED }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_TARGET" in
            staging|production) ;;
            *)
              echo "::error title=Invalid Fetcher deployment target::Expected staging or production"
              exit 1
              ;;
          esac
          if [ "$DEPLOYMENT_TARGET" = staging ] && [ "${{ github.event_name }}" = workflow_dispatch ] && [ "$STAGING_ECR_CUTOVER_ENABLED" != true ]; then
            echo "::error title=Staging ECR cutover disabled::Activation must be exactly true"
            exit 1
          fi

  build-push-production:
    needs: [verify, validate-target-routing]
    if: github.ref == 'refs/heads/main' && (inputs.deployment_target || 'staging') == 'production' && inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FETCHER_IMAGE: ghcr.io/fpi-tw/findb-fetcher
      FETCHER_FINLAB_IMAGE: ghcr.io/fpi-tw/findb-fetcher-finlab
      FETCHER_SHIOAJI_IMAGE: ghcr.io/fpi-tw/findb-fetcher-shioaji

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Fetcher image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: fetcher/Dockerfile
          push: true
          tags: ${{ env.FETCHER_IMAGE }}:${{ env.FETCHER_IMAGE_TAG }}
          cache-from: type=gha,scope=fetcher
          cache-to: type=gha,mode=max,scope=fetcher

      - name: Build and push FinLab Fetcher image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: fetcher/Dockerfile.finlab
          push: true
          tags: ${{ env.FETCHER_FINLAB_IMAGE }}:${{ env.FETCHER_IMAGE_TAG }}
          cache-from: type=gha,scope=fetcher-finlab
          cache-to: type=gha,mode=max,scope=fetcher-finlab

      - name: Build and push Shioaji Fetcher image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: fetcher/Dockerfile.shioaji
          push: true
          tags: ${{ env.FETCHER_SHIOAJI_IMAGE }}:${{ env.FETCHER_IMAGE_TAG }}
          cache-from: type=gha,scope=fetcher-shioaji
          cache-to: type=gha,mode=max,scope=fetcher-shioaji

  build-push-staging-ecr:
    needs: [verify, validate-target-routing]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.deployment_target || 'staging') == 'staging' &&
      vars.STAGING_ECR_CUTOVER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      twelve_image_ref: ${{ steps.twelve_image.outputs.image_ref }}
      finlab_image_ref: ${{ steps.finlab_image.outputs.image_ref }}
      shioaji_image_ref: ${{ steps.shioaji_image.outputs.image_ref }}
    env:
      AWS_REGION: ap-southeast-1
      ECR_REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com
      TWELVE_IMAGE: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/fetcher/twelve-data
      FINLAB_IMAGE: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/fetcher/finlab
      SHIOAJI_IMAGE: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/fetcher/shioaji
      ECR_IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ECR_REUSE_ONLY: ${{ inputs.image_tag != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate staging ECR release selection
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ]
          if [ -n "$ECR_IMAGE_TAG" ]; then
            [[ "$ECR_IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error title=Invalid staging rollback tag::image_tag must be a lowercase 40-character commit SHA"
              exit 1
            }
            git rev-parse --verify "$ECR_IMAGE_TAG^{commit}" >/dev/null
            git merge-base --is-ancestor "$ECR_IMAGE_TAG" HEAD || {
              echo "::error title=Invalid staging rollback tag::image_tag must be reachable from protected main"
              exit 1
            }
            if [ "$ECR_REUSE_ONLY" = true ]; then
              if ! git diff --quiet "$ECR_IMAGE_TAG" HEAD -- \
                infra/deploy/runtime-secrets/load_runtime_secrets.py \
                infra/deploy/runtime-secrets/runtime_secret_command.sh \
                infra/deploy/runtime-secrets/release_fetcher_provider.sh \
                infra/deploy/runtime-secrets/fetcher.json; then
                echo "::error title=Incompatible staging rollback::Deployment contract files differ from the selected image SHA; deploy a forward compatibility fix before retrying rollback"
                exit 1
              fi
            fi
          fi
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::439622209937:role/fetcher-staging-ecr-publisher
          aws-region: ap-southeast-1
          allowed-account-ids: '439622209937'
          role-session-name: fetcher-staging-ecr-${{ github.run_id }}
      - name: Log in to private ECR
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ vars.STAGING_ECR_CUTOVER_ENABLED }}" = true ]
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build or reuse immutable Twelve Data ECR image
        id: twelve_image
        shell: bash
        run: infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$TWELVE_IMAGE" . ./fetcher/Dockerfile
      - name: Build or reuse immutable FinLab ECR image
        id: finlab_image
        shell: bash
        run: infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$FINLAB_IMAGE" . ./fetcher/Dockerfile.finlab
      - name: Build or reuse immutable Shioaji ECR image
        id: shioaji_image
        shell: bash
        run: infra/deploy/runtime-secrets/build_ecr_image_if_missing.sh "$SHIOAJI_IMAGE" . ./fetcher/Dockerfile.shioaji
      - name: Classify selected release manifest support
        id: manifest_support
        shell: bash
        run: |
          set -euo pipefail
          manifest_tool_path=infra/deploy/release_manifest.py
          if ! git cat-file -e "$ECR_IMAGE_TAG^{commit}"; then
            echo "::error title=Selected commit unavailable::Cannot read the selected release commit"
            exit 1
          fi
          manifest_entries_file="$(mktemp "${RUNNER_TEMP:?}/selected-manifest-entry.XXXXXX")"
          trap 'rm -f -- "$manifest_entries_file"' EXIT
          if ! git ls-tree -z "$ECR_IMAGE_TAG" -- "$manifest_tool_path" > "$manifest_entries_file"; then
            echo "::error title=Selected manifest tool inspection failed::Cannot inspect the selected release tree"
            exit 1
          fi
          if [ ! -s "$manifest_entries_file" ]; then
            manifest_missing=true
          else
          if ! manifest_object_id="$(python3 - "$manifest_entries_file" "$manifest_tool_path" <<'PY'
          import re
          import sys

          raw = open(sys.argv[1], "rb").read()
          path = sys.argv[2].encode("ascii")
          if not raw.endswith(b"\0") or raw.count(b"\0") != 1:
              raise SystemExit(1)
          record = raw[:-1]
          match = re.fullmatch(
              rb"100(?:644|755) blob ((?:[0-9a-f]{40}|[0-9a-f]{64}))\t" + re.escape(path),
              record,
          )
          if match is None:
              raise SystemExit(1)
          print(match.group(1).decode("ascii"))
          PY
          )"; then
              echo "::error title=Selected manifest tool inspection failed::Selected manifest tool must be exactly one regular blob entry"
              exit 1
            fi
            if ! git cat-file -e "$manifest_object_id^{blob}"; then
              echo "::error title=Selected manifest tool inspection failed::Selected manifest tool blob is unreadable"
              exit 1
            fi
            manifest_missing=false
          fi
          if [ "$manifest_missing" = false ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          elif [ "$ECR_REUSE_ONLY" = true ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Legacy staging rollback::Selected SHA predates the Phase 3 release manifest; continuing the explicit protected-main SHA-tag rollback without a manifest artifact"
          else
            echo "::error title=Missing selected release manifest tool::Current releases must select a SHA that contains infra/deploy/release_manifest.py"
            exit 1
          fi
      - name: Materialize selected deployment source inputs
        id: selected_source_bundle
        if: ${{ steps.manifest_support.outputs.supported == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/fetcher-selected-deployment-source"
          mkdir -p "$source_root"
          git archive --format=tar "$ECR_IMAGE_TAG" | tar -x -C "$source_root"
          printf 'path=%s\n' "$source_root" >> "$GITHUB_OUTPUT"
      - name: Verify selected release manifest protocol
        if: ${{ steps.manifest_support.outputs.supported == 'true' }}
        shell: bash
        env:
          SOURCE_BUNDLE_ROOT: ${{ steps.selected_source_bundle.outputs.path }}
        run: |
          set -euo pipefail
          protocol_output="$(mktemp "${RUNNER_TEMP:?}/selected-manifest-protocol.XXXXXX")"
          protocol_error="$(mktemp "${RUNNER_TEMP:?}/selected-manifest-protocol-error.XXXXXX")"
          trap 'rm -f -- "$protocol_output" "$protocol_error"' EXIT
          if ! python3 "$SOURCE_BUNDLE_ROOT/infra/deploy/release_manifest.py" protocol > "$protocol_output" 2> "$protocol_error"; then
            echo "::error title=Selected manifest protocol failed::Selected manifest tool did not complete its v1 protocol"
            exit 1
          fi
          if [ -s "$protocol_error" ] || ! printf 'findb-release-manifest-v1\n' | cmp -s - "$protocol_output"; then
            echo "::error title=Selected manifest protocol invalid::Selected manifest tool must emit only the v1 protocol marker"
            exit 1
          fi
      - name: Generate and validate staging release manifest
        if: ${{ steps.manifest_support.outputs.supported == 'true' }}
        shell: bash
        env:
          TWELVE_IMAGE_REF: ${{ steps.twelve_image.outputs.image_ref }}
          FINLAB_IMAGE_REF: ${{ steps.finlab_image.outputs.image_ref }}
          SHIOAJI_IMAGE_REF: ${{ steps.shioaji_image.outputs.image_ref }}
          SOURCE_BUNDLE_ROOT: ${{ steps.selected_source_bundle.outputs.path }}
        run: |
          set -euo pipefail
          python3 "$SOURCE_BUNDLE_ROOT/infra/deploy/release_manifest.py" generate \
            --repo-root "$SOURCE_BUNDLE_ROOT" \
            --unit fetcher \
            --commit-sha "$ECR_IMAGE_TAG" \
            --migration-revision none \
            --contract-manifest "$SOURCE_BUNDLE_ROOT/contracts/manifest.json" \
            --image "twelve_data=$TWELVE_IMAGE_REF" \
            --image "finlab=$FINLAB_IMAGE_REF" \
            --image "shioaji=$SHIOAJI_IMAGE_REF" \
            --created-by-run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/fetcher-staging-release-manifest.json"
          python3 "$SOURCE_BUNDLE_ROOT/infra/deploy/release_manifest.py" validate \
            --repo-root "$SOURCE_BUNDLE_ROOT" \
            --unit fetcher \
            --commit-sha "$ECR_IMAGE_TAG" \
            --migration-revision none \
            --contract-manifest "$SOURCE_BUNDLE_ROOT/contracts/manifest.json" \
            --image "twelve_data=$TWELVE_IMAGE_REF" \
            --image "finlab=$FINLAB_IMAGE_REF" \
            --image "shioaji=$SHIOAJI_IMAGE_REF" \
            --created-by-run-id "$GITHUB_RUN_ID" \
            --manifest "$RUNNER_TEMP/fetcher-staging-release-manifest.json"
      - name: Upload staging release manifest
        if: ${{ steps.manifest_support.outputs.supported == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-fetcher-release-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fetcher-staging-release-manifest.json
          if-no-files-found: error
          retention-days: 30

  staging-ecr-cutover-disabled:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.deployment_target || 'staging') == 'staging' &&
      vars.STAGING_ECR_CUTOVER_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - name: Fail closed until separately authorized foundation acceptance
        run: exit 1

  build-push:
    needs: [verify, validate-target-routing, build-push-production, build-push-staging-ecr, staging-ecr-cutover-disabled]
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      twelve_image_ref: ${{ steps.release_selection.outputs.twelve_image_ref }}
      finlab_image_ref: ${{ steps.release_selection.outputs.finlab_image_ref }}
      shioaji_image_ref: ${{ steps.release_selection.outputs.shioaji_image_ref }}
    steps:
      - name: Confirm the exact target-specific image build succeeded
        id: release_selection
        shell: bash
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target || 'staging' }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          PRODUCTION_BUILD: ${{ needs.build-push-production.result }}
          STAGING_ECR_BUILD: ${{ needs.build-push-staging-ecr.result }}
          CUTOVER_DISABLED: ${{ needs.staging-ecr-cutover-disabled.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          TARGET_ROUTING_RESULT: ${{ needs.validate-target-routing.result }}
          TWELVE_IMAGE_REF: ${{ needs.build-push-staging-ecr.outputs.twelve_image_ref }}
          FINLAB_IMAGE_REF: ${{ needs.build-push-staging-ecr.outputs.finlab_image_ref }}
          SHIOAJI_IMAGE_REF: ${{ needs.build-push-staging-ecr.outputs.shioaji_image_ref }}
        run: |
          set -euo pipefail
          [ "$VERIFY_RESULT" = success ]
          [ "$TARGET_ROUTING_RESULT" = success ]
          case "$DEPLOYMENT_TARGET" in
            production)
              [ -z "$IMAGE_TAG_INPUT" ] || {
                echo "::error title=Invalid production image tag::image_tag is available only for staging ECR rollback"
                exit 1
              }
              [ "$PRODUCTION_BUILD" = success ] && [ "$STAGING_ECR_BUILD" = skipped ] && [ "$CUTOVER_DISABLED" = skipped ]
              ;;
            staging)
              if [ "$EVENT_NAME" = workflow_dispatch ]; then
                [ "$STAGING_ECR_BUILD" = success ] && [ "$PRODUCTION_BUILD" = skipped ] && [ "$CUTOVER_DISABLED" = skipped ]
                if ! [[ "$TWELVE_IMAGE_REF" =~ ^439622209937[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/findb/staging/fetcher/twelve-data@sha256:[0-9a-f]{64}$ ]] \
                  || ! [[ "$FINLAB_IMAGE_REF" =~ ^439622209937[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/findb/staging/fetcher/finlab@sha256:[0-9a-f]{64}$ ]] \
                  || ! [[ "$SHIOAJI_IMAGE_REF" =~ ^439622209937[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/findb/staging/fetcher/shioaji@sha256:[0-9a-f]{64}$ ]]; then
                  echo "::error title=Invalid Fetcher release bridge::Build outputs must contain all three exact unit-scoped ECR digests"
                  exit 1
                fi
                printf 'twelve_image_ref=%s\n' "$TWELVE_IMAGE_REF" >> "$GITHUB_OUTPUT"
                printf 'finlab_image_ref=%s\n' "$FINLAB_IMAGE_REF" >> "$GITHUB_OUTPUT"
                printf 'shioaji_image_ref=%s\n' "$SHIOAJI_IMAGE_REF" >> "$GITHUB_OUTPUT"
              else
                [ "$STAGING_ECR_BUILD" = skipped ] && [ "$PRODUCTION_BUILD" = skipped ] && [ "$CUTOVER_DISABLED" = skipped ]
              fi
              ;;
            *) exit 1 ;;
          esac

  validate-r2-bucket-configuration:
    needs: build-push
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_finlab_smoke != true &&
      needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.deployment_target || 'staging' }}-fetcher
    env:
      DEPLOYMENT_TARGET: ${{ inputs.deployment_target || 'staging' }}
      R2_RAW_BUCKET: ${{ vars.CLOUDFLARE_R2_RAW_BUCKET }}
    steps:
      - name: Fail closed on target-specific R2 bucket configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_TARGET" in
            staging|production) ;;
            *)
              echo "::error title=Invalid Fetcher deployment target::Expected staging or production"
              exit 1
              ;;
          esac
          if [ -z "$R2_RAW_BUCKET" ]; then
            echo "::error title=R2 bucket configuration missing::Fetcher raw bucket name is required"
            exit 1
          fi

  validate-fetcher-credential-isolation:
    needs: build-push
    if: >-
      always() &&
      (inputs.deployment_target || 'staging') == 'production' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_finlab_smoke != true &&
      needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.deployment_target || 'staging' }}-fetcher
    env:
      FETCHER_CALENDAR_SERVE_API_KEY: ${{ secrets.FETCHER_CALENDAR_SERVE_API_KEY }}
      FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY: ${{ secrets.FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY }}
      FETCHER_FINLAB_SOURCE_CLIENT_KEY: ${{ secrets.FETCHER_FINLAB_SOURCE_CLIENT_KEY }}
      FETCHER_SHIOAJI_SOURCE_CLIENT_KEY: ${{ secrets.FETCHER_SHIOAJI_SOURCE_CLIENT_KEY }}
    steps:
      - name: Fail closed on Fetcher credential reuse
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            FETCHER_CALENDAR_SERVE_API_KEY \
            FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY \
            FETCHER_FINLAB_SOURCE_CLIENT_KEY \
            FETCHER_SHIOAJI_SOURCE_CLIENT_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Fetcher credential configuration missing::Required credential is not configured"
              exit 1
            fi
          done
          keys=(
            "$FETCHER_CALENDAR_SERVE_API_KEY"
            "$FETCHER_TWELVE_DATA_SOURCE_CLIENT_KEY"
            "$FETCHER_FINLAB_SOURCE_CLIENT_KEY"
            "$FETCHER_SHIOAJI_SOURCE_CLIENT_KEY"
          )
          for left in "${!keys[@]}"; do
            for right in "${!keys[@]}"; do
              if [ "$left" -lt "$right" ] && [ "${keys[$left]}" = "${keys[$right]}" ]; then
                echo "::error title=Fetcher credential isolation failed::Calendar and provider Source credentials must be distinct"
                exit 1
              fi
            done
          done
          echo "Fetcher credential isolation check passed without printing credential values"

  validate-fetcher-credential-isolation-aws:
    needs: build-push
    if: >-
      always() &&
      (inputs.deployment_target || 'staging') == 'staging' &&
      vars.STAGING_ECR_CUTOVER_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_finlab_smoke != true &&
      needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.deployment_target || 'staging' }}-fetcher
    permissions:
      contents: read
    steps:
      - name: Confirm AWS consumer isolation is host-enforced
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS runtime-secret consumer isolation is enforced by the target loader catalog"

  deploy:
    needs: [build-push, validate-target-routing, validate-r2-bucket-configuration, validate-fetcher-credential-isolation, validate-fetcher-credential-isolation-aws]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_finlab_smoke != true) &&
      needs.build-push.result == 'success' &&
      needs.validate-target-routing.result == 'success' &&
      needs.validate-r2-bucket-configuration.result == 'success' &&
      (
        ((inputs.deployment_target || 'staging') == 'production' &&
          needs.validate-fetcher-credential-isolation.result == 'success' &&
          needs.validate-fetcher-credential-isolation-aws.result == 'skipped') ||
        ((inputs.deployment_target || 'staging') == 'staging' &&
          needs.validate-fetcher-credential-isolation.result == 'skipped' &&
          needs.validate-fetcher-credential-isolation-aws.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.deployment_target || 'staging' }}-fetcher

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate target-derived deployment route
        shell: bash
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target || 'staging' }}
          STAGING_ECR_CUTOVER_ENABLED: ${{ vars.STAGING_ECR_CUTOVER_ENABLED }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_TARGET" in
            production) ;;
            staging) [ "$STAGING_ECR_CUTOVER_ENABLED" = true ] ;;
            *) exit 1 ;;
          esac

      - name: Configure staging AWS credentials
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: fetcher-staging-preflight-${{ github.run_id }}

      - name: Run staging AWS and SSM preflight
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' }}
        shell: bash
        env:
          DEPLOYMENT_UNIT: fetcher
          AWS_REGION: ap-southeast-1
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_INSTANCE_PROFILE_NAME: ${{ vars.AWS_INSTANCE_PROFILE_NAME }}
          AWS_SSM_LOG_GROUP: ${{ vars.AWS_SSM_LOG_GROUP }}
          AWS_DNS_CHECK_NAME: ${{ vars.AWS_DNS_CHECK_NAME }}
          PREFLIGHT_MARKER_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-fetcher
          TWELVE_IMAGE_REF: ${{ needs.build-push.outputs.twelve_image_ref }}
          FINLAB_IMAGE_REF: ${{ needs.build-push.outputs.finlab_image_ref }}
          SHIOAJI_IMAGE_REF: ${{ needs.build-push.outputs.shioaji_image_ref }}
        run: |
          set -euo pipefail

          for name in AWS_REGION AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN AWS_INSTANCE_PROFILE_NAME AWS_SSM_LOG_GROUP AWS_DNS_CHECK_NAME TWELVE_IMAGE_REF FINLAB_IMAGE_REF SHIOAJI_IMAGE_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing staging AWS preflight variable::$name must be configured in the staging-fetcher Environment"
              exit 1
            fi
          done
          if ! [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error title=Invalid staging AWS account::AWS_ACCOUNT_ID must be a 12-digit account identifier"
            exit 1
          fi
          if ! [[ "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]] || [[ "$AWS_DEPLOY_ROLE_ARN" != "arn:aws:iam::${AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "::error title=Invalid staging deploy role::AWS_DEPLOY_ROLE_ARN must be an IAM role ARN in the expected account"
            exit 1
          fi
          if ! [[ "$AWS_INSTANCE_PROFILE_NAME" =~ ^[A-Za-z0-9+=,.@_-]+$ ]]; then
            echo "::error title=Invalid staging instance profile::AWS_INSTANCE_PROFILE_NAME must use IAM name characters without a path"
            exit 1
          fi
          if ! [[ "$AWS_SSM_LOG_GROUP" =~ ^[A-Za-z0-9_.\/#-]+$ ]] || [ "${#AWS_SSM_LOG_GROUP}" -gt 512 ]; then
            echo "::error title=Invalid staging SSM log group::AWS_SSM_LOG_GROUP contains unsupported CloudWatch Logs name characters"
            exit 1
          fi
          if ! [[ "$AWS_DNS_CHECK_NAME" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error title=Invalid staging DNS check::AWS_DNS_CHECK_NAME contains unsafe characters"
            exit 1
          fi
          if [ "${#AWS_DNS_CHECK_NAME}" -gt 253 ]; then
            echo "::error title=Invalid staging DNS check::AWS_DNS_CHECK_NAME exceeds the DNS name length limit"
            exit 1
          fi
          if ! [[ "$PREFLIGHT_MARKER_TOKEN" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Invalid preflight marker::The bounded marker token contains unsupported characters"
            exit 1
          fi
          expected_ecr_registry="439622209937.dkr.ecr.ap-southeast-1.amazonaws.com"
          if ! [[ "$TWELVE_IMAGE_REF" =~ ^439622209937[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/findb/staging/fetcher/twelve-data@sha256:[0-9a-f]{64}$ ]] \
            || ! [[ "$FINLAB_IMAGE_REF" =~ ^439622209937[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/findb/staging/fetcher/finlab@sha256:[0-9a-f]{64}$ ]] \
            || ! [[ "$SHIOAJI_IMAGE_REF" =~ ^439622209937[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/findb/staging/fetcher/shioaji@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Invalid Fetcher digest selection::SSM preflight requires all three exact unit-scoped ECR digests"
            exit 1
          fi

          caller_account="$(aws sts get-caller-identity --region "$AWS_REGION" --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --region "$AWS_REGION" --query Arn --output text)"
          if [ "$caller_account" != "$AWS_ACCOUNT_ID" ]; then
            echo "::error title=AWS account guard failed::STS account does not match AWS_ACCOUNT_ID"
            exit 1
          fi
          expected_role_name="${AWS_DEPLOY_ROLE_ARN#*:role/}"
          actual_role_name="${caller_arn#*:assumed-role/}"
          actual_role_name="${actual_role_name%/*}"
          if [ -z "$expected_role_name" ] || [ "$actual_role_name" != "$expected_role_name" ]; then
            echo "::error title=AWS role guard failed::STS identity is not the expected unit deploy role"
            exit 1
          fi
          echo "sts_identity=ok account_guard=ok role_guard=ok"

          target_ids_json="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                Name=instance-state-name,Values=running \
                Name=tag:Project,Values=findb \
                Name=tag:Environment,Values=staging \
                Name=tag:DeploymentUnit,Values=fetcher \
              --query 'Reservations[].Instances[].InstanceId' \
              --output json
          )"
          target_count="$(jq -r 'length' <<<"$target_ids_json")"
          if [ "$target_count" -ne 1 ]; then
            echo "::error title=Staging target cardinality failed::Expected exactly one running fetcher target"
            exit 1
          fi
          target_id="$(jq -r '.[0]' <<<"$target_ids_json")"
          echo "target_selector=exact-tags target_count=1"

          profile_arn="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --instance-ids "$target_id" \
              --query 'Reservations[0].Instances[0].IamInstanceProfile.Arn' \
              --output text
          )"
          profile_name="${profile_arn##*/}"
          if [ -z "$profile_arn" ] || [ "$profile_arn" = "None" ] || [ "$profile_name" != "$AWS_INSTANCE_PROFILE_NAME" ]; then
            echo "::error title=Instance profile guard failed::Target does not use the expected instance profile"
            exit 1
          fi
          ping_status="$(
            aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=${target_id}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text
          )"
          if [ "$ping_status" != "Online" ]; then
            echo "::error title=SSM target offline::Target instance is not Online in Systems Manager"
            exit 1
          fi
          echo "instance_profile=ok ssm_ping=Online"

          probe_secret_arn="arn:aws:secretsmanager:${AWS_REGION}:${AWS_ACCOUNT_ID}:secret:findb/staging/${DEPLOYMENT_UNIT}/phase1-preflight-denial-probe"
          probe_stderr="$(mktemp)"
          cleanup_probe() { rm -f -- "$probe_stderr" >/dev/null 2>&1 || true; }
          trap cleanup_probe EXIT
          if aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$probe_secret_arn" >/dev/null 2>"$probe_stderr"; then
            echo "::error title=Deploy role secret boundary failed::Secret denial probe unexpectedly succeeded"
            exit 1
          fi
          if ! grep -Fq "AccessDenied" "$probe_stderr" 2>/dev/null; then
            echo "::error title=Deploy role secret boundary failed::Secret denial probe did not return AccessDenied"
            exit 1
          fi
          echo "secret_read_denial=AccessDenied"

          printf -v expected_instance_id_q '%q' "$target_id"
          printf -v expected_instance_profile_name_q '%q' "$AWS_INSTANCE_PROFILE_NAME"
          printf -v expected_dns_name_q '%q' "$AWS_DNS_CHECK_NAME"
          printf -v expected_unit_q '%q' "$DEPLOYMENT_UNIT"
          printf -v expected_marker_token_q '%q' "$PREFLIGHT_MARKER_TOKEN"
          printf -v expected_aws_region_q '%q' "$AWS_REGION"
          printf -v expected_ecr_registry_q '%q' "$expected_ecr_registry"
          printf -v expected_twelve_image_ref_q '%q' "$TWELVE_IMAGE_REF"
          printf -v expected_finlab_image_ref_q '%q' "$FINLAB_IMAGE_REF"
          printf -v expected_shioaji_image_ref_q '%q' "$SHIOAJI_IMAGE_REF"
          host_script="$(cat <<'HOST_SCRIPT'
          set -eu

          preflight_succeeded=0
          docker_config=""
          emit_preflight_failure() {
            trap - EXIT
            case "$docker_config" in
              /run/fetcher-ecr-preflight.*) rm -rf -- "$docker_config" ;;
            esac
            if [ "$preflight_succeeded" -ne 1 ]; then
              printf 'phase1_preflight_marker=%s status=failed\n' "$expected_marker_token"
            fi
          }
          trap emit_preflight_failure EXIT

          imds_token="$(curl --silent --fail --noproxy '*' --max-time 5 -X PUT \
            -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
            http://169.254.169.254/latest/api/token 2>/dev/null)"
          imds_instance_id="$(curl --silent --fail --noproxy '*' --max-time 5 \
            -H "X-aws-ec2-metadata-token: $imds_token" \
            http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null)"
          imds_profile_arn="$(curl --silent --fail --noproxy '*' --max-time 5 \
            -H "X-aws-ec2-metadata-token: $imds_token" \
            http://169.254.169.254/latest/meta-data/iam/info 2>/dev/null | \
            sed -n 's/.*"InstanceProfileArn"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | \
            sed -n '1p')"
          imds_profile_name="${imds_profile_arn##*/}"
          if [ "$imds_instance_id" != "$expected_instance_id" ]; then
            echo "instance_id_match=failed"
            exit 1
          fi
          if [ "$imds_profile_name" != "$expected_instance_profile_name" ]; then
            echo "instance_profile_match=failed"
            exit 1
          fi
          printf 'instance_id_match=ok instance_profile_match=ok unit=%s\n' "$expected_unit"

          ssm_agent_service=""
          for candidate in \
            amazon-ssm-agent.service \
            snap.amazon-ssm-agent.amazon-ssm-agent.service
          do
            if systemctl is-active --quiet "$candidate" >/dev/null 2>&1; then
              ssm_agent_service="$candidate"
              break
            fi
          done
          if [ -z "$ssm_agent_service" ]; then
            echo "ssm_agent=inactive"
            exit 1
          fi
          printf 'ssm_agent=active service=%s\n' "$ssm_agent_service"

          docker_version="$(docker --version 2>/dev/null | cut -c1-128)"
          compose_version="$(docker compose version --short 2>/dev/null | cut -c1-128)"
          if [ -z "$docker_version" ] || [ -z "$compose_version" ]; then
            echo "docker_runtime=missing"
            exit 1
          fi
          printf 'docker=%s compose=%s\n' "$docker_version" "$compose_version"

          docker_config="$(mktemp -d /run/fetcher-ecr-preflight.XXXXXX)"
          chmod 0700 "$docker_config"
          aws ecr get-login-password --region "$expected_aws_region" | \
            docker --config "$docker_config" login \
              --username AWS --password-stdin "$expected_ecr_registry" >/dev/null
          for image_ref in \
            "$expected_twelve_image_ref" \
            "$expected_finlab_image_ref" \
            "$expected_shioaji_image_ref"
          do
            docker --config "$docker_config" pull "$image_ref" >/dev/null
            if ! docker image inspect "$image_ref" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -Fxq "$image_ref"; then
              echo "ecr_digest_inspection=failed"
              exit 1
            fi
          done
          rm -rf -- "$docker_config"
          docker_config=""
          echo "ecr_digest_pull_inspect=ok images=3"

          disk_free_percent="$(df -P / 2>/dev/null | awk 'NR == 2 { sub(/%/, "", $5); print 100 - $5 }')"
          inode_free_percent="$(df -Pi / 2>/dev/null | awk 'NR == 2 { sub(/%/, "", $5); print 100 - $5 }')"
          case "$disk_free_percent" in
            ''|*[!0-9]*)
              echo "disk_free_percent=invalid"
              exit 1
              ;;
          esac
          if [ "$disk_free_percent" -lt 15 ]; then
            echo "disk_free_percent=below-threshold"
            exit 1
          fi
          case "$inode_free_percent" in
            ''|*[!0-9]*)
              echo "inode_free_percent=invalid"
              exit 1
              ;;
          esac
          if [ "$inode_free_percent" -lt 10 ]; then
            echo "inode_free_percent=below-threshold"
            exit 1
          fi
          printf 'disk_free_percent=%s inode_free_percent=%s\n' "$disk_free_percent" "$inode_free_percent"

          time_sync="$(timedatectl show -p NTPSynchronized --value 2>/dev/null || true)"
          case "$time_sync" in
            yes|true|1) ;;
            *)
              echo "time_sync=unsynchronized"
              exit 1
              ;;
          esac
          printf 'utc_now=%s time_sync=ok\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if ! getent ahosts "$expected_dns_name" >/dev/null 2>&1; then
            echo "dns_resolution=failed"
            exit 1
          fi
          printf 'dns_resolution=ok name=%s\n' "$expected_dns_name"
          printf 'phase1_preflight_marker=%s status=success\n' "$expected_marker_token"
          preflight_succeeded=1
          HOST_SCRIPT
          )"
          host_script="expected_instance_id=${expected_instance_id_q}
          expected_instance_profile_name=${expected_instance_profile_name_q}
          expected_dns_name=${expected_dns_name_q}
          expected_unit=${expected_unit_q}
          expected_marker_token=${expected_marker_token_q}
          expected_aws_region=${expected_aws_region_q}
          expected_ecr_registry=${expected_ecr_registry_q}
          expected_twelve_image_ref=${expected_twelve_image_ref_q}
          expected_finlab_image_ref=${expected_finlab_image_ref_q}
          expected_shioaji_image_ref=${expected_shioaji_image_ref_q}
          ${host_script}"
          parameters_json="$(jq -nc --arg command "$host_script" '{commands: [$command]}')"
          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --document-name AWS-RunShellScript \
              --instance-ids "$target_id" \
              --parameters "$parameters_json" \
              --comment "Phase 1 bounded preflight (${DEPLOYMENT_UNIT})" \
              --timeout-seconds 300 \
              --max-concurrency 1 \
              --max-errors 0 \
              --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=${AWS_SSM_LOG_GROUP}" \
              --query 'Command.CommandId' \
              --output text
          )"
          if [ -z "$command_id" ] || [ "$command_id" = "None" ]; then
            echo "::error title=SSM preflight dispatch failed::No command ID was returned"
            exit 1
          fi
          success_marker="phase1_preflight_marker=${PREFLIGHT_MARKER_TOKEN} status=success"
          failure_marker="phase1_preflight_marker=${PREFLIGHT_MARKER_TOKEN} status=failed"
          marker_state="pending"
          for attempt in $(seq 1 36); do
            # Read only the marker event count from this command's stdout stream; never retrieve log text.
            failure_event_count="$(
              aws logs filter-log-events \
                --region "$AWS_REGION" \
                --log-group-name "$AWS_SSM_LOG_GROUP" \
                --log-stream-name-prefix "${command_id}/${target_id}/aws-runShellScript/stdout" \
                --filter-pattern "\"$failure_marker\"" \
                --query 'length(events)' \
                --output json 2>/dev/null
            )"
            if ! [[ "$failure_event_count" =~ ^[0-9]+$ ]]; then
              echo "::error title=Invalid SSM marker count::CloudWatch returned a non-numeric failure marker event count"
              exit 1
            fi
            if [ "$failure_event_count" -gt 0 ]; then
              echo "::error title=SSM host preflight failed::Bounded host failure marker observed; command_id=${command_id}"
              exit 1
            fi
            success_event_count="$(
              aws logs filter-log-events \
                --region "$AWS_REGION" \
                --log-group-name "$AWS_SSM_LOG_GROUP" \
                --log-stream-name-prefix "${command_id}/${target_id}/aws-runShellScript/stdout" \
                --filter-pattern "\"$success_marker\"" \
                --query 'length(events)' \
                --output json 2>/dev/null
            )"
            if ! [[ "$success_event_count" =~ ^[0-9]+$ ]]; then
              echo "::error title=Invalid SSM marker count::CloudWatch returned a non-numeric success marker event count"
              exit 1
            fi
            if [ "$success_event_count" -gt 0 ]; then
              marker_state="success"
              echo "ssm_preflight_status=Success command_id=${command_id} marker_event_count=${success_event_count}"
              break
            fi
            sleep 5
          done
          if [ "$marker_state" != "success" ]; then
            echo "::error title=SSM host preflight timed out::No bounded marker observed; command_id=${command_id}"
            exit 1
          fi

      - name: Calculate AWS runtime-secret bundle checksums
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        id: runtime_secret_checksums
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            infra/deploy/runtime-secrets/load_runtime_secrets.py \
            infra/deploy/runtime-secrets/runtime_secret_command.sh \
            infra/deploy/runtime-secrets/release_fetcher_provider.sh \
            infra/deploy/runtime-secrets/fetcher.json; do
            name="$(basename "$file" | tr '.-' '__')"
            checksum="$(sha256sum "$file" | cut -d ' ' -f1)"
            printf '%s=%s\n' "$name" "$checksum" >> "$GITHUB_OUTPUT"
          done

      - name: Prepare AWS runtime-secret directories on Fetcher EC2
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo install -d -o root -g root -m 0755 /opt/fetcher/runtime-secrets
            sudo install -d -o root -g root -m 0700 /run/findb-runtime-secrets
            sudo rm -rf -- /tmp/fetcher-runtime-secrets
            sudo install -d -o ubuntu -g ubuntu -m 0700 /tmp/fetcher-runtime-secrets

      - name: Sync AWS runtime-secret loader and exact Fetcher catalog
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          source: "infra/deploy/runtime-secrets/load_runtime_secrets.py,infra/deploy/runtime-secrets/runtime_secret_command.sh,infra/deploy/runtime-secrets/release_fetcher_provider.sh,infra/deploy/runtime-secrets/fetcher.json"
          target: /tmp/fetcher-runtime-secrets
          overwrite: true

      - name: Verify AWS runtime-secret bundle ownership, mode, and checksum
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          LOADER_SHA256: ${{ steps.runtime_secret_checksums.outputs.load_runtime_secrets_py }}
          COMMAND_SHA256: ${{ steps.runtime_secret_checksums.outputs.runtime_secret_command_sh }}
          RELEASE_SHA256: ${{ steps.runtime_secret_checksums.outputs.release_fetcher_provider_sh }}
          CATALOG_SHA256: ${{ steps.runtime_secret_checksums.outputs.fetcher_json }}
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          envs: LOADER_SHA256,COMMAND_SHA256,RELEASE_SHA256,CATALOG_SHA256
          script: |
            set -euo pipefail
            runtime_dir=/opt/fetcher/runtime-secrets
            staging_root=/tmp/fetcher-runtime-secrets/infra/deploy/runtime-secrets
            for file in load_runtime_secrets.py runtime_secret_command.sh release_fetcher_provider.sh fetcher.json; do
              if [ ! -f "$staging_root/$file" ] || [ -L "$staging_root/$file" ]; then
                echo "::error title=Runtime-secret bundle missing::${file} is not a regular staged file"
                exit 1
              fi
            done
            declare -A expected=(
              [load_runtime_secrets.py]="$LOADER_SHA256"
              [runtime_secret_command.sh]="$COMMAND_SHA256"
              [release_fetcher_provider.sh]="$RELEASE_SHA256"
              [fetcher.json]="$CATALOG_SHA256"
            )
            for file in "${!expected[@]}"; do
              actual="$(sha256sum "$staging_root/$file" | cut -d ' ' -f1)"
              if [ -z "${expected[$file]}" ] || [ "$actual" != "${expected[$file]}" ]; then
                echo "::error title=Runtime-secret bundle checksum failed::${file} does not match the checked-out artifact"
                exit 1
              fi
            done
            for file in load_runtime_secrets.py runtime_secret_command.sh release_fetcher_provider.sh fetcher.json; do
              case "$file" in
                fetcher.json) install_mode=0644; expected_mode=644 ;;
                *) install_mode=0755; expected_mode=755 ;;
              esac
              sudo install -o root -g root -m "$install_mode" "$staging_root/$file" "$runtime_dir/$file"
              if [ "$(sudo stat -c '%u:%g:%a' "$runtime_dir/$file")" != "0:0:$expected_mode" ]; then
                echo "::error title=Runtime-secret bundle metadata failed::${file} ownership or mode is unsafe"
                exit 1
              fi
              actual="$(sudo sha256sum "$runtime_dir/$file" | cut -d ' ' -f1)"
              if [ "$actual" != "${expected[$file]}" ]; then
                echo "::error title=Runtime-secret bundle install failed::${file} checksum changed during install"
                exit 1
              fi
            done
            sudo rm -rf -- /tmp/fetcher-runtime-secrets
            echo "runtime_secret_bundle=verified files=4"

      - name: Run Fetcher AWS runtime-secret canary
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          AWS_REGION: ap-southeast-1
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          envs: AWS_REGION
          script: |
            set -euo pipefail
            sudo python3 /opt/fetcher/runtime-secrets/load_runtime_secrets.py \
              --catalog /opt/fetcher/runtime-secrets/fetcher.json \
              --consumer canary \
              --region "$AWS_REGION" \
              --output /run/findb-runtime-secrets/canary/runtime.env \
              --owner 0:0 \
              --check-only

      - name: Release Twelve Data scheduler with AWS runtime secrets
        if: ${{ (inputs.deployment_target || 'staging') == 'staging' && vars.STAGING_ECR_CUTOVER_ENABLED == 'true' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          AWS_REGION: ap-southeast-1
          ECR_REGISTRY: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com
          FETCHER_IMAGE: 439622209937.dkr.ecr.ap-southeast-1.amazonaws.com/findb/staging/fetcher/twelve-data
          FETCHER_IMAGE_TAG: ${{ env.FETCHER_IMAGE_TAG }}
          FETCHER_SOURCE_API_URL: ${{ vars.FETCHER_SOURCE_API_URL }}
          FINDB_SERVE_BASE_URL: ${{ vars.FINDB_SERVE_BASE_URL }}
          FETCHER_CALENDAR_TIMEOUT_SECONDS: ${{ vars.FETCHER_CALENDAR_TIMEOUT_SECONDS || '10' }}
