                  "${provider_id} candidate failed: image={{.Config.Image}} user={{.Config.User}} status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}" \
                  "$candidate" || true
                false
              fi
              docker rename "$candidate" "$stable"
              [ "$had_previous" -eq 1 ] && docker rm "$previous" >/dev/null 2>&1 || true

              stable_running="$(docker inspect --format '{{.State.Running}}' "$stable")"
              if [ "$stable_running" != "true" ]; then
                echo "::error title=Fetcher release rejected::${provider_id} did not converge to running" >&2
                false
              fi
              trap - ERR INT TERM HUP
              echo "Fetcher ${provider_id} scheduler release reconciled to running"
            }

            runtime_env_args="\
              --env SOURCE_API_URL \
              --env SOURCE_CLIENT_KEY \
              --env FINDB_SERVE_BASE_URL \
              --env FETCHER_CALENDAR_SERVE_API_KEY \
              --env FETCHER_CALENDAR_TIMEOUT_SECONDS \
              --env FETCHER_CALENDAR_CACHE_TTL_SECONDS \
              --env TWELVE_DATA_API_KEY \
              --env TWELVE_DATA_BASE_URL \
              --env TWELVE_DATA_TIMEOUT_SECONDS \
              --env TWELVE_DATA_MAX_RESPONSE_BYTES \
              --env CLOUDFLARE_R2_ACCOUNT_ID \
              --env CLOUDFLARE_R2_RAW_BUCKET \
              --env CLOUDFLARE_R2_RAW_ACCESS_KEY_ID \
              --env CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY \
              --env CLOUDFLARE_R2_RAW_SESSION_TOKEN \
              --env CLOUDFLARE_R2_MAX_OBJECT_BYTES \
              --env FETCHER_REQUEST_TIMEOUT_SECONDS \
              --env FETCHER_SCHEDULER_CONTROL_POLL_SECONDS \
              --env FETCHER_MAX_ATTEMPTS \
              --env FETCHER_MAX_RETRY_AFTER_SECONDS \
              --env FETCHER_STATE_PATH"
            # BEGIN FETCHER TWELVE SCHEDULER RECONCILIATION
            # Provider command contracts: findb-fetch-scheduler --check and findb-fetch-scheduler --run-forever.
            reconcile_scheduler twelve "${FETCHER_IMAGE}:${FETCHER_IMAGE_TAG}" \
              /var/lib/findb-fetcher /var/lib/findb-fetcher/state.sqlite3 \
              findb-fetcher-scheduler findb-fetcher-scheduler-candidate findb-fetcher-scheduler-previous \
              findb-fetcher-scheduler-preflight - "$runtime_env_args" findb-fetch-scheduler --schedule-file /app/configs/daily_scheduler.v2.json --slot-id western_markets_window --dataset-key us_equity_eod
            # END FETCHER TWELVE SCHEDULER RECONCILIATION

      - name: Release and validate FinLab scheduler on Fetcher EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
