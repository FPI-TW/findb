              sudo mkdir -p "$state_dir" "$cache_dir"; sudo chown 10001:10001 "$state_dir" "$cache_dir"; sudo chmod 0700 "$state_dir" "$cache_dir"
              if [ "$(sudo stat -c '%u:%g:%a' "$state_dir")" != "10001:10001:700" ]; then echo "::error title=Shioaji state rejected::State ownership or mode is unsafe"; exit 1; fi
              if [ "$(sudo stat -c '%u:%g:%a' "$cache_dir")" != "10001:10001:700" ]; then echo "::error title=Shioaji cache rejected::Cache ownership or mode is unsafe"; exit 1; fi
              if [ -e "$state_path" ] && { [ ! -f "$state_path" ] || [ "$(sudo stat -c '%u:%g:%a' "$state_path")" != "10001:10001:600" ]; }; then echo "::error title=Shioaji state rejected::SQLite ownership or mode is unsafe"; exit 1; fi
              raw_bucket_marker="$state_dir/raw-bucket.sha256"
              if ! printf '%s' "$CLOUDFLARE_R2_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$' || ! printf '%s' "$CLOUDFLARE_R2_RAW_BUCKET" | grep -Eq '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'; then echo "::error title=Invalid Shioaji R2 configuration::Raw bucket configuration is unsafe" >&2; exit 1; fi
              raw_bucket_fingerprint="$(printf '%s\n%s\nshioaji' "$CLOUDFLARE_R2_ACCOUNT_ID" "$CLOUDFLARE_R2_RAW_BUCKET" | sha256sum | cut -d ' ' -f1)"
              write_raw_bucket_marker() { marker_tmp="$(sudo mktemp "$state_dir/.raw-bucket.sha256.XXXXXX")"; printf '%s\n' "$raw_bucket_fingerprint" | sudo tee "$marker_tmp" >/dev/null; sudo chown 10001:10001 "$marker_tmp"; sudo chmod 0600 "$marker_tmp"; sudo mv "$marker_tmp" "$raw_bucket_marker"; }
              validate_raw_bucket_marker_mode() { if ! sudo test -f "$raw_bucket_marker" || [ "$(sudo stat -c '%u:%g:%a' "$raw_bucket_marker")" != "10001:10001:600" ]; then echo "::error title=Shioaji state rejected::Raw bucket binding marker ownership or mode is unsafe" >&2; exit 1; fi; }
              if sudo test -e "$state_path"; then sudo test -f "$raw_bucket_marker" || { echo "::error title=Shioaji raw bucket cutover required::State has no binding marker" >&2; exit 1; }; validate_raw_bucket_marker_mode; [ "$(sudo cat "$raw_bucket_marker")" = "$raw_bucket_fingerprint" ] || { echo "::error title=Shioaji raw bucket mismatch::State belongs to a different Raw bucket" >&2; exit 1; }; elif sudo test -e "$raw_bucket_marker"; then validate_raw_bucket_marker_mode; [ "$(sudo cat "$raw_bucket_marker")" = "$raw_bucket_fingerprint" ] || write_raw_bucket_marker; else write_raw_bucket_marker; fi
              if docker container inspect "$candidate" >/dev/null 2>&1; then docker rm -f "$candidate"; fi
              if docker container inspect "$previous" >/dev/null 2>&1; then if docker container inspect "$stable" >/dev/null 2>&1; then docker rm -f "$previous"; else docker rename "$previous" "$stable"; fi; fi
              echo "Pruning unused Docker images before pulling ${provider_id}"
              docker image prune -af
              docker pull "$image"
              # Shioaji preflight is before replacing its stable container and validates the
              # manifest, credentials, and the explicit simulation=true mode.
              docker run --rm --name "$preflight_name" --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$state_dir,dst=$state_dir" --mount "type=bind,src=$cache_dir,dst=/home/fetcher" $runtime_env_args "$image" "${scheduler_command[@]}" --check
              recover_scheduler() { original_status="$1"; [ "$original_status" -eq 0 ] && original_status=1; trap - ERR INT TERM HUP; set +e; recovery_failed=0; if docker container inspect "$candidate" >/dev/null 2>&1; then docker rm -f "$candidate" >/dev/null 2>&1 || recovery_failed=1; fi; if [ "$recovery_failed" -eq 0 ] && ! docker container inspect "$stable" >/dev/null 2>&1 && docker container inspect "$previous" >/dev/null 2>&1; then docker rename "$previous" "$stable" >/dev/null 2>&1 || recovery_failed=1; fi; if [ "$recovery_failed" -eq 0 ] && docker container inspect "$stable" >/dev/null 2>&1; then docker start "$stable" >/dev/null 2>&1 || recovery_failed=1; fi; [ "$recovery_failed" -eq 0 ] || echo "::error title=Shioaji recovery failed::Rollback did not complete" >&2; exit "$original_status"; }
              trap 'recover_scheduler "$?"' ERR; trap 'recover_scheduler 130' INT; trap 'recover_scheduler 143' TERM; trap 'recover_scheduler 129' HUP
              had_previous=0; if docker container inspect "$stable" >/dev/null 2>&1; then had_previous=1; docker stop --time 30 "$stable" >/dev/null; docker rename "$stable" "$previous"; fi
              common_runtime_args=(--user 10001:10001 --restart unless-stopped --read-only --cap-drop ALL --security-opt no-new-privileges --log-opt max-size=10m --log-opt max-file=3 --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$state_dir,dst=$state_dir" --mount "type=bind,src=$cache_dir,dst=/home/fetcher")
              docker run -d --name "$candidate" "${common_runtime_args[@]}" $runtime_env_args "$image" "${scheduler_command[@]}" --run-forever >/dev/null; candidate_image="$(docker inspect --format '{{.Config.Image}}' "$candidate")"; candidate_user="$(docker inspect --format '{{.Config.User}}' "$candidate")"; healthy=0; for attempt in $(seq 1 6); do status="$(docker inspect --format '{{.State.Status}}' "$candidate")"; restarts="$(docker inspect --format '{{.RestartCount}}' "$candidate")"; if [ "$status" != "running" ] || [ "$restarts" -ne 0 ]; then break; fi; [ "$attempt" -eq 6 ] && healthy=1 && break; sleep 5; done; if [ "$candidate_image" != "$image" ] || [ "$candidate_user" != "10001:10001" ] || [ "$healthy" -ne 1 ]; then docker inspect --format "Shioaji candidate failed: image={{.Config.Image}} user={{.Config.User}} status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}" "$candidate" || true; false; fi
              candidate_running="$(docker inspect --format '{{.State.Running}}' "$candidate")"
              if [ "$candidate_running" != "true" ]; then
                echo "::error title=Shioaji release rejected::Candidate did not remain running" >&2
                false
              fi
              trap - ERR INT TERM HUP; printf '{"schema_version":1,"provider":"shioaji","commit_sha":"%s","image":"%s","status":"candidate","checks":["digest","preflight","runtime_user","restart_count","state_binding"]}\n' "${RELEASE_COMMIT_SHA:-unknown}" "$image" | sudo tee "$state_dir/target-acceptance.json" >/dev/null; sudo chown 10001:10001 "$state_dir/target-acceptance.json"; sudo chmod 0600 "$state_dir/target-acceptance.json"; echo "Shioaji scheduler candidate is running; overall promotion waits for all providers"
            }
            runtime_env_args="\
              --env SOURCE_API_URL --env SOURCE_CLIENT_KEY --env FINDB_SERVE_BASE_URL \
              --env FETCHER_CALENDAR_SERVE_API_KEY --env FETCHER_CALENDAR_TIMEOUT_SECONDS --env FETCHER_CALENDAR_CACHE_TTL_SECONDS \
              --env SHIOAJI_API_KEY --env SHIOAJI_SECRET_KEY --env SHIOAJI_SIMULATION \
              --env CLOUDFLARE_R2_ACCOUNT_ID --env CLOUDFLARE_R2_RAW_BUCKET --env CLOUDFLARE_R2_RAW_ACCESS_KEY_ID \
              --env CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY --env CLOUDFLARE_R2_RAW_SESSION_TOKEN --env CLOUDFLARE_R2_MAX_OBJECT_BYTES \
              --env FETCHER_REQUEST_TIMEOUT_SECONDS --env FETCHER_SCHEDULER_CONTROL_POLL_SECONDS --env FETCHER_MAX_ATTEMPTS --env FETCHER_MAX_RETRY_AFTER_SECONDS --env FETCHER_SHIOAJI_STATE_PATH"
            # BEGIN FETCHER SHIOAJI SCHEDULER RECONCILIATION
            # Provider command contracts: findb-fetch-shioaji-scheduler --check and findb-fetch-shioaji-scheduler --run-forever.
            reconcile_scheduler shioaji "${FETCHER_SHIOAJI_IMAGE_REFERENCE}" \
              /var/lib/findb-shioaji-fetcher /var/lib/findb-shioaji-fetcher/state.sqlite3 \
              findb-fetcher-shioaji-scheduler findb-fetcher-shioaji-scheduler-candidate findb-fetcher-shioaji-scheduler-previous \
              findb-fetcher-shioaji-scheduler-preflight "$runtime_env_args" findb-fetch-shioaji-scheduler --manifest /app/configs/shioaji_tw_pilot.v1.json
            # END FETCHER SHIOAJI SCHEDULER RECONCILIATION

      - name: Roll back incomplete Fetcher candidate
        if: ${{ failure() || cancelled() }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            set +e
            for spec in \
              'findb-fetcher-scheduler|findb-fetcher-scheduler-candidate|findb-fetcher-scheduler-previous' \
              'findb-fetcher-finlab-scheduler|findb-fetcher-finlab-scheduler-candidate|findb-fetcher-finlab-scheduler-previous' \
              'findb-fetcher-shioaji-scheduler|findb-fetcher-shioaji-scheduler-candidate|findb-fetcher-shioaji-scheduler-previous'; do
              IFS='|' read -r stable candidate previous <<< "$spec"
              if docker container inspect "$candidate" >/dev/null 2>&1; then
                docker rm -f "$candidate" >/dev/null 2>&1 || true
              fi
              if docker container inspect "$previous" >/dev/null 2>&1; then
                if docker container inspect "$stable" >/dev/null 2>&1; then
                  docker rm -f "$stable" >/dev/null 2>&1 || true
                fi
                docker rename "$previous" "$stable" >/dev/null 2>&1 || true
                docker start "$stable" >/dev/null 2>&1 || true
              fi
            done
            echo "Fetcher candidate rollback completed; accepted manifest was not changed"

      - name: Promote all Fetcher providers atomically
        if: ${{ success() }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target || 'staging' }}
          RELEASE_MANIFEST_SHA256: ${{ steps.fetcher-manifest.outputs.sha256 }}
          FETCHER_IMAGE_REFERENCE: ${{ env.FETCHER_IMAGE }}@${{ needs.build-push.outputs.fetcher_digest }}
          FETCHER_FINLAB_IMAGE_REFERENCE: ${{ env.FETCHER_FINLAB_IMAGE }}@${{ needs.build-push.outputs.finlab_digest }}
          FETCHER_SHIOAJI_IMAGE_REFERENCE: ${{ env.FETCHER_SHIOAJI_IMAGE }}@${{ needs.build-push.outputs.shioaji_digest }}
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          command_timeout: 10m
          envs: RELEASE_COMMIT_SHA,DEPLOYMENT_TARGET,RELEASE_MANIFEST_SHA256,FETCHER_IMAGE_REFERENCE,FETCHER_FINLAB_IMAGE_REFERENCE,FETCHER_SHIOAJI_IMAGE_REFERENCE
          script: |
            set -euo pipefail
            release_root=/opt/findb/release-state
            candidate_root="$release_root/candidate"
            accepted_root="$release_root/accepted"
            previous_root="$release_root/previous"
            candidate_manifest="$candidate_root/fetcher.json"
            accepted_manifest="$accepted_root/fetcher.json"
            previous_manifest="$previous_root/fetcher.json"
            restore_unverified_candidates() {
              set +e
              for spec in \
                'findb-fetcher-scheduler|findb-fetcher-scheduler-candidate|findb-fetcher-scheduler-previous' \
                'findb-fetcher-finlab-scheduler|findb-fetcher-finlab-scheduler-candidate|findb-fetcher-finlab-scheduler-previous' \
                'findb-fetcher-shioaji-scheduler|findb-fetcher-shioaji-scheduler-candidate|findb-fetcher-shioaji-scheduler-previous'; do
                IFS='|' read -r stable candidate previous <<< "$spec"
                docker rm -f "$candidate" >/dev/null 2>&1 || true
                if docker container inspect "$previous" >/dev/null 2>&1; then
                  docker rm -f "$stable" >/dev/null 2>&1 || true
                  docker rename "$previous" "$stable" >/dev/null 2>&1 || true
                  docker start "$stable" >/dev/null 2>&1 || true
                fi
              done
            }
            if [ ! -s "$candidate_manifest" ]; then
              echo "::error title=Missing Fetcher release candidate::Candidate manifest was not transferred"
              restore_unverified_candidates
              exit 1
            fi
            manifest_sha256="$(sha256sum "$candidate_manifest" | cut -d ' ' -f1)"
            if [ "$manifest_sha256" != "$RELEASE_MANIFEST_SHA256" ]; then
              echo "::error title=Fetcher manifest identity mismatch::Transferred manifest differs from the validated workflow artifact"
              restore_unverified_candidates
              exit 1
            fi
            if ! python3 - "$candidate_manifest" <<'PY'
            import json
            import os
            import re
            import sys

            with open(sys.argv[1], encoding="utf-8") as stream:
                manifest = json.load(stream)
            expected_images = {
                "generic": os.environ["FETCHER_IMAGE_REFERENCE"],
                "finlab": os.environ["FETCHER_FINLAB_IMAGE_REFERENCE"],
                "shioaji": os.environ["FETCHER_SHIOAJI_IMAGE_REFERENCE"],
            }
            actual_images = {
                label: f"{entry.get('name', '')}@{entry.get('digest', '')}"
                for label, entry in manifest.get("images", {}).items()
                if isinstance(entry, dict)
            }
            contracts = manifest.get("contract_versions")
            valid_contracts = isinstance(contracts, list) and bool(contracts) and all(
                isinstance(entry, dict)
                and set(entry) == {"path", "schema_id", "schema_version", "sha256"}
                and re.fullmatch(r"[0-9a-f]{64}", str(entry.get("sha256", "")))
                for entry in contracts
            )
            checks = (
                manifest.get("schema_version") == 1,
                manifest.get("deployment_unit") == "fetcher",
                manifest.get("deployment_target") == os.environ["DEPLOYMENT_TARGET"],
                manifest.get("commit_sha") == os.environ["RELEASE_COMMIT_SHA"],
                actual_images == expected_images,
                bool(re.fullmatch(r"[0-9a-f]{12}", str(manifest.get("migration_revision", "")))),
                valid_contracts,
                bool(re.fullmatch(r"[0-9a-f]{64}", str(manifest.get("deployment_bundle_sha256", "")))),
                bool(str(manifest.get("created_by_run_id", "")).strip()),
            )
            if not all(checks):
                raise SystemExit("Fetcher target rejected release manifest contract")
            PY
            then
              restore_unverified_candidates
              exit 1
            fi
            provider_specs=(
              'twelve|/var/lib/findb-fetcher|findb-fetcher-scheduler|findb-fetcher-scheduler-candidate|findb-fetcher-scheduler-previous'
              'finlab|/var/lib/findb-finlab-fetcher|findb-fetcher-finlab-scheduler|findb-fetcher-finlab-scheduler-candidate|findb-fetcher-finlab-scheduler-previous'
              'shioaji|/var/lib/findb-shioaji-fetcher|findb-fetcher-shioaji-scheduler|findb-fetcher-shioaji-scheduler-candidate|findb-fetcher-shioaji-scheduler-previous'
            )
            promoted_stables=()
            was_promoted() {
              sought="$1"
              for promoted in "${promoted_stables[@]-}"; do
                [ "$promoted" = "$sought" ] && return 0
              done
              return 1
            }
            rollback_all() {
              set +e
              for spec in "${provider_specs[@]}"; do
                IFS='|' read -r provider state_dir stable candidate previous <<< "$spec"
                if docker container inspect "$candidate" >/dev/null 2>&1; then
                  docker rm -f "$candidate" >/dev/null 2>&1 || true
                fi
                if docker container inspect "$previous" >/dev/null 2>&1; then
                  if docker container inspect "$stable" >/dev/null 2>&1; then
                    docker rm -f "$stable" >/dev/null 2>&1 || true
                  fi
                  docker rename "$previous" "$stable" >/dev/null 2>&1 || true
                  docker start "$stable" >/dev/null 2>&1 || true
                elif was_promoted "$stable" && docker container inspect "$stable" >/dev/null 2>&1; then
                  docker rm -f "$stable" >/dev/null 2>&1 || true
                fi
              done
            }
            metadata_swap_started=0
            metadata_promoted=0
            accepted_manifest_present=0
            accepted_evidence_present=0
            [ -f "$accepted_manifest" ] && accepted_manifest_present=1
            [ -f "$accepted_root/target-acceptance.json" ] && accepted_evidence_present=1
            restore_previous_metadata() {
              set +e
              if [ "$accepted_manifest_present" -eq 1 ] && [ -f "$previous_manifest" ]; then
                install -m 0600 "$previous_manifest" "$accepted_manifest.restore"
                mv -f "$accepted_manifest.restore" "$accepted_manifest"
              elif [ "$accepted_manifest_present" -eq 0 ] && [ -f "$accepted_manifest" ]; then
                rm -f "$accepted_manifest"
              fi
              if [ "$accepted_evidence_present" -eq 1 ] && [ -f "$previous_root/target-acceptance.json" ]; then
                install -m 0600 "$previous_root/target-acceptance.json" "$accepted_root/target-acceptance.json.restore"
                mv -f "$accepted_root/target-acceptance.json.restore" "$accepted_root/target-acceptance.json"
              elif [ "$accepted_evidence_present" -eq 0 ] && [ -f "$accepted_root/target-acceptance.json" ]; then
                rm -f "$accepted_root/target-acceptance.json"
              fi
              rm -f "$accepted_manifest.next" "$accepted_root/target-acceptance.json.next"
            }
            for spec in "${provider_specs[@]}"; do
              IFS='|' read -r provider state_dir stable candidate previous <<< "$spec"
              marker="$state_dir/target-acceptance.json"
              if ! sudo test -s "$marker" \
                || ! sudo grep -Fq '"status":"candidate"' "$marker" \
                || ! sudo grep -Fq "\"commit_sha\":\"${RELEASE_COMMIT_SHA}\"" "$marker" \
                || ! docker container inspect "$candidate" >/dev/null 2>&1 \
                || [ "$(docker inspect --format '{{.State.Running}}' "$candidate")" != "true" ]; then
                echo "::error title=Fetcher provider acceptance incomplete::${provider} candidate is not ready for promotion"
                rollback_all
                exit 1
              fi
            done
            handle_promotion_failure() {
              status="$?"
              trap - ERR INT TERM HUP
              if [ "$metadata_promoted" -eq 0 ]; then
                rollback_all
                if [ "$metadata_swap_started" -eq 1 ]; then
                  restore_previous_metadata
                fi
              fi
              exit "$status"
            }
            trap handle_promotion_failure ERR INT TERM HUP
            for spec in "${provider_specs[@]}"; do
              IFS='|' read -r provider state_dir stable candidate previous <<< "$spec"
              docker rename "$candidate" "$stable"
              promoted_stables+=("$stable")
            done
            printf '{"schema_version":1,"deployment_target":"%s","deployment_unit":"fetcher","commit_sha":"%s","manifest_sha256":"%s","status":"accepted","providers":["twelve","finlab","shioaji"],"checks":["manifest_identity","all_provider_candidates","digest","preflight","runtime_user","restart_count","state_binding"]}\n' \
              "$DEPLOYMENT_TARGET" "$RELEASE_COMMIT_SHA" "$manifest_sha256" > "$candidate_root/target-acceptance.json.next"
            chmod 0600 "$candidate_root/target-acceptance.json.next"
            mv -f "$candidate_root/target-acceptance.json.next" "$candidate_root/target-acceptance.json"
            install -m 0600 "$candidate_manifest" "$accepted_manifest.next"
            install -m 0600 "$candidate_root/target-acceptance.json" "$accepted_root/target-acceptance.json.next"
            if [ -f "$accepted_manifest" ]; then
              install -m 0600 "$accepted_manifest" "$previous_manifest.next"
              mv -f "$previous_manifest.next" "$previous_manifest"
            fi
            if [ -f "$accepted_root/target-acceptance.json" ]; then
              install -m 0600 "$accepted_root/target-acceptance.json" "$previous_root/target-acceptance.json.next"
              mv -f "$previous_root/target-acceptance.json.next" "$previous_root/target-acceptance.json"
            fi
            metadata_swap_started=1
            mv -f "$accepted_root/target-acceptance.json.next" "$accepted_root/target-acceptance.json"
            mv -f "$accepted_manifest.next" "$accepted_manifest"
            metadata_promoted=1
            trap - ERR INT TERM HUP
            for spec in "${provider_specs[@]}"; do
              IFS='|' read -r provider state_dir stable candidate previous <<< "$spec"
              docker rm "$previous" >/dev/null 2>&1 || true
            done
            echo "All Fetcher provider candidates accepted; previous manifest preserved at ${previous_manifest} when present"

  finlab-acquisition-smoke:
    needs: [build-push, validate-release-manifest]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_finlab_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job is intentionally staging-only, regardless of the regular deploy input.
    environment: staging-fetcher

    permissions:
      contents: read
      packages: read

    steps:
      - name: Run bounded FinLab acquisition smoke on Fetcher staging EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FETCHER_FINLAB_IMAGE_REFERENCE: ${{ env.FETCHER_FINLAB_IMAGE }}@${{ needs.build-push.outputs.finlab_digest }}
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
          FINLAB_SMOKE_TARGET_DATE: ${{ inputs.finlab_target_date }}
          FINLAB_SMOKE_SYMBOLS: ${{ inputs.finlab_symbols }}
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,FETCHER_FINLAB_IMAGE_REFERENCE,FINLAB_API_TOKEN,FINLAB_SMOKE_TARGET_DATE,FINLAB_SMOKE_SYMBOLS
          script: |
            set -euo pipefail

            if [ -z "${FINLAB_API_TOKEN:-}" ]; then
              echo "::error title=FinLab smoke configuration missing::FINLAB_API_TOKEN is not configured"
              exit 1
            fi
            if [ -z "${FINLAB_SMOKE_TARGET_DATE:-}" ]; then
              echo "::error title=FinLab smoke arguments missing::An explicit ISO target date is required"
              exit 1
            fi

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            image="${FETCHER_FINLAB_IMAGE_REFERENCE}"
            echo "Pruning unused Docker images before pulling FinLab smoke image"
            docker image prune -af
            docker pull "$image"

            cache_dir=/var/lib/findb-finlab-smoke-cache
            sudo mkdir -p "$cache_dir"
            sudo chown 10001:10001 "$cache_dir"
            sudo chmod 0700 "$cache_dir"
            if [ "$(stat -c '%u:%g:%a' "$cache_dir")" != "10001:10001:700" ]; then
              echo "::error title=FinLab smoke cache rejected::Provider cache ownership or mode is unsafe"
              exit 1
            fi

            # This container receives only the provider token.  It has no Source,
            # R2, scheduler, or durable Fetcher state credential/mount.
            docker run --rm \
              --name findb-finlab-acquisition-smoke \
              --user 10001:10001 \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --mount "type=bind,src=$cache_dir,dst=/home/fetcher" \
              --env FINLAB_API_TOKEN \
              "$image" \
              findb-fetch-finlab-smoke \
              --target-date "$FINLAB_SMOKE_TARGET_DATE" \
              --symbols "$FINLAB_SMOKE_SYMBOLS"
