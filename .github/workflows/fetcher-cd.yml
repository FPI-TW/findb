              # manifest, credentials, and the explicit simulation=false mode.
              docker run --rm --name "$preflight_name" --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$state_dir,dst=$state_dir" $runtime_env_args "$image" "${scheduler_command[@]}" --check
              recover_scheduler() { original_status="$1"; [ "$original_status" -eq 0 ] && original_status=1; trap - ERR INT TERM HUP; set +e; recovery_failed=0; if docker container inspect "$candidate" >/dev/null 2>&1; then docker rm -f "$candidate" >/dev/null 2>&1 || recovery_failed=1; fi; if [ "$recovery_failed" -eq 0 ] && ! docker container inspect "$stable" >/dev/null 2>&1 && docker container inspect "$previous" >/dev/null 2>&1; then docker rename "$previous" "$stable" >/dev/null 2>&1 || recovery_failed=1; fi; if [ "$recovery_failed" -eq 0 ] && docker container inspect "$stable" >/dev/null 2>&1; then if [ "$desired_state" = "running" ]; then docker start "$stable" >/dev/null 2>&1 || recovery_failed=1; else docker stop --time 30 "$stable" >/dev/null 2>&1 || recovery_failed=1; fi; fi; [ "$recovery_failed" -eq 0 ] || echo "::error title=Shioaji recovery failed::Rollback did not complete" >&2; exit "$original_status"; }
              trap 'recover_scheduler "$?"' ERR; trap 'recover_scheduler 130' INT; trap 'recover_scheduler 143' TERM; trap 'recover_scheduler 129' HUP
              had_previous=0; if docker container inspect "$stable" >/dev/null 2>&1; then had_previous=1; docker stop --time 30 "$stable" >/dev/null; docker rename "$stable" "$previous"; fi
              common_runtime_args=(--user 10001:10001 --restart unless-stopped --read-only --cap-drop ALL --security-opt no-new-privileges --log-opt max-size=10m --log-opt max-file=3 --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$state_dir,dst=$state_dir")
              if [ "$desired_state" = "stopped" ]; then docker create --name "$candidate" "${common_runtime_args[@]}" $runtime_env_args "$image" "${scheduler_command[@]}" --run-forever >/dev/null; [ "$(docker inspect --format '{{.Config.Image}}' "$candidate")" = "$image" ] || false; [ "$(docker inspect --format '{{.State.Running}}' "$candidate")" = "false" ] || false; [ "$(docker inspect --format '{{.Config.User}}' "$candidate")" = "10001:10001" ] || false; else docker run -d --name "$candidate" "${common_runtime_args[@]}" $runtime_env_args "$image" "${scheduler_command[@]}" --run-forever >/dev/null; healthy=0; for attempt in $(seq 1 6); do status="$(docker inspect --format '{{.State.Status}}' "$candidate")"; restarts="$(docker inspect --format '{{.RestartCount}}' "$candidate")"; if [ "$status" != "running" ] || [ "$restarts" -ne 0 ]; then break; fi; [ "$attempt" -eq 6 ] && healthy=1 && break; sleep 5; done; [ "$healthy" -eq 1 ] || { docker inspect --format "Shioaji candidate failed: status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}" "$candidate" || true; false; }; fi
              docker rename "$candidate" "$stable"; [ "$had_previous" -eq 1 ] && docker rm "$previous" >/dev/null 2>&1 || true; stable_running="$(docker inspect --format '{{.State.Running}}' "$stable")"
              if [ "$desired_state" = "running" ] && [ "$stable_running" != "true" ]; then
                echo "::error title=Shioaji running release rejected::Scheduler did not converge to running" >&2
                false
              fi
              if [ "$desired_state" = "stopped" ] && [ "$stable_running" != "false" ]; then
                echo "::error title=Shioaji stopped release rejected::Scheduler did not converge to stopped" >&2
                false
              fi
              trap - ERR INT TERM HUP; echo "Shioaji scheduler release reconciled to ${desired_state}"
            }
            runtime_env_args="\
              --env SOURCE_API_URL --env SOURCE_CLIENT_KEY --env FINDB_SERVE_BASE_URL \
              --env FETCHER_CALENDAR_SERVE_API_KEY --env FETCHER_CALENDAR_TIMEOUT_SECONDS --env FETCHER_CALENDAR_CACHE_TTL_SECONDS \
              --env SHIOAJI_API_KEY --env SHIOAJI_SECRET_KEY --env SHIOAJI_SIMULATION \
              --env CLOUDFLARE_R2_ACCOUNT_ID --env CLOUDFLARE_R2_RAW_BUCKET --env CLOUDFLARE_R2_RAW_ACCESS_KEY_ID \
              --env CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY --env CLOUDFLARE_R2_RAW_SESSION_TOKEN --env CLOUDFLARE_R2_MAX_OBJECT_BYTES \
              --env FETCHER_REQUEST_TIMEOUT_SECONDS --env FETCHER_MAX_ATTEMPTS --env FETCHER_MAX_RETRY_AFTER_SECONDS --env FETCHER_SHIOAJI_STATE_PATH"
            # BEGIN FETCHER SHIOAJI SCHEDULER RECONCILIATION
            # Provider command contracts: findb-fetch-shioaji-scheduler --check and findb-fetch-shioaji-scheduler --run-forever.
            reconcile_scheduler shioaji "${FETCHER_SHIOAJI_SCHEDULER_DESIRED_STATE}" "${FETCHER_SHIOAJI_IMAGE}:${FETCHER_IMAGE_TAG}" \
              /var/lib/findb-shioaji-fetcher /var/lib/findb-shioaji-fetcher/state.sqlite3 \
              findb-fetcher-shioaji-scheduler findb-fetcher-shioaji-scheduler-candidate findb-fetcher-shioaji-scheduler-previous \
              findb-fetcher-shioaji-scheduler-preflight "$runtime_env_args" findb-fetch-shioaji-scheduler --manifest /app/configs/shioaji_tw_pilot.v1.json
            # END FETCHER SHIOAJI SCHEDULER RECONCILIATION

  finlab-acquisition-smoke:
    needs: build-push
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_finlab_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job is intentionally staging-only, regardless of the regular deploy input.
    environment: staging-fetcher

    permissions:
      contents: read
      packages: read

    steps:
      - name: Run bounded FinLab acquisition smoke on Fetcher staging EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FETCHER_FINLAB_IMAGE: ${{ env.FETCHER_FINLAB_IMAGE }}
          FETCHER_IMAGE_TAG: ${{ env.FETCHER_IMAGE_TAG }}
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
          FINLAB_SMOKE_TARGET_DATE: ${{ inputs.finlab_target_date }}
          FINLAB_SMOKE_SYMBOLS: ${{ inputs.finlab_symbols }}
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,FETCHER_FINLAB_IMAGE,FETCHER_IMAGE_TAG,FINLAB_API_TOKEN,FINLAB_SMOKE_TARGET_DATE,FINLAB_SMOKE_SYMBOLS
          script: |
            set -euo pipefail

            if [ -z "${FINLAB_API_TOKEN:-}" ]; then
              echo "::error title=FinLab smoke configuration missing::FINLAB_API_TOKEN is not configured"
              exit 1
            fi
            if [ -z "${FINLAB_SMOKE_TARGET_DATE:-}" ]; then
              echo "::error title=FinLab smoke arguments missing::An explicit ISO target date is required"
              exit 1
            fi

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            image="${FETCHER_FINLAB_IMAGE}:${FETCHER_IMAGE_TAG}"
            docker pull "$image"

            cache_dir=/var/lib/findb-finlab-smoke-cache
            sudo mkdir -p "$cache_dir"
            sudo chown 10001:10001 "$cache_dir"
            sudo chmod 0700 "$cache_dir"
            if [ "$(stat -c '%u:%g:%a' "$cache_dir")" != "10001:10001:700" ]; then
              echo "::error title=FinLab smoke cache rejected::Provider cache ownership or mode is unsafe"
              exit 1
            fi

            # This container receives only the provider token.  It has no Source,
            # R2, scheduler, or durable Fetcher state credential/mount.
            docker run --rm \
              --name findb-finlab-acquisition-smoke \
              --user 10001:10001 \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --mount "type=bind,src=$cache_dir,dst=/home/fetcher" \
              --env FINLAB_API_TOKEN \
              "$image" \
              findb-fetch-finlab-smoke \
              --target-date "$FINLAB_SMOKE_TARGET_DATE" \
              --symbols "$FINLAB_SMOKE_SYMBOLS"
