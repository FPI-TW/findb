          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,RELEASE_COMMIT_SHA,FETCHER_FINLAB_IMAGE_REFERENCE,FETCHER_SOURCE_API_URL,FINDB_SERVE_BASE_URL,FETCHER_CALENDAR_SERVE_API_KEY,FETCHER_CALENDAR_TIMEOUT_SECONDS,FETCHER_CALENDAR_CACHE_TTL_SECONDS,FETCHER_FINLAB_SOURCE_CLIENT_KEY,FINLAB_API_TOKEN,CLOUDFLARE_R2_ACCOUNT_ID,CLOUDFLARE_R2_RAW_BUCKET,CLOUDFLARE_R2_RAW_ACCESS_KEY_ID,CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY,CLOUDFLARE_R2_RAW_SESSION_TOKEN,CLOUDFLARE_R2_MAX_OBJECT_BYTES,FETCHER_REQUEST_TIMEOUT_SECONDS,FETCHER_SCHEDULER_CONTROL_POLL_SECONDS,FETCHER_MAX_ATTEMPTS,FETCHER_MAX_RETRY_AFTER_SECONDS
          script: |
            set -euo pipefail
            require_runtime_value() {
              if [ -z "$2" ]; then
                echo "::error title=Missing FinLab Fetcher configuration::Required runtime setting is not configured"
                exit 1
              fi
            }
            require_runtime_value source_api_url "${FETCHER_SOURCE_API_URL:-}"
            require_runtime_value finlab_source_client_key "${FETCHER_FINLAB_SOURCE_CLIENT_KEY:-}"
            require_runtime_value finlab_api_token "${FINLAB_API_TOKEN:-}"
            require_runtime_value r2_account_id "${CLOUDFLARE_R2_ACCOUNT_ID:-}"
            require_runtime_value r2_raw_bucket "${CLOUDFLARE_R2_RAW_BUCKET:-}"
            require_runtime_value r2_raw_access_key_id "${CLOUDFLARE_R2_RAW_ACCESS_KEY_ID:-}"
            require_runtime_value r2_raw_secret_access_key "${CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY:-}"
            require_runtime_value serve_base_url "${FINDB_SERVE_BASE_URL:-}"
            require_runtime_value calendar_serve_api_key "${FETCHER_CALENDAR_SERVE_API_KEY:-}"
            for source_key in "$FETCHER_FINLAB_SOURCE_CLIENT_KEY"; do
              if [ "$source_key" = "$FETCHER_CALENDAR_SERVE_API_KEY" ]; then
                echo "::error title=Fetcher credential isolation failed::FinLab Source and calendar credentials must be different"
                exit 1
              fi
            done
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            export SOURCE_API_URL="$FETCHER_SOURCE_API_URL"
            export SOURCE_CLIENT_KEY="$FETCHER_FINLAB_SOURCE_CLIENT_KEY"
            export FETCHER_STATE_PATH=/var/lib/findb-finlab-fetcher/state.sqlite3
            export FINLAB_API_TOKEN
            test -s /opt/findb/release-state/candidate/fetcher.json

            reconcile_scheduler() {
              provider_id="$1"; image="$2"; state_dir="$3"; state_path="$4"
              stable="$5"; candidate="$6"; previous="$7"; preflight_name="$8"; cache_dir="${9}"
              runtime_env_args="${10}"; shift 10; scheduler_command=("$@")
              sudo mkdir -p "$state_dir" "$cache_dir"
              sudo chown 10001:10001 "$state_dir" "$cache_dir"
              sudo chmod 0700 "$state_dir" "$cache_dir"
              if [ "$(sudo stat -c '%u:%g:%a' "$state_dir")" != "10001:10001:700" ] || [ "$(sudo stat -c '%u:%g:%a' "$cache_dir")" != "10001:10001:700" ]; then
                echo "::error title=FinLab state rejected::State or cache ownership/mode is unsafe"; exit 1
              fi
              if [ -e "$state_path" ] && { [ ! -f "$state_path" ] || [ "$(sudo stat -c '%u:%g:%a' "$state_path")" != "10001:10001:600" ]; }; then
                echo "::error title=FinLab state rejected::SQLite ownership or mode is unsafe"; exit 1
              fi
              raw_bucket_marker="$state_dir/raw-bucket.sha256"
              if ! printf '%s' "$CLOUDFLARE_R2_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$' || ! printf '%s' "$CLOUDFLARE_R2_RAW_BUCKET" | grep -Eq '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'; then
                echo "::error title=Invalid FinLab R2 configuration::Raw bucket configuration is unsafe" >&2; exit 1
              fi
              raw_bucket_fingerprint="$(printf '%s\n%s\nfinlab' "$CLOUDFLARE_R2_ACCOUNT_ID" "$CLOUDFLARE_R2_RAW_BUCKET" | sha256sum | cut -d ' ' -f1)"
              write_raw_bucket_marker() {
                marker_tmp="$(sudo mktemp "$state_dir/.raw-bucket.sha256.XXXXXX")"
                printf '%s\n' "$raw_bucket_fingerprint" | sudo tee "$marker_tmp" >/dev/null
                sudo chown 10001:10001 "$marker_tmp"; sudo chmod 0600 "$marker_tmp"; sudo mv "$marker_tmp" "$raw_bucket_marker"
              }
              validate_raw_bucket_marker_mode() {
                if ! sudo test -f "$raw_bucket_marker" || [ "$(sudo stat -c '%u:%g:%a' "$raw_bucket_marker")" != "10001:10001:600" ]; then
                  echo "::error title=FinLab state rejected::Raw bucket binding marker ownership or mode is unsafe" >&2; exit 1
                fi
              }
              if sudo test -e "$state_path"; then
                sudo test -f "$raw_bucket_marker" || { echo "::error title=FinLab raw bucket cutover required::State has no binding marker" >&2; exit 1; }
                validate_raw_bucket_marker_mode
                [ "$(sudo cat "$raw_bucket_marker")" = "$raw_bucket_fingerprint" ] || { echo "::error title=FinLab raw bucket mismatch::State belongs to a different Raw bucket" >&2; exit 1; }
              elif sudo test -e "$raw_bucket_marker"; then
                validate_raw_bucket_marker_mode
                [ "$(sudo cat "$raw_bucket_marker")" = "$raw_bucket_fingerprint" ] || write_raw_bucket_marker
              else
                write_raw_bucket_marker
              fi
              if docker container inspect "$candidate" >/dev/null 2>&1; then
                docker rm -f "$candidate"
              fi
              if docker container inspect "$previous" >/dev/null 2>&1; then
                if docker container inspect "$stable" >/dev/null 2>&1; then docker rm -f "$previous"; else docker rename "$previous" "$stable"; fi
              fi
              echo "Pruning unused Docker images before pulling ${provider_id}"
              docker image prune -af
              docker pull "$image"
              runtime_mounts="--mount type=bind,src=$state_dir,dst=$state_dir --mount type=bind,src=$cache_dir,dst=/home/fetcher"
              # FinLab preflight happens before replacing its stable container.
              docker run --rm --name "$preflight_name" --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m $runtime_mounts $runtime_env_args "$image" "${scheduler_command[@]}" --check
              recover_scheduler() {
                original_status="$1"; [ "$original_status" -eq 0 ] && original_status=1; trap - ERR INT TERM HUP; set +e; recovery_failed=0
                if docker container inspect "$candidate" >/dev/null 2>&1; then docker rm -f "$candidate" >/dev/null 2>&1 || recovery_failed=1; fi
                if ! docker container inspect "$stable" >/dev/null 2>&1 && docker container inspect "$previous" >/dev/null 2>&1; then docker rename "$previous" "$stable" >/dev/null 2>&1 || recovery_failed=1; fi
                if [ "$recovery_failed" -eq 0 ] && docker container inspect "$stable" >/dev/null 2>&1; then
                  docker start "$stable" >/dev/null 2>&1 || recovery_failed=1
                fi
                [ "$recovery_failed" -eq 0 ] || echo "::error title=FinLab recovery failed::Rollback did not complete" >&2
                exit "$original_status"
              }
              trap 'recover_scheduler "$?"' ERR; trap 'recover_scheduler 130' INT; trap 'recover_scheduler 143' TERM; trap 'recover_scheduler 129' HUP
              had_previous=0
              if docker container inspect "$stable" >/dev/null 2>&1; then had_previous=1; docker stop --time 30 "$stable" >/dev/null; docker rename "$stable" "$previous"; fi
              common_runtime_args=(--user 10001:10001 --restart unless-stopped --read-only --cap-drop ALL --security-opt no-new-privileges --log-opt max-size=10m --log-opt max-file=3 --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$state_dir,dst=$state_dir" --mount "type=bind,src=$cache_dir,dst=/home/fetcher")
              docker run -d --name "$candidate" "${common_runtime_args[@]}" $runtime_env_args "$image" "${scheduler_command[@]}" --run-forever >/dev/null
              candidate_image="$(docker inspect --format '{{.Config.Image}}' "$candidate")"
              candidate_user="$(docker inspect --format '{{.Config.User}}' "$candidate")"
              healthy=0
              for attempt in $(seq 1 6); do status="$(docker inspect --format '{{.State.Status}}' "$candidate")"; restarts="$(docker inspect --format '{{.RestartCount}}' "$candidate")"; if [ "$status" != "running" ] || [ "$restarts" -ne 0 ]; then break; fi; [ "$attempt" -eq 6 ] && healthy=1 && break; sleep 5; done
              if [ "$candidate_image" != "$image" ] || [ "$candidate_user" != "10001:10001" ] || [ "$healthy" -ne 1 ]; then
                docker inspect --format "FinLab candidate failed: image={{.Config.Image}} user={{.Config.User}} status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}" "$candidate" || true
                false
              fi
              candidate_running="$(docker inspect --format '{{.State.Running}}' "$candidate")"
              if [ "$candidate_running" != "true" ]; then
                echo "::error title=FinLab release rejected::Candidate did not remain running" >&2
                false
