              docker run -d --name "$candidate" "${common_runtime_args[@]}" $runtime_env_args "$image" "${scheduler_command[@]}" --run-forever >/dev/null
              candidate_image="$(docker inspect --format '{{.Config.Image}}' "$candidate")"
              candidate_user="$(docker inspect --format '{{.Config.User}}' "$candidate")"
              healthy=0
              for attempt in $(seq 1 6); do status="$(docker inspect --format '{{.State.Status}}' "$candidate")"; restarts="$(docker inspect --format '{{.RestartCount}}' "$candidate")"; if [ "$status" != "running" ] || [ "$restarts" -ne 0 ]; then break; fi; [ "$attempt" -eq 6 ] && healthy=1 && break; sleep 5; done
              if [ "$candidate_image" != "$image" ] || [ "$candidate_user" != "10001:10001" ] || [ "$healthy" -ne 1 ]; then
                docker inspect --format "FinLab candidate failed: image={{.Config.Image}} user={{.Config.User}} status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}" "$candidate" || true
                false
              fi
              docker rename "$candidate" "$stable"; [ "$had_previous" -eq 1 ] && docker rm "$previous" >/dev/null 2>&1 || true
              stable_running="$(docker inspect --format '{{.State.Running}}' "$stable")"
              if [ "$stable_running" != "true" ]; then
                echo "::error title=FinLab release rejected::Scheduler did not converge to running" >&2
                false
              fi
              trap - ERR INT TERM HUP
              echo "FinLab scheduler release reconciled to running"
            }
            runtime_env_args="\
              --env SOURCE_API_URL --env SOURCE_CLIENT_KEY --env FINDB_SERVE_BASE_URL \
              --env FETCHER_CALENDAR_SERVE_API_KEY --env FETCHER_CALENDAR_TIMEOUT_SECONDS --env FETCHER_CALENDAR_CACHE_TTL_SECONDS \
              --env FINLAB_API_TOKEN --env CLOUDFLARE_R2_ACCOUNT_ID --env CLOUDFLARE_R2_RAW_BUCKET \
              --env CLOUDFLARE_R2_RAW_ACCESS_KEY_ID --env CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY --env CLOUDFLARE_R2_RAW_SESSION_TOKEN \
              --env CLOUDFLARE_R2_MAX_OBJECT_BYTES --env FETCHER_REQUEST_TIMEOUT_SECONDS --env FETCHER_SCHEDULER_CONTROL_POLL_SECONDS --env FETCHER_MAX_ATTEMPTS \
              --env FETCHER_MAX_RETRY_AFTER_SECONDS --env FETCHER_STATE_PATH"
            # BEGIN FETCHER FINLAB SCHEDULER RECONCILIATION
            # Provider command contracts: findb-fetch-finlab-scheduler --check and findb-fetch-finlab-scheduler --run-forever.
            reconcile_scheduler finlab "${FETCHER_FINLAB_IMAGE}:${FETCHER_IMAGE_TAG}" \
              /var/lib/findb-finlab-fetcher /var/lib/findb-finlab-fetcher/state.sqlite3 \
              findb-fetcher-finlab-scheduler findb-fetcher-finlab-scheduler-candidate findb-fetcher-finlab-scheduler-previous \
              findb-fetcher-finlab-scheduler-preflight /var/lib/findb-finlab-fetcher/cache "$runtime_env_args" \
              findb-fetch-finlab-scheduler --schedule-file /app/configs/daily_scheduler.v2.json --slot-id taiwan_market_window --dataset-key tw_equity_eod
            # END FETCHER FINLAB SCHEDULER RECONCILIATION

      - name: Release and validate Shioaji scheduler on Fetcher EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FETCHER_SHIOAJI_IMAGE: ${{ env.FETCHER_SHIOAJI_IMAGE }}
          FETCHER_IMAGE_TAG: ${{ env.FETCHER_IMAGE_TAG }}
          FETCHER_SOURCE_API_URL: ${{ vars.FETCHER_SOURCE_API_URL }}
          FINDB_SERVE_BASE_URL: ${{ vars.FINDB_SERVE_BASE_URL }}
          FETCHER_CALENDAR_SERVE_API_KEY: ${{ secrets.FETCHER_CALENDAR_SERVE_API_KEY }}
          FETCHER_CALENDAR_TIMEOUT_SECONDS: ${{ vars.FETCHER_CALENDAR_TIMEOUT_SECONDS || '10' }}
          FETCHER_CALENDAR_CACHE_TTL_SECONDS: ${{ vars.FETCHER_CALENDAR_CACHE_TTL_SECONDS || '300' }}
          FETCHER_SHIOAJI_SOURCE_CLIENT_KEY: ${{ secrets.FETCHER_SHIOAJI_SOURCE_CLIENT_KEY }}
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          SHIOAJI_SIMULATION: ${{ vars.SHIOAJI_SIMULATION || 'true' }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_RAW_BUCKET: ${{ vars.CLOUDFLARE_R2_RAW_BUCKET }}
          CLOUDFLARE_R2_RAW_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RAW_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_RAW_SESSION_TOKEN: ${{ secrets.CLOUDFLARE_R2_RAW_SESSION_TOKEN }}
          CLOUDFLARE_R2_MAX_OBJECT_BYTES: ${{ vars.CLOUDFLARE_R2_MAX_OBJECT_BYTES || '8388608' }}
          FETCHER_REQUEST_TIMEOUT_SECONDS: ${{ vars.FETCHER_REQUEST_TIMEOUT_SECONDS || '30' }}
          FETCHER_SCHEDULER_CONTROL_POLL_SECONDS: ${{ vars.FETCHER_SCHEDULER_CONTROL_POLL_SECONDS || '30' }}
          FETCHER_MAX_ATTEMPTS: ${{ vars.FETCHER_MAX_ATTEMPTS || '3' }}
          FETCHER_MAX_RETRY_AFTER_SECONDS: ${{ vars.FETCHER_MAX_RETRY_AFTER_SECONDS || '30' }}
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,FETCHER_SHIOAJI_IMAGE,FETCHER_IMAGE_TAG,FETCHER_SOURCE_API_URL,FINDB_SERVE_BASE_URL,FETCHER_CALENDAR_SERVE_API_KEY,FETCHER_CALENDAR_TIMEOUT_SECONDS,FETCHER_CALENDAR_CACHE_TTL_SECONDS,FETCHER_SHIOAJI_SOURCE_CLIENT_KEY,SHIOAJI_API_KEY,SHIOAJI_SECRET_KEY,SHIOAJI_SIMULATION,CLOUDFLARE_R2_ACCOUNT_ID,CLOUDFLARE_R2_RAW_BUCKET,CLOUDFLARE_R2_RAW_ACCESS_KEY_ID,CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY,CLOUDFLARE_R2_RAW_SESSION_TOKEN,CLOUDFLARE_R2_MAX_OBJECT_BYTES,FETCHER_REQUEST_TIMEOUT_SECONDS,FETCHER_SCHEDULER_CONTROL_POLL_SECONDS,FETCHER_MAX_ATTEMPTS,FETCHER_MAX_RETRY_AFTER_SECONDS
          script: |
            set -euo pipefail
            require_runtime_value() {
              if [ -z "$2" ]; then
                echo "::error title=Missing Shioaji Fetcher configuration::Required runtime setting is not configured"
                exit 1
              fi
            }
            require_runtime_value source_api_url "${FETCHER_SOURCE_API_URL:-}"
            require_runtime_value shioaji_source_client_key "${FETCHER_SHIOAJI_SOURCE_CLIENT_KEY:-}"
            require_runtime_value shioaji_api_key "${SHIOAJI_API_KEY:-}"
            require_runtime_value shioaji_secret_key "${SHIOAJI_SECRET_KEY:-}"
            require_runtime_value r2_account_id "${CLOUDFLARE_R2_ACCOUNT_ID:-}"
            require_runtime_value r2_raw_bucket "${CLOUDFLARE_R2_RAW_BUCKET:-}"
            require_runtime_value r2_raw_access_key_id "${CLOUDFLARE_R2_RAW_ACCESS_KEY_ID:-}"
            require_runtime_value r2_raw_secret_access_key "${CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY:-}"
            require_runtime_value serve_base_url "${FINDB_SERVE_BASE_URL:-}"
            require_runtime_value calendar_serve_api_key "${FETCHER_CALENDAR_SERVE_API_KEY:-}"
            if [ "$FETCHER_CALENDAR_SERVE_API_KEY" = "$FETCHER_SHIOAJI_SOURCE_CLIENT_KEY" ]; then
              echo "::error title=Fetcher credential isolation failed::Shioaji Source and calendar credentials must be different"; exit 1
            fi
            if [ "${SHIOAJI_SIMULATION:-}" != "true" ]; then
              echo "::error title=Shioaji safety configuration failed::SHIOAJI_SIMULATION must be true"; exit 1
            fi
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            export SOURCE_API_URL="$FETCHER_SOURCE_API_URL"
            export SOURCE_CLIENT_KEY="$FETCHER_SHIOAJI_SOURCE_CLIENT_KEY"
            export FETCHER_SHIOAJI_STATE_PATH=/var/lib/findb-shioaji-fetcher/state.sqlite3
            export SHIOAJI_API_KEY SHIOAJI_SECRET_KEY SHIOAJI_SIMULATION

            reconcile_scheduler() {
              provider_id="$1"; image="$2"; state_dir="$3"; state_path="$4"
              stable="$5"; candidate="$6"; previous="$7"; preflight_name="$8"; runtime_env_args="${9}"; shift 9
              scheduler_command=("$@")
              cache_dir="$state_dir/cache"
              sudo mkdir -p "$state_dir" "$cache_dir"; sudo chown 10001:10001 "$state_dir" "$cache_dir"; sudo chmod 0700 "$state_dir" "$cache_dir"
              if [ "$(sudo stat -c '%u:%g:%a' "$state_dir")" != "10001:10001:700" ]; then echo "::error title=Shioaji state rejected::State ownership or mode is unsafe"; exit 1; fi
              if [ "$(sudo stat -c '%u:%g:%a' "$cache_dir")" != "10001:10001:700" ]; then echo "::error title=Shioaji cache rejected::Cache ownership or mode is unsafe"; exit 1; fi
              if [ -e "$state_path" ] && { [ ! -f "$state_path" ] || [ "$(sudo stat -c '%u:%g:%a' "$state_path")" != "10001:10001:600" ]; }; then echo "::error title=Shioaji state rejected::SQLite ownership or mode is unsafe"; exit 1; fi
              raw_bucket_marker="$state_dir/raw-bucket.sha256"
              if ! printf '%s' "$CLOUDFLARE_R2_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$' || ! printf '%s' "$CLOUDFLARE_R2_RAW_BUCKET" | grep -Eq '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'; then echo "::error title=Invalid Shioaji R2 configuration::Raw bucket configuration is unsafe" >&2; exit 1; fi
              raw_bucket_fingerprint="$(printf '%s\n%s\nshioaji' "$CLOUDFLARE_R2_ACCOUNT_ID" "$CLOUDFLARE_R2_RAW_BUCKET" | sha256sum | cut -d ' ' -f1)"
              write_raw_bucket_marker() { marker_tmp="$(sudo mktemp "$state_dir/.raw-bucket.sha256.XXXXXX")"; printf '%s\n' "$raw_bucket_fingerprint" | sudo tee "$marker_tmp" >/dev/null; sudo chown 10001:10001 "$marker_tmp"; sudo chmod 0600 "$marker_tmp"; sudo mv "$marker_tmp" "$raw_bucket_marker"; }
              validate_raw_bucket_marker_mode() { if ! sudo test -f "$raw_bucket_marker" || [ "$(sudo stat -c '%u:%g:%a' "$raw_bucket_marker")" != "10001:10001:600" ]; then echo "::error title=Shioaji state rejected::Raw bucket binding marker ownership or mode is unsafe" >&2; exit 1; fi; }
              if sudo test -e "$state_path"; then sudo test -f "$raw_bucket_marker" || { echo "::error title=Shioaji raw bucket cutover required::State has no binding marker" >&2; exit 1; }; validate_raw_bucket_marker_mode; [ "$(sudo cat "$raw_bucket_marker")" = "$raw_bucket_fingerprint" ] || { echo "::error title=Shioaji raw bucket mismatch::State belongs to a different Raw bucket" >&2; exit 1; }; elif sudo test -e "$raw_bucket_marker"; then validate_raw_bucket_marker_mode; [ "$(sudo cat "$raw_bucket_marker")" = "$raw_bucket_fingerprint" ] || write_raw_bucket_marker; else write_raw_bucket_marker; fi
              if docker container inspect "$candidate" >/dev/null 2>&1; then if docker container inspect "$stable" >/dev/null 2>&1 || docker container inspect "$previous" >/dev/null 2>&1; then docker rm -f "$candidate"; else docker rename "$candidate" "$stable"; fi; fi
              if docker container inspect "$previous" >/dev/null 2>&1; then if docker container inspect "$stable" >/dev/null 2>&1; then docker rm -f "$previous"; else docker rename "$previous" "$stable"; fi; fi
              echo "Pruning unused Docker images before pulling ${provider_id}"
              docker image prune -af
              docker pull "$image"
              # Shioaji preflight is before replacing its stable container and validates the
              # manifest, credentials, and the explicit simulation=true mode.
              docker run --rm --name "$preflight_name" --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$state_dir,dst=$state_dir" --mount "type=bind,src=$cache_dir,dst=/home/fetcher" $runtime_env_args "$image" "${scheduler_command[@]}" --check
              recover_scheduler() { original_status="$1"; [ "$original_status" -eq 0 ] && original_status=1; trap - ERR INT TERM HUP; set +e; recovery_failed=0; if docker container inspect "$candidate" >/dev/null 2>&1; then docker rm -f "$candidate" >/dev/null 2>&1 || recovery_failed=1; fi; if [ "$recovery_failed" -eq 0 ] && ! docker container inspect "$stable" >/dev/null 2>&1 && docker container inspect "$previous" >/dev/null 2>&1; then docker rename "$previous" "$stable" >/dev/null 2>&1 || recovery_failed=1; fi; if [ "$recovery_failed" -eq 0 ] && docker container inspect "$stable" >/dev/null 2>&1; then docker start "$stable" >/dev/null 2>&1 || recovery_failed=1; fi; [ "$recovery_failed" -eq 0 ] || echo "::error title=Shioaji recovery failed::Rollback did not complete" >&2; exit "$original_status"; }
              trap 'recover_scheduler "$?"' ERR; trap 'recover_scheduler 130' INT; trap 'recover_scheduler 143' TERM; trap 'recover_scheduler 129' HUP
              had_previous=0
              if docker container inspect "$stable" >/dev/null 2>&1; then
                had_previous=1
                docker stop --time 30 "$stable" >/dev/null
                stable_exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$stable")"
                if [ "$stable_exit_code" -ne 0 ]; then
                  echo "::error title=Shioaji graceful stop failed::Stable container exited ${stable_exit_code}" >&2
                  false
                fi
                docker rename "$stable" "$previous"
              fi
              common_runtime_args=(--user 10001:10001 --restart unless-stopped --read-only --cap-drop ALL --security-opt no-new-privileges --log-opt max-size=10m --log-opt max-file=3 --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$state_dir,dst=$state_dir" --mount "type=bind,src=$cache_dir,dst=/home/fetcher")
              docker run -d --name "$candidate" "${common_runtime_args[@]}" $runtime_env_args "$image" "${scheduler_command[@]}" --run-forever >/dev/null; candidate_image="$(docker inspect --format '{{.Config.Image}}' "$candidate")"; candidate_user="$(docker inspect --format '{{.Config.User}}' "$candidate")"; healthy=0; for attempt in $(seq 1 6); do status="$(docker inspect --format '{{.State.Status}}' "$candidate")"; restarts="$(docker inspect --format '{{.RestartCount}}' "$candidate")"; if [ "$status" != "running" ] || [ "$restarts" -ne 0 ]; then break; fi; [ "$attempt" -eq 6 ] && healthy=1 && break; sleep 5; done; if [ "$candidate_image" != "$image" ] || [ "$candidate_user" != "10001:10001" ] || [ "$healthy" -ne 1 ]; then docker inspect --format "Shioaji candidate failed: image={{.Config.Image}} user={{.Config.User}} status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}" "$candidate" || true; false; fi
              docker rename "$candidate" "$stable"; [ "$had_previous" -eq 1 ] && docker rm "$previous" >/dev/null 2>&1 || true; stable_running="$(docker inspect --format '{{.State.Running}}' "$stable")"
              if [ "$stable_running" != "true" ]; then
                echo "::error title=Shioaji release rejected::Scheduler did not converge to running" >&2
                false
              fi
              trap - ERR INT TERM HUP; echo "Shioaji scheduler release reconciled to running"
            }
            runtime_env_args="\
              --env SOURCE_API_URL --env SOURCE_CLIENT_KEY --env FINDB_SERVE_BASE_URL \
              --env FETCHER_CALENDAR_SERVE_API_KEY --env FETCHER_CALENDAR_TIMEOUT_SECONDS --env FETCHER_CALENDAR_CACHE_TTL_SECONDS \
              --env SHIOAJI_API_KEY --env SHIOAJI_SECRET_KEY --env SHIOAJI_SIMULATION \
              --env CLOUDFLARE_R2_ACCOUNT_ID --env CLOUDFLARE_R2_RAW_BUCKET --env CLOUDFLARE_R2_RAW_ACCESS_KEY_ID \
              --env CLOUDFLARE_R2_RAW_SECRET_ACCESS_KEY --env CLOUDFLARE_R2_RAW_SESSION_TOKEN --env CLOUDFLARE_R2_MAX_OBJECT_BYTES \
              --env FETCHER_REQUEST_TIMEOUT_SECONDS --env FETCHER_SCHEDULER_CONTROL_POLL_SECONDS --env FETCHER_MAX_ATTEMPTS --env FETCHER_MAX_RETRY_AFTER_SECONDS --env FETCHER_SHIOAJI_STATE_PATH"
            # BEGIN FETCHER SHIOAJI SCHEDULER RECONCILIATION
            # Provider command contracts: findb-fetch-shioaji-scheduler --check and findb-fetch-shioaji-scheduler --run-forever.
            reconcile_scheduler shioaji "${FETCHER_SHIOAJI_IMAGE}:${FETCHER_IMAGE_TAG}" \
              /var/lib/findb-shioaji-fetcher /var/lib/findb-shioaji-fetcher/state.sqlite3 \
              findb-fetcher-shioaji-scheduler findb-fetcher-shioaji-scheduler-candidate findb-fetcher-shioaji-scheduler-previous \
              findb-fetcher-shioaji-scheduler-preflight "$runtime_env_args" findb-fetch-shioaji-scheduler --manifest /app/configs/shioaji_tw_pilot.v1.json
            # END FETCHER SHIOAJI SCHEDULER RECONCILIATION

  finlab-acquisition-smoke:
    needs: build-push
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_finlab_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job is intentionally staging-only, regardless of the regular deploy input.
    environment: staging-fetcher

    permissions:
      contents: read
      packages: read

    steps:
      - name: Run bounded FinLab acquisition smoke on Fetcher staging EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FETCHER_FINLAB_IMAGE: ${{ env.FETCHER_FINLAB_IMAGE }}
          FETCHER_IMAGE_TAG: ${{ env.FETCHER_IMAGE_TAG }}
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
          FINLAB_SMOKE_TARGET_DATE: ${{ inputs.finlab_target_date }}
          FINLAB_SMOKE_SYMBOLS: ${{ inputs.finlab_symbols }}
        with:
          host: ${{ secrets.FETCHER_EC2_HOST }}
          username: ${{ secrets.FETCHER_EC2_USER }}
          key: ${{ secrets.FETCHER_EC2_SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,FETCHER_FINLAB_IMAGE,FETCHER_IMAGE_TAG,FINLAB_API_TOKEN,FINLAB_SMOKE_TARGET_DATE,FINLAB_SMOKE_SYMBOLS
          script: |
            set -euo pipefail

            if [ -z "${FINLAB_API_TOKEN:-}" ]; then
              echo "::error title=FinLab smoke configuration missing::FINLAB_API_TOKEN is not configured"
              exit 1
            fi
            if [ -z "${FINLAB_SMOKE_TARGET_DATE:-}" ]; then
              echo "::error title=FinLab smoke arguments missing::An explicit ISO target date is required"
              exit 1
            fi

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            image="${FETCHER_FINLAB_IMAGE}:${FETCHER_IMAGE_TAG}"
            echo "Pruning unused Docker images before pulling FinLab smoke image"
            docker image prune -af
            docker pull "$image"

            cache_dir=/var/lib/findb-finlab-smoke-cache
            sudo mkdir -p "$cache_dir"
            sudo chown 10001:10001 "$cache_dir"
            sudo chmod 0700 "$cache_dir"
            if [ "$(stat -c '%u:%g:%a' "$cache_dir")" != "10001:10001:700" ]; then
              echo "::error title=FinLab smoke cache rejected::Provider cache ownership or mode is unsafe"
              exit 1
            fi

            # This container receives only the provider token.  It has no Source,
            # R2, scheduler, or durable Fetcher state credential/mount.
            docker run --rm \
              --name findb-finlab-acquisition-smoke \
              --user 10001:10001 \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --mount "type=bind,src=$cache_dir,dst=/home/fetcher" \
              --env FINLAB_API_TOKEN \
              "$image" \
              findb-fetch-finlab-smoke \
              --target-date "$FINLAB_SMOKE_TARGET_DATE" \
              --symbols "$FINLAB_SMOKE_SYMBOLS"
