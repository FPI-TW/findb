[project]
name = "findb-fetcher"
version = "0.1.0"
description = "Independent fetch and delivery client for FinDB ingress contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1,<0.29.0",
    "jsonschema[format]>=4.25.1,<5.0.0",
]

[project.scripts]
findb-fetch-twelve-data = "findb_fetcher.twelve_data_cli:main"
findb-fetch-scheduler = "findb_fetcher.scheduler_cli:main"

[dependency-groups]
dev = [
    "black>=26.3.1,<27.0.0",
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.15.11,<0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findb_fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
