[project]
name = "findb-fetcher"
version = "0.1.0"
description = "Independent fetch and delivery client for FinDB ingress contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.40,<2.0",
    "httpx>=0.28.1,<0.29.0",
    "jsonschema[format]>=4.25.1,<5.0.0",
    "pdfminer.six==20260107",
]

[project.scripts]
findb-fetch-runtime = "findb_fetcher.full_market_cli:main"
findb-fetch-full-market = "findb_fetcher.full_market_cli:main"
findb-fetch-historical-backfill = "findb_fetcher.historical_backfill_cli:main"
findb-fetch-backfill-plan = "findb_fetcher.production_backfill_cli:main"
findb-fetch-retired-purge = "findb_fetcher.retired_provider_purge:main"

[project.optional-dependencies]
factset = [
    "PyMySQL>=1.1.1,<2",
]
finlab = [
    "finlab==2.3.11",
]

[dependency-groups]
dev = [
    "mypy>=1.20.1,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.15.11,<0.16.0",
    "types-PyMySQL>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findb_fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
