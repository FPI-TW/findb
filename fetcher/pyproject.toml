[project]
name = "findb-fetcher"
version = "0.1.0"
description = "Independent fetch and delivery client for FinDB ingress contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.40,<2.0",
    "httpx>=0.28.1,<0.29.0",
    "jsonschema[format]>=4.25.1,<5.0.0",
]

[project.scripts]
findb-fetch-twelve-data = "findb_fetcher.twelve_data_cli:main"
findb-fetch-scheduler = "findb_fetcher.scheduler_cli:main"
findb-fetch-finlab-smoke = "findb_fetcher.finlab_smoke_cli:main"
findb-fetch-shioaji-smoke = "findb_fetcher.shioaji_smoke_cli:main"
findb-fetch-shioaji-staging = "findb_fetcher.shioaji_staging_cli:main"

[project.optional-dependencies]
finlab = [
    "finlab==1.5.7",
]
shioaji = [
    "shioaji==1.7.1",
]

[dependency-groups]
dev = [
    "mypy>=1.20.1,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.15.11,<0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findb_fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
