<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinDB — 標的與宏觀查詢</title>
<style>
:root {
  /* iOS light surfaces */
  --bg:               #F2F2F7;
  --bg-card:          #FFFFFF;
  --bg-hover:         rgba(0, 0, 0, 0.035);
  --bg-fill:          rgba(118, 118, 128, 0.12);
  --bg-fill-strong:   rgba(118, 118, 128, 0.2);

  /* iOS label scale */
  --text-1:           rgba(0, 0, 0, 0.9);
  --text-2:           rgba(60, 60, 67, 0.6);
  --text-3:           rgba(60, 60, 67, 0.32);

  /* System blue */
  --accent:           #007AFF;
  --accent-hover:     #0066D6;
  --accent-soft:      rgba(0, 122, 255, 0.12);

  /* Semantic */
  --success:          #34C759;
  --success-soft:     rgba(52, 199, 89, 0.16);
  --success-text:     #1B7F37;
  --danger:           #FF3B30;
  --danger-soft:      rgba(255, 59, 48, 0.12);
  --danger-text:      #B22A1E;

  /* Rules */
  --border:           rgba(60, 60, 67, 0.18);
  --border-light:     rgba(60, 60, 67, 0.08);

  /* Shadow */
  --shadow-card:      0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px -10px rgba(0, 0, 0, 0.08);

  /* Radius */
  --radius-card:      18px;
  --radius-input:     12px;
  --radius-btn:       10px;
  --radius-pill:      980px;
}

*, *::before, *::after { box-sizing: border-box; }

html { font-size: 16px; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
               "Inter", "Segoe UI", "Helvetica Neue", "PingFang TC",
               "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-weight: 400;
  letter-spacing: -0.003em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background: var(--bg);
}

.page {
  position: relative;
  max-width: 1040px;
  margin: 0 auto;
  padding: 56px 24px 80px;
}

.page-header {
  margin-bottom: 28px;
}

.eyebrow {
  margin-bottom: 8px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.page-title {
  margin: 0;
  font-family: inherit;
  font-weight: 700;
  font-size: clamp(1.9rem, 3.2vw, 2.5rem);
  letter-spacing: -0.022em;
  color: var(--text-1);
  line-height: 1.15;
}

.page-title .accent { color: var(--accent); }

.page-subtitle {
  margin: 10px 0 0;
  color: var(--text-2);
  font-size: 0.92rem;
  line-height: 1.5;
}

.panel {
  background: var(--bg-card);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
}

.sticky-shell {
  position: sticky;
  top: 0;
  z-index: 6;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top-left-radius: var(--radius-card);
  border-top-right-radius: var(--radius-card);
  border-bottom: 1px solid var(--border-light);
}

.panel > .footer-row {
  border-bottom-left-radius: var(--radius-card);
  border-bottom-right-radius: var(--radius-card);
}

.controls {
  padding: 22px 24px 16px;
}

.dataset-tabs {
  position: relative;
  display: inline-flex;
  gap: 0;
  margin-bottom: 20px;
  padding: 3px;
  background: var(--bg-fill);
  border-radius: var(--radius-input);
}

.dataset-tab-indicator {
  position: absolute;
  background: var(--bg-card);
  border-radius: 9px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
  transition: left 0.28s cubic-bezier(0.32, 0.72, 0, 1),
              width 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  pointer-events: none;
  z-index: 0;
}

.dataset-tab {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--text-2);
  padding: 6px 14px;
  font: inherit;
  font-size: 0.88rem;
  font-weight: 500;
  letter-spacing: -0.005em;
  cursor: pointer;
  transition: color 0.2s ease;
  white-space: nowrap;
}

.dataset-tab:hover { color: var(--text-1); }
.dataset-tab.active { color: var(--text-1); }

.dataset-tab-count {
  display: inline-block;
  min-width: 22px;
  padding: 0 7px;
  border-radius: 999px;
  background: rgba(118, 118, 128, 0.18);
  color: var(--text-2);
  font-size: 0.72rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.55;
  text-align: center;
  transition: background 0.2s ease, color 0.2s ease;
}

.dataset-tab.active .dataset-tab-count {
  background: var(--accent-soft);
  color: var(--accent);
}

.search-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
  padding: 10px 14px;
  background: var(--bg-fill);
  border-radius: var(--radius-input);
  transition: background 0.15s ease, box-shadow 0.15s ease;
}

.search-row:focus-within {
  background: var(--bg-card);
  box-shadow: 0 0 0 4px var(--accent-soft), inset 0 0 0 1px var(--accent);
}

.search-icon {
  width: 16px;
  height: 16px;
  color: var(--text-2);
  flex: 0 0 auto;
}

.search-input {
  flex: 1 1 auto;
  min-width: 0;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--text-1);
  font: inherit;
  font-size: 0.95rem;
  outline: none;
}

.search-input::placeholder { color: var(--text-3); }

.filters {
  display: grid;
  gap: 10px;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 14px;
}

.filter-label {
  min-width: 44px;
  color: var(--text-2);
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: -0.01em;
}

.pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.pill {
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--bg-fill);
  color: var(--text-2);
  padding: 5px 14px;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.pill:hover {
  background: var(--bg-fill-strong);
  color: var(--text-1);
}

.pill.active {
  background: var(--accent);
  color: #FFFFFF;
}

.pill.active:hover { background: var(--accent-hover); }

.status-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 24px 16px;
  color: var(--text-2);
  font-size: 0.85rem;
}

.clear-button {
  border: 0;
  background: transparent;
  color: var(--accent);
  padding: 4px 6px;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: color 0.15s ease, opacity 0.15s ease;
}

.clear-button:hover { color: var(--accent-hover); }

.clear-button:disabled {
  color: var(--text-3);
  cursor: not-allowed;
}

.footer-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}

.page-size-select {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text-1);
  padding: 5px 10px;
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.page-size-select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.csv-button {
  border: 0;
  border-radius: 8px;
  background: var(--bg-fill);
  color: var(--text-1);
  padding: 7px 14px;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s ease;
}

.csv-button:hover { background: var(--bg-fill-strong); }

.csv-button:disabled {
  color: var(--text-3);
  cursor: not-allowed;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 32px;
  transform: translate(-50%, 12px);
  padding: 11px 20px;
  background: rgba(28, 28, 30, 0.92);
  color: #FFFFFF;
  border-radius: 999px;
  font-size: 0.86rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
  z-index: 200;
}

.toast.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

.detail-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.36);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease;
  z-index: 120;
}

.detail-backdrop.visible {
  opacity: 1;
  pointer-events: auto;
}

.detail-drawer {
  position: fixed;
  top: 0;
  right: 0;
  height: 100vh;
  width: min(480px, 100vw);
  background: var(--bg-card);
  box-shadow: -16px 0 40px -16px rgba(0, 0, 0, 0.25);
  transform: translateX(100%);
  transition: transform 0.22s cubic-bezier(0.22, 0.61, 0.36, 1);
  z-index: 130;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.detail-drawer.visible {
  transform: translateX(0);
}

.detail-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 20px 22px 14px;
  border-bottom: 1px solid var(--border-light);
}

.detail-header-text {
  flex: 1;
  min-width: 0;
}

.detail-symbol {
  font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--accent);
  margin: 0 0 2px;
  word-break: break-all;
}

.detail-name {
  font-size: 0.95rem;
  color: var(--text-2);
  margin: 0;
}

.detail-close {
  appearance: none;
  border: 0;
  background: var(--bg-fill);
  color: var(--text-1);
  width: 32px;
  height: 32px;
  border-radius: 999px;
  font-size: 0.95rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.12s ease;
}

.detail-close:hover { background: var(--bg-fill-strong); }
.detail-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 22px 24px;
  -webkit-overflow-scrolling: touch;
}

.detail-section { margin-top: 18px; }
.detail-section:first-child { margin-top: 0; }

.detail-section h3 {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-2);
  margin: 0 0 10px;
}

.detail-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}

.detail-badge {
  font-size: 0.78rem;
  padding: 4px 10px;
  background: var(--bg-fill);
  border-radius: var(--radius-pill);
  color: var(--text-1);
}

.detail-badge.is-status-active { background: var(--success-soft); color: var(--success-text); }
.detail-badge.is-status-delisted { background: var(--danger-soft); color: var(--danger-text); }

.detail-grid {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 8px 18px;
  margin-bottom: 14px;
}

.detail-grid > dt {
  font-size: 0.78rem;
  color: var(--text-2);
  margin: 0;
  white-space: nowrap;
}

.detail-grid > dd {
  margin: 0;
  font-size: 0.9rem;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
  word-break: break-all;
}

.detail-actions-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}

.detail-summary {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  background: var(--bg-fill);
  border-radius: var(--radius-input);
  margin-bottom: 12px;
}

.detail-summary-figures {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.detail-summary-price {
  font-size: 1.45rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-1);
  line-height: 1.1;
}

.detail-summary-delta {
  font-size: 0.86rem;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}

.detail-summary-delta.is-up { color: var(--success-text); }
.detail-summary-delta.is-down { color: var(--danger-text); }
.detail-summary-delta.is-flat { color: var(--text-2); }

.detail-summary-spark {
  margin-left: auto;
  flex-shrink: 0;
}

.detail-summary-spark svg {
  display: block;
}

tbody tr.row-active,
tbody tr.row-active:hover {
  background: var(--accent-soft);
}

tbody tr.row-active td:first-child {
  box-shadow: inset 3px 0 0 var(--accent);
}

.detail-action-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-1);
  padding: 7px 14px;
  border-radius: var(--radius-btn);
  font-size: 0.84rem;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}

.detail-action-btn:hover { background: var(--bg-fill); }
.detail-action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.detail-table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 0 -4px;
  padding: 0 4px;
}

.detail-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.84rem;
  font-variant-numeric: tabular-nums;
  table-layout: auto;
}

.detail-table th,
.detail-table td {
  height: auto;
  padding: 6px 8px;
  text-align: right;
  border-bottom: 1px solid var(--border-light);
  white-space: nowrap;
  overflow: visible;
  text-overflow: clip;
}

.detail-table th:first-child,
.detail-table td:first-child {
  text-align: left;
  padding-left: 0;
}

.detail-table th:last-child,
.detail-table td:last-child {
  padding-right: 0;
}

.detail-table th {
  font-size: 0.74rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--text-2);
  text-transform: uppercase;
}

.detail-table tr:last-child td { border-bottom: 0; }

.detail-skeleton {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.detail-skeleton span {
  display: block;
  height: 14px;
  width: 100%;
  background: linear-gradient(90deg, var(--bg-fill) 0%, var(--bg-fill-strong) 50%, var(--bg-fill) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  animation: detail-skeleton-shimmer 1.1s linear infinite;
}

.detail-skeleton span:nth-child(2) { width: 88%; }
.detail-skeleton span:nth-child(3) { width: 76%; }

@keyframes detail-skeleton-shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.detail-error {
  font-size: 0.86rem;
  color: var(--danger-text);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  background: var(--danger-soft);
  border-radius: var(--radius-input);
}

.detail-empty {
  font-size: 0.86rem;
  color: var(--text-2);
  padding: 8px 0;
}

@media (max-width: 640px) {
  .detail-drawer {
    width: 100vw;
    height: 85vh;
    top: auto;
    bottom: 0;
    right: 0;
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    transform: translateY(100%);
  }
  .detail-drawer.visible { transform: translateY(0); }
}

.cell-symbol {
  cursor: pointer;
  user-select: all;
}

.cell-symbol:hover { color: var(--accent-hover); }

.is-filtering tbody {
  opacity: 0.5;
  transition: opacity 0.15s ease;
}

.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: 12px 12px;
  border-bottom: 1px solid var(--border-light);
  background: var(--bg-card);
  color: var(--text-2);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-align: left;
  vertical-align: bottom;
  white-space: normal;
  word-break: keep-all;
  line-height: 1.3;
}

.sort-button {
  display: inline-flex;
  align-items: flex-end;
  gap: 5px;
  max-width: 100%;
  border: 0;
  padding: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-transform: inherit;
  letter-spacing: inherit;
  cursor: pointer;
  text-align: left;
}

.sort-label {
  min-width: 0;
  white-space: normal;
  word-break: keep-all;
}

.sort-indicator {
  width: 10px;
  height: 12px;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  opacity: 0.55;
  transition: opacity 0.15s ease, color 0.15s ease;
}

.sort-button:hover .sort-indicator,
.sort-button.active .sort-indicator {
  opacity: 1;
}

.sort-button.active { color: var(--text-1); }
.sort-button.active .sort-indicator { color: var(--accent); }

tbody td {
  height: 54px;
  padding: 14px 12px;
  border-bottom: 1px solid var(--border-light);
  font-size: 0.92rem;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

tbody tr {
  transition: background 0.1s ease;
}

tbody tr:hover { background: var(--bg-hover); }

tbody tr.row-clickable { cursor: pointer; }
tbody tr.row-clickable:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

tbody tr:last-child td { border-bottom: 0; }

.cell-symbol {
  font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  letter-spacing: -0.005em;
  color: var(--accent);
  font-weight: 500;
}

.cell-name {
  min-width: 0;
  color: var(--text-1);
}

.cell-date,
.cell-price {
  font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  font-size: 0.86rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--text-2);
}

.cell-price {
  text-align: right;
  color: var(--text-1);
  font-weight: 500;
}

.cell-price .price-ccy {
  margin-left: 6px;
  color: var(--text-3);
  font-size: 0.72rem;
  font-weight: 400;
}

.cell-status {
  font-size: 0.78rem;
  color: var(--text-3);
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: var(--bg-fill);
  color: var(--text-2);
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: -0.005em;
  text-transform: lowercase;
}

.status-pill .status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-3);
  flex: 0 0 auto;
}

.status-pill.status-active {
  background: var(--success-soft);
  color: var(--success-text);
}

.status-pill.status-active .status-dot { background: var(--success); }

.status-pill.status-delisted {
  background: var(--danger-soft);
  color: var(--danger-text);
  text-decoration: line-through;
  text-decoration-color: rgba(255, 59, 48, 0.5);
}

.status-pill.status-delisted .status-dot { background: var(--danger); }

mark {
  background: rgba(255, 204, 0, 0.42);
  color: inherit;
  padding: 0 2px;
  border-radius: 3px;
}

.empty-state,
.error-state,
.loading-state {
  padding: 56px 24px;
  text-align: center;
  color: var(--text-2);
  font-size: 0.92rem;
  line-height: 1.6;
}

.error-state strong {
  display: block;
  margin-bottom: 8px;
  color: var(--danger);
  font-weight: 600;
  font-size: 1rem;
}

.retry-button {
  margin-top: 16px;
  border: 0;
  border-radius: var(--radius-btn);
  background: var(--accent);
  color: #FFFFFF;
  padding: 10px 22px;
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;

<script>
(() => {
  const PAGE_SIZE_OPTIONS = [25, 50, 100, 200];
  const DEFAULT_PAGE_SIZE = 50;
  const SEARCH_DEBOUNCE_MS = 200;
  const STORAGE_KEY = 'findb.instrument-lookup.prefs.v1';
  const TOAST_DURATION_MS = 1600;
  const DATASETS = {
    instruments: {
      label: '金融商品',
      itemLabel: '標的',
      url: '/static/data/instruments.json',
      defaultSort: 'market',
      searchPlaceholder: '標的名稱、Symbol、Instrument ID…',
      searchFields: ['symbol', 'name', 'short_name','instrument_id', 'market', 'asset_class', 'currency'],
      columns: [
        { key: 'market', label: 'Market', sortable: true, width: '9%' },
        { key: 'symbol', label: 'Symbol', sortable: true, className: 'cell-symbol', width: '10%' },
        { key: 'name', label: 'Name', sortable: true, className: 'cell-name', width: '16%' },
        { key: 'asset_class', label: 'Asset Class', sortable: true, width: '11%' },
        { key: 'currency', label: 'CCY', sortable: true, width: '6%' },
        { key: 'first_trade_date', label: 'First Date', sortable: true, type: 'date', className: 'cell-date', width: '11%' },
        { key: 'latest_trade_date', label: 'Last Date', sortable: true, type: 'date', className: 'cell-date', width: '11%' },
        { key: 'latest_price', label: 'Last Price', sortable: true, type: 'number', className: 'cell-price', width: '11%' },
        { key: 'status', label: 'Status', sortable: true, type: 'status', width: '9%' },
      ],
    },
    macro: {
      label: '宏觀序列',
      itemLabel: '宏觀序列',
      url: '/static/data/macro-series.json',
      defaultSort: 'market',
      searchPlaceholder: '宏觀序列名稱、Source Code、Series ID…',
      searchFields: ['name', 'source_code', 'series_id', 'unit', 'frequency', 'source', 'market'],
      columns: [
        { key: 'market', label: 'Market', sortable: true, width: '12%' },
        { key: 'source_code', label: 'Source Code', sortable: true, className: 'cell-symbol', width: '22%' },
        { key: 'name', label: 'Name', sortable: true, className: 'cell-name', width: '34%' },
        { key: 'frequency', label: 'Frequency', sortable: true, width: '12%' },
        { key: 'unit', label: 'Unit', sortable: true, width: '10%' },
        { key: 'source', label: 'Source', sortable: true, width: '10%' },
      ],
    },
  };

  const state = {
    dataset: 'instruments',
    source: {
      instruments: [],
      macro: [],
    },
    filtered: [],
    metadata: {
      instruments: {
        markets: [],
        assetClasses: [],
        generatedAt: '',
        total: 0,
      },
      macro: {
        markets: [],
        frequencies: [],
        sources: [],
        generatedAt: '',
        total: 0,
      },
    },
    searchTerm: '',
    market: 'ALL',
    assetClass: 'ALL',
    status: 'active',
    frequency: 'ALL',
    sourceFilter: 'ALL',
    sortBy: 'market',
    sortDir: 'asc',
    currentPage: 1,
    pageSize: DEFAULT_PAGE_SIZE,
    detailId: '',
  };

  const elements = {
    headerMeta: document.getElementById('header-meta'),
    datasetTabs: document.getElementById('dataset-tabs'),
    searchInput: document.getElementById('search-input'),
    marketFilters: document.getElementById('market-filters'),
    assetFilterLabel: document.getElementById('asset-filter-label'),
    assetFilters: document.getElementById('asset-filters'),
    statusFilterLabel: document.getElementById('status-filter-label'),
    statusFilters: document.getElementById('status-filters'),
    resultSummary: document.getElementById('result-summary'),
    activeFilters: document.getElementById('active-filters'),
    loadingState: document.getElementById('loading-state'),
    errorState: document.getElementById('error-state'),
    errorMessage: document.getElementById('error-message'),
    retryButton: document.getElementById('retry-button'),
    tableSection: document.getElementById('table-section'),
    tableColumns: document.getElementById('table-columns'),
    tableHead: document.getElementById('table-head'),
    tableBody: document.getElementById('table-body'),
    emptyState: document.getElementById('empty-state'),
    countLabel: document.getElementById('count-label'),
    pagination: document.getElementById('pagination'),
    clearFilters: document.getElementById('clear-filters'),
    pageSizeSelect: document.getElementById('page-size-select'),
    csvExport: document.getElementById('csv-export'),
    toast: document.getElementById('toast'),
    emptyMessage: document.getElementById('empty-message'),
    emptyClear: document.getElementById('empty-clear'),
    detailBackdrop: document.getElementById('detail-backdrop'),
    detailDrawer: document.getElementById('detail-drawer'),
    detailClose: document.getElementById('detail-close'),
    detailSymbol: document.getElementById('detail-symbol'),
    detailName: document.getElementById('detail-name'),
    detailMeta: document.getElementById('detail-meta'),
    detailPrices: document.getElementById('detail-prices'),
    detailActions: document.getElementById('detail-actions'),
  };

  const HIGHLIGHT_KEYS = new Set([
    'symbol', 'name', 'short_name', 'instrument_id',
    'source_code', 'series_id',
    'market', 'asset_class', 'currency', 'frequency', 'unit', 'source',
  ]);

  function getDatasetConfig() {
    return DATASETS[state.dataset];
  }

  function getDatasetMetadata() {
    return state.metadata[state.dataset];
  }

  function getDatasetItems() {
    return state.source[state.dataset] || [];
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normalizeText(value) {
    // NFKC folds fullwidth digits/letters (２３３０ → 2330) and width variants
    // so CJK users with IME-emitted fullwidth input still match canonical data.
    return String(value ?? '').normalize('NFKC').trim().toLowerCase();
  }

  function compareText(left, right) {
    return String(left ?? '').localeCompare(String(right ?? ''), 'en', { sensitivity: 'base' });
  }

  function getSortColumn() {
    return getDatasetConfig().columns.find((column) => column.key === state.sortBy);
  }

  function compareDate(left, right) {
    const leftTime = Date.parse(left || '');
    const rightTime = Date.parse(right || '');
    const normalizedLeft = Number.isNaN(leftTime) ? -Infinity : leftTime;
    const normalizedRight = Number.isNaN(rightTime) ? -Infinity : rightTime;
    return normalizedLeft - normalizedRight;
  }

  function compareNumber(left, right) {
    if (left === null || left === undefined || left === '') {
      return right === null || right === undefined || right === '' ? 0 : -Infinity;
    }
    if (right === null || right === undefined || right === '') {
      return Infinity;
    }

    const leftNumber = Number(left);
    const rightNumber = Number(right);
    const normalizedLeft = Number.isFinite(leftNumber) ? leftNumber : -Infinity;
    const normalizedRight = Number.isFinite(rightNumber) ? rightNumber : -Infinity;
    return normalizedLeft - normalizedRight;
  }

  function compareValues(left, right, column) {
    if (column?.type === 'date') {
      return compareDate(left, right);
    }
    if (column?.type === 'number') {
      return compareNumber(left, right);
    }
    return compareText(left, right);
  }

  function sortItems(items) {
    const direction = state.sortDir === 'asc' ? 1 : -1;
    const config = getDatasetConfig();
    const sortColumn = getSortColumn();
    const sorted = [...items].sort((a, b) => {
      const primary = compareValues(a[state.sortBy], b[state.sortBy], sortColumn);
      if (primary !== 0) {
        return primary * direction;
      }

      const marketFallback = compareText(a.market, b.market);
      if (marketFallback !== 0) {
        return marketFallback;
      }

      const symbolFallback = compareText(a.symbol, b.symbol);
      if (symbolFallback !== 0) {
        return symbolFallback;
      }

      if (config.columns.some((column) => column.key === 'source_code')) {
        const sourceCodeFallback = compareText(a.source_code, b.source_code);
        if (sourceCodeFallback !== 0) {
          return sourceCodeFallback;
        }
      }

      return compareText(a.name, b.name);
    });

    return sorted;
  }

  function applyFilters() {
    const query = normalizeText(state.searchTerm);
    const config = getDatasetConfig();
    const items = getDatasetItems().filter((item) => {
      const matchedSearch = !query || config.searchFields.some((field) => normalizeText(item[field]).includes(query));
      const matchedMarket = state.market === 'ALL' || item.market === state.market;
      const matchedSecondary = state.dataset === 'macro'
        ? state.frequency === 'ALL' || item.frequency === state.frequency
        : state.assetClass === 'ALL' || item.asset_class === state.assetClass;
      const matchedTertiary = state.dataset === 'macro'
        ? state.sourceFilter === 'ALL' || item.source === state.sourceFilter
        : state.status === 'ALL' || item.status === state.status;

      return matchedSearch && matchedMarket && matchedSecondary && matchedTertiary;
    });

    state.filtered = sortItems(items);

    const totalPages = Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
    if (state.currentPage > totalPages) {
      state.currentPage = totalPages;
    }
  }

  function getVisibleRows() {
    const start = (state.currentPage - 1) * state.pageSize;
    const end = start + state.pageSize;
    return state.filtered.slice(start, end);
  }

  const GENERATED_AT_FORMATTER = new Intl.DateTimeFormat('zh-TW', {
    timeZone: 'Asia/Taipei',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false,
  });

  function formatGeneratedAt(raw) {
    if (!raw) {
      return '未知';
    }

    const parsed = new Date(raw);
    if (Number.isNaN(parsed.getTime())) {
      return escapeHtml(raw);
    }

    const parts = GENERATED_AT_FORMATTER.formatToParts(parsed).reduce((acc, part) => {
      acc[part.type] = part.value;
      return acc;
    }, {});
    return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second} UTC+8`;
  }

  function formatTradeDate(value) {
    return value || '-';
  }

  function formatPrice(value) {
    if (value === null || value === undefined || value === '') {
      return '-';
    }

    const numericValue = Number(value);
    if (!Number.isFinite(numericValue)) {
      return '-';
    }

    return new Intl.NumberFormat('en-US', {
      maximumFractionDigits: 8,
    }).format(numericValue);
  }

  function updateHeader() {
    const metadata = getDatasetMetadata();
    const config = getDatasetConfig();
    elements.headerMeta.textContent = `${config.label}更新時間：${formatGeneratedAt(metadata.generatedAt)} | 共 ${metadata.total.toLocaleString()} 筆`;
  }

  function updateResultSummary() {
    const total = state.filtered.length;
    const config = getDatasetConfig();
    if (total === 0) {
      elements.resultSummary.textContent = '目前沒有符合條件的資料';
      elements.countLabel.textContent = '顯示 0 / 共 0 筆';
      return;
    }

    const start = (state.currentPage - 1) * state.pageSize + 1;
    const end = Math.min(state.currentPage * state.pageSize, total);
    elements.resultSummary.textContent = `共找到 ${total.toLocaleString()} 筆符合條件的${config.itemLabel}`;
    elements.countLabel.textContent = `顯示 ${start.toLocaleString()}–${end.toLocaleString()} / 共 ${total.toLocaleString()} 筆`;
  }

  function updateActiveFilterSummary() {
    const parts = [];

    if (state.searchTerm.trim()) {
      parts.push(`搜尋「${state.searchTerm.trim()}」`);
    }
    if (state.market !== 'ALL') {
      parts.push(`市場 ${state.market}`);
    }

    if (state.dataset === 'macro') {
      if (state.frequency !== 'ALL') {
        parts.push(`頻率 ${state.frequency}`);
      }
      if (state.sourceFilter !== 'ALL') {
        parts.push(`來源 ${state.sourceFilter}`);
      }
    } else {
      if (state.assetClass !== 'ALL') {
        parts.push(`類別 ${state.assetClass}`);
      }
      if (state.status !== 'ALL') {
        parts.push(`狀態 ${state.status}`);
      }
    }

    elements.activeFilters.textContent = parts.length > 0 ? parts.join(' / ') : `顯示全部${getDatasetConfig().itemLabel}`;
  }

  function createPill(value, label, currentValue) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `pill${value === currentValue ? ' active' : ''}`;
    button.dataset.value = value;
    button.textContent = label;
    return button;
  }

  function handleFilterPillClick(event) {
    const pill = event.target.closest('.pill');
    if (!pill || !event.currentTarget.contains(pill)) return;
    const value = pill.dataset.value;
    if (value === undefined) return;

    const container = event.currentTarget;
    if (container === elements.marketFilters) {
      if (state.market === value) return;
      state.market = value;
    } else if (container === elements.assetFilters) {
      if (state.dataset === 'macro') {
        if (state.frequency === value) return;
        state.frequency = value;
      } else {
        if (state.assetClass === value) return;
        state.assetClass = value;
      }
    } else if (container === elements.statusFilters) {
      if (state.dataset === 'macro') {
        if (state.sourceFilter === value) return;
        state.sourceFilter = value;
      } else {
        if (state.status === value) return;
        state.status = value;
      }
    } else {
      return;
    }
    state.currentPage = 1;
    render();
  }

  function buildDatasetTabs() {
    // Build buttons once; updateDatasetTabsState() handles active class & counts per render.
    elements.datasetTabs.replaceChildren();

    const indicator = document.createElement('div');
    indicator.className = 'dataset-tab-indicator';
    elements.datasetTabs.appendChild(indicator);
    elements.datasetTabIndicator = indicator;

    Object.entries(DATASETS).forEach(([value, config]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dataset-tab';
      btn.dataset.dataset = value;
      btn.setAttribute('role', 'tab');

      const labelEl = document.createElement('span');
      labelEl.className = 'dataset-tab-label';
      labelEl.textContent = config.label;

      const countEl = document.createElement('span');
      countEl.className = 'dataset-tab-count';
      countEl.textContent = '—';

      btn.append(labelEl, countEl);
      btn.addEventListener('click', () => switchDataset(value));
      elements.datasetTabs.appendChild(btn);
    });
  }

  function switchDataset(nextDataset) {
    if (state.dataset === nextDataset) return;

    state.dataset = nextDataset;
    state.searchTerm = '';
    state.market = 'ALL';
    state.assetClass = 'ALL';
    state.status = getDefaultStatusFor(nextDataset);
    state.frequency = 'ALL';
    state.sourceFilter = 'ALL';
    state.sortBy = DATASETS[nextDataset].defaultSort;
    state.sortDir = 'asc';
    state.currentPage = 1;

    const persisted = readPersistedState();
    if (persisted && persisted[nextDataset]) {
      applyDatasetPersistedState(nextDataset, persisted[nextDataset]);
    }

    elements.searchInput.value = '';
    elements.searchInput.placeholder = DATASETS[nextDataset].searchPlaceholder;
    render();
  }

  function updateDatasetTabsState(animate = true) {
    const tabs = elements.datasetTabs.querySelectorAll('.dataset-tab');
    tabs.forEach((tab) => {
      const key = tab.dataset.dataset;
      const isActive = key === state.dataset;
      tab.classList.toggle('active', isActive);
      tab.setAttribute('aria-selected', String(isActive));

      const countEl = tab.querySelector('.dataset-tab-count');
      if (!countEl) return;
      const meta = state.metadata[key];
      if (meta && meta.generatedAt) {
        countEl.textContent = Number(meta.total || 0).toLocaleString();
      } else {
        countEl.textContent = '—';
      }
    });
    positionTabIndicator(animate);
  }

  function positionTabIndicator(animate = true) {
    const indicator = elements.datasetTabIndicator;
    if (!indicator) return;
    const activeTab = elements.datasetTabs.querySelector('.dataset-tab.active');
    if (!activeTab) return;

    if (!animate) {
      indicator.style.transition = 'none';
      // Force reflow so the transition: none takes effect before we set new values.
      void indicator.offsetWidth;
    }

    indicator.style.top = `${activeTab.offsetTop}px`;
    indicator.style.height = `${activeTab.offsetHeight}px`;
    indicator.style.left = `${activeTab.offsetLeft}px`;
    indicator.style.width = `${activeTab.offsetWidth}px`;

    if (!animate) {
      requestAnimationFrame(() => {
        indicator.style.transition = '';
      });
    }
  }

  function renderFilters() {
    const metadata = getDatasetMetadata();
    const isMacro = state.dataset === 'macro';

    elements.marketFilters.replaceChildren(
      createPill('ALL', '全部', state.market),
      ...metadata.markets.map((market) => createPill(market, market, state.market))
    );

    const assetCurrent = isMacro ? state.frequency : state.assetClass;
    const assetValues = isMacro ? metadata.frequencies : metadata.assetClasses;
    elements.assetFilterLabel.textContent = isMacro ? '頻率' : '類別';
    elements.assetFilters.replaceChildren(
      createPill('ALL', '全部', assetCurrent),
      ...assetValues.map((value) => createPill(value, value, assetCurrent))
    );

    elements.statusFilterLabel.textContent = isMacro ? '來源' : '狀態';
    const statusOptions = isMacro
      ? [
          { value: 'ALL', label: '全部' },
          ...metadata.sources.map((source) => ({ value: source, label: source })),
        ]
      : [
          { value: 'ALL', label: '全部' },
          { value: 'active', label: 'active' },
          { value: 'delisted', label: 'delisted' },
        ];
    const statusCurrent = isMacro ? state.sourceFilter : state.status;
    elements.statusFilters.replaceChildren(
      ...statusOptions.map((option) => createPill(option.value, option.label, statusCurrent))
    );
  }

  function renderTableHead() {
    const fragment = document.createDocumentFragment();

    getDatasetConfig().columns.forEach((column) => {
      const th = document.createElement('th');
      th.title = column.label;
      if (!column.sortable) {
        th.textContent = column.label;
        fragment.appendChild(th);
        return;
      }

      const button = document.createElement('button');
      button.type = 'button';
      button.className = `sort-button${state.sortBy === column.key ? ' active' : ''}`;
      button.title = column.label;
      button.addEventListener('click', () => {
        if (state.sortBy === column.key) {
          state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          state.sortBy = column.key;
          state.sortDir = 'asc';
        }
        render();
      });

      const label = document.createElement('span');
      label.className = 'sort-label';
      label.textContent = column.label;
      const indicator = document.createElement('span');
      indicator.className = 'sort-indicator';
      indicator.textContent = state.sortBy === column.key ? (state.sortDir === 'asc' ? '▲' : '▼') : '▵';

      button.append(label, indicator);
      th.appendChild(button);
      fragment.appendChild(th);
    });

    elements.tableHead.replaceChildren(fragment);
  }

  function renderTableColumns() {
    const fragment = document.createDocumentFragment();

    getDatasetConfig().columns.forEach((column) => {
      const col = document.createElement('col');
      if (column.width) {
        col.style.width = column.width;
      }
      fragment.appendChild(col);
    });

    elements.tableColumns.replaceChildren(fragment);
  }

  function renderCell(item, column) {
    if (column.type === 'status') {
      return item.status || '';
    }
    if (column.type === 'date') {
      return formatTradeDate(item[column.key]);
    }
    if (column.type === 'number') {
      return formatPrice(item[column.key]);
    }
    if (column.key === 'name') {
      return item.name || item.short_name || '-';
    }

    return item[column.key] || '-';
  }

  function highlightMatch(text, query) {
    const safe = escapeHtml(text);
    if (!query) return safe;
    const lowerText = String(text).toLowerCase();
    const lowerQuery = query.toLowerCase();
    const idx = lowerText.indexOf(lowerQuery);
    if (idx === -1) return safe;
    const before = String(text).slice(0, idx);
    const match = String(text).slice(idx, idx + query.length);
    const after = String(text).slice(idx + query.length);
    return `${escapeHtml(before)}<mark>${escapeHtml(match)}</mark>${escapeHtml(after)}`;
  }

  function renderStatusHTML(status) {
    const value = String(status || 'unknown');
    const safe = escapeHtml(value);
    return `<span class="status-pill status-${safe}"><span class="status-dot" aria-hidden="true"></span>${safe}</span>`;
  }

  function renderCellHTML(item, column, query) {
    if (column.type === 'status') {
      return renderStatusHTML(item.status);
    }
    if (column.type === 'date') {
      return escapeHtml(formatTradeDate(item[column.key]));
    }
    if (column.type === 'number') {
      const formatted = formatPrice(item[column.key]);
      if (formatted === '-') return '-';
      const safe = escapeHtml(formatted);
      if (column.key === 'latest_price' && item.currency) {
        return `${safe}<span class="price-ccy">${escapeHtml(item.currency)}</span>`;
      }
      return safe;
    }

    let text;
    if (column.key === 'name') {
      text = item.name || item.short_name || '-';
    } else {
      text = item[column.key] || '-';
    }

    if (text === '-' || !HIGHLIGHT_KEYS.has(column.key)) {
      return escapeHtml(text);
    }
    return highlightMatch(text, query);
  }

  function renderTableBody() {
    const rows = getVisibleRows();
    const hasRows = rows.length > 0;
    const columns = getDatasetConfig().columns;
    const query = normalizeText(state.searchTerm);

    const idKey = state.dataset === 'macro' ? 'series_id' : 'instrument_id';

    elements.tableBody.innerHTML = rows.map((item) => {
      const rowId = item[idKey];
      const rowAttrs = rowId
        ? ` class="row-clickable" data-id="${escapeHtml(rowId)}" tabindex="0" role="button" aria-label="查看 ${escapeHtml(item.symbol || item.source_code || item.name || '')} 詳情"`
        : '';
      const cells = columns.map((column) => {
        const classNames = [];
        if (column.className) {
          classNames.push(column.className);
        }
        if (column.type === 'status') {
          classNames.push('cell-status');
        }
        const classAttribute = classNames.length ? ` class="${classNames.join(' ')}"` : '';
        const dataAttrs = ` data-label="${escapeHtml(column.label)}" data-column="${escapeHtml(column.key)}"`;
        const value = renderCellHTML(item, column, query);

        let extraAttrs = '';
        if (column.key === 'symbol' && item.symbol) {
          extraAttrs = ` data-copy="${escapeHtml(item.symbol)}" role="button" tabindex="0" title="點擊複製 ${escapeHtml(item.symbol)}"`;
        } else if (column.key === 'name') {
          const fullName = item.name || item.short_name;
          if (fullName) extraAttrs = ` title="${escapeHtml(fullName)}"`;
        } else if (column.key === 'source_code' && item.source_code) {
          extraAttrs = ` title="${escapeHtml(item.source_code)}"`;
        }

        return `<td${classAttribute}${dataAttrs}${extraAttrs}>${value}</td>`;
      }).join('');

      return `<tr${rowAttrs}>${cells}</tr>`;
    }).join('');

    elements.emptyState.classList.toggle('hidden', hasRows);
    if (elements.emptyMessage) {
      elements.emptyMessage.textContent = `沒有符合條件的${getDatasetConfig().itemLabel}。`;
    }
    if (elements.emptyClear) {
      elements.emptyClear.hidden = !isFiltersDirty();
    }
    if (state.detailId) setActiveRow(state.detailId);
  }

  function isFiltersDirty() {
    if (state.searchTerm.trim() !== '') return true;
    if (state.market !== 'ALL') return true;
    if (state.dataset === 'macro') {
      return state.frequency !== 'ALL' || state.sourceFilter !== 'ALL';
    }
    return state.assetClass !== 'ALL' || state.status !== getDefaultStatusFor(state.dataset);
  }

  function createPageButton(label, disabled, onClick, className = '') {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `page-button${className ? ` ${className}` : ''}`;
    button.textContent = label;
    button.disabled = disabled;
    if (!disabled) {
      button.addEventListener('click', onClick);
    }
    return button;
  }

  function buildPageList(currentPage, totalPages, sibling = 2) {
    // Always show the first and last page, plus a `sibling`-sized window around
    // current. Inserts '…' sentinels where there are gaps. The window is shifted
    // when current sits near an edge so the visible count stays roughly constant.
    // Example layouts:
    //   page 1   of 51 -> 1 2 3 4 5 … 51
    //   page 25  of 51 -> 1 … 23 24 25 26 27 … 51
    //   page 51  of 51 -> 1 … 47 48 49 50 51
    const boundary = 1;
    const windowSize = sibling * 2 + 1;
    // Inline when there isn't enough room for both ellipses + boundaries.
    if (totalPages <= boundary * 2 + windowSize + 2) {
      return Array.from({ length: totalPages }, (_, i) => i + 1);
    }

    const startPage = Math.max(
      boundary + 1,
      Math.min(currentPage - sibling, totalPages - boundary - windowSize + 1),
    );
    const endPage = Math.min(
      totalPages - boundary,
      Math.max(currentPage + sibling, boundary + windowSize),
    );

    const result = [];
    for (let i = 1; i <= boundary; i += 1) result.push(i);
    if (startPage > boundary + 1) result.push('…');
    for (let p = startPage; p <= endPage; p += 1) result.push(p);
    if (endPage < totalPages - boundary) result.push('…');
    for (let i = totalPages - boundary + 1; i <= totalPages; i += 1) result.push(i);
    return result;
  }

  function renderPagination() {
    const totalPages = Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
    const fragment = document.createDocumentFragment();

    fragment.appendChild(
      createPageButton('← 前', state.currentPage === 1, () => {
        state.currentPage -= 1;
        render();
      })
    );

    for (const entry of buildPageList(state.currentPage, totalPages)) {
      if (entry === '…') {
        const ellipsis = document.createElement('span');
        ellipsis.className = 'page-ellipsis';
        ellipsis.textContent = '…';
        ellipsis.setAttribute('aria-hidden', 'true');
        fragment.appendChild(ellipsis);
        continue;
      }
      const page = entry;
      fragment.appendChild(
        createPageButton(String(page), false, () => {
          state.currentPage = page;
          render();
        }, page === state.currentPage ? 'current' : '')
      );
    }

    fragment.appendChild(
      createPageButton('後 →', state.currentPage === totalPages, () => {
        state.currentPage += 1;
        render();
      })
    );

    elements.pagination.replaceChildren(fragment);
    elements.pagination.classList.toggle('hidden', state.filtered.length <= state.pageSize);
  }

  function setMode(mode) {
    elements.loadingState.classList.toggle('hidden', mode !== 'loading');
    elements.errorState.classList.toggle('hidden', mode !== 'error');
    elements.tableSection.classList.toggle('hidden', mode !== 'ready');
  }

  function render() {
    flushPendingSearch();
    applyFilters();
    updateDatasetTabsState();
    renderFilters();
    renderTableColumns();
    renderTableHead();
    renderTableBody();
    renderPagination();
    updateHeader();
    updateResultSummary();
    updateActiveFilterSummary();
    syncFooterControls();
    syncURL();
    persistState();
  }

  function syncFooterControls() {
    if (elements.pageSizeSelect && elements.pageSizeSelect.value !== String(state.pageSize)) {
      elements.pageSizeSelect.value = String(state.pageSize);
    }
    const hasRows = state.filtered.length > 0;
    if (elements.csvExport) {
      elements.csvExport.disabled = !hasRows;
    }
    if (elements.clearFilters) {
      elements.clearFilters.disabled = !isFiltersDirty();
    }
  }

  function getDefaultStatusFor(dataset) {
    return dataset === 'instruments' ? 'active' : 'ALL';
  }

  // ---------- URL state sync ----------

  const URL_KEYS = {
    ds: 'dataset',
    q: 'searchTerm',
    m: 'market',
    ac: 'assetClass',
    st: 'status',
    fq: 'frequency',
    src: 'sourceFilter',
    sb: 'sortBy',
    sd: 'sortDir',
    ps: 'pageSize',
    p: 'currentPage',
    id: 'detailId',
  };

  let suppressURLSync = false;

  function syncURL() {
    if (suppressURLSync) return;
    const params = new URLSearchParams();
    const defaults = buildDefaults(state.dataset);

    Object.entries(URL_KEYS).forEach(([param, key]) => {
      const value = state[key];
      const defaultValue = defaults[key];
      if (value === undefined || value === null || value === '' || value === defaultValue) {
        return;
      }
      params.set(param, String(value));
    });

    const newQuery = params.toString();
    const newSearch = newQuery ? `?${newQuery}` : '';
    if (newSearch !== window.location.search) {
      window.history.replaceState(
        null,
        '',
        `${window.location.pathname}${newSearch}${window.location.hash}`,
      );
    }
  }

  function buildDefaults(dataset) {
    return {
      dataset: 'instruments',
      searchTerm: '',
      market: 'ALL',
      assetClass: 'ALL',
      status: getDefaultStatusFor(dataset),
      frequency: 'ALL',
      sourceFilter: 'ALL',
      sortBy: DATASETS[dataset].defaultSort,
      sortDir: 'asc',
      pageSize: DEFAULT_PAGE_SIZE,
      currentPage: 1,
      detailId: '',
    };
  }

  function readURLState() {
    const params = new URL(window.location.href).searchParams;
    const result = {};
    Object.entries(URL_KEYS).forEach(([param, key]) => {
      if (params.has(param)) {
        result[key] = params.get(param);
      }
    });
    return result;
  }

  // ---------- localStorage ----------

  function persistState() {
    try {
      const payload = {
        dataset: state.dataset,
        pageSize: state.pageSize,
        instruments: {
          market: state.dataset === 'instruments' ? state.market : null,
          assetClass: state.dataset === 'instruments' ? state.assetClass : null,
          status: state.dataset === 'instruments' ? state.status : null,
          sortBy: state.dataset === 'instruments' ? state.sortBy : null,
          sortDir: state.dataset === 'instruments' ? state.sortDir : null,
        },
        macro: {
          market: state.dataset === 'macro' ? state.market : null,
          frequency: state.dataset === 'macro' ? state.frequency : null,
          sourceFilter: state.dataset === 'macro' ? state.sourceFilter : null,
          sortBy: state.dataset === 'macro' ? state.sortBy : null,
          sortDir: state.dataset === 'macro' ? state.sortDir : null,
        },
      };
      const existing = readPersistedState();
      const merged = mergePersisted(existing, payload);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
    } catch (_) {
      // localStorage may be disabled; ignore.
    }
  }

  function mergePersisted(existing, incoming) {
    const out = { ...existing, ...incoming };
    ['instruments', 'macro'].forEach((ds) => {
      out[ds] = { ...(existing && existing[ds]), ...(incoming[ds] || {}) };
      Object.keys(out[ds]).forEach((k) => {
        if (out[ds][k] === null) delete out[ds][k];
      });
    });
    return out;
  }

  function readPersistedState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (_) {
      return null;
    }
  }

  function applyPersistedState(persisted) {
    if (!persisted) return;
    if (Number.isFinite(persisted.pageSize) && PAGE_SIZE_OPTIONS.includes(persisted.pageSize)) {
      state.pageSize = persisted.pageSize;
    }
    if (typeof persisted.dataset === 'string' && DATASETS[persisted.dataset]) {
      state.dataset = persisted.dataset;
    }
    applyDatasetPersistedState(state.dataset, persisted[state.dataset]);
  }

  function applyDatasetPersistedState(dataset, stored) {
    if (!stored) return;
    if (typeof stored.market === 'string') state.market = stored.market;
    if (dataset === 'instruments') {
      if (typeof stored.assetClass === 'string') state.assetClass = stored.assetClass;
      if (typeof stored.status === 'string') state.status = stored.status;
    } else {
      if (typeof stored.frequency === 'string') state.frequency = stored.frequency;
      if (typeof stored.sourceFilter === 'string') state.sourceFilter = stored.sourceFilter;
    }
    if (typeof stored.sortBy === 'string') state.sortBy = stored.sortBy;
    if (stored.sortDir === 'asc' || stored.sortDir === 'desc') state.sortDir = stored.sortDir;
  }

  function applyURLState(urlState) {
    if (!urlState || Object.keys(urlState).length === 0) return;

    if (typeof urlState.dataset === 'string' && DATASETS[urlState.dataset]) {
      state.dataset = urlState.dataset;
    }
    if (typeof urlState.searchTerm === 'string') state.searchTerm = urlState.searchTerm;
    if (typeof urlState.market === 'string') state.market = urlState.market;
    if (typeof urlState.assetClass === 'string') state.assetClass = urlState.assetClass;
    if (typeof urlState.status === 'string') state.status = urlState.status;
    if (typeof urlState.frequency === 'string') state.frequency = urlState.frequency;
    if (typeof urlState.sourceFilter === 'string') state.sourceFilter = urlState.sourceFilter;
    if (typeof urlState.sortBy === 'string') state.sortBy = urlState.sortBy;
    if (urlState.sortDir === 'asc' || urlState.sortDir === 'desc') state.sortDir = urlState.sortDir;
    const ps = Number(urlState.pageSize);
    if (PAGE_SIZE_OPTIONS.includes(ps)) state.pageSize = ps;
    const page = Number(urlState.currentPage);
    if (Number.isFinite(page) && page >= 1) state.currentPage = Math.floor(page);
    if (typeof urlState.detailId === 'string') state.detailId = urlState.detailId;
  }

  // ---------- clear filters ----------

  function clearFilters() {
    state.searchTerm = '';
    state.market = 'ALL';
    state.assetClass = 'ALL';
    state.status = getDefaultStatusFor(state.dataset);
    state.frequency = 'ALL';
    state.sourceFilter = 'ALL';
    state.currentPage = 1;
    elements.searchInput.value = '';
    render();
  }

  // ---------- copy + toast ----------

  let toastTimer = null;

  function showToast(message) {
    if (!elements.toast) return;
    elements.toast.textContent = message;
    elements.toast.classList.add('visible');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      elements.toast.classList.remove('visible');
    }, TOAST_DURATION_MS);
  }

  async function copyToClipboard(text) {
    if (!text) return false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (_) {
      // fall through to legacy path
    }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (_) {
      return false;
    }
  }

  function handleSymbolClick(event) {
    const cell = event.target.closest('td[data-copy]');
    if (!cell) return;
    if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return;
    if (event.type === 'keydown') event.preventDefault();
    // Stop the bubble so the row-level open-detail handler doesn't fire.
    event.stopPropagation();
    const value = cell.getAttribute('data-copy');
    copyToClipboard(value).then((ok) => {
      showToast(ok ? `已複製：${value}` : `複製失敗：${value}`);
    });
  }

  function handleRowActivate(event) {
    if (event.type === 'keydown') {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      // Only the row itself, not the inner symbol cell (which has its own keydown copy).
      if (document.activeElement && document.activeElement.matches('td[data-copy]')) return;
      event.preventDefault();
    } else {
      // Clicks inside the symbol copy cell are handled by handleSymbolClick and
      // stop propagation, so we just need to ignore other interactive descendants.
      if (event.target.closest('a, button, [data-copy]')) return;
    }
    const row = event.target.closest('tr[data-id]');
    if (!row) return;
    openDetail(row.dataset.id);
  }

  // ---------- detail drawer ----------

  let currentDetailToken = 0;
  let lastFocusedBeforeDetail = null;

  function findItemById(id) {
    if (!id) return null;
    const idKey = state.dataset === 'macro' ? 'series_id' : 'instrument_id';
    return state.source[state.dataset].find((item) => item[idKey] === id) || null;
  }

  function findItemAcrossDatasets(id) {
    if (!id) return null;
    for (const ds of Object.keys(DATASETS)) {
      const idKey = ds === 'macro' ? 'series_id' : 'instrument_id';
      const found = (state.source[ds] || []).find((item) => item[idKey] === id);
      if (found) return { dataset: ds, item: found };
    }
    return null;
  }

  function openDetail(id) {
    if (!id) return;
    const found = findItemAcrossDatasets(id);
    if (!found) {
      showToast('找不到此標的');
      state.detailId = '';
      syncURL();
      return;
    }
    state.detailId = id;
    if (found.dataset !== state.dataset) {
      // ID from another dataset — switch tab first so future syncURL writes
      // resolve under the correct ds context, then re-render the table.
      switchDataset(found.dataset);
    }
    setActiveRow(id);
    if (!lastFocusedBeforeDetail) {
      lastFocusedBeforeDetail = document.activeElement instanceof HTMLElement ? document.activeElement : null;
    }

    renderDetailMeta(found.item);
    elements.detailBackdrop.classList.add('visible');
    elements.detailBackdrop.setAttribute('aria-hidden', 'false');
    elements.detailDrawer.classList.add('visible');
    elements.detailDrawer.setAttribute('aria-hidden', 'false');
    elements.detailClose.focus();

    const token = ++currentDetailToken;
    if (state.dataset === 'macro') {
      elements.detailActions.innerHTML = '';
      fetchMacroObservations(id, token);
    } else {
      fetchDetailPrices(id, token);
      fetchDetailActions(id, token);
    }

    syncURL();
  }

  function closeDetail() {
    if (!elements.detailDrawer.classList.contains('visible')) return;
    currentDetailToken += 1; // invalidate any in-flight fetches
    state.detailId = '';
    setActiveRow('');
    elements.detailBackdrop.classList.remove('visible');
    elements.detailBackdrop.setAttribute('aria-hidden', 'true');
    elements.detailDrawer.classList.remove('visible');
    elements.detailDrawer.setAttribute('aria-hidden', 'true');
    syncURL();
    if (lastFocusedBeforeDetail && document.body.contains(lastFocusedBeforeDetail)) {
      lastFocusedBeforeDetail.focus();
    }
    lastFocusedBeforeDetail = null;
  }

  function setActiveRow(id) {
    const prev = elements.tableBody.querySelector('tr.row-active');
    if (prev) prev.classList.remove('row-active');
    if (!id) return;
    const next = elements.tableBody.querySelector(`tr[data-id="${CSS.escape(id)}"]`);
    if (next) {
      next.classList.add('row-active');
      // Keep the active row in view when navigating via keyboard.
      next.scrollIntoView({ block: 'nearest', behavior: 'auto' });
    }
  }

  function navigateDetail(delta) {
    if (!state.detailId || !Array.isArray(state.filtered) || state.filtered.length === 0) return;
    const idKey = state.dataset === 'macro' ? 'series_id' : 'instrument_id';
    const idx = state.filtered.findIndex((item) => item[idKey] === state.detailId);
    if (idx === -1) return;
    const nextIdx = idx + delta;
    if (nextIdx < 0 || nextIdx >= state.filtered.length) return;
    const nextId = state.filtered[nextIdx][idKey];
    const nextPage = Math.floor(nextIdx / state.pageSize) + 1;
    if (nextPage !== state.currentPage) {
      state.currentPage = nextPage;
      render();
    }
    openDetail(nextId);
  }

  function renderDetailMeta(item) {
    const isMacro = state.dataset === 'macro';
    const idKey = isMacro ? 'series_id' : 'instrument_id';
    const symbolText = isMacro ? (item.source_code || item.name || item[idKey]) : (item.symbol || item[idKey]);
    const nameText = isMacro ? (item.name || '') : (item.name || item.short_name || '');

    elements.detailSymbol.textContent = symbolText || '—';
    elements.detailName.textContent = nameText || '';

    const badges = [];
    if (item.market) badges.push({ text: item.market });
    if (isMacro) {
      if (item.frequency) badges.push({ text: item.frequency });
      if (item.source) badges.push({ text: item.source });
    } else {
      if (item.asset_class) badges.push({ text: item.asset_class });
      if (item.currency) badges.push({ text: item.currency });
      if (item.status) badges.push({ text: item.status, cls: `is-status-${item.status}` });
    }

    const rows = [];
    if (isMacro) {
      if (item.unit) rows.push(['單位', item.unit]);
      if (item.source_code) rows.push(['Source Code', item.source_code]);
      if (item.frequency) rows.push(['頻率', item.frequency]);
      if (item.market) rows.push(['市場', item.market]);
    } else {
      if (item.first_trade_date) rows.push(['First Trade Date', item.first_trade_date]);
      if (item.latest_trade_date) rows.push(['Last Trade Date', item.latest_trade_date]);
      if (item.latest_price !== null && item.latest_price !== undefined) {
        rows.push(['Last Price', formatPrice(item.latest_price)]);
      }
      if (item.currency) rows.push(['Currency', item.currency]);
    }
    rows.push([isMacro ? 'Series ID' : 'Instrument ID', item[idKey]]);

    const badgeHTML = badges.length
      ? `<div class="detail-badges">${badges.map((b) =>
          `<span class="detail-badge${b.cls ? ' ' + b.cls : ''}">${escapeHtml(b.text)}</span>`
        ).join('')}</div>`
      : '';

    const gridHTML = rows.length
      ? `<dl class="detail-grid">${rows.map(([label, value]) =>
          `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`
        ).join('')}</dl>`
      : '';

    const copySymbolLabel = isMacro ? '複製 Source Code' : '複製 Symbol';
    const copyIdLabel = isMacro ? '複製 Series ID' : '複製 Instrument ID';
    const copySymbolValue = isMacro ? (item.source_code || '') : (item.symbol || '');

    const actionsHTML = `
      <div class="detail-actions-row">
        ${copySymbolValue ? `<button type="button" class="detail-action-btn" data-copy-target="${escapeHtml(copySymbolValue)}">${copySymbolLabel}</button>` : ''}
        <button type="button" class="detail-action-btn" data-copy-target="${escapeHtml(item[idKey])}">${copyIdLabel}</button>
      </div>`;

    elements.detailMeta.innerHTML = badgeHTML + gridHTML + actionsHTML;

    if (isMacro) {
      elements.detailPrices.innerHTML = renderDetailSectionHeader('最近觀測值') + renderSkeleton();
    } else {
      elements.detailPrices.innerHTML = renderDetailSectionHeader('最近 10 筆 EOD') + renderSkeleton();
      elements.detailActions.innerHTML = renderDetailSectionHeader('近期 Corporate Action') + renderSkeleton();
    }
  }

  function renderDetailSectionHeader(title) {
    return `<h3>${escapeHtml(title)}</h3>`;
  }

  function renderSkeleton() {
    return `<div class="detail-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>`;
  }

  function renderDetailError(message, retryHandlerKey) {
    return `<div class="detail-error"><span>${escapeHtml(message)}</span><button type="button" class="detail-action-btn" data-retry="${retryHandlerKey}">重試</button></div>`;
  }

  function renderDetailEmpty(message) {
    return `<div class="detail-empty">${escapeHtml(message)}</div>`;
  }

  async function fetchDetailPrices(id, token) {
    try {
      const response = await fetch(`/api/v1/serve/eod/${encodeURIComponent(id)}?page_size=10`);
      if (token !== currentDetailToken) return;
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      if (token !== currentDetailToken) return;
      const items = Array.isArray(payload.data) ? payload.data : [];
      if (items.length === 0) {
        elements.detailPrices.innerHTML = renderDetailSectionHeader('最近 10 筆 EOD') + renderDetailEmpty('尚無 EOD 紀錄');
        return;
      }
      const rowsHTML = items.map((row) => `
        <tr>
          <td>${escapeHtml(row.trade_date || '')}</td>
          <td>${escapeHtml(formatPrice(row.open))}</td>
          <td>${escapeHtml(formatPrice(row.high))}</td>
          <td>${escapeHtml(formatPrice(row.low))}</td>
          <td>${escapeHtml(formatPrice(row.close))}</td>
          <td>${escapeHtml(formatInteger(row.volume))}</td>
        </tr>`).join('');
      // Serve returns newest first; reverse for left→right time order in sparkline.
      const closes = items.slice().reverse().map((row) => Number(row.close)).filter((n) => Number.isFinite(n));
      const summaryHTML = buildPriceSummaryHTML(items[0], items[1], closes);
      elements.detailPrices.innerHTML =
        renderDetailSectionHeader('最近 10 筆 EOD') + summaryHTML +
        `<div class="detail-table-wrap"><table class="detail-table"><thead><tr><th>Date</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Volume</th></tr></thead><tbody>${rowsHTML}</tbody></table></div>`;
    } catch (err) {
      if (token !== currentDetailToken) return;
      console.error('fetchDetailPrices failed', err);
      elements.detailPrices.innerHTML = renderDetailSectionHeader('最近 10 筆 EOD') + renderDetailError('讀取 EOD 失敗', 'prices');
    }
  }

  async function fetchDetailActions(id, token) {
    try {
      const response = await fetch(`/api/v1/serve/corporate-actions/${encodeURIComponent(id)}?page_size=5`);
      if (token !== currentDetailToken) return;
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      if (token !== currentDetailToken) return;
      const items = Array.isArray(payload.data) ? payload.data : [];
      if (items.length === 0) {
        elements.detailActions.innerHTML = renderDetailSectionHeader('近期 Corporate Action') + renderDetailEmpty('最近無 corporate action');
        return;
      }
      const rowsHTML = items.map((row) => `
        <tr>
          <td>${escapeHtml(row.ex_date || row.record_date || '')}</td>
          <td>${escapeHtml(row.action_type || '')}</td>
          <td>${escapeHtml(row.ratio !== null && row.ratio !== undefined ? formatPrice(row.ratio) : (row.cash_amount !== null && row.cash_amount !== undefined ? `${formatPrice(row.cash_amount)} ${row.currency || ''}`.trim() : ''))}</td>
        </tr>`).join('');
      elements.detailActions.innerHTML =
        renderDetailSectionHeader('近期 Corporate Action') +
        `<div class="detail-table-wrap"><table class="detail-table"><thead><tr><th>Ex Date</th><th>Type</th><th>Value</th></tr></thead><tbody>${rowsHTML}</tbody></table></div>`;
    } catch (err) {
      if (token !== currentDetailToken) return;
      console.error('fetchDetailActions failed', err);
      elements.detailActions.innerHTML = renderDetailSectionHeader('近期 Corporate Action') + renderDetailError('讀取事件失敗', 'actions');
    }
  }

  async function fetchMacroObservations(id, token) {
    try {
      const response = await fetch(`/api/v1/serve/macro/observations/${encodeURIComponent(id)}?page_size=10`);
      if (token !== currentDetailToken) return;
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      if (token !== currentDetailToken) return;
      const items = Array.isArray(payload.data) ? payload.data : [];
      if (items.length === 0) {
        elements.detailPrices.innerHTML = renderDetailSectionHeader('最近觀測值') + renderDetailEmpty('尚無觀測資料');
        return;
      }
      const rowsHTML = items.map((row) => `
        <tr>
          <td>${escapeHtml(row.obs_date || '')}</td>
          <td>${escapeHtml(formatPrice(row.value))}</td>
          <td>${escapeHtml(row.source || '')}</td>
        </tr>`).join('');
      elements.detailPrices.innerHTML =
        renderDetailSectionHeader('最近觀測值') +
        `<div class="detail-table-wrap"><table class="detail-table"><thead><tr><th>Date</th><th>Value</th><th>Source</th></tr></thead><tbody>${rowsHTML}</tbody></table></div>`;
    } catch (err) {
      if (token !== currentDetailToken) return;
      console.error('fetchMacroObservations failed', err);
      elements.detailPrices.innerHTML = renderDetailSectionHeader('最近觀測值') + renderDetailError('讀取觀測資料失敗', 'macro');
    }
  }

  function buildPriceSummaryHTML(latestRow, prevRow, closes) {
    if (!latestRow) return '';
    const latestClose = Number(latestRow.close);
    if (!Number.isFinite(latestClose)) return '';

    let deltaHTML = '';
    if (prevRow && Number.isFinite(Number(prevRow.close))) {
      const prev = Number(prevRow.close);
      const diff = latestClose - prev;
      const pct = prev !== 0 ? (diff / prev) * 100 : 0;
      const cls = diff > 0 ? 'is-up' : (diff < 0 ? 'is-down' : 'is-flat');
      const arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '·');
      const sign = diff > 0 ? '+' : '';
      deltaHTML = `<div class="detail-summary-delta ${cls}">${arrow} ${escapeHtml(sign + formatPrice(diff))} (${escapeHtml(sign + pct.toFixed(2))}%)</div>`;
    }

    const sparkHTML = buildSparklineSVG(closes);
    return `
      <div class="detail-summary">
        <div class="detail-summary-figures">
          <div class="detail-summary-price">${escapeHtml(formatPrice(latestClose))}</div>
          ${deltaHTML}
        </div>
        <div class="detail-summary-spark" aria-hidden="true">${sparkHTML}</div>
      </div>`;
  }

  function buildSparklineSVG(values) {
    if (!values || values.length < 2) return '';
    const w = 96;
    const h = 28;
    const pad = 2;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    const stepX = (w - pad * 2) / (values.length - 1);
    const points = values.map((v, i) => {
      const x = pad + i * stepX;
      const y = pad + (h - pad * 2) * (1 - (v - min) / range);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const first = values[0];
    const last = values[values.length - 1];
    const stroke = last > first ? 'var(--success)' : (last < first ? 'var(--danger)' : 'var(--text-2)');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <polyline fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" points="${points.join(' ')}" />
    </svg>`;
  }

  function formatInteger(value) {
    if (value === null || value === undefined || value === '') return '';
    const n = Number(value);
    return Number.isFinite(n) ? n.toLocaleString() : String(value);
  }

  function handleDrawerKeydown(event) {
    if (event.key !== 'Tab') return;
    const focusable = Array.from(
      elements.detailDrawer.querySelectorAll('button, [tabindex]:not([tabindex="-1"]), a[href], input, select, textarea')
    ).filter((el) => !el.disabled && el.offsetParent !== null);
    if (focusable.length === 0) {
      event.preventDefault();
      elements.detailDrawer.focus();
      return;
    }
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    const active = document.activeElement;
    if (event.shiftKey) {
      if (active === first || !elements.detailDrawer.contains(active)) {
        event.preventDefault();
        last.focus();
      }
    } else {
      if (active === last || !elements.detailDrawer.contains(active)) {
        event.preventDefault();
        first.focus();
      }
    }
  }

  function handleDetailClick(event) {
    const copyBtn = event.target.closest('[data-copy-target]');
    if (copyBtn) {
      const value = copyBtn.getAttribute('data-copy-target');
      copyToClipboard(value).then((ok) => {
        showToast(ok ? `已複製：${value}` : `複製失敗：${value}`);
      });
      return;
    }
    const retryBtn = event.target.closest('[data-retry]');
    if (retryBtn) {
      const which = retryBtn.getAttribute('data-retry');
      const id = state.detailId;
      if (!id) return;
      const token = ++currentDetailToken;
      if (which === 'prices') {
        elements.detailPrices.innerHTML = renderDetailSectionHeader('最近 10 筆 EOD') + renderSkeleton();
        fetchDetailPrices(id, token);
      } else if (which === 'actions') {
        elements.detailActions.innerHTML = renderDetailSectionHeader('近期 Corporate Action') + renderSkeleton();
        fetchDetailActions(id, token);
      } else if (which === 'macro') {
        elements.detailPrices.innerHTML = renderDetailSectionHeader('最近觀測值') + renderSkeleton();
        fetchMacroObservations(id, token);
      }
    }
  }

  // ---------- CSV export ----------

  function escapeCsvCell(value) {
    if (value === null || value === undefined) return '';
    const str = String(value);
    if (/[",\n\r]/.test(str)) {
      return `"${str.replace(/"/g, '""')}"`;
    }
    return str;
  }

  function exportCSV() {
    const config = getDatasetConfig();
    const items = state.filtered;
    if (!items.length) {
      showToast('沒有資料可匯出');
      return;
    }
    const header = config.columns.map((c) => c.label);
    const rows = items.map((item) =>
      config.columns.map((c) => escapeCsvCell(renderCell(item, c))).join(',')
    );
    const csv = [header.join(','), ...rows].join('\n');
    // BOM for Excel compatibility with CJK chars
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    a.href = url;
    a.download = `findb-${state.dataset}-${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`已匯出 ${items.length.toLocaleString()} 筆`);
  }

  // ---------- debounced search ----------

  let searchTimer = null;
  function handleSearchInput(event) {
    elements.tableSection.classList.add('is-filtering');
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchTimer = null;
      state.searchTerm = elements.searchInput.value;
      state.currentPage = 1;
      render();
    }, SEARCH_DEBOUNCE_MS);
  }

  function flushPendingSearch() {
    if (searchTimer) {
      clearTimeout(searchTimer);
      searchTimer = null;
      const latest = elements.searchInput.value;
      if (latest !== state.searchTerm) {
        state.searchTerm = latest;
        state.currentPage = 1;
      }
    }
    elements.tableSection.classList.remove('is-filtering');
  }

  async function loadData() {
    setMode('loading');

    try {
      const entries = await Promise.all(
        Object.entries(DATASETS).map(async ([dataset, config]) => {
          const response = await fetch(config.url);
          if (!response.ok) {
            throw new Error(`${config.url} HTTP ${response.status}`);
          }
          return [dataset, await response.json()];
        })
      );

      entries.forEach(([dataset, payload]) => {
        state.source[dataset] = Array.isArray(payload.data) ? payload.data : [];
        state.metadata[dataset].markets = Array.isArray(payload.markets) ? payload.markets : [];
        state.metadata[dataset].generatedAt = payload.generated_at || '';
        state.metadata[dataset].total = Number.isFinite(payload.total) ? payload.total : state.source[dataset].length;

        if (dataset === 'instruments') {
          state.metadata[dataset].assetClasses = Array.isArray(payload.asset_classes) ? payload.asset_classes : [];
        } else {
          state.metadata[dataset].frequencies = Array.isArray(payload.frequencies) ? payload.frequencies : [];
          state.metadata[dataset].sources = Array.isArray(payload.sources) ? payload.sources : [];
        }
      });

      // Don't reset currentPage here — applyFilters() clamps it to the new max,
      // and URL-restored page numbers must survive the first data load.
      render();
      setMode('ready');

      if (state.detailId) {
        const pendingId = state.detailId;
        state.detailId = '';
        openDetail(pendingId);
      }
    } catch (error) {
      elements.errorMessage.textContent = `請確認 instruments.json 與 macro-series.json 都已產生。錯誤訊息：${error.message}`;
      setMode('error');
    }
  }

  elements.searchInput.addEventListener('input', handleSearchInput);

  elements.marketFilters.addEventListener('click', handleFilterPillClick);
  elements.assetFilters.addEventListener('click', handleFilterPillClick);
  elements.statusFilters.addEventListener('click', handleFilterPillClick);

  elements.retryButton.addEventListener('click', () => {
    loadData();
  });

  elements.clearFilters.addEventListener('click', clearFilters);

  if (elements.emptyClear) {
    elements.emptyClear.addEventListener('click', clearFilters);
  }

  elements.pageSizeSelect.addEventListener('change', (event) => {
    const next = Number(event.target.value);
    if (!PAGE_SIZE_OPTIONS.includes(next)) return;
    state.pageSize = next;
    state.currentPage = 1;
    render();
  });

  elements.csvExport.addEventListener('click', exportCSV);

  elements.tableBody.addEventListener('click', handleSymbolClick);
  elements.tableBody.addEventListener('keydown', handleSymbolClick);
  elements.tableBody.addEventListener('click', handleRowActivate);
  elements.tableBody.addEventListener('keydown', handleRowActivate);

  elements.detailClose.addEventListener('click', closeDetail);
  elements.detailBackdrop.addEventListener('click', closeDetail);
  elements.detailDrawer.addEventListener('click', handleDetailClick);
  elements.detailDrawer.addEventListener('keydown', handleDrawerKeydown);

  document.addEventListener('keydown', (event) => {
    const drawerOpen = elements.detailDrawer.classList.contains('visible');

    if (event.key === 'Escape') {
      if (drawerOpen) {
        closeDetail();
        return;
      }
      if (document.activeElement === elements.searchInput) return;
      if (!elements.clearFilters.disabled) {
        clearFilters();
      }
      return;
    }

    if (drawerOpen && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      event.preventDefault();
      navigateDetail(event.key === 'ArrowDown' ? 1 : -1);
    }
  });

  // ---------- init flow: defaults → localStorage → URL ----------

  suppressURLSync = true;
  applyPersistedState(readPersistedState());
  applyURLState(readURLState());

  // Make sure derived defaults are correct after dataset override.
  if (state.dataset !== 'instruments' && state.status === 'active' && !readURLState().status) {
    state.status = 'ALL';
  }

  elements.searchInput.value = state.searchTerm;
  elements.searchInput.placeholder = getDatasetConfig().searchPlaceholder;
  elements.pageSizeSelect.value = String(state.pageSize);
  suppressURLSync = false;

  buildDatasetTabs();
  renderFilters();
  renderTableHead();
  updateDatasetTabsState(false);
  window.addEventListener('resize', () => positionTabIndicator(false));
  loadData();
})();
</script>
</body>
</html>
