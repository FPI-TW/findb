[project]
name = "findb"
version = "0.1.0"
description = "Financial Database - Normalize and Serve Layer"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.136.0,<0.137.0",
    "uvicorn[standard]>=0.44.0,<0.45.0",
    "sqlalchemy[asyncio]>=2.0.49,<3.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "pydantic>=2.13.0,<3.0.0",
    "pydantic-settings>=2.14.0,<3.0.0",
    "alembic>=1.18.4,<2.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "httpx>=0.28.1,<0.29.0",
    "black>=26.3.1,<27.0.0",
    "ruff>=0.15.11,<0.16.0",
    "mypy>=1.20.1,<2.0.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false
