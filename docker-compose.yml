services:
  db:
    image: postgres:16-alpine
    container_name: findb-postgres
    environment:
      POSTGRES_USER: findb
      POSTGRES_PASSWORD: findb
      POSTGRES_DB: findb
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findb -d findb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findb-app
    environment:
      DATABASE_URL: postgresql+asyncpg://findb:findb@db:5432/findb
      DEBUG: ${DEBUG:-true}
      PORT: ${PORT:-8080}
      SOURCE_API_KEYS: ${SOURCE_API_KEYS:-dev-source-key}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./app/static:/app/app/static
      - ./scripts:/app/scripts:ro
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080} --reload"

  raw-cleanup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findb-raw-cleanup
    environment:
      DATABASE_URL: postgresql+asyncpg://findb:findb@db:5432/findb
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
    command: sh -c "while true; do python /app/scripts/cleanup_raw.py; sleep 86400; done"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: findb-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5056:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data:
